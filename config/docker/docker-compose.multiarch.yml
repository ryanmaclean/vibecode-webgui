version: '3.8'

services:
  # Main application service with multi-arch support
  vibecode-app:
    build:
      context: .
      dockerfile: Dockerfile.multiarch
      target: runtime
      platforms:
        - linux/amd64
        - linux/arm64
      cache_from:
        - node:20-alpine
      args:
        NODE_VERSION: 20
        BASE_OS: alpine
    image: vibecode-webgui:multiarch
    container_name: vibecode-app-multiarch
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DD_TRACE_ENABLED=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE=vibecode-webgui
      - DD_ENV=production
      - DD_VERSION=${BUILD_VERSION:-latest}
      - DD_AGENT_HOST=${DD_AGENT_HOST:-datadog-agent}
      - DD_TRACE_AGENT_PORT=8126
      - DD_DOGSTATSD_PORT=8125
      - NEXT_PUBLIC_DD_APPLICATION_ID=${NEXT_PUBLIC_DD_APPLICATION_ID:-}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${NEXT_PUBLIC_DD_CLIENT_TOKEN:-}
      - NEXT_PUBLIC_DD_SITE=${NEXT_PUBLIC_DD_SITE:-datadoghq.com}
      - NEXT_PUBLIC_APP_VERSION=${BUILD_VERSION:-latest}
    volumes:
      # Only mount configuration files for production
      - ./next.config.js:/app/next.config.js:ro
    networks:
      - vibecode-network
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service with hot reloading
  vibecode-dev:
    build:
      context: .
      dockerfile: Dockerfile.multiarch
      target: development
      platforms:
        - linux/amd64
        - linux/arm64
      cache_from:
        - node:20-alpine
    image: vibecode-webgui:dev-multiarch
    container_name: vibecode-dev-multiarch
    ports:
      - "3001:3000"  # Different port to avoid conflicts
      - "9229:9229"  # Debug port
    environment:
      - NODE_ENV=development
      - DOCKER=true
      - NEXT_TELEMETRY_DISABLED=1
      - DD_TRACE_ENABLED=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE=vibecode-webgui
      - DD_ENV=development
      - DD_VERSION=dev
      - DD_AGENT_HOST=${DD_AGENT_HOST:-datadog-agent}
      - DD_TRACE_AGENT_PORT=8126
      - DD_DOGSTATSD_PORT=8125
      - NEXT_PUBLIC_DD_APPLICATION_ID=${NEXT_PUBLIC_DD_APPLICATION_ID:-}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${NEXT_PUBLIC_DD_CLIENT_TOKEN:-}
      - NEXT_PUBLIC_DD_SITE=${NEXT_PUBLIC_DD_SITE:-datadoghq.com}
      - NEXT_PUBLIC_APP_VERSION=dev
    volumes:
      # Full source code mount for development
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - vibecode-network
    depends_on:
      valkey:
        condition: service_healthy
    stdin_open: true
    tty: true
    profiles:
      - development

  # Valkey (Redis-compatible) service with architecture optimization
  valkey:
    image: valkey/valkey:7-alpine
    container_name: vibecode-valkey-multiarch
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
      - ./config/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    environment:
      - VALKEY_MAXMEMORY=512mb
      - VALKEY_MAXMEMORY_POLICY=allkeys-lru
      - DD_SERVICE=${DD_SERVICE:-valkey}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    networks:
      - vibecode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # PostgreSQL with multi-arch support for development
  postgres:
    image: postgres:15-alpine
    container_name: vibecode-postgres-multiarch
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vibecode
      - POSTGRES_USER=vibecode
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - DD_SERVICE=${DD_SERVICE:-postgres}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vibecode-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecode"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - development
      - database

  # Nginx reverse proxy with multi-arch support
  nginx:
    image: nginx:alpine
    container_name: vibecode-nginx-multiarch
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    environment:
      - DD_SERVICE=${DD_SERVICE:-nginx}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    networks:
      - vibecode-network
    depends_on:
      - vibecode-app
    restart: unless-stopped
    profiles:
      - production
      - load-balancer

  # Monitoring stack
  prometheus:
    image: prom/prometheus:latest
    container_name: vibecode-prometheus-multiarch
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    environment:
      - DD_SERVICE=${DD_SERVICE:-prometheus}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    networks:
      - vibecode-network
    restart: unless-stopped
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: vibecode-grafana-multiarch
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - DD_SERVICE=${DD_SERVICE:-grafana}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    networks:
      - vibecode-network
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  vibecode-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  valkey-data:
    driver: local
  postgres-data:
    driver: local
  nginx-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# Docker Compose profiles for different deployment scenarios:
# Development: docker-compose -f docker-compose.multiarch.yml --profile development up
# Production: docker-compose -f docker-compose.multiarch.yml --profile production up
# Full monitoring: docker-compose -f docker-compose.multiarch.yml --profile development --profile monitoring up
