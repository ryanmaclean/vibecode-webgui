version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: vibecode-pgvector
    environment:
      POSTGRES_USER: vibecode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vibecode
      DD_SERVICE: ${DD_SERVICE:-pgvector}
      DD_ENV: ${DD_ENV:-development}
      DD_VERSION: ${DD_VERSION:-0.1.0}
      DD_TAGS: team:platform,component:infra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecode -d vibecode"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vibecode.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
      DD_SERVICE: ${DD_SERVICE:-pgadmin}
      DD_ENV: ${DD_ENV:-development}
      DD_VERSION: ${DD_VERSION:-0.1.0}
      DD_TAGS: team:platform,component:infra
    ports:
      - "5050:80"
    depends_on:
      - pgvector

volumes:
  pgdata:
