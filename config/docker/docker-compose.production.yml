# Production Docker Compose configuration
# For self-hosted deployments with all services

version: '3.8'

services:
  # Main VibeCode application
  vibecode-app:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: vibecode-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vibecode:vibecode@postgres:5432/vibecode}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - NEXT_TELEMETRY_DISABLED=1
      - DD_IAST_ENABLED=true
      - DD_DBM_PROPAGATION_MODE=full
      - DD_SERVICE=vibecode-webgui
      - DD_ENV=production
      - DD_VERSION=1.0.0
      - DD_TRACE_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - NEXT_PUBLIC_DD_APPLICATION_ID=${NEXT_PUBLIC_DD_APPLICATION_ID:-}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${NEXT_PUBLIC_DD_CLIENT_TOKEN:-}
      - NEXT_PUBLIC_DD_SITE=${NEXT_PUBLIC_DD_SITE:-datadoghq.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - rag-data:/app/rag-index
      - conversations:/app/conversations
    networks:
      - vibecode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vibecode-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vibecode
      - POSTGRES_USER=vibecode
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vibecode123}
      - DD_SERVICE=${DD_SERVICE:-postgres}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - vibecode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecode -d vibecode"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: vibecode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      - DD_SERVICE=${DD_SERVICE:-redis}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    networks:
      - vibecode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # NGINX reverse proxy
  nginx:
    image: nginx:alpine
    container_name: vibecode-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
    environment:
      - DD_SERVICE=${DD_SERVICE:-nginx}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    depends_on:
      - vibecode-app
    networks:
      - vibecode-network

  # Code Server instances (for VS Code integration)
  code-server:
    image: codercom/code-server:latest
    container_name: vibecode-code-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-vibecode123}
      - DD_SERVICE=${DD_SERVICE:-code-server}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    volumes:
      - code-projects:/home/coder/projects
      - code-config:/home/coder/.config
    networks:
      - vibecode-network
    command: >
      --bind-addr 0.0.0.0:8080
      --auth password
      --disable-telemetry
      --disable-update-check

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: vibecode-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    environment:
      - DD_SERVICE=${DD_SERVICE:-prometheus}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    networks:
      - vibecode-network
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: vibecode-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - DD_SERVICE=${DD_SERVICE:-grafana}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - vibecode-network
    profiles:
      - monitoring

  # Dropbear SSH service for remote access
  dropbear:
    image: alpine:3.22
    container_name: vibecode-ssh
    command: sh -c "apk add --no-cache dropbear && dropbear -F -E -B -R -p 22"
    ports:
      - "2222:22"
    environment:
      - DD_SERVICE=${DD_SERVICE:-dropbear}
      - DD_ENV=${DD_ENV:-production}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    restart: unless-stopped
    networks:
      - vibecode-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  uploads:
    driver: local
  rag-data:
    driver: local
  conversations:
    driver: local
  code-projects:
    driver: local
  code-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  vibecode-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
