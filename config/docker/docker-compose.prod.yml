# Production x86-64 deployment simulation
version: '3.8'

services:
  vibecode-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
      platforms:
        - linux/amd64
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - NEXT_TELEMETRY_DISABLED=1
      - DD_SERVICE=vibecode-webgui
      - DD_ENV=production
      - DD_VERSION=${BUILD_VERSION:-latest}
      - DD_TRACE_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - NEXT_PUBLIC_DD_APPLICATION_ID=${NEXT_PUBLIC_DD_APPLICATION_ID:-}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${NEXT_PUBLIC_DD_CLIENT_TOKEN:-}
      - NEXT_PUBLIC_DD_SITE=${NEXT_PUBLIC_DD_SITE:-datadoghq.com}
    networks:
      - vibecode-prod-network

  # Valkey for Redis compatibility
  valkey:
    image: valkey/valkey:7-alpine
    container_name: vibecode-valkey-prod
    ports:
      - "6379:6379"
    volumes:
      - valkey-data-prod:/data
    command: valkey-server --save 900 1 --maxmemory 512mb --appendonly yes
    environment:
      - DD_SERVICE=${DD_SERVICE:-valkey}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    networks:
      - vibecode-prod-network

  # Dropbear SSH service for remote access
  dropbear:
    image: alpine:3.22
    container_name: vibecode-ssh
    command: sh -c "apk add --no-cache dropbear && dropbear -F -E -B -R -p 22"
    ports:
      - "2222:22"
    environment:
      - DD_SERVICE=${DD_SERVICE:-dropbear}
      - DD_ENV=${DD_ENV:-production}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    restart: unless-stopped
    networks:
      - vibecode-prod-network

networks:
  vibecode-prod-network:
    driver: bridge

volumes:
  valkey-data-prod:
