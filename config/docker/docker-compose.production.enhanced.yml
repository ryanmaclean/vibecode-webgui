# Enhanced Production Docker Compose Configuration
# Container Team: Production-ready orchestration with monitoring
version: '3.8'

# ===== NETWORKS =====
networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

# ===== VOLUMES =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  logs:
    driver: local
  datadog_logs:
    driver: local
  cache:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ===== SERVICES =====
services:
  # ===== APPLICATION =====
  vibecode-app:
    build:
      context: .
      dockerfile: Dockerfile.production.enhanced
      target: runner
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}
        - BUILD_VERSION=${BUILD_VERSION:-latest}
        - BUILD_COMMIT=${BUILD_COMMIT:-unknown}
        - NODE_VERSION=20-slim
        - DATADOG_VERSION=5.72.0
        - BUILD_ENV=production
      cache_from:
        - vibecode-webgui:latest
        - vibecode-webgui:cache
    image: vibecode-webgui:${BUILD_VERSION:-latest}
    container_name: vibecode-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - frontend
      - backend
      - monitoring
    environment:
      # Application
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      
      # Database
      - DATABASE_URL=postgresql://vibecode:${POSTGRES_PASSWORD:-vibecode123}@postgres:5432/vibecode
      - REDIS_URL=redis://redis:6379
      
      # Datadog APM
      - DD_TRACE_ENABLED=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_DYNAMIC_INSTRUMENTATION_ENABLED=true
      - DD_APPSEC_ENABLED=true
      - DD_IAST_ENABLED=true
      - DD_SERVICE=vibecode-webgui
      - DD_ENV=production
      - DD_VERSION=${BUILD_VERSION:-latest}
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_DOGSTATSD_PORT=8125

      # Datadog RUM (public)
      - NEXT_PUBLIC_DD_APPLICATION_ID=${NEXT_PUBLIC_DD_APPLICATION_ID:-}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${NEXT_PUBLIC_DD_CLIENT_TOKEN:-}
      - NEXT_PUBLIC_DD_SITE=${NEXT_PUBLIC_DD_SITE:-datadoghq.com}
      - NEXT_PUBLIC_APP_VERSION=${BUILD_VERSION:-latest}
      
      # Security
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-default-secret-change-me}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      
      # OpenAI/AI Services
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      
      # Monitoring
      - ENABLE_METRICS=true
      - ENABLE_TRACING=true
      - LOG_LEVEL=info
    volumes:
      - logs:/app/logs
      - datadog_logs:/var/log/datadog
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      datadog-agent:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service,environment"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vibecode.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.services.vibecode.loadbalancer.server.port=3000"
      - "com.datadoghq.ad.logs=[{\"source\": \"nodejs\", \"service\": \"vibecode-webgui\"}]"

  # ===== DATABASE =====
  postgres:
    image: postgres:16-alpine
    container_name: vibecode-postgres
    restart: unless-stopped
    networks:
      - backend
    environment:
      - POSTGRES_DB=vibecode
      - POSTGRES_USER=vibecode
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vibecode123}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
      - DD_SERVICE=${DD_SERVICE:-postgres}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecode -d vibecode"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "com.datadoghq.ad.logs=[{\"source\": \"postgresql\", \"service\": \"postgres\"}]"

  # ===== REDIS CACHE =====
  redis:
    image: redis:7-alpine
    container_name: vibecode-redis
    restart: unless-stopped
    networks:
      - backend
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    environment:
      - DD_SERVICE=${DD_SERVICE:-redis}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    volumes:
      - redis_data:/data
      - cache:/var/lib/redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    labels:
      - "com.datadoghq.ad.logs=[{\"source\": \"redis\", \"service\": \"redis\"}]"

  # ===== DATADOG AGENT =====
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: vibecode-datadog-agent
    restart: unless-stopped
    networks:
      - monitoring
      - backend
      - frontend
    environment:
      - DD_SERVICE=${DD_SERVICE:-datadog-agent}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
      - DD_API_KEY=${DD_API_KEY:-}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE="name:datadog-agent"
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_SYSTEM_PROBE_ENABLED=true
      - DD_RUNTIME_SECURITY_CONFIG_ENABLED=true
      - DD_COMPLIANCE_CONFIG_ENABLED=true
      # Database monitoring
      - DD_DBM_ENABLED=true
      # Container monitoring
      - DD_CONTAINER_IMAGE_ENABLED=true
      - DD_CONTAINER_INCLUDE_LOGS=true
      # Performance monitoring
      - DD_ENABLE_PAYLOADS_EVENTS=false
      - DD_ENABLE_PAYLOADS_SERIES=false
      - DD_ENABLE_PAYLOADS_SERVICE_CHECKS=false
      - DD_ENABLE_PAYLOADS_SKETCHES=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /opt/datadog-agent/run:/opt/datadog-agent/run:rw
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - datadog_logs:/opt/datadog-agent/logs
    ports:
      - "8125:8125/udp"  # DogStatsD
      - "8126:8126"      # APM
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - IPC_LOCK
      - CHOWN
    security_opt:
      - apparmor:unconfined
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ===== REVERSE PROXY (OPTIONAL) =====
  traefik:
    image: traefik:v3.0
    container_name: vibecode-traefik
    restart: unless-stopped
    networks:
      - frontend
    environment:
      - DD_SERVICE=${DD_SERVICE:-traefik}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    command:
      - --api.dashboard=true
      - --api.debug=true
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --metrics.prometheus=true
      - --metrics.prometheus.addentrypointslabels=true
      - --metrics.prometheus.addserviceslabels=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    profiles:
      - proxy

  # ===== SSH ACCESS =====
  dropbear:
    image: alpine:3.22
    container_name: vibecode-ssh
    command: sh -c "apk add --no-cache dropbear && dropbear -F -E -B -R -p 22"
    ports:
      - "2222:22"
    environment:
      - DD_SERVICE=${DD_SERVICE:-dropbear}
      - DD_ENV=${DD_ENV:-production}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    restart: unless-stopped
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.datadoghq.ad.logs=[{\"source\": \"ssh\", \"service\": \"dropbear\"}]"

  # ===== MONITORING STACK (OPTIONAL) =====
  prometheus:
    image: prom/prometheus:latest
    container_name: vibecode-prometheus
    restart: unless-stopped
    networks:
      - monitoring
    environment:
      - DD_SERVICE=${DD_SERVICE:-prometheus}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: vibecode-grafana
    restart: unless-stopped
    networks:
      - monitoring
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - DD_SERVICE=${DD_SERVICE:-grafana}
      - DD_ENV=${DD_ENV:-development}
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_TAGS=team:platform,component:infra
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    profiles:
      - monitoring

# ===== USAGE EXAMPLES =====
# Basic production deployment:
# docker-compose -f docker-compose.production.enhanced.yml up -d
#
# With reverse proxy:
# docker-compose -f docker-compose.production.enhanced.yml --profile proxy up -d
#
# With full monitoring stack:
# docker-compose -f docker-compose.production.enhanced.yml --profile monitoring --profile proxy up -d
#
# Scale the application:
# docker-compose -f docker-compose.production.enhanced.yml up -d --scale vibecode-app=3
#
# Update to latest image:
# docker-compose -f docker-compose.production.enhanced.yml pull vibecode-app
# docker-compose -f docker-compose.production.enhanced.yml up -d vibecode-app
