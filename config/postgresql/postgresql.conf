# VibeCode PostgreSQL Configuration - Optimized for pgvector
# PostgreSQL 16+ Configuration for Vector Embeddings and AI/RAG Workloads
#
# System Configuration:
# - 8GB RAM, 4 vCPUs
# - SSD storage
# - Workload: Vector similarity search, embeddings storage, OLTP
#
# Last Updated: 2024-10-28

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------
listen_addresses = '*'                  # Listen on all interfaces
port = 5432                             # Standard PostgreSQL port
max_connections = 100                   # Maximum concurrent connections
superuser_reserved_connections = 3      # Reserved for superuser maintenance

#------------------------------------------------------------------------------
# RESOURCE USAGE (Optimized for 8GB RAM + Vector Workloads)
#------------------------------------------------------------------------------

# Memory Configuration
shared_buffers = 2GB                    # 25% of RAM - shared memory for caching
effective_cache_size = 6GB              # 75% of RAM - optimizer's cache size estimate
work_mem = 64MB                         # Higher for vector operations (sorting, hashing)
maintenance_work_mem = 512MB            # For VACUUM, CREATE INDEX, pgvector HNSW/IVFFlat builds
temp_buffers = 32MB                     # Memory for temporary tables

# Background Writer - controls page writes to disk
bgwriter_delay = 200ms                  # Sleep time between rounds
bgwriter_lru_maxpages = 100             # Max pages to write per round
bgwriter_lru_multiplier = 2.0           # Multiple of avg buffer usage

# Checkpoint Configuration - critical for write performance
checkpoint_timeout = 15min              # Max time between automatic checkpoints
checkpoint_completion_target = 0.9      # Spread checkpoint writes over 90% of interval
max_wal_size = 4GB                      # Maximum WAL size between checkpoints
min_wal_size = 1GB                      # Minimum WAL size to reserve

# Async I/O - optimized for SSD
effective_io_concurrency = 200          # For SSDs (200-300 recommended)
max_worker_processes = 4                # Total worker processes
max_parallel_workers_per_gather = 2     # Workers per parallel query node
max_parallel_maintenance_workers = 2    # Workers for parallel CREATE INDEX
max_parallel_workers = 4                # Total parallel workers allowed

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL)
#------------------------------------------------------------------------------
wal_level = replica                     # Enable for replication and point-in-time recovery
wal_buffers = 16MB                      # WAL buffer size
wal_compression = on                    # Compress full page writes in WAL
wal_log_hints = on                      # Write hints for pg_rewind support
wal_sync_method = fdatasync             # WAL sync method (OS-dependent)

# Archive settings - enable for production backups
archive_mode = on                       # Enable archiving
archive_command = 'test ! -f /mnt/backup/wal/%f && cp %p /mnt/backup/wal/%f'
archive_timeout = 0                     # Force WAL segment switch after N seconds (0 = disabled)

#------------------------------------------------------------------------------
# REPLICATION
#------------------------------------------------------------------------------
# Configuration for read replicas and high availability
max_wal_senders = 3                     # Maximum concurrent WAL sender processes
wal_keep_size = 1GB                     # Amount of WAL to retain for standby servers
hot_standby = on                        # Allow read queries on standby
hot_standby_feedback = off              # Allow feedback from standby to prevent query conflicts

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

# Cost-based optimizer settings
random_page_cost = 1.1                  # Lower for SSD (1.0-1.5 recommended, default 4.0 for HDD)
seq_page_cost = 1.0                     # Sequential page fetch cost
cpu_tuple_cost = 0.01                   # Cost to process each row
cpu_index_tuple_cost = 0.005            # Cost to process each index entry
cpu_operator_cost = 0.0025              # Cost to execute an operator/function

# Query planning
default_statistics_target = 100         # Statistics target for ANALYZE (higher = better estimates)
constraint_exclusion = partition        # Enable constraint exclusion for partitions
cursor_tuple_fraction = 0.1             # Fraction of cursor queries to optimize
from_collapse_limit = 8                 # Max FROM items to flatten
join_collapse_limit = 8                 # Max JOIN items to plan together

# Parallelism thresholds
min_parallel_table_scan_size = 8MB      # Minimum table size for parallel scan
min_parallel_index_scan_size = 512kB    # Minimum index size for parallel scan
parallel_setup_cost = 1000.0            # Cost to start parallel workers
parallel_tuple_cost = 0.1               # Cost to transfer one tuple between workers

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
logging_collector = on                  # Enable log file capture
log_destination = 'stderr'              # Log destination
log_directory = '/var/log/postgresql'   # Log directory
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'  # Log file naming pattern
log_rotation_age = 1d                   # Rotate after 1 day
log_rotation_size = 100MB               # Rotate after 100MB
log_truncate_on_rotation = on           # Truncate same-named file on rotation

# What to log
log_min_messages = warning              # Minimum severity to log
log_min_error_statement = error         # Minimum severity to log statement causing error
log_min_duration_statement = 1000       # Log queries slower than 1000ms
log_checkpoints = on                    # Log checkpoint activity
log_connections = on                    # Log connection attempts
log_disconnections = on                 # Log session terminations
log_duration = off                      # Log duration of all statements
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '  # Log line format
log_lock_waits = on                     # Log lock wait events
log_statement = 'ddl'                   # Log DDL statements only
log_temp_files = 0                      # Log all temporary files (0 = all sizes)

# Performance analysis
log_autovacuum_min_duration = 0         # Log all autovacuum runs
log_error_verbosity = default           # Error detail level
log_timezone = 'UTC'                    # Timezone for timestamps

#------------------------------------------------------------------------------
# AUTOVACUUM (Critical for pgvector Performance)
#------------------------------------------------------------------------------
# Autovacuum is essential for maintaining performance with pgvector
autovacuum = on                         # Enable autovacuum
autovacuum_max_workers = 3              # Max concurrent autovacuum workers
autovacuum_naptime = 30s                # Time between autovacuum runs
autovacuum_vacuum_threshold = 50        # Min row updates before VACUUM
autovacuum_vacuum_scale_factor = 0.05   # VACUUM when 5% of rows change (more aggressive)
autovacuum_analyze_threshold = 50       # Min row updates before ANALYZE
autovacuum_analyze_scale_factor = 0.05  # ANALYZE when 5% of rows change
autovacuum_vacuum_cost_delay = 2ms      # Sleep time during vacuum
autovacuum_vacuum_cost_limit = 400      # Vacuum cost limit before sleeping

# Vacuum cost-based delay (prevent vacuum from overwhelming I/O)
vacuum_cost_delay = 0                   # No delay for manual VACUUM
vacuum_cost_page_hit = 1                # Cost of vacuuming page in buffer
vacuum_cost_page_miss = 10              # Cost of vacuuming page not in buffer
vacuum_cost_page_dirty = 20             # Cost of vacuuming modified page
vacuum_cost_limit = 200                 # Limit before sleeping

#------------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------
timezone = 'UTC'                        # Server timezone
datestyle = 'iso, mdy'                  # Date format
lc_messages = 'C'                       # System locale for messages
lc_monetary = 'C'                       # Locale for currency
lc_numeric = 'C'                        # Locale for numbers
lc_time = 'C'                           # Locale for time
default_text_search_config = 'pg_catalog.english'  # Default text search config

# Statement behavior
statement_timeout = 0                   # 0 = disabled (no timeout)
lock_timeout = 0                        # 0 = disabled (no lock timeout)
idle_in_transaction_session_timeout = 0 # 0 = disabled
vacuum_freeze_min_age = 50000000        # Min age before freezing tuples
vacuum_freeze_table_age = 150000000     # Age at which to scan whole table

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------
deadlock_timeout = 1s                   # Time before deadlock check
max_locks_per_transaction = 64          # Max locks per transaction
max_pred_locks_per_transaction = 64     # Max predicate locks per transaction
max_pred_locks_per_relation = -2        # Max predicate locks per relation (-2 = default)
max_pred_locks_per_page = 2             # Max predicate locks per page

#------------------------------------------------------------------------------
# VERSION AND PLATFORM COMPATIBILITY
#------------------------------------------------------------------------------
# These are automatically set by PostgreSQL
# Included here for reference
#
# server_encoding = 'UTF8'
# server_version = '16.x'

#------------------------------------------------------------------------------
# ERROR HANDLING
#------------------------------------------------------------------------------
exit_on_error = off                     # Terminate session on any error
restart_after_crash = on                # Restart after backend crash

#------------------------------------------------------------------------------
# SSL/TLS CONFIGURATION
#------------------------------------------------------------------------------
# SSL is essential for production deployments
ssl = on                                # Enable SSL
ssl_cert_file = '/var/lib/postgresql/data/server.crt'   # Server certificate
ssl_key_file = '/var/lib/postgresql/data/server.key'    # Server private key
ssl_ca_file = '/var/lib/postgresql/data/root.crt'       # Root certificate
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL' # Allowed SSL ciphers
ssl_min_protocol_version = 'TLSv1.2'    # Minimum TLS version
ssl_prefer_server_ciphers = on          # Prefer server cipher order

#------------------------------------------------------------------------------
# SHARED PRELOAD LIBRARIES
#------------------------------------------------------------------------------
# Extensions loaded at server start
shared_preload_libraries = 'pg_stat_statements'  # Query statistics

#------------------------------------------------------------------------------
# EXTENSION CONFIGURATION
#------------------------------------------------------------------------------

# pg_stat_statements - query performance monitoring
pg_stat_statements.max = 10000          # Max queries to track
pg_stat_statements.track = all          # Track all queries (top, all, none)
pg_stat_statements.track_utility = on   # Track utility commands
pg_stat_statements.save = on            # Persist stats across restarts

#------------------------------------------------------------------------------
# CUSTOM SETTINGS FOR PGVECTOR
#------------------------------------------------------------------------------
# pgvector-specific optimizations
#
# For optimal pgvector performance:
# 1. Use work_mem = 64MB+ for index builds
# 2. Use maintenance_work_mem = 512MB+ for HNSW/IVFFlat creation
# 3. Use effective_cache_size = 75% RAM for query planning
# 4. Consider max_parallel_workers_per_gather = 2 for parallel scans
#
# HNSW Index Recommendations:
# - m: 16 (higher = better recall, more memory)
# - ef_construction: 64 (higher = better quality, slower builds)
# - Example: CREATE INDEX ON items USING hnsw (embedding vector_cosine_ops) WITH (m = 16, ef_construction = 64);
#
# IVFFlat Index Recommendations:
# - lists: rows / 1000 (for < 1M rows) or sqrt(rows) (for > 1M rows)
# - Example: CREATE INDEX ON items USING ivfflat (embedding vector_cosine_ops) WITH (lists = 100);
#
# Distance operators:
# - <-> : L2 distance (Euclidean)
# - <#> : Inner product
# - <=> : Cosine distance (most common for embeddings)

#------------------------------------------------------------------------------
# PERFORMANCE MONITORING
#------------------------------------------------------------------------------
# Enable these for production monitoring
# track_activities = on
# track_counts = on
# track_io_timing = on                  # Track I/O timing (slight overhead)
# track_functions = all                 # Track function call statistics
# track_activity_query_size = 4096      # Max query text size to track

track_activities = on
track_counts = on
track_io_timing = on                    # Enable for detailed I/O metrics
track_functions = pl                    # Track PL/pgSQL function performance
track_activity_query_size = 4096        # Size of query text to track

#------------------------------------------------------------------------------
# STATISTICS COLLECTOR
#------------------------------------------------------------------------------
stats_temp_directory = '/var/run/postgresql/stats_tmp'  # Stats temp directory

#------------------------------------------------------------------------------
# DEVELOPER SETTINGS (DISABLE IN PRODUCTION)
#------------------------------------------------------------------------------
# These settings are useful during development
# Set to 'off' or comment out in production

# debug_print_parse = off
# debug_print_rewritten = off
# debug_print_plan = off
# debug_pretty_print = on
# log_parser_stats = off
# log_planner_stats = off
# log_executor_stats = off
# log_statement_stats = off

