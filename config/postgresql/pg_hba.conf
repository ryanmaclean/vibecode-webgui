# VibeCode PostgreSQL pg_hba.conf
# Host-Based Authentication Configuration File
#
# This file controls: which hosts are allowed to connect, how clients are authenticated,
# which PostgreSQL user names they can use, which databases they can access.
#
# Records are checked sequentially for each connection attempt. The first matching
# record is used for authentication. If no record matches, access is denied.
#
# Format:
# TYPE  DATABASE        USER            ADDRESS                 METHOD  [OPTIONS]
#
# TYPE: local (Unix socket), host (TCP/IP), hostssl (SSL/TLS), hostnossl (no SSL)
# DATABASE: database name or 'all'
# USER: PostgreSQL user name or 'all'
# ADDRESS: IP address range (CIDR notation) or hostname
# METHOD: trust, reject, scram-sha-256, md5, password, gss, sspi, ident, peer, pam, ldap, radius, cert
#
# Recommended methods:
# - scram-sha-256: Most secure password authentication (PostgreSQL 10+)
# - md5: Legacy password authentication (less secure than scram-sha-256)
# - peer/ident: OS user authentication (for local connections)
# - cert: SSL certificate authentication
#
# Last Updated: 2024-10-28

# =============================================================================
# LOCAL CONNECTIONS (Unix Domain Sockets)
# =============================================================================

# PostgreSQL superuser (postgres) uses peer authentication
# This allows "sudo -u postgres psql" without password
local   all             postgres                                peer

# All other local users use scram-sha-256 password authentication
local   all             all                                     scram-sha-256

# =============================================================================
# IPv4 LOCAL CONNECTIONS
# =============================================================================

# Localhost connections (127.0.0.1)
# Applications running on the same host as PostgreSQL
host    all             all             127.0.0.1/32            scram-sha-256

# =============================================================================
# IPv6 LOCAL CONNECTIONS
# =============================================================================

# Localhost connections (::1)
host    all             all             ::1/128                 scram-sha-256

# =============================================================================
# PRIVATE NETWORK CONNECTIONS
# =============================================================================

# VM NAT Network (vfkit default network)
# Typical range: 10.0.2.0/24
host    all             all             10.0.2.0/24             scram-sha-256

# VM Bridge Network (if using bridged networking)
# Typical range: 192.168.64.0/24 (macOS)
host    all             all             192.168.64.0/24         scram-sha-256

# Docker/Container Networks
# Standard Docker bridge network
host    all             all             172.16.0.0/12           scram-sha-256

# Kubernetes pod networks (if applicable)
host    all             all             10.244.0.0/16           scram-sha-256

# =============================================================================
# REPLICATION CONNECTIONS
# =============================================================================

# Allow replication connections from standby servers
# Replace with actual standby server IPs in production
local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
host    replication     all             10.0.2.0/24             scram-sha-256
host    replication     all             192.168.64.0/24         scram-sha-256

# =============================================================================
# DEVELOPMENT: ALLOW ALL CONNECTIONS (INSECURE - REMOVE IN PRODUCTION!)
# =============================================================================

# WARNING: These rules allow connections from ANY host
# Only use for development/testing environments
# Comment out or remove these lines for production deployments

# Allow all IPv4 connections (DEVELOPMENT ONLY)
host    all             all             0.0.0.0/0               scram-sha-256

# Allow all IPv6 connections (DEVELOPMENT ONLY)
host    all             all             ::/0                    scram-sha-256

# =============================================================================
# PRODUCTION SECURITY RECOMMENDATIONS
# =============================================================================

# For production deployments, replace the "allow all" rules above with:
#
# 1. Specific application server IPs:
#    host    vibecode        vibecode        192.168.1.100/32        scram-sha-256
#    host    vibecode        vibecode        192.168.1.101/32        scram-sha-256
#
# 2. Application subnet:
#    host    vibecode        vibecode        10.10.0.0/16            scram-sha-256
#
# 3. Use SSL/TLS for remote connections:
#    hostssl vibecode        vibecode        0.0.0.0/0               scram-sha-256
#    hostnossl all           all             0.0.0.0/0               reject
#
# 4. Certificate-based authentication:
#    hostssl vibecode        vibecode        0.0.0.0/0               cert
#
# 5. Reject specific networks:
#    host    all             all             192.168.100.0/24        reject
#
# 6. Allow monitoring from specific host:
#    host    postgres        monitoring      10.0.1.50/32            scram-sha-256

# =============================================================================
# SSL/TLS CONNECTIONS (Recommended for Production)
# =============================================================================

# Force SSL for remote connections (uncomment for production)
# hostssl   all             all             0.0.0.0/0               scram-sha-256
# hostssl   all             all             ::/0                    scram-sha-256
# hostnossl all             all             0.0.0.0/0               reject
# hostnossl all             all             ::/0                    reject

# =============================================================================
# ADMINISTRATIVE NOTES
# =============================================================================

# To reload this file without restarting PostgreSQL:
#   SELECT pg_reload_conf();
#   -- or --
#   pg_ctl reload -D /var/lib/postgresql/data
#   -- or --
#   systemctl reload postgresql
#
# To test authentication:
#   psql -h localhost -U vibecode -d vibecode
#
# To view current connections:
#   SELECT * FROM pg_stat_activity;
#
# To view authentication failures:
#   grep "authentication failed" /var/log/postgresql/postgresql-*.log
#
# Security best practices:
# 1. Use scram-sha-256 for password authentication
# 2. Use peer/ident for local connections
# 3. Require SSL/TLS for remote connections
# 4. Limit access to specific IP ranges
# 5. Use certificate authentication for high-security environments
# 6. Regularly review and update this file
# 7. Monitor authentication failures
# 8. Use strong passwords (20+ characters)
# 9. Rotate passwords regularly
# 10. Implement connection pooling (PgBouncer) for high-traffic applications
