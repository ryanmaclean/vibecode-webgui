# Prometheus Monitoring Configuration
# Metrics collection and alerting for service observability

# Global Configuration
global:
  # Scrape interval
  scrape_interval: ${PROMETHEUS_SCRAPE_INTERVAL:-15s}
  # Evaluation interval for rules
  evaluation_interval: ${PROMETHEUS_EVAL_INTERVAL:-15s}
  # Scrape timeout
  scrape_timeout: ${PROMETHEUS_SCRAPE_TIMEOUT:-10s}

  # External labels (added to all metrics)
  external_labels:
    cluster: ${CLUSTER_NAME:-local}
    environment: ${DEPLOYMENT_ENVIRONMENT:-development}
    service: ${SERVICE_NAME:-vibecode-service}
    namespace: ${SERVICE_NAMESPACE:-vibecode}

# Alertmanager Configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - ${ALERTMANAGER_URL:-localhost:9093}
      timeout: ${ALERTMANAGER_TIMEOUT:-10s}

# Rule Files
rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/alerts/*.yml

# Scrape Configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'

  # OpenTelemetry Collector Prometheus Exporter
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['${OTEL_COLLECTOR_HOST:-localhost}:${OTEL_COLLECTOR_PORT:-9464}']
        labels:
          component: 'otel-collector'
          service: ${SERVICE_NAME:-vibecode-service}

  # Service metrics endpoint
  - job_name: 'service-metrics'
    scrape_interval: ${SERVICE_SCRAPE_INTERVAL:-15s}
    metrics_path: ${METRICS_PATH:-/metrics}
    static_configs:
      - targets: ['${SERVICE_HOST:-localhost}:${SERVICE_PORT:-3000}']
        labels:
          service: ${SERVICE_NAME:-vibecode-service}
          environment: ${DEPLOYMENT_ENVIRONMENT:-development}

  # Agent API metrics
  - job_name: 'agentapi'
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ['${AGENTAPI_HOST:-localhost}:${AGENTAPI_PORT:-8000}']
        labels:
          component: 'agentapi'
          service: 'vibecode-agentapi'

  # Node exporter (system metrics)
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['${NODE_EXPORTER_HOST:-localhost}:9100']
        labels:
          component: 'node-exporter'

  # Docker container metrics (cAdvisor)
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['${CADVISOR_HOST:-localhost}:8080']
        labels:
          component: 'cadvisor'

# OpenTelemetry Prometheus Exporter Configuration
otel:
  # Resource attributes
  resource:
    service.name: ${SERVICE_NAME:-vibecode-service}
    service.version: ${SERVICE_VERSION:-1.0.0}
    service.namespace: ${SERVICE_NAMESPACE:-vibecode}
    deployment.environment: ${DEPLOYMENT_ENVIRONMENT:-development}

  # Prometheus exporter settings
  exporter:
    prometheus:
      # Port for Prometheus to scrape
      port: ${OTEL_PROMETHEUS_PORT:-9464}
      # Endpoint path
      endpoint: /metrics
      # Namespace for metrics
      namespace: ${METRICS_NAMESPACE:-vibecode}
      # Include resource attributes as labels
      resource_to_telemetry_conversion:
        enabled: true

# Alert Rules Configuration
alert_rules:
  # Agent task alerts
  agent:
    - alert: HighAgentFailureRate
      expr: |
        rate(agent_failure_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
        component: agent
      annotations:
        summary: "High agent task failure rate detected"
        description: "Agent failure rate is {{ $value }} failures/sec for {{ $labels.agent_type }}"

    - alert: LongRunningAgentTask
      expr: |
        histogram_quantile(0.95, rate(agent_task_duration_seconds_bucket[5m])) > 300
      for: 10m
      labels:
        severity: warning
        component: agent
      annotations:
        summary: "Agent tasks taking longer than expected"
        description: "95th percentile task duration is {{ $value }}s for {{ $labels.agent_type }}"

    - alert: HighAgentErrorRate
      expr: |
        rate(agent_errors_total[5m]) > 0.5
      for: 5m
      labels:
        severity: critical
        component: agent
      annotations:
        summary: "High agent error rate detected"
        description: "Agent error rate is {{ $value }} errors/sec"

  # HTTP alerts
  http:
    - alert: HighHTTPErrorRate
      expr: |
        rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
      for: 5m
      labels:
        severity: critical
        component: http
      annotations:
        summary: "High HTTP 5xx error rate"
        description: "HTTP error rate is {{ $value | humanizePercentage }} for {{ $labels.route }}"

    - alert: SlowHTTPRequests
      expr: |
        histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
      for: 10m
      labels:
        severity: warning
        component: http
      annotations:
        summary: "Slow HTTP requests detected"
        description: "95th percentile request duration is {{ $value }}s for {{ $labels.route }}"

    - alert: HighHTTPRequestRate
      expr: |
        rate(http_requests_total[1m]) > 1000
      for: 5m
      labels:
        severity: info
        component: http
      annotations:
        summary: "High HTTP request rate"
        description: "Request rate is {{ $value }} req/sec"

  # System alerts
  system:
    - alert: ServiceDown
      expr: up == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Service is down"
        description: "{{ $labels.job }} on {{ $labels.instance }} is down"

    - alert: HighMemoryUsage
      expr: |
        (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage"
        description: "Memory usage is {{ $value | humanizePercentage }}"

    - alert: HighCPUUsage
      expr: |
        100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage"
        description: "CPU usage is {{ $value }}%"

# Recording Rules (pre-computed metrics)
recording_rules:
  # Agent success rate
  - record: agent:success_rate:5m
    expr: |
      rate(agent_success_total[5m]) / (rate(agent_success_total[5m]) + rate(agent_failure_total[5m]))

  # HTTP error rate
  - record: http:error_rate:5m
    expr: |
      rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m])

  # Average agent task duration
  - record: agent:task_duration:avg
    expr: |
      rate(agent_task_duration_seconds_sum[5m]) / rate(agent_task_duration_seconds_count[5m])

  # Average HTTP request duration
  - record: http:request_duration:avg
    expr: |
      rate(http_request_duration_seconds_sum[5m]) / rate(http_request_duration_seconds_count[5m])

# Remote Write Configuration (for long-term storage)
remote_write:
  - url: ${PROMETHEUS_REMOTE_WRITE_URL}
    queue_config:
      capacity: 10000
      max_shards: 50
      min_shards: 1
      max_samples_per_send: 5000
      batch_send_deadline: 5s
      min_backoff: 30ms
      max_backoff: 100ms
    write_relabel_configs:
      # Drop high-cardinality metrics
      - source_labels: [__name__]
        regex: 'agent_output_lines_total'
        action: drop

# Remote Read Configuration (for querying remote storage)
remote_read:
  - url: ${PROMETHEUS_REMOTE_READ_URL}
    read_recent: true

# Storage Configuration
storage:
  tsdb:
    # Retention time
    retention.time: ${PROMETHEUS_RETENTION_TIME:-15d}
    # Retention size
    retention.size: ${PROMETHEUS_RETENTION_SIZE:-10GB}
    # Data directory
    path: ${PROMETHEUS_DATA_DIR:-/prometheus/data}
    # WAL compression
    wal_compression: true

# Performance Tuning
performance:
  # Query concurrency
  query.max-concurrency: ${PROMETHEUS_QUERY_CONCURRENCY:-20}
  # Query timeout
  query.timeout: ${PROMETHEUS_QUERY_TIMEOUT:-2m}
  # Query lookback delta
  query.lookback-delta: ${PROMETHEUS_LOOKBACK_DELTA:-5m}
