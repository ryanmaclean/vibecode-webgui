# Datadog Monitoring Configuration for PyTorch ML Workloads
# OpenTelemetry integration optimized for machine learning observability

# Service Configuration
service:
  name: ${SERVICE_NAME:-pytorch-ml-service}
  version: ${SERVICE_VERSION:-1.0.0}
  namespace: ${SERVICE_NAMESPACE:-vibecode}
  environment: ${DEPLOYMENT_ENVIRONMENT:-development}

# Datadog Agent Configuration
datadog:
  # API key for Datadog authentication
  api_key: ${DD_API_KEY}
  site: ${DD_SITE:-datadoghq.com}

  # APM (Application Performance Monitoring)
  apm:
    enabled: true
    # Port for trace agent
    receiver_port: 8126
    # Sample rate (0.0 to 1.0)
    sample_rate: ${DD_TRACE_SAMPLE_RATE:-1.0}

  # Logs
  logs:
    enabled: true
    # Log level: trace, debug, info, warn, error
    level: ${LOG_LEVEL:-info}
    # JSON formatting for structured logs
    json: true

  # DogStatsD for metrics
  dogstatsd:
    enabled: true
    port: 8125
    # Non-local traffic (for containerized environments)
    non_local_traffic: true

# OpenTelemetry Collector Configuration
otel:
  # Receivers
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

  # Exporters
  exporters:
    # Datadog exporter
    datadog:
      api:
        key: ${DD_API_KEY}
        site: ${DD_SITE:-datadoghq.com}

      # Traces configuration
      traces:
        endpoint: https://trace.agent.${DD_SITE:-datadoghq.com}
        # Span name remapping
        span_name_remapping:
          model.training: "ModelTraining"
          model.inference: "ModelInference"
          data.loading: "DataLoading"
          http.request: "HTTPRequest"

      # Metrics configuration
      metrics:
        endpoint: https://api.${DD_SITE:-datadoghq.com}
        # Histogram aggregation
        histograms:
          mode: distributions
          send_count_sum_metrics: true

      # Host metadata
      host_metadata:
        enabled: true
        hostname_source: first_resource

  # Processors
  processors:
    # Batch processing for efficiency
    batch:
      timeout: 10s
      send_batch_size: 100
      send_batch_max_size: 1000

    # Resource detection
    resourcedetection:
      detectors: [env, system, docker]
      timeout: 5s

    # Attributes processor for enrichment
    attributes:
      actions:
        - key: deployment.environment
          value: ${DEPLOYMENT_ENVIRONMENT:-development}
          action: upsert
        - key: service.namespace
          value: ${SERVICE_NAMESPACE:-vibecode}
          action: upsert
        - key: ml.framework
          value: pytorch
          action: upsert

  # Service pipelines
  service:
    pipelines:
      # Traces pipeline
      traces:
        receivers: [otlp]
        processors: [batch, resourcedetection, attributes]
        exporters: [datadog]

      # Metrics pipeline
      metrics:
        receivers: [otlp]
        processors: [batch, resourcedetection, attributes]
        exporters: [datadog]

# Custom Metrics Configuration
metrics:
  # ML Model Training Metrics
  training:
    - name: ml_training_epoch_duration_seconds
      type: histogram
      description: Duration of training epoch in seconds
      unit: s
      tags:
        - model_name
        - epoch
        - gpu_count

    - name: ml_training_loss
      type: gauge
      description: Training loss value
      unit: "1"
      tags:
        - model_name
        - epoch
        - loss_type

    - name: ml_training_accuracy
      type: gauge
      description: Training accuracy
      unit: "1"
      tags:
        - model_name
        - epoch
        - dataset

    - name: ml_validation_accuracy
      type: gauge
      description: Validation accuracy
      unit: "1"
      tags:
        - model_name
        - epoch
        - dataset

    - name: ml_training_samples_per_second
      type: gauge
      description: Training throughput in samples per second
      unit: "1/s"
      tags:
        - model_name
        - batch_size

  # ML Model Inference Metrics
  inference:
    - name: ml_inference_duration_seconds
      type: histogram
      description: Model inference duration in seconds
      unit: s
      tags:
        - model_name
        - model_version
        - batch_size

    - name: ml_inference_requests_total
      type: counter
      description: Total number of inference requests
      unit: "1"
      tags:
        - model_name
        - model_version
        - success

    - name: ml_inference_batch_size
      type: histogram
      description: Inference batch size distribution
      unit: "1"
      tags:
        - model_name

  # GPU Metrics
  gpu:
    - name: gpu_utilization_percent
      type: gauge
      description: GPU utilization percentage
      unit: "%"
      tags:
        - gpu_id
        - gpu_name

    - name: gpu_memory_used_bytes
      type: gauge
      description: GPU memory used in bytes
      unit: By
      tags:
        - gpu_id
        - gpu_name

    - name: gpu_memory_total_bytes
      type: gauge
      description: Total GPU memory in bytes
      unit: By
      tags:
        - gpu_id
        - gpu_name

    - name: gpu_temperature_celsius
      type: gauge
      description: GPU temperature in Celsius
      unit: C
      tags:
        - gpu_id
        - gpu_name

  # Data Loading Metrics
  data:
    - name: ml_data_loading_duration_seconds
      type: histogram
      description: Data loading duration in seconds
      unit: s
      tags:
        - dataset_name
        - batch_size

    - name: ml_data_samples_loaded_total
      type: counter
      description: Total samples loaded from dataset
      unit: "1"
      tags:
        - dataset_name

    - name: ml_data_augmentation_duration_seconds
      type: histogram
      description: Data augmentation duration in seconds
      unit: s
      tags:
        - augmentation_type

  # Model Checkpoint Metrics
  checkpoint:
    - name: ml_checkpoint_save_duration_seconds
      type: histogram
      description: Model checkpoint save duration in seconds
      unit: s
      tags:
        - model_name
        - checkpoint_type

    - name: ml_checkpoint_size_bytes
      type: gauge
      description: Model checkpoint size in bytes
      unit: By
      tags:
        - model_name
        - checkpoint_type

  # HTTP metrics
  http:
    - name: http_requests_total
      type: counter
      description: Total HTTP requests
      unit: "1"
      tags:
        - method
        - route
        - status_code

    - name: http_request_duration_seconds
      type: histogram
      description: HTTP request duration in seconds
      unit: s
      tags:
        - method
        - route
        - status_code

  # System Metrics (Memory is critical for ML)
  system:
    - name: system_memory_used_bytes
      type: gauge
      description: System memory used in bytes
      unit: By
      tags:
        - host

    - name: system_cpu_utilization_percent
      type: gauge
      description: CPU utilization percentage
      unit: "%"
      tags:
        - host
        - cpu_id

# Alerting Rules (optional - configured in Datadog UI)
alerts:
  enabled: ${DD_ALERTS_ENABLED:-false}
  # Configure monitors in Datadog UI or via Terraform/API
  # Common ML alerts:
  # - GPU utilization too low during training
  # - Training loss not decreasing
  # - Inference latency exceeding threshold
  # - GPU memory overflow
  # - Model accuracy below threshold

# Tags for service identification
tags:
  - service:${SERVICE_NAME:-pytorch-ml-service}
  - env:${DEPLOYMENT_ENVIRONMENT:-development}
  - version:${SERVICE_VERSION:-1.0.0}
  - namespace:${SERVICE_NAMESPACE:-vibecode}
  - ml_framework:pytorch
  - platform:azure
  - template:azure-pytorch-dsvm

# Additional configuration
config:
  # Enable runtime metrics
  runtime_metrics_enabled: true
  # Profiling (useful for identifying bottlenecks in ML code)
  profiling_enabled: ${DD_PROFILING_ENABLED:-true}
  # Log injection (correlate logs with traces)
  log_injection_enabled: true
  # GPU monitoring
  gpu_monitoring_enabled: ${DD_GPU_MONITORING_ENABLED:-true}
