# ==============================================================================
# Valkey Production Configuration for VibeCode
# ==============================================================================
# License: BSD-3-Clause (Linux Foundation)
# Version: 7.2.6+
# Purpose: Session storage and caching for VibeCode authentication
# Compatible with: Redis 7.2+ protocol
#
# Why Valkey?
# - Redis changed to restrictive RSAL/SSPL license in 2024
# - Valkey is open-source fork by Linux Foundation (BSD-3-Clause)
# - 100% Redis protocol compatible
# - Community-driven development
# - Enhanced performance features
#
# ==============================================================================

# ==============================================================================
# NETWORK CONFIGURATION
# ==============================================================================

# Network interface binding
# Production: bind to specific interface or 0.0.0.0 with firewall
# Development: bind 127.0.0.1 for localhost-only access
bind 0.0.0.0

# Accept connections on specified port
port 6379

# TCP listen() backlog
# Increase for high connection rate environments
tcp-backlog 511

# Close connection after client is idle for N seconds (0 = disabled)
timeout 0

# TCP keepalive
# Send TCP ACKs to clients every N seconds to detect dead connections
tcp-keepalive 300

# ==============================================================================
# SECURITY
# ==============================================================================

# Require password authentication
# CRITICAL: Change this in production!
# Generate strong password: openssl rand -base64 32
requirepass VibeCodeChangeInProduction2025

# Enable protected mode
# Prevents access from non-localhost when no password is set
protected-mode yes

# ==============================================================================
# ACCESS CONTROL LISTS (ACL)
# ==============================================================================
# Valkey supports Redis 6+ ACL system
# Define users with specific permissions

# ACL file location (optional)
# aclfile /etc/valkey/users.acl

# Example ACL rules (uncomment to enable):
# Default user (full access)
# user default on >VibeCodeChangeInProduction2025 ~* &* +@all

# Session storage user (limited to session operations)
# user session on >SessionPassword ~session:* &* +@read +@write +@keyspace +@string +@hash +ttl +expire +del

# Cache user (limited to cache operations)
# user cache on >CachePassword ~cache:* &* +@read +@write +@keyspace +@string +@hash +ttl +expire +del +incr

# Monitoring user (read-only)
# user monitor on >MonitorPassword ~* &* +@read +@admin +@slow +@fast

# ==============================================================================
# DANGEROUS COMMAND RESTRICTIONS
# ==============================================================================
# Disable or rename potentially dangerous commands

# Prevent accidental data loss
rename-command FLUSHALL ""
rename-command FLUSHDB ""

# Prevent configuration changes
rename-command CONFIG CONFIG_ADMIN_ONLY

# Prevent shutdown from clients
rename-command SHUTDOWN SHUTDOWN_ADMIN_ONLY

# Prevent debugging commands in production
rename-command DEBUG ""

# ==============================================================================
# MEMORY MANAGEMENT
# ==============================================================================

# Maximum memory limit
# Session storage recommended: 512MB-1GB
# Heavy caching: 2GB-8GB
maxmemory 512mb

# Eviction policy when maxmemory is reached
# allkeys-lru: Remove any key using LRU algorithm (recommended for cache)
# volatile-lru: Remove keys with TTL using LRU (recommended for sessions)
# allkeys-lfu: Remove any key using LFU algorithm (best for mixed workload)
# volatile-lfu: Remove keys with TTL using LFU
# allkeys-random: Remove random key
# volatile-random: Remove random key with TTL
# volatile-ttl: Remove key with nearest TTL
# noeviction: Return error when memory limit reached
maxmemory-policy allkeys-lru

# Number of samples for LRU/LFU algorithms (higher = more accurate, slower)
maxmemory-samples 5

# ==============================================================================
# PERSISTENCE - RDB (Snapshotting)
# ==============================================================================

# Save database to disk:
# save <seconds> <changes>
# Will save after 900 seconds (15 minutes) if at least 1 key changed
save 900 1

# Will save after 300 seconds (5 minutes) if at least 10 keys changed
save 300 10

# Will save after 60 seconds if at least 10000 keys changed
save 60 10000

# Stop accepting writes if RDB save fails (prevents data loss)
stop-writes-on-bgsave-error yes

# Compress RDB files (recommended)
rdbcompression yes

# Checksum RDB files for corruption detection
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory for RDB and AOF files
dir /var/lib/valkey

# ==============================================================================
# PERSISTENCE - AOF (Append-Only File)
# ==============================================================================

# Enable AOF persistence (recommended for session storage)
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy:
# always: Fsync after every write (slowest, safest)
# everysec: Fsync once per second (recommended balance)
# no: Let OS decide when to fsync (fastest, least safe)
appendfsync everysec

# Don't fsync during BGSAVE/BGREWRITEAOF (prevents latency spikes)
no-appendfsync-on-rewrite no

# Automatic AOF rewrite configuration
# Rewrite AOF when it grows by this percentage
auto-aof-rewrite-percentage 100

# Minimum size before triggering automatic rewrite
auto-aof-rewrite-min-size 64mb

# Load truncated AOF on startup (recover from crashes)
aof-load-truncated yes

# Use RDB preamble in AOF for faster loading
aof-use-rdb-preamble yes

# ==============================================================================
# SESSION STORAGE OPTIMIZATION
# ==============================================================================

# Number of databases (0-15 by default)
databases 16

# Use lazy freeing for better performance
# Async deletion in background thread
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ==============================================================================
# LOGGING
# ==============================================================================

# Log levels: debug, verbose, notice, warning
loglevel notice

# Log file location (empty string = stdout)
logfile /var/log/valkey/valkey.log

# Enable syslog logging
syslog-enabled no

# Syslog identity
# syslog-ident valkey

# Syslog facility
# syslog-facility local0

# ==============================================================================
# SLOW LOG
# ==============================================================================

# Log commands slower than this value (microseconds)
# 10000 = 10 milliseconds
slowlog-log-slower-than 10000

# Maximum length of slow log
slowlog-max-len 128

# ==============================================================================
# LATENCY MONITORING
# ==============================================================================

# Enable latency monitoring for events exceeding threshold (milliseconds)
# 0 = disabled, 100ms = recommended for production
latency-monitor-threshold 100

# ==============================================================================
# CLIENT LIMITS
# ==============================================================================

# Maximum number of connected clients
maxclients 10000

# Client output buffer limits:
# client-output-buffer-limit <class> <hard-limit> <soft-limit> <soft-seconds>

# Normal clients
client-output-buffer-limit normal 0 0 0

# Replica clients
client-output-buffer-limit replica 256mb 64mb 60

# Pub/Sub clients
client-output-buffer-limit pubsub 32mb 8mb 60

# ==============================================================================
# REPLICATION (for High Availability)
# ==============================================================================

# Uncomment to configure this instance as a replica:
# replicaof <masterip> <masterport>

# If master is password protected:
# masterauth <master-password>

# Replica serves read-only queries
replica-read-only yes

# Replica priority for sentinel failover (0 = never promote)
replica-priority 100

# Minimum number of replicas for writes
# min-replicas-to-write 1
# min-replicas-max-lag 10

# ==============================================================================
# ADVANCED DATA STRUCTURE SETTINGS
# ==============================================================================

# Hashes are encoded using memory-efficient data structures when small
hash-max-listpack-entries 512
hash-max-listpack-value 64

# Lists are encoded as listpack when small
list-max-listpack-size -2
list-compress-depth 0

# Sets with only integers are encoded as intsets when small
set-max-intset-entries 512

# Sorted sets are encoded as listpack when small
zset-max-listpack-entries 128
zset-max-listpack-value 64

# HyperLogLog sparse representation max bytes
hll-sparse-max-bytes 3000

# Streams macro node max bytes/entries
stream-node-max-bytes 4096
stream-node-max-entries 100

# ==============================================================================
# ACTIVE REHASHING
# ==============================================================================

# Use extra CPU time to rehash main dictionary
# Improves memory efficiency
activerehashing yes

# ==============================================================================
# EVENT NOTIFICATION
# ==============================================================================

# Enable keyspace notifications (useful for monitoring)
# Format: <classes><events>
# Classes: K=keyspace, E=keyevent, g=generic, $=string, l=list, s=set, h=hash, z=zset, x=expired, e=evicted, t=stream, m=missed
# Events: A=all events

# Example: Enable keyspace notifications for expired keys
# notify-keyspace-events Ex

# Example: Enable all notifications (warning: performance impact)
# notify-keyspace-events KEA

# ==============================================================================
# ADVANCED CONFIG
# ==============================================================================

# Server frequency (Hz) for background tasks
# Higher = more responsive, more CPU usage
# Range: 1-500, recommended: 10
hz 10

# Dynamically adapt hz based on connected clients
dynamic-hz yes

# Incremental fsync for AOF and RDB (reduces I/O spikes)
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Disable Linux Transparent Huge Pages (THP) warnings
# THP can cause latency issues
# Set in /etc/rc.local: echo never > /sys/kernel/mm/transparent_hugepage/enabled
# Set in /etc/rc.local: echo never > /sys/kernel/mm/transparent_hugepage/defrag

# ==============================================================================
# TLS/SSL CONFIGURATION (Optional)
# ==============================================================================
# Uncomment to enable TLS support
# Requires certificate files

# Disable non-TLS port
# port 0

# Enable TLS port
# tls-port 6380

# Certificate files
# tls-cert-file /etc/valkey/certs/valkey.crt
# tls-key-file /etc/valkey/certs/valkey.key
# tls-ca-cert-file /etc/valkey/certs/ca.crt

# Client certificate authentication
# tls-auth-clients no
# tls-auth-clients optional

# TLS protocols (disable old versions for security)
# tls-protocols "TLSv1.2 TLSv1.3"

# TLS cipher suites
# tls-ciphers DEFAULT:!MEDIUM:!LOW:!EXPORT:!aNULL:!eNULL:!SSLv2

# Prefer server cipher order
# tls-prefer-server-ciphers yes

# Enable TLS for replication
# tls-replication yes

# Enable TLS for cluster bus
# tls-cluster yes

# ==============================================================================
# CLUSTER MODE (Optional)
# ==============================================================================
# Uncomment to enable cluster mode

# Enable cluster mode
# cluster-enabled yes

# Cluster configuration file (auto-generated)
# cluster-config-file nodes-6379.conf

# Cluster node timeout (milliseconds)
# cluster-node-timeout 15000

# Cluster replica validity factor
# cluster-replica-validity-factor 10

# Cluster migration barrier
# cluster-migration-barrier 1

# Require full cluster coverage
# cluster-require-full-coverage yes

# Allow reads from replicas
# cluster-replica-no-failover no

# ==============================================================================
# MONITORING INTEGRATION
# ==============================================================================

# Datadog integration notes:
# - Use INFO command to collect metrics
# - Monitor: used_memory, connected_clients, ops_per_sec, hit_rate
# - Set up alerts for: high memory usage, connection limits, slow commands
# - Use SLOWLOG GET to identify slow operations
# - Monitor AOF/RDB lag with INFO persistence

# Prometheus integration notes:
# - Use valkey_exporter (https://github.com/oliver006/redis_exporter)
# - Export port: 9121 (default)
# - Metrics endpoint: http://localhost:9121/metrics

# ==============================================================================
# VIBECODE-SPECIFIC SETTINGS
# ==============================================================================

# Session key pattern: session:{session_id}
# Cache key pattern: cache:{resource}:{id}
# Rate limit pattern: ratelimit:{user_id}:{action}
# JWT token pattern: jwt:{token_id}

# Recommended key naming conventions:
# - Use colons for namespace separation
# - Include type prefix (session:, cache:, ratelimit:)
# - Use meaningful identifiers
# - Set appropriate TTL for all keys

# Recommended TTLs:
# - User sessions: 3600 seconds (1 hour)
# - API cache: 300 seconds (5 minutes)
# - Rate limits: 60 seconds (1 minute)
# - JWT tokens: 1800 seconds (30 minutes)

# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
