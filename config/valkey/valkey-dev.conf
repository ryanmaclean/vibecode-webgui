# ==============================================================================
# DATA SEEDING FOR DEVELOPMENT
# ==============================================================================

# After Valkey starts, you can seed test data:
#
# # Create test sessions
# redis-cli SET session:dev123 '{"userId":"dev123","email":"dev@vibecode.dev","role":"admin"}' EX 86400
# redis-cli SET session:test456 '{"userId":"test456","email":"test@vibecode.dev","role":"developer"}' EX 86400
#
# # Create test cache entries
# redis-cli HSET cache:user:dev123 name "Dev User" email "dev@vibecode.dev" role "admin"
# redis-cli EXPIRE cache:user:dev123 3600
#
# # Create test rate limits
# redis-cli SET ratelimit:dev123:api 5 EX 60
# redis-cli SET ratelimit:test456:api 10 EX 60

# ==============================================================================
# RESET COMMANDS FOR TESTING
# ==============================================================================

# WARNING: These commands delete all data!
#
# Flush all databases:
# > FLUSHALL
#
# Flush current database:
# > FLUSHDB
#
# Reset stats:
# > CONFIG RESETSTAT
#
# Clear slow log:
# > SLOWLOG RESET

# ==============================================================================
# PERFORMANCE TESTING
# ==============================================================================

# Use valkey-benchmark for performance testing:
# $ valkey-benchmark -h localhost -p 6379 -t set,get -n 100000 -q
# or
# $ redis-benchmark -h localhost -p 6379 -t set,get -n 100000 -q
#
# Test specific operations:
# $ valkey-benchmark -h localhost -p 6379 -t set,get,incr,lpush,rpush,lpop,rpop,sadd,hset,spop,zadd,zpopmin,lrange,mset -n 100000 -q

# ==============================================================================
# DEBUGGING TIPS
# ==============================================================================

# 1. Monitor all commands in real-time:
#    > MONITOR
#
# 2. Check memory usage:
#    > INFO memory
#    > MEMORY STATS
#    > MEMORY DOCTOR
#
# 3. Find slow commands:
#    > SLOWLOG GET 25
#
# 4. Check connected clients:
#    > CLIENT LIST
#
# 5. View server info:
#    > INFO
#    > INFO server
#    > INFO stats
#    > INFO replication
#    > INFO cpu
#
# 6. Check key patterns:
#    > SCAN 0 MATCH session:* COUNT 100
#    > KEYS session:*  (use with caution!)
#
# 7. Analyze key memory usage:
#    > MEMORY USAGE session:user123
#
# 8. Check latency:
#    $ valkey-cli --latency
#    $ valkey-cli --latency-history
#
# 9. Test throughput:
#    $ valkey-cli --rps (requests per second)

# ==============================================================================
# END OF DEVELOPMENT CONFIGURATION
# ==============================================================================
