# ==============================================================================
# Valkey Development Configuration for VibeCode
# ==============================================================================
# License: BSD-3-Clause (Linux Foundation)
# Version: 7.2.6+
# Purpose: Development and testing environment
#
# WARNING: DO NOT USE IN PRODUCTION!
# This configuration prioritizes developer convenience over security
# ==============================================================================

# Include base production configuration
include /etc/valkey/valkey.conf

# ==============================================================================
# DEVELOPMENT OVERRIDES
# ==============================================================================

# Network - localhost only for security
bind 127.0.0.1

# Disable authentication for local development
# WARNING: Never use in production!
protected-mode no
requirepass ""

# ==============================================================================
# PERSISTENCE - DISABLED FOR SPEED
# ==============================================================================

# Disable RDB snapshots (faster, data loss acceptable in dev)
save ""

# Disable AOF persistence (faster startup)
appendonly no

# ==============================================================================
# MEMORY - REDUCED FOR LOCAL DEVELOPMENT
# ==============================================================================

# Lower memory limit for development
maxmemory 256mb

# More aggressive eviction for testing
maxmemory-policy allkeys-lru
maxmemory-samples 3

# ==============================================================================
# LOGGING - VERBOSE FOR DEBUGGING
# ==============================================================================

# Enable debug logging
loglevel debug

# Log to stdout for docker-compose logs
logfile ""

# ==============================================================================
# SLOW LOG - MORE SENSITIVE
# ==============================================================================

# Log commands slower than 1ms (vs 10ms in production)
slowlog-log-slower-than 1000

# Larger slow log for debugging
slowlog-max-len 256

# ==============================================================================
# MONITORING - MORE AGGRESSIVE
# ==============================================================================

# Lower threshold for latency monitoring (10ms vs 100ms)
latency-monitor-threshold 10

# ==============================================================================
# CLIENT LIMITS - RELAXED
# ==============================================================================

# Lower connection limit for development
maxclients 1000

# ==============================================================================
# DANGEROUS COMMANDS - ENABLED FOR TESTING
# ==============================================================================

# Re-enable dangerous commands for development convenience
# Note: In production config these are disabled
rename-command FLUSHALL FLUSHALL
rename-command FLUSHDB FLUSHDB
rename-command CONFIG CONFIG
rename-command SHUTDOWN SHUTDOWN
rename-command DEBUG DEBUG

# ==============================================================================
# REPLICATION - DISABLED
# ==============================================================================

# No replication needed in development
# replicaof <masterip> <masterport>

# ==============================================================================
# TLS - DISABLED FOR SIMPLICITY
# ==============================================================================

# Use plain TCP in development
port 6379
# tls-port 6380

# ==============================================================================
# CLUSTER MODE - DISABLED
# ==============================================================================

# Single instance for development
# cluster-enabled no

# ==============================================================================
# EVENT NOTIFICATION - ENABLED FOR TESTING
# ==============================================================================

# Enable all keyspace events for debugging
notify-keyspace-events KEA

# ==============================================================================
# DEVELOPMENT HELPERS
# ==============================================================================

# Lower hz for less CPU usage in development
hz 5

# Disable dynamic hz
dynamic-hz no

# ==============================================================================
# DOCKER COMPOSE INTEGRATION
# ==============================================================================

# When running in Docker Compose:
# 1. Bind to 0.0.0.0 inside container
# 2. Expose port 6379 to host
# 3. Use service name 'valkey' or 'redis' for connection
# 4. No password required
# 5. Data is ephemeral (lost on container restart)

# Example docker-compose.yml:
# services:
#   valkey:
#     image: valkey/valkey:7-alpine
#     ports:
#       - "6379:6379"
#     volumes:
#       - ./config/valkey/valkey-dev.conf:/etc/valkey/valkey.conf
#     command: valkey-server /etc/valkey/valkey.conf

# ==============================================================================
# TESTING COMMANDS
# ==============================================================================

# Connect from host:
# $ valkey-cli -h localhost -p 6379
# or
# $ redis-cli -h localhost -p 6379
#
# Basic tests:
# > PING
# > SET test "Hello Valkey"
# > GET test
# > DEL test
#
# Session test:
# > SET session:user123 "{\"userId\":123,\"email\":\"test@example.com\"}" EX 3600
# > GET session:user123
# > TTL session:user123
#
# Cache test:
# > HSET cache:user:123 name "John Doe" email "john@example.com"
# > HGETALL cache:user:123
# > EXPIRE cache:user:123 300
#
# Rate limit test:
# > INCR ratelimit:user123:api
# > EXPIRE ratelimit:user123:api 60
# > GET ratelimit:user123:api
#
# Monitor commands:
# > MONITOR
# > INFO
# > INFO memory
# > INFO stats
# > CONFIG GET *
# > SLOWLOG GET 10
# > CLIENT LIST

# ==============================================================================
# INTEGRATION WITH VIBECODE
# ==============================================================================

# Environment variables for ioredis client:
# REDIS_HOST=localhost
# REDIS_PORT=6379
# REDIS_PASSWORD=
# REDIS_DB=0
# REDIS_TLS=false

# TypeScript/JavaScript connection:
# import { Redis } from 'ioredis';
