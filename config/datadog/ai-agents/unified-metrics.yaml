# Unified AI Agent Observability Metrics
# Covers: Ralph Loop, Sequential Thinking, Gas Town, Claude Code, OpenAI/Codex, Anthropic
# For Datadog dashboards and monitoring

metrics:
  # ============================================================
  # RALPH LOOP / SEQUENTIAL THINKING
  # ============================================================
  - name: ralph.loop.iteration
    type: counter
    description: "Ralph loop iterations executed"
    tags:
      - session_id
      - agent_type
      - outcome  # success, failure, timeout

  - name: ralph.loop.duration_ms
    type: histogram
    description: "Duration of each Ralph loop iteration"
    tags:
      - session_id
      - complexity

  - name: ralph.thinking.thought_count
    type: histogram
    description: "Number of thoughts per problem"
    tags:
      - session_id
      - problem_type

  - name: ralph.thinking.depth
    type: gauge
    description: "Current thinking depth (nested thoughts)"
    tags:
      - session_id

  - name: ralph.thinking.branch_count
    type: counter
    description: "Thought branches created"
    tags:
      - session_id
      - branch_type  # revision, question, alternative

  - name: ralph.thinking.convergence_ms
    type: histogram
    description: "Time to converge on solution"
    tags:
      - session_id
      - success

  - name: sequential_thinking.request.count
    type: counter
    description: "Sequential thinking requests"
    tags:
      - model
      - provider

  - name: sequential_thinking.request.duration_ms
    type: histogram
    description: "Sequential thinking request latency"
    tags:
      - model
      - thought_count

  - name: sequential_thinking.fallback.count
    type: counter
    description: "Fallbacks triggered"
    tags:
      - reason
      - from_model

  # ============================================================
  # CLAUDE CODE / ANTHROPIC API
  # ============================================================
  - name: claude.api.request.count
    type: counter
    description: "Claude API requests"
    tags:
      - model  # claude-3-opus, claude-3-sonnet, etc.
      - endpoint  # messages, completions
      - status  # success, error, rate_limited

  - name: claude.api.request.duration_ms
    type: histogram
    description: "Claude API request latency"
    tags:
      - model
      - streaming  # true, false

  - name: claude.api.tokens.input
    type: counter
    description: "Input tokens sent to Claude"
    tags:
      - model
      - session_id

  - name: claude.api.tokens.output
    type: counter
    description: "Output tokens from Claude"
    tags:
      - model
      - session_id

  - name: claude.api.tokens.cache_read
    type: counter
    description: "Tokens read from prompt cache"
    tags:
      - model

  - name: claude.api.tokens.cache_write
    type: counter
    description: "Tokens written to prompt cache"
    tags:
      - model

  - name: claude.api.cost_usd
    type: counter
    description: "Estimated cost in USD (microcents)"
    tags:
      - model
      - session_id

  - name: claude.api.error.count
    type: counter
    description: "Claude API errors"
    tags:
      - model
      - error_type  # rate_limit, timeout, invalid_request, server_error

  - name: claude.tool_use.count
    type: counter
    description: "Tool use invocations"
    tags:
      - tool_name
      - model
      - success

  - name: claude.tool_use.duration_ms
    type: histogram
    description: "Tool execution duration"
    tags:
      - tool_name

  - name: claude.streaming.token_rate
    type: gauge
    description: "Tokens per second in streaming response"
    tags:
      - model

  # ============================================================
  # OPENAI / CODEX / GPT
  # ============================================================
  - name: openai.api.request.count
    type: counter
    description: "OpenAI API requests"
    tags:
      - model  # gpt-4, gpt-3.5-turbo, codex
      - endpoint
      - status

  - name: openai.api.request.duration_ms
    type: histogram
    description: "OpenAI API request latency"
    tags:
      - model
      - streaming

  - name: openai.api.tokens.input
    type: counter
    description: "Input tokens to OpenAI"
    tags:
      - model

  - name: openai.api.tokens.output
    type: counter
    description: "Output tokens from OpenAI"
    tags:
      - model

  - name: openai.api.cost_usd
    type: counter
    description: "Estimated cost in USD (microcents)"
    tags:
      - model

  - name: openai.api.error.count
    type: counter
    description: "OpenAI API errors"
    tags:
      - model
      - error_type

  - name: openai.embedding.count
    type: counter
    description: "Embedding requests"
    tags:
      - model  # text-embedding-3-small, text-embedding-3-large

  - name: openai.embedding.dimensions
    type: gauge
    description: "Embedding dimensions used"
    tags:
      - model

  # ============================================================
  # GAS TOWN / POLECATS
  # ============================================================
  - name: gastown.polecats.spawned
    type: counter
    description: "Polecats spawned"
    tags:
      - rig_name
      - agent_type
      - priority

  - name: gastown.polecats.completed
    type: counter
    description: "Polecats completed work"
    tags:
      - rig_name
      - success

  - name: gastown.polecats.failed
    type: counter
    description: "Polecats failed"
    tags:
      - rig_name
      - failure_reason

  - name: gastown.polecats.active
    type: gauge
    description: "Currently active polecats"
    tags:
      - rig_name

  - name: gastown.polecat.duration_s
    type: histogram
    description: "Polecat work duration"
    tags:
      - rig_name
      - task_type

  - name: gastown.polecat.tokens_used
    type: counter
    description: "Tokens used by polecat"
    tags:
      - rig_name
      - model

  - name: gastown.polecat.cost_usd
    type: counter
    description: "Cost per polecat session"
    tags:
      - rig_name

  # Mayor metrics
  - name: gastown.mayor.tasks_assigned
    type: counter
    description: "Tasks assigned by mayor"
    tags:
      - priority
      - task_type
      - target_agent

  # Nudge metrics
  - name: gastown.nudges.sent
    type: counter
    description: "Nudges sent to polecats"
    tags:
      - target_agent
      - urgency
      - rig_name

  - name: gastown.nudges.responded
    type: counter
    description: "Nudges that got response"
    tags:
      - target_agent
      - response_time_bucket

  # Beads/Kanban metrics
  - name: gastown.beads.created
    type: counter
    description: "New beads created"
    tags:
      - priority
      - type
      - rig_name

  - name: gastown.beads.in_progress
    type: gauge
    description: "Beads currently in progress"
    tags:
      - priority

  - name: gastown.beads.completed
    type: counter
    description: "Beads marked complete"
    tags:
      - priority
      - assigned_agent

  - name: gastown.beads.escalated
    type: counter
    description: "Beads escalated (Andon)"
    tags:
      - reason
      - from_agent

  # Task assignment metrics
  - name: gastown.task.assigned
    type: counter
    description: "Tasks assigned to agents"
    tags:
      - agent_type
      - priority

  - name: gastown.task.accepted
    type: counter
    description: "Tasks accepted by agents"
    tags:
      - agent_type

  # Witness metrics (per-rig polecat lifecycle manager)
  - name: gastown.witness.checks
    type: counter
    description: "Witness patrol checks"
    tags:
      - check_type
      - rig_name

  - name: gastown.witness.lifecycle_events
    type: counter
    description: "Polecat lifecycle events managed by witness"
    tags:
      - event_type  # spawn, complete, fail, timeout
      - rig_name

  # Deacon metrics (background supervisor daemon)
  - name: gastown.deacon.health_checks
    type: counter
    description: "Deacon health checks performed"
    tags:
      - check_type
      - result

  - name: gastown.deacon.dogs_active
    type: gauge
    description: "Active Dog helpers"
    tags:
      - dog_type  # boot, etc

  - name: gastown.deacon.watchdog_events
    type: counter
    description: "Watchdog chain events"
    tags:
      - event_type

  # Refinery metrics (merge queue processor)
  - name: gastown.refinery.merges_queued
    type: gauge
    description: "PRs in merge queue"
    tags:
      - rig_name
      - priority

  - name: gastown.refinery.merges_processed
    type: counter
    description: "PRs processed by refinery"
    tags:
      - rig_name
      - outcome  # merged, rejected, conflict

  - name: gastown.refinery.integration_time_s
    type: histogram
    description: "Integration workflow duration"
    tags:
      - rig_name

  # Crew metrics (persistent workers)
  - name: gastown.crew.active
    type: gauge
    description: "Active crew members"
    tags:
      - rig_name

  - name: gastown.crew.contributions
    type: counter
    description: "Crew contributions"
    tags:
      - crew_member
      - contribution_type

  # Worktree metrics
  - name: gastown.worktree.created
    type: counter
    description: "Worktrees created"
    tags:
      - rig_name
      - purpose

  - name: gastown.worktree.active
    type: gauge
    description: "Active worktrees"
    tags:
      - rig_name

  # Convoy metrics
  - name: gastown.convoy.started
    type: counter
    description: "Convoys started"
    tags:
      - rig_name
      - task_count

  - name: gastown.convoy.completed
    type: counter
    description: "Convoys completed"
    tags:
      - rig_name
      - success

  # Polecat productivity metrics
  - name: gastown.polecat.prs_created
    type: counter
    description: "PRs created by polecat"
    tags:
      - rig_name

  - name: gastown.polecat.commits_pushed
    type: counter
    description: "Commits pushed by polecat"
    tags:
      - rig_name

  - name: gastown.polecat.lines_added
    type: counter
    description: "Lines of code added"
    tags:
      - rig_name
      - language

  - name: gastown.polecat.lines_deleted
    type: counter
    description: "Lines of code deleted"
    tags:
      - rig_name
      - language

  # ============================================================
  # UNIFIED AGENT METRICS
  # ============================================================
  - name: ai_agent.request.count
    type: counter
    description: "Unified AI agent requests"
    tags:
      - provider  # anthropic, openai, ollama, local
      - model
      - agent_type  # ralph, gastown, claude_code, codex

  - name: ai_agent.request.duration_ms
    type: histogram
    description: "Unified request latency"
    tags:
      - provider
      - model

  - name: ai_agent.tokens.total
    type: counter
    description: "Total tokens across all providers"
    tags:
      - provider
      - direction  # input, output

  - name: ai_agent.cost.total_usd
    type: counter
    description: "Total cost across all providers"
    tags:
      - provider
      - model

  - name: ai_agent.error.count
    type: counter
    description: "Errors across all agents"
    tags:
      - provider
      - agent_type
      - error_category

  - name: ai_agent.quality.score
    type: gauge
    description: "Quality score (0-100)"
    tags:
      - provider
      - model
      - task_type

  - name: ai_agent.routing.decision
    type: counter
    description: "Routing decisions made"
    tags:
      - selected_provider
      - selected_model
      - reason  # cost, latency, capability, fallback

  # ============================================================
  # TOWN-LEVEL HEALTH (from gastown-viewer-intent)
  # ============================================================
  - name: gastown.town.health
    type: gauge
    description: "Overall town health score (0-100)"
    tags:
      - town_name

  - name: gastown.town.agents_total
    type: gauge
    description: "Total agents in town"
    tags:
      - agent_type

  - name: gastown.town.agents_active
    type: gauge
    description: "Currently active agents"
    tags:
      - agent_type

  - name: gastown.town.rigs_active
    type: gauge
    description: "Active rigs"
    tags: []

  # Agent state detection
  - name: gastown.agent.state
    type: gauge
    description: "Agent state (1=active, 2=idle, 3=stuck)"
    tags:
      - agent_id
      - rig_name
      - state  # active, idle, stuck

  - name: gastown.agent.idle_duration_s
    type: gauge
    description: "Seconds agent has been idle"
    tags:
      - agent_id
      - rig_name

  - name: gastown.agent.stuck_count
    type: counter
    description: "Agents detected as stuck (>10min unresponsive)"
    tags:
      - rig_name

  - name: gastown.agent.last_activity_s
    type: gauge
    description: "Seconds since last activity"
    tags:
      - agent_id

  # Workflow/Molecule execution
  - name: gastown.molecule.started
    type: counter
    description: "Molecules started"
    tags:
      - formula_template
      - rig_name

  - name: gastown.molecule.completed
    type: counter
    description: "Molecules completed"
    tags:
      - formula_template
      - success

  - name: gastown.molecule.progress_pct
    type: gauge
    description: "Molecule completion percentage"
    tags:
      - molecule_id
      - formula_template

  - name: gastown.molecule.step_completed
    type: counter
    description: "Molecule steps completed"
    tags:
      - step_name
      - formula_template

  # Convoy batch priority tracking
  - name: gastown.convoy.priority_distribution
    type: gauge
    description: "Convoy items by priority"
    tags:
      - priority  # critical, high, medium, low
      - status  # done, active, blocked, pending

  - name: gastown.convoy.blocked
    type: gauge
    description: "Blocked convoy items"
    tags:
      - rig_name
      - block_reason

  # Beads edge types (14 types)
  - name: gastown.beads.edges
    type: counter
    description: "Beads edge relationships created"
    tags:
      - edge_type  # blocks, depends_on, relates_to, parent, child, etc
      - source_type
      - target_type

  - name: gastown.beads.graph_nodes
    type: gauge
    description: "Total nodes in beads dependency graph"
    tags:
      - node_type

  # Kanban board status
  - name: gastown.kanban.column_count
    type: gauge
    description: "Items per kanban column"
    tags:
      - column  # backlog, todo, in_progress, review, done
      - priority

  - name: gastown.kanban.wip_limit_violations
    type: counter
    description: "WIP limit violations"
    tags:
      - column

  # Rig activity
  - name: gastown.rig.active
    type: gauge
    description: "Is rig active (1=yes, 0=no)"
    tags:
      - rig_name

  - name: gastown.rig.last_activity_s
    type: gauge
    description: "Seconds since last rig activity"
    tags:
      - rig_name

  - name: gastown.rig.agents_count
    type: gauge
    description: "Agents per rig"
    tags:
      - rig_name
      - agent_type

  # tmux session tracking
  - name: gastown.tmux.sessions_active
    type: gauge
    description: "Active tmux sessions"
    tags:
      - session_prefix

  - name: gastown.tmux.hook_attached
    type: gauge
    description: "Sessions with hooks attached"
    tags:
      - session_name

# Log sources for correlation
logs:
  - source: ralph_loop
    paths:
      - /Users/studio/gt/*/ralph/*.log
      - /Users/studio/.claude/logs/*.jsonl
    tags:
      - service:ralph-loop

  - source: claude_code
    paths:
      - /Users/studio/.claude/projects/*/*.jsonl
      - /Users/studio/.claude/*.log
    tags:
      - service:claude-code

  - source: gastown
    paths:
      - /Users/studio/gt/*/.beads/*.log
      - /Users/studio/gt/*/polecats/*/logs/*.log
    tags:
      - service:gastown

  - source: sequential_thinking
    paths:
      - /Users/studio/.mcp/sequential-thinking/*.log
    tags:
      - service:sequential-thinking
