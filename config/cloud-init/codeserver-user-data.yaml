#cloud-config

# OpenVSCode Server VM Configuration
hostname: vibecode-codeserver

packages:
  - nodejs
  - npm
  - openssh
  - curl
  - bash
  - git
  - python3
  - build-base

users:
  - name: vibecode
    groups: wheel
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/ash
    ssh_authorized_keys:
      - __SSH_PUBKEY__

runcmd:
  # Install code-server
  - mkdir -p /opt/code-server
  - cd /opt/code-server
  - |
    # Try to install code-server, with fallback options
    if ! curl -fsSL https://code-server.dev/install.sh | sh; then
      echo "WARNING: code-server installation failed, will be available for manual install" >> /var/log/vibecode-setup.log
    fi
  
  # Configure code-server
  - mkdir -p /home/vibecode/.config/code-server
  - chown -R vibecode:vibecode /home/vibecode/.config
  
  # Configure SSH
  - rc-update add sshd default
  - echo "PermitRootLogin yes" >> /etc/ssh/sshd_config
  - echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
  - rc-service sshd start
  
  # Enable local service for auto-start
  - rc-update add local default
  
  # Try to start code-server if installed
  - |
    if command -v code-server >/dev/null 2>&1; then
      rc-service local start
      echo "code-server installed and started" >> /var/log/vibecode-setup.log
    else
      echo "code-server not installed, skipping start" >> /var/log/vibecode-setup.log
    fi
  
  # Log completion
  - echo "OpenVSCode VM setup complete" >> /var/log/vibecode-setup.log
  - date >> /var/log/vibecode-setup.log

write_files:
  - path: /etc/motd
    content: |
      VibeCode OpenVSCode Server VM
      VSCode Server Ready
      Access: http://<vm-ip>:8080
      Password: vibecode
  
  - path: /home/vibecode/.config/code-server/config.yaml
    content: |
      bind-addr: 0.0.0.0:8080
      auth: password
      password: vibecode
      cert: false
    owner: vibecode:vibecode
  
  - path: /etc/local.d/start-code-server.start
    content: |
      #!/bin/sh
      # Only start code-server if it's installed
      if command -v code-server >/dev/null 2>&1; then
        su -s /bin/sh vibecode -c "code-server --config /home/vibecode/.config/code-server/config.yaml > /var/log/code-server.log 2>&1 &"
      else
        echo "code-server not found, skipping start" >> /var/log/code-server.log
      fi
    permissions: '0755'

