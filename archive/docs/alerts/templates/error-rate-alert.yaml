---
# SSH Error Alert
name: "VibeCode SSH Errors"
type: "log-based"
query: "service:ssh level:ERROR OR service:ssh level:WARNING"

thresholds:
  warning: 10
  critical: 50

trigger_type: "count"
condition: "above"
evaluation_window: "5m"

severity: "warning"

notify:
  - slack: "#vibecode-alerts"

message: |
  **SSH Connection Errors**

  Error count: {{count}}

  **Common causes**:
  - Authentication failures
  - Connection timeouts
  - Resource exhaustion

  **Check SSH logs**:
  ```
  vibecode-vm ssh "tail -50 /var/log/ssh.log"
  ```

  **Check active connections**:
  ```
  vibecode-vm ssh "ss -t"
  ```

---
# Performance Error Alert
name: "VibeCode Performance Degradation"
type: "metric"
query: "avg:vibecode.service.response_time{*}"

thresholds:
  warning: 2000   # 2 seconds
  critical: 5000  # 5 seconds

trigger_type: "threshold"
condition: "above"
evaluation_window: "5m"

severity: "warning"

notify:
  - slack: "#vibecode-alerts"

message: |
  **Slow Response Times Detected**

  Average response time: {{value}}ms
  Threshold: {{threshold}}ms

  **Check which service is slow**:
  ```
  vibecode-vm logs | grep "response_time" | tail -20
  ```

  **Investigate**:
  1. High CPU: `vibecode-vm ssh "top -bn1"`
  2. High memory: `vibecode-vm ssh "free -h"`
  3. Disk I/O: `vibecode-vm ssh "iostat -x 1 5"`
