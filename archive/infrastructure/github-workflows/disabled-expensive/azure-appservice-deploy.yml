name: Deploy AI Gateway to Azure App Service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: sha)'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'services/ai-gateway/**'
      - '.github/workflows/azure-appservice-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY || 'vibecode/ai-gateway' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

# Required secrets for Azure deployment:
# - AZURE_CLIENT_ID: Azure AD application client ID for OIDC authentication
# - AZURE_TENANT_ID: Azure AD tenant ID
# - AZURE_SUBSCRIPTION_ID: Azure subscription ID
# - ACR_NAME: Azure Container Registry name
# - AZURE_RESOURCE_GROUP: Azure resource group name
# - APP_NAME: Azure App Service name for AI Gateway
# - GATEWAY_API_KEY: (Optional) API key for testing gateway endpoints

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Skip if Azure secrets are not configured
    if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Azure Configuration
        run: |
          echo "Validating Azure secrets configuration..."
          if [ -z "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "::error::AZURE_CLIENT_ID secret is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_TENANT_ID }}" ]; then
            echo "::error::AZURE_TENANT_ID secret is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "::error::AZURE_SUBSCRIPTION_ID secret is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.ACR_NAME }}" ]; then
            echo "::error::ACR_NAME secret is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ]; then
            echo "::error::AZURE_RESOURCE_GROUP secret is not configured"
            exit 1
          fi
          echo "All required Azure secrets are configured"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI - Get ACR login server
        id: acr
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account show -o none
            az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv > acr.txt
            echo "login_server=$(cat acr.txt)" >> $GITHUB_OUTPUT

      - name: Docker Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image
        run: |
          docker build -t ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }} services/ai-gateway

      - name: Push image
        run: |
          docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Publish artifact meta
        run: |
          echo "image=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Skip if Azure secrets are not configured
    if: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI - Update App Service container image
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -e
            ACR_LOGIN_SERVER=$(az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv)
            IMAGE="${ACR_LOGIN_SERVER}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}"
            echo "Deploying image: ${IMAGE}"
            az webapp config container set \
              -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
              -n ${{ secrets.APP_NAME }} \
              --docker-custom-image-name ${IMAGE} \
              --enable-app-service-storage false

      - name: Azure CLI - Restart app
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${{ secrets.APP_NAME }}

      - name: Resolve App URL
        id: app
        uses: azure/cli@v2
        with:
          inlineScript: |
            HOST=$(az webapp show -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${{ secrets.APP_NAME }} --query defaultHostName -o tsv)
            echo "url=https://${HOST}" >> $GITHUB_OUTPUT
            echo "App URL: https://${HOST}" >> $GITHUB_STEP_SUMMARY

      - name: Post-deploy smoke (health)
        run: |
          set -e
          URL="${{ steps.app.outputs.url }}"
          echo "Probing ${URL}/health"
          curl -sS --max-time 8 -i "${URL}/health" | head -n 30

      - name: Post-deploy smoke (models)
        run: |
          set -e || true
          URL="${{ steps.app.outputs.url }}"
          echo "Probing ${URL}/api/v1/models"
          curl -sS --max-time 10 -i -H "X-API-Key: ${{ secrets.GATEWAY_API_KEY || 'vbai_dev_key_1' }}" "${URL}/api/v1/models" | head -n 30
