version: '3.9'

services:
  codeserver:
    image: ${CODESERVER_IMAGE:-ghcr.io/ryanmaclean/vibecode-codeserver:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-codeserver}-workspace
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-changeme}
      TZ: ${TZ:-UTC}
    volumes:
      - workspace_data:/home/coder/project
      - ./config:/home/coder/.config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  workspace_data:
    driver: local
    driver_opts:
      type: none
      device: ${WORKSPACE_DEVICE:-./workspace}
      o: bind
