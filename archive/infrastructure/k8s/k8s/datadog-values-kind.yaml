# Datadog Helm values for KIND bootstrap

global:
  clusterName: vibecode-kind-local

logLevel: INFO

datadog:
  site: datadoghq.com
  apiKeyExistingSecret: datadog-secret
  clusterName: vibecode-kind-local
  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true
  apm:
    enabled: true
    env: local
  processAgent:
    enabled: true
  orchestratorExplorer:
    enabled: true
  kubelet:
    tlsVerify: false
  networkMonitoring:
    enabled: true

  collectEvents: true

  kubeStateMetricsCore:
    enabled: true
  kubeStateMetricsScrape:
    enabled: true

  databaseMonitoring:
    enabled: true

  env:
    - name: DD_APPSEC_ENABLED
      value: "true"
    - name: DD_IAST_ENABLED
      value: "true"
    - name: DD_PROFILING_ENABLED
      value: "true"
    - name: DD_TRACE_ENABLED
      value: "true"
    - name: DD_LOGS_ENABLED
      value: "true"
    - name: DD_APM_FEATURES
      value: "appsec,profiling,ci_visibility"

  confd:
    redisdb.yaml: |
      init_config:
      instances:
        - host: valkey-service.vibecode-platform.svc.cluster.local
          port: 6379
          tags:
            - env:local
            - service:vibecode-valkey
            - component:cache

agents:
  tolerations:
    - operator: Exists
  image:
    tag: 7.66.1
  apm:
    useSocketVolume: true
  useHostNetwork: false
  containers:
    agent:
      env:
        - name: DD_CLUSTER_AGENT_USE_TLS
          value: "false"
        - name: DD_CLUSTER_AGENT_CMD_PORT
          value: "5005"

clusterAgent:
  enabled: true
  image:
    tag: 7.66.1
  replicas: 1
  orchestratorExplorer:
    enabled: true
  metricsProvider:
    enabled: true
  admissionController:
    enabled: false
  rbac:
    create: true
  env:
    - name: DD_CLUSTER_AGENT_USE_TLS
      value: "false"
    - name: DD_CLUSTER_AGENT_CMD_PORT
      value: "5005"
    - name: DD_COLLECT_KUBERNETES_EVENTS
      value: "false"
    - name: DD_CLUSTER_AGENT_ENABLE_LEADER_ELECTION
      value: "true"

clusterChecksRunner:
  enabled: false

kubeStateMetrics:
  enabled: false

kube-state-metrics:
  enabled: false

apiService:
  create: false

systemProbe:
  enabled: true
  enableTCPQueueLength: true
  enableHTTPMonitoring: true
  collectDNSStats: true

securityAgent:
  runtime:
    enabled: true
  compliance:
    enabled: true
