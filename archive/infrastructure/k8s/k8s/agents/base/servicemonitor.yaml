apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openai-agents
  namespace: openai-agents
  labels:
    app: openai-agents
    component: monitoring
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: openai-agents
      component: runtime
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
    scheme: http
    scrapeTimeout: 10s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace
  namespaceSelector:
    matchNames:
    - openai-agents
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: openai-agents-pods
  namespace: openai-agents
  labels:
    app: openai-agents
    component: monitoring
spec:
  selector:
    matchLabels:
      app: openai-agents
  podMetricsEndpoints:
  - port: metrics
    interval: 15s
    path: /metrics
  namespaceSelector:
    matchNames:
    - openai-agents
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openai-agents-prometheus-rules
  namespace: openai-agents
  labels:
    app: openai-agents
    component: monitoring
data:
  rules.yaml: |
    groups:
    - name: openai_agents_alerts
      interval: 30s
      rules:
      - alert: HighErrorRate
        expr: rate(agent_errors_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, agent_response_time_seconds) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time"
          description: "P95 response time is {{ $value }}s"

      - alert: AgentPodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{namespace="openai-agents"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Agent pod is crash looping"
          description: "Pod {{ $labels.pod }} is restarting frequently"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{namespace="openai-agents"} / container_spec_memory_limit_bytes{namespace="openai-agents"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is at {{ $value }}%"

      - alert: NoAgentsAvailable
        expr: kube_deployment_status_replicas_available{namespace="openai-agents",deployment="openai-agents"} < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Less than 2 agent pods available"
          description: "Only {{ $value }} pods available"
