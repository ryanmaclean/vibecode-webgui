# Default values for agentapi Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration
global:
  environment: development
  cloudProvider: aws
  imageRegistry: ghcr.io
  imagePullSecrets: []

# Replica count
replicaCount: 1

# Code-server configuration
codeserver:
  enabled: true
  image:
    repository: ghcr.io/ryanmaclean/vibecode-codeserver
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  service:
    type: ClusterIP
    port: 8765
    targetPort: 8765

  workspace:
    storageClass: ""
    size: 50Gi
    accessMode: ReadWriteOnce

  # Environment variables
  env:
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: code-server-config
          key: password
    - name: SHELL
      value: /bin/bash

# AgentAPI sidecar configuration
agentapi:
  enabled: true
  image:
    repository: ghcr.io/ryanmaclean/vibecode-agentapi
    tag: latest
    pullPolicy: IfNotPresent

  config:
    host: 127.0.0.1
    port: 3284
    terminalDir: /tmp/terminals
    logLevel: info
    maxConcurrentAgents: 5
    agentTimeout: 300
    allowedOrigins:
      - http://localhost:8765
      - http://127.0.0.1:8765

  # Supported agents
  agents:
    - name: aider
      enabled: true
      command: aider
      args: []
    - name: goose
      enabled: true
      command: goose
      args: []
    - name: cline
      enabled: true
      command: npx
      args: ["-y", "@cline/cli"]

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  service:
    type: ClusterIP
    port: 3284
    targetPort: 3284

  healthCheck:
    enabled: true
    livenessProbe:
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

# PostgreSQL configuration (subchart)
postgresql:
  enabled: false  # Use external managed database in production
  auth:
    username: vibecode
    password: ""  # Set via --set-sensitive
    database: vibecode_production
  primary:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# External PostgreSQL (for managed services)
externalPostgresql:
  enabled: false
  host: ""
  port: 5432
  username: vibecode
  database: vibecode_production
  password: ""  # Set via --set-sensitive
  sslMode: require

# Redis configuration (subchart)
redis:
  enabled: false  # Use external managed cache in production
  auth:
    password: ""  # Set via --set-sensitive
  master:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# External Redis (for managed services)
externalRedis:
  enabled: false
  host: ""
  port: 6379
  password: ""  # Set via --set-sensitive
  database: 0

# Service configuration
service:
  type: ClusterIP
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "code-server-agentapi"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: workspace.vibecode.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: workspace-tls
      hosts:
        - workspace.vibecode.dev

# Persistence configuration
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 50Gi
  annotations: {}

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
  datadog:
    enabled: false
    apiKeySecretName: datadog-secret
    site: datadoghq.com
    env: development

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# RBAC
rbac:
  create: true

# Node selector and tolerations
nodeSelector: {}

tolerations: []

affinity: {}

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"

# Pod labels
podLabels:
  app: code-server
  component: workspace

# Update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Resource quotas
resourceQuotas:
  enabled: false
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi

# Network policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8765
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

# Init containers
initContainers:
  - name: init-terminal-dir
    image: busybox:latest
    command: ['sh', '-c']
    args:
      - |
        mkdir -p /tmp/terminals
        chmod 755 /tmp/terminals
        chown 1000:1000 /tmp/terminals
    volumeMounts:
      - name: terminal-data
        mountPath: /tmp/terminals
    securityContext:
      runAsUser: 0
      allowPrivilegeEscalation: false

# Additional volumes
extraVolumes: []

# Additional volume mounts
extraVolumeMounts: []
