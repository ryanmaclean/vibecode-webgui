apiVersion: v1
kind: ConfigMap
metadata:
  name: pgvector-monitoring-config
  namespace: vibecode-webgui
data:
  postgres-exporter.yml: |
    # PostgreSQL metrics for pgvector monitoring
    pg_database:
      query: "SELECT pg_database.datname, pg_database_size(pg_database.datname) as size FROM pg_database"
      master: true
      cache_seconds: 30
      metrics:
        - datname:
            usage: "LABEL"
            description: "Name of the database"
        - size:
            usage: "GAUGE"
            description: "Disk space used by the database"

    pg_stat_user_tables:
      query: "SELECT schemaname, tablename, n_tup_ins, n_tup_upd, n_tup_del, n_live_tup, n_dead_tup FROM pg_stat_user_tables WHERE tablename = 'embeddings'"
      master: true
      cache_seconds: 30
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Name of the schema"
        - tablename:
            usage: "LABEL"
            description: "Name of the table"
        - n_tup_ins:
            usage: "COUNTER"
            description: "Number of rows inserted"
        - n_tup_upd:
            usage: "COUNTER"
            description: "Number of rows updated"
        - n_tup_del:
            usage: "COUNTER"
            description: "Number of rows deleted"
        - n_live_tup:
            usage: "GAUGE"
            description: "Number of live rows"
        - n_dead_tup:
            usage: "GAUGE"
            description: "Number of dead rows"

    pg_stat_statements:
      query: "SELECT query, calls, total_time, mean_time, rows FROM pg_stat_statements WHERE query LIKE '%embedding%' ORDER BY total_time DESC LIMIT 10"
      master: true
      cache_seconds: 60
      metrics:
        - query:
            usage: "LABEL"
            description: "Query text"
        - calls:
            usage: "COUNTER"
            description: "Number of times executed"
        - total_time:
            usage: "COUNTER"
            description: "Total time spent in the statement"
        - mean_time:
            usage: "GAUGE"
            description: "Mean time per execution"
        - rows:
            usage: "COUNTER"
            description: "Total number of rows retrieved or affected"

    pgvector_index_stats:
      query: |
        SELECT 
          schemaname,
          tablename,
          indexname,
          idx_tup_read,
          idx_tup_fetch
        FROM pg_stat_user_indexes 
        WHERE tablename = 'embeddings'
      master: true
      cache_seconds: 30
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Schema name"
        - tablename:
            usage: "LABEL"
            description: "Table name"
        - indexname:
            usage: "LABEL"
            description: "Index name"
        - idx_tup_read:
            usage: "COUNTER"
            description: "Number of index entries returned by scans"
        - idx_tup_fetch:
            usage: "COUNTER"
            description: "Number of live table rows fetched by index scans"

    pgvector_embeddings_count:
      query: |
        SELECT 
          content_type,
          COUNT(*) as count,
          AVG(CASE WHEN metadata->>'token_count' IS NOT NULL THEN (metadata->>'token_count')::int ELSE NULL END) as avg_tokens
        FROM embeddings 
        GROUP BY content_type
      master: true
      cache_seconds: 60
      metrics:
        - content_type:
            usage: "LABEL"
            description: "Type of content"
        - count:
            usage: "GAUGE"
            description: "Number of embeddings"
        - avg_tokens:
            usage: "GAUGE"
            description: "Average token count"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector-postgres-exporter
  namespace: vibecode-webgui
  labels:
    app: pgvector-postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgvector-postgres-exporter
  template:
    metadata:
      labels:
        app: pgvector-postgres-exporter
    spec:
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.15.0
        ports:
        - containerPort: 9187
          name: metrics
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: DATA_SOURCE_NAME
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres_exporter/queries.yaml"
        volumeMounts:
        - name: queries
          mountPath: /etc/postgres_exporter
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: queries
        configMap:
          name: pgvector-monitoring-config
          items:
          - key: postgres-exporter.yml
            path: queries.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: pgvector-postgres-exporter
  namespace: vibecode-webgui
  labels:
    app: pgvector-postgres-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  ports:
  - port: 9187
    targetPort: 9187
    name: metrics
  selector:
    app: pgvector-postgres-exporter

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pgvector-postgres-exporter
  namespace: vibecode-webgui
  labels:
    app: pgvector-postgres-exporter
spec:
  selector:
    matchLabels:
      app: pgvector-postgres-exporter
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
