# Apple Silicon Performance Recording Rules
# Pre-computed metrics for faster Grafana dashboards

groups:
  - name: apple_silicon_cpu
    interval: 30s
    rules:
      # CPU efficiency (E-core utilization percentage)
      - record: agentapi:cpu_efficiency_cores:ratio
        expr: |
          (rate(agentapi_cpu_cores{core_type="efficiency"}[5m]) /
           rate(agentapi_cpu_cores[5m])) * 100

      # CPU utilization percentage
      - record: agentapi:cpu:utilization_pct
        expr: |
          (rate(agentapi_cpu_seconds_total[5m]) /
           agentapi_cpu_cores_total) * 100

  - name: apple_silicon_memory
    interval: 30s
    rules:
      # Memory compression effectiveness
      - record: agentapi:memory_compression:ratio
        expr: |
          (agentapi_memory_compressed_bytes /
           agentapi_memory_uncompressed_bytes) * 100

      # Memory utilization percentage
      - record: agentapi:memory:utilization_pct
        expr: |
          (agentapi_memory_bytes / agentapi_memory_limit_bytes) * 100

  - name: apple_silicon_api
    interval: 15s
    rules:
      # Request rate (requests per second)
      - record: agentapi:requests:rate5m
        expr: rate(agentapi_requests_total[5m])

      # Request latency P50
      - record: agentapi:request_latency:p50
        expr: |
          histogram_quantile(0.50,
            rate(agentapi_request_duration_seconds_bucket[5m]))

      # Request latency P95
      - record: agentapi:request_latency:p95
        expr: |
          histogram_quantile(0.95,
            rate(agentapi_request_duration_seconds_bucket[5m]))

      # Request latency P99
      - record: agentapi:request_latency:p99
        expr: |
          histogram_quantile(0.99,
            rate(agentapi_request_duration_seconds_bucket[5m]))

  - name: apple_silicon_agents
    interval: 30s
    rules:
      # Agent spawn rate
      - record: agentapi:agent_spawns:rate5m
        expr: rate(agentapi_agent_spawns_total[5m])

      # Agent spawn duration P95
      - record: agentapi:agent_spawn_duration:p95
        expr: |
          histogram_quantile(0.95,
            rate(agentapi_agent_spawn_seconds_bucket[5m]))

      # Agent spawn duration P99
      - record: agentapi:agent_spawn_duration:p99
        expr: |
          histogram_quantile(0.99,
            rate(agentapi_agent_spawn_seconds_bucket[5m]))
