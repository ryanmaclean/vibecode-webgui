# Prometheus configuration for AgentAPI monitoring
# Optimized for Apple Silicon performance tracking
# Local development with Docker Compose

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'vibecode-local'
    platform: 'apple-silicon'

# Rule files for alerts and recording rules
rule_files:
  - 'recording_rules/apple_silicon.yml'

# Scrape configurations
scrape_configs:
  # AgentAPI application metrics
  - job_name: 'agentapi'
    static_configs:
      - targets: ['agentapi:9090']
        labels:
          service: 'agentapi'
          env: 'development'
    scrape_interval: 10s
    metrics_path: '/metrics'
    scheme: http

  # Code-server metrics (if exposed)
  - job_name: 'codeserver'
    static_configs:
      - targets: ['codeserver:8765']
        labels:
          service: 'codeserver'
          env: 'development'
    scrape_interval: 30s
    metrics_path: '/metrics'
    scheme: http

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
