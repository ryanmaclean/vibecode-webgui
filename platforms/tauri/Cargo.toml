[package]
name = "vibecode"
version = "1.5.0"
description = "VibeCode - AI-Powered Development Environment"
authors = ["VibeCode Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bollard = "0.18"
mdns-sd = "0.11"
hostname = "0.4"
thiserror = "2"
url = "2"
dirs = "5"
reqwest = { version = "0.12.24", features = ["blocking", "json"] }
once_cell = "1.21"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus for notifications and system integration
# dbus = "0.9"  # Uncomment when implementing full D-Bus support

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific dependencies can be added here

[profile.release]
# optimize for small binary size
strip = true
lto = "thin"
opt-level = "z"
codegen-units = 1
panic = "abort"
