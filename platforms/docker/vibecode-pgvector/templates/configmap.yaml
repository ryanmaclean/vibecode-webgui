apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vibecode-pgvector.fullname" . }}-init
  labels:
    {{- include "vibecode-pgvector.labels" . | nindent 4 }}
data:
  init.sql: |
    -- Enable pgvector extension
    CREATE EXTENSION IF NOT EXISTS vector;
    
    -- Create production-ready embeddings table
    CREATE TABLE IF NOT EXISTS embeddings (
        id bigserial PRIMARY KEY,
        content_type VARCHAR(50) NOT NULL,
        content_hash VARCHAR(64) NOT NULL UNIQUE,
        embedding vector(1536) NOT NULL,
        metadata JSONB,
        created_at TIMESTAMPTZ DEFAULT NOW(),
        updated_at TIMESTAMPTZ DEFAULT NOW()
    );
    
    -- Create optimized indexes for production scale
    {{- if eq .Values.pgvector.indexType "hnsw" }}
    CREATE INDEX IF NOT EXISTS idx_embeddings_hnsw 
    ON embeddings USING hnsw (embedding vector_cosine_ops) 
    WITH (m = {{ .Values.pgvector.indexParams.m }}, ef_construction = {{ .Values.pgvector.indexParams.efConstruction }});
    {{- else }}
    CREATE INDEX IF NOT EXISTS idx_embeddings_ivfflat 
    ON embeddings USING ivfflat (embedding vector_cosine_ops) 
    WITH (lists = {{ .Values.pgvector.indexParams.lists | default 100 }});
    {{- end }}
    
    -- Create supporting indexes
    CREATE INDEX IF NOT EXISTS idx_embeddings_content_type ON embeddings(content_type);
    CREATE INDEX IF NOT EXISTS idx_embeddings_metadata ON embeddings USING gin(metadata);
    CREATE INDEX IF NOT EXISTS idx_embeddings_created_at ON embeddings(created_at DESC);
    
    -- Insert sample data for testing
    INSERT INTO embeddings (content_type, content_hash, embedding, metadata) VALUES
    ('code', 'sample_typescript', array_fill(0.1, ARRAY[1536])::vector, '{"language": "typescript", "framework": "react"}'),
    ('documentation', 'sample_docs', array_fill(0.2, ARRAY[1536])::vector, '{"section": "getting-started"}'),
    ('chat', 'sample_chat', array_fill(0.3, ARRAY[1536])::vector, '{"user_id": "test_user", "session_id": "test_session"}')
    ON CONFLICT (content_hash) DO NOTHING;
