# Version declaration removed - Docker Compose v2+ automatically detects format

services:
  # VibeCode WebGUI Application
  webgui:
    build: .
    image: vibecode-webgui-local
    container_name: vibecode-webgui
    labels:
      - "com.vibecode.service=webgui"
      - "com.vibecode.tier=application"
      - "com.vibecode.env=staging"
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/vibecode
      - NEXTAUTH_SECRET=your-nextauth-secret-here
      - NEXTAUTH_URL=http://localhost:3000
      - NODE_ENV=production
      - DD_IAST_ENABLED=true
      - DD_DBM_PROPAGATION_MODE=full
      - DD_SERVICE=vibecode-webgui
      - DD_ENV=staging
      - DD_VERSION=0.1.0-staging
      - FREE_LLM_MODELS_FILE=/app/runtime/free-llm-models/models.txt
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - free-llm-models:/app/runtime/free-llm-models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: vibecode-postgres
    labels:
      - "com.vibecode.service=postgres"
      - "com.vibecode.tier=database"
      - "com.vibecode.env=staging"
    environment:
      - POSTGRES_DB=vibecode
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vibecode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/schema.prisma:/docker-entrypoint-initdb.d/schema.prisma
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vibecode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis for caching and sessions
  redis:
    image: redis:8.1-alpine
    container_name: vibecode-redis
    labels:
      - "com.vibecode.service=redis"
      - "com.vibecode.tier=cache"
      - "com.vibecode.env=staging"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: vibecode-nginx
    labels:
      - "com.vibecode.service=nginx"
      - "com.vibecode.tier=proxy"
      - "com.vibecode.env=staging"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      webgui:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Periodic updater for OpenRouter free model catalogue
  free-llm-model-updater:
    image: vibecode-webgui-local
    build: .
    container_name: vibecode-free-llm-model-updater
    labels:
      - "com.vibecode.service=free-llm-model-updater"
      - "com.vibecode.tier=worker"
      - "com.vibecode.env=staging"
    command: >
      sh -c "mkdir -p /app/runtime/free-llm-models && while true; do node -r dd-trace/init scripts/jobs/update-openrouter-free-models.js && sleep 43200; done"
    environment:
      - OUTPUT_JSON_PATH=/app/runtime/free-llm-models/models.json
      - OUTPUT_TEXT_PATH=/app/runtime/free-llm-models/models.txt
      - ENABLE_CONFIGMAP_SYNC=false
      - MAX_FREE_MODELS=10
      - MIN_WORKING_MODELS=3
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-}
      - DD_API_KEY=${DD_API_KEY:-}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_ENV=${DD_ENV:-staging}
      - DD_DBM_PROPAGATION_MODE=full
      - DD_SERVICE=vibecode-webgui
      - DD_VERSION=0.1.0-staging
      - DATADOG_METRIC_TAGS=environment:staging
    healthcheck:
      test: ["CMD", "test", "-f", "/app/runtime/free-llm-models/models.txt"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    volumes:
      - free-llm-models:/app/runtime/free-llm-models
    depends_on:
      webgui:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /app/runtime/free-llm-models/models.txt"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  # OpenTelemetry Collector for trace aggregation
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: vibecode-otel-collector
    labels:
      - "com.vibecode.service=otel-collector"
      - "com.vibecode.tier=observability"
      - "com.vibecode.env=staging"
    command: ["--config=/etc/otel-collector-config.yaml"]
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-localhost:4317}
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  free-llm-models:
