# Multi-architecture Docker Compose for VibeCode Platform
# Supports both x86-64 and ARM64 architectures

version: '3.8'

services:
  # Main VibeCode application
  vibecode-app:
    image: ghcr.io/vibecode/vibecode-webgui:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DD_IAST_ENABLED=true
      - DATABASE_URL=${DATABASE_URL}
      - DD_API_KEY=${DD_API_KEY}
      - DATADOG_API_KEY=${DATADOG_API_KEY}
      # RUM (prefer NEXT_PUBLIC_DD_*; legacy NEXT_PUBLIC_DATADOG_* as fallback)
      - NEXT_PUBLIC_DD_APPLICATION_ID=${NEXT_PUBLIC_DD_APPLICATION_ID}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${NEXT_PUBLIC_DD_CLIENT_TOKEN}
      - NEXT_PUBLIC_DD_SITE=${NEXT_PUBLIC_DD_SITE:-datadoghq.com}
      - NEXT_PUBLIC_DATADOG_APPLICATION_ID=${NEXT_PUBLIC_DATADOG_APPLICATION_ID}
      - NEXT_PUBLIC_DATADOG_CLIENT_TOKEN=${NEXT_PUBLIC_DATADOG_CLIENT_TOKEN}
      - NEXT_PUBLIC_DATADOG_SITE=${NEXT_PUBLIC_DATADOG_SITE:-datadoghq.com}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - postgres
      - redis
      - ai-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # AI Gateway service
  ai-gateway:
    image: ghcr.io/vibecode/vibecode-webgui/ai-gateway:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DD_IAST_ENABLED=true
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - DD_API_KEY=${DD_API_KEY}
      - DATADOG_API_KEY=${DATADOG_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Code Server (VS Code in browser)
  code-server:
    image: ghcr.io/vibecode/vibecode-webgui/code-server:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "8080:8080"
    volumes:
      - code-server-data:/home/coder/projects
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD:-vibecode123}
      - SUDO_PASSWORD=${CODE_SERVER_PASSWORD:-vibecode123}
    restart: unless-stopped

  # Documentation site
  docs:
    image: ghcr.io/vibecode/vibecode-webgui/docs:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # MCP Servers
  mcp-servers:
    image: ghcr.io/vibecode/vibecode-webgui/mcp-servers:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "3002:3001"
      - "3003:3002"
      - "3004:3003"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mcp-models:/app/models
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=vibecode
      - POSTGRES_USER=vibecode
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vibecode123}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecode -d vibecode"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Valkey Cache (BSD-licensed Redis fork for legal compliance)
  # Uses Valkey instead of Redis to avoid RSAL/SSPL licensing issues
  valkey:
    image: valkey/valkey:8.1-alpine
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Prometheus (monitoring)
  prometheus:
    image: prom/prometheus:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Vector (log router)
  vector:
    image: timberio/vector:latest-alpine
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "9598:9598"
    volumes:
      - ./monitoring/vector.toml:/etc/vector/vector.toml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      - DATADOG_API_KEY=${DD_API_KEY:-${DATADOG_API_KEY}}
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
  prometheus-data:
  code-server-data:
  mcp-models:

networks:
  default:
    name: vibecode-network