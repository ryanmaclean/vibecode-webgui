version: '3.9'

# Apple Silicon Optimized Configuration for AgentAPI
# Target: M1/M2/M3 processors with OrbStack runtime
# Performance goals: <300ms boot, <5W idle, 90%+ E-core utilization

services:
  # Code-server with AI extensions
  codeserver:
    image: ${CODESERVER_IMAGE:-ghcr.io/ryanmaclean/vibecode-codeserver:latest}
    container_name: vibecode-codeserver
    restart: unless-stopped
    platform: linux/arm64  # Explicit ARM64 platform

    ports:
      - "${CODE_SERVER_PORT:-8765}:8765"

    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-changeme}
      TZ: ${TZ:-UTC}
      SHELL: /bin/bash

      # AgentAPI connection
      AGENTAPI_HOST: agentapi
      AGENTAPI_PORT: 3284
      AGENTAPI_ENABLED: "true"

      # Apple Silicon optimizations
      NODE_OPTIONS: "--max-old-space-size=2048 --experimental-worker"

      # macOS QoS hints (passed through to container)
      THREAD_QOS_CLASS: "utility"  # Balanced P/E-core scheduling

    volumes:
      - workspace_data:/home/coder/workspace
      - terminal_data:/tmp/terminals
      - config_data:/home/coder/.config
      - extensions_data:/home/coder/.local/share/code-server

    networks:
      - vibecode-network

    deploy:
      resources:
        limits:
          cpus: '2.0'      # Allow burst to 2 P-cores
          memory: 4G       # macOS unified memory architecture
          pids: 200        # Prevent fork bomb
        reservations:
          cpus: '0.5'      # Reserve 1 E-core baseline
          memory: 1G

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    depends_on:
      agentapi:
        condition: service_healthy

  # AgentAPI optimized for Apple Silicon
  agentapi:
    build:
      context: ./docker/agentapi
      dockerfile: Dockerfile
      args:
        AGENTAPI_VERSION: ${AGENTAPI_VERSION:-0.1.0}
        TARGETPLATFORM: linux/arm64
      cache_from:
        - ghcr.io/ryanmaclean/vibecode-agentapi:latest-arm64
        - ghcr.io/ryanmaclean/vibecode-agentapi:cache-arm64

    image: ${AGENTAPI_IMAGE:-ghcr.io/ryanmaclean/vibecode-agentapi:latest}
    container_name: vibecode-agentapi
    restart: unless-stopped
    platform: linux/arm64

    ports:
      - "${AGENTAPI_PORT:-3284}:3284"
      - "${AGENTAPI_METRICS_PORT:-9090}:9090"

    environment:
      # Server configuration
      AGENTAPI_HOST: 0.0.0.0
      AGENTAPI_PORT: 3284
      AGENTAPI_LOG_LEVEL: ${LOG_LEVEL:-info}

      # CORS configuration
      AGENTAPI_ALLOWED_ORIGINS: "http://localhost:8765,http://127.0.0.1:8765,http://localhost:3000"

      # Terminal configuration
      AGENTAPI_TERMINAL_DIR: /tmp/terminals

      # Agent configuration
      AGENTAPI_AGENTS: "aider,goose,cline"
      AGENTAPI_MAX_CONCURRENT_AGENTS: ${MAX_AGENTS:-2}
      AGENTAPI_AGENT_TIMEOUT: ${AGENT_TIMEOUT:-300}

      # === APPLE SILICON OPTIMIZATIONS ===

      # CPU Optimization: QoS thread scheduling
      THREAD_QOS_CLASS: "background"  # Prefer E-cores for I/O-bound tasks
      CPU_AFFINITY: "efficiency-first"  # E-cores for idle, P-cores for bursts

      # Memory Optimization: macOS unified memory architecture
      PYTHONMALLOC: "malloc"          # Use system allocator (better with compression)
      MALLOC_ARENA_MAX: "2"           # Reduce glibc arena fragmentation
      AGENTAPI_MAX_MEMORY_MB: 512     # Memory limit per agent
      AGENTAPI_MEMORY_CHECK_INTERVAL: 30  # Check every 30s

      # Power Management: adaptive based on battery/thermal
      AGENTAPI_POWER_MODE: ${POWER_MODE:-balanced}  # 'efficiency'|'balanced'|'performance'
      AGENTAPI_IDLE_TIMEOUT: 300      # Reduce activity after 5min idle
      AGENTAPI_SLEEP_INTERVAL: 5      # Poll interval for background tasks

      # I/O Optimization: buffered async I/O
      AGENTAPI_IO_BUFFER_SIZE: 65536  # 64KB buffer (optimal for NVMe)
      AGENTAPI_WRITE_COALESCING: "true"  # Batch writes

      # Python Performance
      PYTHONUNBUFFERED: "1"           # Disable buffering for logs
      PYTHONASYNCIODEBUG: "0"         # Disable async debug overhead
      PYTHONHASHSEED: "random"        # Security best practice

      # Metrics and Monitoring
      AGENTAPI_METRICS_ENABLED: "true"
      AGENTAPI_METRICS_PORT: 9090
      AGENTAPI_PERFORMANCE_TRACKING: "true"
      AGENTAPI_THERMAL_MONITORING: "true"

    volumes:
      # Read-only workspace access with optimized mount options
      - workspace_data:/home/coder/workspace:ro,noatime,nodiratime

      # Shared terminal emulation (tmpfs for performance)
      - terminal_data:/tmp/terminals:rw,noatime

      # AgentAPI configuration (compression-friendly)
      - agentapi_config:/home/coder/.agentapi:rw,noatime

      # Apple Silicon optimization library
      - ./docker/agentapi/apple_silicon_optimizations.py:/opt/agentapi/apple_silicon_optimizations.py:ro

      # Optional: hot-reload for development
      - ./docker/agentapi/server.py:/opt/agentapi/server.py:ro

    networks:
      - vibecode-network

    deploy:
      resources:
        limits:
          cpus: '1.0'      # 1 P-core max (burst)
          memory: 1G       # Soft limit, allows swap
          pids: 100        # Prevent fork bomb
        reservations:
          cpus: '0.25'     # 1/4 E-core baseline (very low idle)
          memory: 256M     # Minimum guaranteed

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3284/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: vibecode-prometheus
    restart: unless-stopped
    platform: linux/arm64

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

    ports:
      - "9091:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - vibecode-network

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: vibecode-grafana
    restart: unless-stopped
    platform: linux/arm64

    ports:
      - "3001:3000"

    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro

    networks:
      - vibecode-network

    depends_on:
      - prometheus

    profiles:
      - monitoring

# Network configuration optimized for Apple Silicon
networks:
  vibecode-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
    driver_opts:
      com.docker.network.bridge.name: vibecode0
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      # Jumbo frames for better throughput (requires Docker restart)
      com.docker.network.driver.mtu: "9000"

# Volume configuration optimized for macOS unified memory and NVMe
volumes:
  # Workspace: virtiofs with optimal caching
  workspace_data:
    driver: local
    driver_opts:
      type: none
      device: ${WORKSPACE_DIR:-./workspace}
      o: bind,noatime,nodiratime

  # Terminal data: tmpfs for maximum performance (ephemeral)
  terminal_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      # 100MB, no access time updates, relaxed sync
      o: size=100m,mode=755,noatime,nodiratime,nobarrier

  # AgentAPI config: persistent with compression-friendly allocation
  agentapi_config:
    driver: local
    driver_opts:
      type: none
      device: ${AGENTAPI_CONFIG_DIR:-./agentapi-config}
      o: bind,noatime,nodiratime

  # Code-server config: persistent
  config_data:
    driver: local
    driver_opts:
      type: none
      device: ${CONFIG_DIR:-./config}
      o: bind,noatime

  # Extensions: persistent with caching
  extensions_data:
    driver: local

  # Prometheus data: persistent time-series storage
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      device: ${PROMETHEUS_DIR:-./monitoring/prometheus-data}
      o: bind,noatime

  # Grafana data: persistent dashboards
  grafana_data:
    driver: local
    driver_opts:
      type: none
      device: ${GRAFANA_DIR:-./monitoring/grafana-data}
      o: bind,noatime

# ============================================================================
# Usage Examples
# ============================================================================
#
# 1. Start with default (balanced) power mode:
#    docker-compose -f docker-compose.agentapi.apple-silicon.yml up -d
#
# 2. Start in efficiency mode (battery, low power):
#    POWER_MODE=efficiency docker-compose -f docker-compose.agentapi.apple-silicon.yml up -d
#
# 3. Start in performance mode (AC power, maximum speed):
#    POWER_MODE=performance docker-compose -f docker-compose.agentapi.apple-silicon.yml up -d
#
# 4. Start with monitoring stack:
#    docker-compose -f docker-compose.agentapi.apple-silicon.yml --profile monitoring up -d
#
# 5. Monitor performance:
#    docker stats vibecode-agentapi
#    curl http://localhost:9090/metrics
#
# 6. View Grafana dashboard:
#    Open http://localhost:3001 (default: admin/admin)
#
# ============================================================================
