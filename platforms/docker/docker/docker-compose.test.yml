# Testing Environment
version: '3.8'

services:
  webgui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: testing
      args:
        NODE_VERSION: 24
        BASE_OS: alpine
        INCLUDE_DEV_DEPS: true
        ENABLE_LIGHTNINGCSS: true
        ENABLE_PRISMA: true
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=test
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://test:test@postgres:5432/testdb
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=test-secret-key-for-ci
    depends_on:
      - postgres
      - redis
    networks:
      - vibecode-test

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-test}
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - vibecode-test

  redis:
    image: redis:8.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data
    networks:
      - vibecode-test

volumes:
  postgres_test_data:
  redis_test_data:

networks:
  vibecode-test:
    driver: bridge