# Enterprise overrides enabling Keycloak-backed SSO
keycloak:
  enabled: true
  replicaCount: 2
  auth:
    existingSecret: keycloak-admin-credentials
    existingSecretPasswordKey: admin-password
  externalDatabase:
    host: vector-db
    database: keycloak
    user: keycloak
    existingSecret: keycloak-db-credentials
    existingSecretUserKey: username
    existingSecretPasswordKey: password
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: sso.enterprise.vibecode.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls: true
    extraTls:
      - hosts:
          - sso.enterprise.vibecode.example.com
        secretName: keycloak-tls
