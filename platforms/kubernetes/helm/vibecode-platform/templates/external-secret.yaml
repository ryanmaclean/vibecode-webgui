{{- if .Values.externalSecrets.enabled }}
{{/*
External Secrets Operator integration for VibeCode Platform
This template creates ExternalSecret resources to sync secrets from external secret stores
(e.g., AWS Secrets Manager, Google Secret Manager, HashiCorp Vault, Azure Key Vault)

Prerequisites:
- External Secrets Operator must be installed in the cluster
- A SecretStore or ClusterSecretStore must be configured
- The backend secret store must contain the required secrets

Documentation: https://external-secrets.io/
*/}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "vibecode-platform.secretName" . }}-external
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
  annotations:
    vibecode.dev/managed-by: external-secrets-operator
spec:
  # Refresh interval for syncing secrets from the external store
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}

  # Reference to the SecretStore or ClusterSecretStore
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind | default "SecretStore" }}

  # Target Kubernetes Secret to create/update
  target:
    name: {{ include "vibecode-platform.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain

  # Secret data mappings from external store
  data:
  # Code-server password
  - secretKey: password
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.password.key }}
      {{- if .Values.externalSecrets.secrets.password.property }}
      property: {{ .Values.externalSecrets.secrets.password.property }}
      {{- end }}

  # Database connection string
  - secretKey: database-url
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.databaseUrl.key }}
      {{- if .Values.externalSecrets.secrets.databaseUrl.property }}
      property: {{ .Values.externalSecrets.secrets.databaseUrl.property }}
      {{- end }}

  # JWT secret for session management
  - secretKey: jwt-secret
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.jwtSecret.key }}
      {{- if .Values.externalSecrets.secrets.jwtSecret.property }}
      property: {{ .Values.externalSecrets.secrets.jwtSecret.property }}
      {{- end }}

  {{- if .Values.externalSecrets.secrets.githubClientId }}
  # GitHub OAuth client ID
  - secretKey: github-client-id
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.githubClientId.key }}
      {{- if .Values.externalSecrets.secrets.githubClientId.property }}
      property: {{ .Values.externalSecrets.secrets.githubClientId.property }}
      {{- end }}
  {{- end }}

  {{- if .Values.externalSecrets.secrets.githubClientSecret }}
  # GitHub OAuth client secret
  - secretKey: github-client-secret
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.githubClientSecret.key }}
      {{- if .Values.externalSecrets.secrets.githubClientSecret.property }}
      property: {{ .Values.externalSecrets.secrets.githubClientSecret.property }}
      {{- end }}
  {{- end }}

  {{- if .Values.externalSecrets.secrets.googleClientId }}
  # Google OAuth client ID
  - secretKey: google-client-id
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.googleClientId.key }}
      {{- if .Values.externalSecrets.secrets.googleClientId.property }}
      property: {{ .Values.externalSecrets.secrets.googleClientId.property }}
      {{- end }}
  {{- end }}

  {{- if .Values.externalSecrets.secrets.googleClientSecret }}
  # Google OAuth client secret
  - secretKey: google-client-secret
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.googleClientSecret.key }}
      {{- if .Values.externalSecrets.secrets.googleClientSecret.property }}
      property: {{ .Values.externalSecrets.secrets.googleClientSecret.property }}
      {{- end }}
  {{- end }}

{{- if .Values.aiIntegration.openRouter.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.aiIntegration.openRouter.secretName }}-external
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-integration
  annotations:
    vibecode.dev/managed-by: external-secrets-operator
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind | default "SecretStore" }}
  target:
    name: {{ .Values.aiIntegration.openRouter.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: api-key
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.openRouterApiKey.key }}
      {{- if .Values.externalSecrets.secrets.openRouterApiKey.property }}
      property: {{ .Values.externalSecrets.secrets.openRouterApiKey.property }}
      {{- end }}
{{- end }}

{{- if .Values.aiIntegration.artificialAnalysis.enabled }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.aiIntegration.artificialAnalysis.secretName }}-external
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-integration
  annotations:
    vibecode.dev/managed-by: external-secrets-operator
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: {{ .Values.externalSecrets.secretStore.kind | default "SecretStore" }}
  target:
    name: {{ .Values.aiIntegration.artificialAnalysis.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: api-key
    remoteRef:
      key: {{ .Values.externalSecrets.secrets.artificialAnalysisApiKey.key }}
      {{- if .Values.externalSecrets.secrets.artificialAnalysisApiKey.property }}
      property: {{ .Values.externalSecrets.secrets.artificialAnalysisApiKey.property }}
      {{- end }}
{{- end }}
{{- end }}
