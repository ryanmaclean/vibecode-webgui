repositories:
  - name: coder-vscode
    url: https://coder-vscode.github.io/helm
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: vibecode-local
    url: file://../charts

releases:
  - name: code-server
    namespace: dev-tools
    chart: coder-vscode/code-server
    values:
      - values/code-server.yaml
  - name: litellm-pgvector
    namespace: ai-platform
    chart: vibecode-local/litellm-pgvector
    values:
      - values/litellm-pgvector.yaml
