# Minimal overrides for deploying code-server via the upstream chart
image:
  repository: codercom/code-server
  tag: latest

replicaCount: 1

service:
  type: ClusterIP
  port: 8443

ingress:
  enabled: false

persistence:
  enabled: true
  size: 10Gi

codeServer:
  password: "changeme"
  extraEnv:
    - name: DEFAULT_WORKSPACE_DIR
      value: /home/coder/project
  extraSecretEnv: []

## share PVC with litellm sample (optional)
additionalVolumes:
  - name: shared-data
    persistentVolumeClaim:
      claimName: litellm-data
additionalVolumeMounts:
  - name: shared-data
    mountPath: /home/coder/shared
