apiVersion: v2
name: agentapi
description: AgentAPI deployment for VibeCode workspaces with code-server sidecar
version: 1.0.0
appVersion: "0.1.0"
type: application

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

keywords:
  - agentapi
  - code-server
  - ai-agents
  - workspace
  - coding-assistant

maintainers:
  - name: VibeCode DevOps
    email: devops@vibecode.dev

home: https://github.com/vibecode/vibecode-webgui
sources:
  - https://github.com/vibecode/vibecode-webgui
icon: https://raw.githubusercontent.com/vibecode/vibecode-webgui/main/public/icon.png
