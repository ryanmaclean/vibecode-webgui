---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-simple
  namespace: vibecode-platform
  labels:
    app: postgres-simple
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-simple
  template:
    metadata:
      labels:
        app: postgres-simple
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "vibecode"
        - name: POSTGRES_USER
          value: "vibecode"
        - name: POSTGRES_PASSWORD
          value: "vibecode"
        - name: PGDATA
          value: "/var/lib/postgresql/data"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - vibecode
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - vibecode
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-simple-service
  namespace: vibecode-platform
spec:
  selector:
    app: postgres-simple
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
