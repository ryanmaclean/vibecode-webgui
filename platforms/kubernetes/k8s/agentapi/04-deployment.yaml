apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server-workspace
  namespace: vibecode-platform
  labels:
    app: code-server
    component: workspace
    app.kubernetes.io/name: vibecode
    app.kubernetes.io/version: "1.2.0"
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: code-server
      component: workspace

  template:
    metadata:
      labels:
        app: code-server
        component: workspace
        app.kubernetes.io/name: vibecode
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"

    spec:
      serviceAccountName: code-server-sa

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups: [1000]

      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: timeout
            value: "2"

      initContainers:
        - name: init-terminal-dir
          image: busybox:1.36-musl
          command: ['sh', '-c']
          args:
            - |
              set -ex
              mkdir -p /tmp/terminals
              chmod 755 /tmp/terminals
              touch /tmp/terminals/.initialized
              echo "Terminal directory initialized"
          volumeMounts:
            - name: terminal-data
              mountPath: /tmp/terminals
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        - name: init-agent-deps
          image: ghcr.io/ryanmaclean/vibecode-agentapi:latest
          command: ['sh', '-c']
          args:
            - |
              set -ex
              echo "Verifying agent tools..."
              aider --version || echo "Aider not available"
              python3 --version
              node --version
              echo "Agent dependencies verified"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

      containers:
        - name: code-server
          image: ghcr.io/ryanmaclean/vibecode-codeserver:latest
          imagePullPolicy: IfNotPresent

          args:
            - --bind-addr
            - 0.0.0.0:8765
            - --auth
            - password
            - --disable-telemetry
            - /home/coder/workspace

          ports:
            - name: ide
              containerPort: 8765
              protocol: TCP

          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: code-server-config
                  key: password

            - name: SHELL
              value: /bin/bash

            - name: AGENTAPI_HOST
              value: "127.0.0.1"

            - name: AGENTAPI_PORT
              value: "3284"

            - name: AGENTAPI_ENABLED
              value: "true"

            - name: NODE_OPTIONS
              value: "--max-old-space-size=2048"

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
              ephemeral-storage: 10Gi

          volumeMounts:
            - name: workspace
              mountPath: /home/coder/workspace

            - name: terminal-data
              mountPath: /tmp/terminals

            - name: config
              mountPath: /home/coder/.config

            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

        - name: agentapi
          image: ghcr.io/ryanmaclean/vibecode-agentapi:latest
          imagePullPolicy: IfNotPresent

          args:
            - --config
            - /etc/agentapi/config.yaml
            - --host
            - "0.0.0.0"
            - --port
            - "3284"

          ports:
            - name: api
              containerPort: 3284
              protocol: TCP

            - name: metrics
              containerPort: 9090
              protocol: TCP

          env:
            - name: AGENTAPI_HOST
              value: "0.0.0.0"

            - name: AGENTAPI_PORT
              value: "3284"

            - name: AGENTAPI_LOG_LEVEL
              value: info

            - name: AGENTAPI_MAX_CONCURRENT_AGENTS
              value: "2"

            - name: AGENTAPI_AGENT_TIMEOUT
              value: "300"

            - name: AGENTAPI_METRICS_ENABLED
              value: "true"

            - name: AGENTAPI_METRICS_PORT
              value: "9090"

            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentapi-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true

            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentapi-secrets
                  key: OPENAI_API_KEY
                  optional: true

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi

          volumeMounts:
            - name: workspace
              mountPath: /home/coder/workspace
              readOnly: true

            - name: terminal-data
              mountPath: /tmp/terminals

            - name: agentapi-config
              mountPath: /etc/agentapi

            - name: tmp
              mountPath: /tmp
              subPath: agentapi

          livenessProbe:
            exec:
              command:
                - /bin/bash
                - /etc/agentapi/health-check.sh
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/bash
                - /etc/agentapi/readiness-check.sh
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: code-server-workspace-pvc

        - name: terminal-data
          emptyDir:
            medium: Memory
            sizeLimit: 100Mi

        - name: config
          emptyDir:
            sizeLimit: 100Mi

        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

        - name: agentapi-config
          configMap:
            name: agentapi-config
            defaultMode: 0755
            items:
              - key: config.yaml
                path: config.yaml
              - key: health-check.sh
                path: health-check.sh
              - key: readiness-check.sh
                path: readiness-check.sh

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - code-server
                topologyKey: kubernetes.io/hostname

        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/disk-type
                    operator: In
                    values:
                      - ssd

      tolerations:
        - key: workload
          operator: Equal
          value: development
          effect: NoSchedule

      priorityClassName: vibecode-workspace-priority
