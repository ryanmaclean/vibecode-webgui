apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: code-server-workspace-hpa
  namespace: vibecode-platform
  labels:
    app.kubernetes.io/name: vibecode
    app.kubernetes.io/component: workspace
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: code-server-workspace

  minReplicas: 1
  maxReplicas: 100

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

    - type: Pods
      pods:
        metric:
          name: agentapi_active_agents
        target:
          type: AverageValue
          averageValue: "1"

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 5
          periodSeconds: 30
      selectPolicy: Max
