# Production environment values for OpenAI Agents

global:
  environment: production

replicaCount: 5

image:
  tag: stable
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 1
    memory: 2Gi
  limits:
    cpu: 4
    memory: 8Gi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 50
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

persistence:
  enabled: true
  storageClass: azure-file-premium
  size: 200Gi

cache:
  enabled: true
  storageClass: azure-file-premium
  size: 100Gi

ingress:
  enabled: true
  className: nginx
  hosts:
  - host: agents.vibecode.io
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: openai-agents-prod-tls
    hosts:
    - agents.vibecode.io
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"

externalSecrets:
  enabled: true
  backend: azure-keyvault

agentConfig:
  runtime:
    workers: 8
    maxConcurrentSessions: 20
  openai:
    maxTokens: 8192
    retryAttempts: 5
  session:
    idleTimeout: 3600
    maxSessionDuration: 14400
  monitoring:
    logLevel: warning

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 10s
  prometheusRules:
    enabled: true

networkPolicy:
  enabled: true

istio:
  enabled: true
  virtualService:
    enabled: true
    timeout: 600s
  destinationRule:
    enabled: true

backup:
  enabled: true
  schedule: "0 */6 * * *"
  retention: 30

datadog:
  enabled: true
  logs:
    enabled: true
  apm:
    enabled: true
  profiling:
    enabled: true

priorityClassName: high-priority

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  sidecar.istio.io/inject: "true"
  ad.datadoghq.com/agent-runtime.logs: '[{"source":"openai-agents","service":"openai-agents"}]'
