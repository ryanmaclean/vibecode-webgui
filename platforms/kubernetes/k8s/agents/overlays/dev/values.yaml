# Development environment values for OpenAI Agents

global:
  environment: dev

replicaCount: 1

image:
  tag: dev
  pullPolicy: Always

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1
    memory: 2Gi

autoscaling:
  enabled: false

persistence:
  enabled: false

cache:
  enabled: false

ingress:
  enabled: true
  className: nginx
  hosts:
  - host: agents-dev.vibecode.io
    paths:
    - path: /
      pathType: Prefix
  tls: []

secrets:
  openaiApiKey: "dev-key-from-env"

agentConfig:
  runtime:
    workers: 2
    maxConcurrentSessions: 5
  monitoring:
    logLevel: debug

monitoring:
  enabled: true

networkPolicy:
  enabled: false

backup:
  enabled: false

datadog:
  enabled: false
