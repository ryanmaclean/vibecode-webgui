{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openai-agents.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openai-agents.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
  - {{ .Values.persistence.accessMode }}
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
{{- if .Values.cache.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "openai-agents.fullname" . }}-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openai-agents.labels" . | nindent 4 }}
spec:
  accessModes:
  - {{ .Values.cache.accessMode }}
  storageClassName: {{ .Values.cache.storageClass }}
  resources:
    requests:
      storage: {{ .Values.cache.size }}
{{- end }}
