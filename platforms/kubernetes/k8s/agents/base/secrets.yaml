# This is a template - actual secrets should be created via external-secrets or sealed-secrets
apiVersion: v1
kind: Secret
metadata:
  name: openai-agents-secrets
  namespace: openai-agents
  labels:
    app: openai-agents
    component: secrets
type: Opaque
stringData:
  # OpenAI API credentials
  openai-api-key: "REPLACE_WITH_ACTUAL_KEY"
  openai-org-id: "REPLACE_WITH_ACTUAL_ORG_ID"

  # Database credentials (if needed)
  database-url: "REPLACE_WITH_DATABASE_URL"

  # Redis credentials (if needed)
  redis-url: "REPLACE_WITH_REDIS_URL"

  # JWT signing key
  jwt-secret: "REPLACE_WITH_RANDOM_SECRET"

  # Datadog API key
  datadog-api-key: "REPLACE_WITH_DATADOG_KEY"
---
# External Secrets Operator configuration example
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openai-agents-external-secrets
  namespace: openai-agents
  labels:
    app: openai-agents
    component: secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: SecretStore
  target:
    name: openai-agents-secrets
    creationPolicy: Owner
  data:
  - secretKey: openai-api-key
    remoteRef:
      key: openai-api-key
  - secretKey: openai-org-id
    remoteRef:
      key: openai-org-id
  - secretKey: database-url
    remoteRef:
      key: database-url
  - secretKey: redis-url
    remoteRef:
      key: redis-url
  - secretKey: jwt-secret
    remoteRef:
      key: jwt-secret
  - secretKey: datadog-api-key
    remoteRef:
      key: datadog-api-key
