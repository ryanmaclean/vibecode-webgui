apiVersion: v1
kind: Service
metadata:
  name: openai-agents
  namespace: openai-agents
  labels:
    app: openai-agents
    component: runtime
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "openai-agents"
    tags.datadoghq.com/version: "1.0.0"
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  - name: health
    port: 8081
    targetPort: health
    protocol: TCP
  selector:
    app: openai-agents
    component: runtime
---
apiVersion: v1
kind: Service
metadata:
  name: openai-agents-headless
  namespace: openai-agents
  labels:
    app: openai-agents
    component: runtime
    tags.datadoghq.com/env: "production"
    tags.datadoghq.com/service: "openai-agents"
    tags.datadoghq.com/version: "1.0.0"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: openai-agents
    component: runtime
