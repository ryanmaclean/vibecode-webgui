apiVersion: v1
kind: ServiceAccount
metadata:
  name: openai-agents
  namespace: openai-agents
  labels:
    app: openai-agents
    component: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openai-agents-role
  namespace: openai-agents
  labels:
    app: openai-agents
    component: rbac
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openai-agents-rolebinding
  namespace: openai-agents
  labels:
    app: openai-agents
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openai-agents-role
subjects:
- kind: ServiceAccount
  name: openai-agents
  namespace: openai-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openai-agents-metrics-reader
  labels:
    app: openai-agents
    component: rbac
rules:
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openai-agents-metrics-reader
  labels:
    app: openai-agents
    component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openai-agents-metrics-reader
subjects:
- kind: ServiceAccount
  name: openai-agents
  namespace: openai-agents
