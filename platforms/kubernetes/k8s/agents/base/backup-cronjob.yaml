apiVersion: batch/v1
kind: CronJob
metadata:
  name: openai-agents-backup
  namespace: openai-agents
  labels:
    app: openai-agents
    component: backup
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: openai-agents
            component: backup
        spec:
          serviceAccountName: openai-agents-backup
          restartPolicy: OnFailure
          containers:
          - name: backup
            image: mcr.microsoft.com/azure-cli:latest
            command:
            - /bin/bash
            - -c
            - |
              #!/bin/bash
              set -euo pipefail

              BACKUP_DATE=$(date +%Y%m%d-%H%M%S)
              BACKUP_NAME="openai-agents-backup-${BACKUP_DATE}"

              echo "Starting backup: ${BACKUP_NAME}"

              # Login to Azure
              az login --identity

              # Create backup directory
              mkdir -p /backup/${BACKUP_NAME}

              # Backup data volume
              echo "Backing up data volume..."
              tar czf /backup/${BACKUP_NAME}/data.tar.gz -C /data .

              # Backup configuration
              echo "Backing up configuration..."
              kubectl get configmap openai-agents-config -n openai-agents -o yaml > /backup/${BACKUP_NAME}/configmap.yaml
              kubectl get secret openai-agents-secrets -n openai-agents -o yaml > /backup/${BACKUP_NAME}/secrets.yaml

              # Upload to Azure Blob Storage
              echo "Uploading to Azure Blob Storage..."
              az storage blob upload-batch \
                --account-name ${AZURE_STORAGE_ACCOUNT} \
                --destination backups \
                --source /backup/${BACKUP_NAME} \
                --destination-path openai-agents/${BACKUP_NAME}

              # Cleanup old backups (keep last 30 days)
              echo "Cleaning up old backups..."
              RETENTION_DATE=$(date -d '30 days ago' +%Y%m%d)
              az storage blob delete-batch \
                --account-name ${AZURE_STORAGE_ACCOUNT} \
                --source backups \
                --pattern "openai-agents/openai-agents-backup-${RETENTION_DATE}*"

              echo "Backup completed successfully: ${BACKUP_NAME}"

            env:
            - name: AZURE_STORAGE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secrets
                  key: storage-account

            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: backup
              mountPath: /backup

            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1
                memory: 2Gi

          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: openai-agents-data
          - name: backup
            emptyDir:
              sizeLimit: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openai-agents-backup
  namespace: openai-agents
  labels:
    app: openai-agents
    component: backup
  annotations:
    azure.workload.identity/client-id: ${AZURE_CLIENT_ID}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openai-agents-backup-role
  namespace: openai-agents
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openai-agents-backup-rolebinding
  namespace: openai-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openai-agents-backup-role
subjects:
- kind: ServiceAccount
  name: openai-agents-backup
  namespace: openai-agents
