# Minimal ingress for local KIND usage without external auth/TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibecode-ingress
  namespace: vibecode-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: vibecode.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vibecode-service
                port:
                  number: 3000
