# Apache SkyWalking Helm Chart Values
# Deployment: Complementary observability with AI anomaly detection and eBPF tracing
# Integration: Works alongside Datadog for multi-vendor observability

# OAP (Observability Analysis Platform) Configuration
oap:
  name: oap
  replicas: 2
  image:
    repository: apache/skywalking-oap-server
    tag: 10.3.0
    pullPolicy: IfNotPresent

  storageType: banyandb  # Native APM database optimized for observability data

  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  # Environment variables for OAP configuration
  env:
    # AI/ML anomaly detection configuration
    SW_AI_PIPELINE: "true"
    SW_ANOMALY_DETECTION_ENABLED: "true"
    SW_ANOMALY_DETECTION_BASELINE_LEARNING_PERIOD: "7d"  # Learning period for baseline
    SW_ANOMALY_DETECTION_SENSITIVITY: "medium"  # low, medium, high
    SW_ANOMALY_DETECTION_ALERT_THRESHOLD: "0.8"  # 80% confidence for alerting

    # Storage configuration
    SW_STORAGE: banyandb
    SW_STORAGE_BANYANDB_TARGETS: banyandb:17912

    # Telemetry export configuration
    SW_TELEMETRY: prometheus
    SW_TELEMETRY_PROMETHEUS_HOST: 0.0.0.0
    SW_TELEMETRY_PROMETHEUS_PORT: 1234

    # OTLP receiver for forwarding to Datadog
    SW_OTEL_RECEIVER: default
    SW_OTEL_RECEIVER_ENABLED_OTEL_RULES: "vm,k8s-cluster,k8s-service,k8s-node"

    # Query optimization
    SW_CORE_DEFAULT_ENDPOINT_DETECT_PERIOD: 3
    SW_STORAGE_BANYANDB_MAX_BULK_SIZE: 5000

    # Correlation and analysis
    SW_CORRELATION_VALUE_MAX_LENGTH: 256
    SW_TRACE_SAMPLE_RATE: 10000  # 100% sampling initially, tune down in production

    # Performance tuning
    SW_RECEIVER_BUFFER_PATH: /tmp/sw-buffer
    SW_RECEIVER_BUFFER_SIZE_MB: 256

  # Health checks
  livenessProbe:
    httpGet:
      path: /internal/l7check
      port: 12800
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /internal/l7check
      port: 12800
    initialDelaySeconds: 15
    periodSeconds: 5

  # Service configuration
  service:
    type: ClusterIP
    ports:
      # gRPC for agent connections
      grpc:
        port: 11800
        targetPort: 11800
      # REST API
      rest:
        port: 12800
        targetPort: 12800
      # Prometheus metrics
      prometheus:
        port: 1234
        targetPort: 1234

  # Persistent volume for buffering
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
    mountPath: /tmp/sw-buffer

# BanyanDB Configuration (Native Storage)
banyandb:
  enabled: true
  name: banyandb
  replicas: 2
  image:
    repository: apache/skywalking-banyandb
    tag: 0.8.1
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  env:
    BANYANDB_GRPC_HOST: 0.0.0.0
    BANYANDB_GRPC_PORT: 17912
    BANYANDB_HTTP_HOST: 0.0.0.0
    BANYANDB_HTTP_PORT: 17913
    BANYANDB_STORAGE_PATH: /data
    BANYANDB_MEASURE_SHARD_NUM: 2
    BANYANDB_STREAM_SHARD_NUM: 2
    # Retention policies
    BANYANDB_TTL: 168h  # 7 days retention
    BANYANDB_BLOCK_SIZE: 2h
    BANYANDB_SEGMENT_SIZE: 24h

  persistence:
    enabled: true
    size: 20Gi
    storageClass: standard
    mountPath: /data

  service:
    type: ClusterIP
    ports:
      grpc:
        port: 17912
        targetPort: 17912
      http:
        port: 17913
        targetPort: 17913

# SkyWalking UI Configuration
ui:
  name: ui
  replicas: 1
  image:
    repository: apache/skywalking-ui
    tag: 10.3.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  env:
    SW_OAP_ADDRESS: http://oap:12800
    SW_SERVER_PORT: 8080

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  # Ingress for external access
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: skywalking.vibecode.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: skywalking-tls
        hosts:
          - skywalking.vibecode.local

# eBPF Rover Agent (Zero-code instrumentation)
rover:
  enabled: true
  name: rover
  image:
    repository: apache/skywalking-rover
    tag: 0.8.0
    pullPolicy: IfNotPresent

  # DaemonSet for node-level eBPF monitoring
  daemonset: true

  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi

  env:
    # Connect to OAP backend
    SW_AGENT_COLLECTOR_BACKEND_SERVICES: oap:11800

    # eBPF profiling configuration
    SW_AGENT_PROFILING_NETWORK_ENABLED: "true"
    SW_AGENT_PROFILING_PROCESS_ENABLED: "true"
    SW_AGENT_PROFILING_EBPF_ENABLED: "true"

    # Sampling and filtering
    SW_AGENT_PROFILING_NETWORK_SAMPLE_RATE: 100
    SW_AGENT_PROFILING_PROCESS_SAMPLE_RATE: 100

    # Resource limits for eBPF
    SW_AGENT_PROFILING_EBPF_MAX_MEMORY_MB: 100
    SW_AGENT_PROFILING_EBPF_MAX_CPU_PERCENT: 1

    # Protocol detection
    SW_AGENT_PROFILING_NETWORK_PROTOCOLS: "http,https,http2,grpc,mysql,postgresql,redis"

    # Service mesh awareness
    SW_AGENT_PROFILING_MESH_ENABLED: "true"

  # Required for eBPF operations
  securityContext:
    privileged: true
    capabilities:
      add:
        - SYS_ADMIN
        - SYS_RESOURCE
        - SYS_PTRACE
        - NET_ADMIN
        - BPF

  # Host network for full visibility
  hostNetwork: true
  hostPID: true

  # Volume mounts for eBPF
  volumeMounts:
    - name: sys
      mountPath: /sys
      readOnly: true
    - name: debug
      mountPath: /sys/kernel/debug
    - name: boot
      mountPath: /boot
      readOnly: true

  volumes:
    - name: sys
      hostPath:
        path: /sys
        type: Directory
    - name: debug
      hostPath:
        path: /sys/kernel/debug
        type: Directory
    - name: boot
      hostPath:
        path: /boot
        type: Directory

# Satellite (Optional data aggregation layer)
satellite:
  enabled: false  # Enable if needed for edge aggregation

# Monitoring and ServiceMonitor for Prometheus integration
monitoring:
  enabled: true

  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: prometheus

# AI/ML Configuration
aiPipeline:
  enabled: true

  # Anomaly detection models
  models:
    - name: response-time-anomaly
      type: statistical
      metric: service_response_time
      algorithm: zscore
      threshold: 3.0

    - name: error-rate-anomaly
      type: statistical
      metric: service_error_rate
      algorithm: iqr
      threshold: 1.5

    - name: throughput-anomaly
      type: ml
      metric: service_throughput
      algorithm: isolation_forest
      contamination: 0.1

# Alert Rules for AI-detected anomalies
alerting:
  enabled: true

  rules:
    - name: high-response-time-anomaly
      expression: |
        (service_response_time_p99 > service_response_time_p99_baseline * 2)
        and (anomaly_score > 0.8)
      duration: 2m
      severity: warning
      labels:
        component: skywalking
        type: anomaly
      annotations:
        summary: "High response time anomaly detected"
        description: "Service {{ $labels.service }} has response time anomaly (score: {{ $value }})"

    - name: error-rate-spike
      expression: |
        (service_error_rate > service_error_rate_baseline * 3)
        and (anomaly_score > 0.8)
      duration: 1m
      severity: critical
      labels:
        component: skywalking
        type: anomaly
      annotations:
        summary: "Error rate spike detected"
        description: "Service {{ $labels.service }} has abnormal error rate (score: {{ $value }})"

    - name: throughput-drop
      expression: |
        (service_throughput < service_throughput_baseline * 0.5)
        and (anomaly_score > 0.8)
      duration: 5m
      severity: warning
      labels:
        component: skywalking
        type: anomaly
      annotations:
        summary: "Throughput drop detected"
        description: "Service {{ $labels.service }} has abnormal throughput drop (score: {{ $value }})"

# Integration with existing monitoring
integration:
  # Forward traces to Datadog via OTLP
  datadog:
    enabled: true
    otlpEndpoint: http://datadog-agent:4318/v1/traces
    headers:
      DD-API-KEY: "${DD_API_KEY}"

  # Export metrics to Prometheus
  prometheus:
    enabled: true
    port: 1234
    path: /metrics

  # Slack notifications for anomalies
  slack:
    enabled: true
    webhookUrl: "${SLACK_WEBHOOK_URL}"
    channel: "#alerts-anomaly"
    username: "SkyWalking Anomaly Detection"

  # PagerDuty integration for critical anomalies
  pagerduty:
    enabled: true
    routingKey: "${PAGERDUTY_ROUTING_KEY}"
    severity: critical

# Resource quotas and limits
resourceQuota:
  enabled: true
  hard:
    requests.cpu: 5
    requests.memory: 10Gi
    persistentvolumeclaims: 5

# Pod disruption budgets for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network policies for security
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: vibecode-platform
      ports:
      - protocol: TCP
        port: 11800
      - protocol: TCP
        port: 12800
  egress:
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 4318  # OTLP to Datadog
      - protocol: TCP
        port: 443   # External APIs

# Global labels
commonLabels:
  app.kubernetes.io/part-of: vibecode-observability
  app.kubernetes.io/managed-by: helm
  monitoring-tier: skywalking
  environment: production
