# GCP Code-Server Workspace Deployment
# Optimized for GKE Autopilot with Spot VMs and Filestore

apiVersion: v1
kind: Namespace
metadata:
  name: vibecode
  labels:
    name: vibecode
    environment: production

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-sa
  namespace: vibecode
  annotations:
    iam.gke.io/gcp-service-account: workspace-sa@PROJECT_ID.iam.gserviceaccount.com

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: filestore-sc
provisioner: filestore.csi.storage.gke.io
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  tier: standard
  network: default

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: filestore-workspaces-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: filestore-sc
  mountOptions:
    - nfsvers=4.1
    - noatime
  csi:
    driver: filestore.csi.storage.gke.io
    volumeHandle: "modeInstance/REGION/FILESTORE_INSTANCE_NAME/SHARE_NAME"
    volumeAttributes:
      ip: FILESTORE_IP
      volume: SHARE_NAME

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-server-config
  namespace: vibecode
data:
  config.yaml: |
    bind-addr: 0.0.0.0:8080
    auth: none
    cert: false
    disable-telemetry: true
    disable-update-check: true
    extensions-dir: /home/coder/.local/share/code-server/extensions
    user-data-dir: /home/coder/.local/share/code-server

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: code-server
  namespace: vibecode
  labels:
    app: code-server
    workload: cloud-workspace
spec:
  serviceName: code-server
  replicas: 0  # Scale up dynamically per user
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
        workload: cloud-workspace
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: workspace-sa

      # Schedule on Spot VMs for cost savings
      nodeSelector:
        cloud.google.com/gke-spot: "true"

      tolerations:
      - key: cloud.google.com/gke-spot
        operator: Equal
        value: "true"
        effect: NoSchedule

      # Graceful shutdown for spot interruptions
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true

      initContainers:
      # Create user workspace directory
      - name: init-workspace
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          USER_DIR="/workspaces/$(USER_ID)"
          mkdir -p "$USER_DIR"
          chown -R 1000:1000 "$USER_DIR"
          echo "Initialized workspace for $(USER_ID)"
        volumeMounts:
        - name: workspaces
          mountPath: /workspaces
        env:
        - name: USER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['user-id']

      containers:
      - name: code-server
        image: gcr.io/PROJECT_ID/vibecode-code-server:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        env:
        - name: USER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['user-id']
        - name: PASSWORD
          value: ""  # Auth handled by ingress
        - name: SHELL
          value: "/bin/bash"
        - name: HOME
          value: "/home/coder"
        - name: WORKSPACE_DIR
          value: "/home/coder/workspace"
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          value: "production"
        - name: DD_SERVICE
          value: "code-server"
        - name: DD_VERSION
          value: "1.0.0"

        volumeMounts:
        - name: workspace
          mountPath: /home/coder/workspace
          subPathExpr: $(USER_ID)
        - name: config
          mountPath: /home/coder/.config/code-server
        - name: tmp
          mountPath: /tmp

        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 5Gi
          limits:
            cpu: 2000m
            memory: 4Gi
            ephemeral-storage: 10Gi

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                echo "Gracefully shutting down workspace..."
                # Save all open files
                code-server --save-all || true
                # Sync to persistent storage
                sync
                # Wait for flush
                sleep 5
                echo "Shutdown complete"

      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: workspaces-pvc
      - name: config
        configMap:
          name: code-server-config
      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workspaces-pvc
  namespace: vibecode
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: filestore-sc
  resources:
    requests:
      storage: 1Ti
  volumeName: filestore-workspaces-pv

---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: vibecode
  labels:
    app: code-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: code-server

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: code-server-hpa
  namespace: vibecode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: code-server
  minReplicas: 0  # Scale to zero when idle
  maxReplicas: 5  # Limit per user
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 min cooldown
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-isolation
  namespace: vibecode
spec:
  podSelector:
    matchLabels:
      app: code-server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443  # HTTPS only
    - protocol: TCP
      port: 80   # HTTP
  - to:  # Allow DNS
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: code-server-pdb
  namespace: vibecode
spec:
  minAvailable: 0  # Allow disruption for spot instances
  selector:
    matchLabels:
      app: code-server
