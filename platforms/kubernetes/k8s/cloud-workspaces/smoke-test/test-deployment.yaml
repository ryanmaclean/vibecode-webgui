# Smoke Test Deployment for Cloud Workspaces
# Simulates production GCP/AWS setup in KinD

apiVersion: v1
kind: Namespace
metadata:
  name: vibecode-test
  labels:
    name: vibecode-test
    environment: smoke-test

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-sa
  namespace: vibecode-test

---
# Simulate Filestore/EFS with local-path storage
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-workspaces
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workspaces-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-workspaces
  local:
    path: /mnt/workspaces
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: workload
          operator: In
          values:
          - code-server

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-server-config
  namespace: vibecode-test
data:
  config.yaml: |
    bind-addr: 0.0.0.0:8080
    auth: none
    cert: false
    disable-telemetry: true

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: code-server-test
  namespace: vibecode-test
  labels:
    app: code-server
    test: smoke
spec:
  serviceName: code-server-test
  replicas: 2  # Test multiple workspaces
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
        test: smoke
        user-id: "test-user-1"
    spec:
      serviceAccountName: workspace-sa

      # Test spot node affinity
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: In
                values:
                - "true"

      # Test spot tolerations
      tolerations:
      - key: cloud.google.com/gke-spot
        operator: Equal
        value: "true"
        effect: NoSchedule

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
      - name: code-server
        image: codercom/code-server:4.104.2
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080
          name: http

        env:
        - name: PASSWORD
          value: "test123"
        - name: USER_ID
          value: "test-user-1"

        volumeMounts:
        - name: workspace
          mountPath: /home/coder/workspace
        - name: config
          mountPath: /home/coder/.config/code-server

        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                echo "Testing graceful shutdown..."
                sync
                sleep 5

      volumes:
      - name: config
        configMap:
          name: code-server-config

  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-workspaces
      resources:
        requests:
          storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: code-server-test
  namespace: vibecode-test
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  selector:
    app: code-server

---
# Test HPA behavior
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: code-server-hpa-test
  namespace: vibecode-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: code-server-test
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

---
# Test network policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-isolation-test
  namespace: vibecode-test
spec:
  podSelector:
    matchLabels:
      app: code-server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}

---
# Test pod disruption budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: code-server-pdb-test
  namespace: vibecode-test
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: code-server

---
# Simulate spot instance interruption for testing
apiVersion: batch/v1
kind: Job
metadata:
  name: spot-interruption-test
  namespace: vibecode-test
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: tester
        image: curlimages/curl:8.1.0
        command:
        - sh
        - -c
        - |
          echo "Simulating spot instance interruption..."
          sleep 60
          echo "Sending drain signal to nodes..."
          # In production, AWS Node Termination Handler would do this
          kubectl drain --ignore-daemonsets --delete-emptydir-data \
            --force --timeout=60s \
            $(kubectl get nodes -l cloud.google.com/gke-spot=true -o name | head -1) || true
          echo "Interruption test complete"
