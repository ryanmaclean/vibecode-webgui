  - name: Container Manifest
    type: doc
    provider: github
    url: https://github.com/vibecode/vibecode-webgui/blob/main/docs/src/content/docs/container-manifest.md
  - name: Helm Values
    type: repo
    provider: github
    url: https://github.com/vibecode/vibecode-webgui/blob/main/charts/vibecode-platform/templates/redis.yaml
tags:
  - env:production
  - component:cache
