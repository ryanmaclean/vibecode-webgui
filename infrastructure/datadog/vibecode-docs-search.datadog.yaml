    type: repo
    provider: github
    url: https://github.com/vibecode/vibecode-webgui/tree/main/azure-functions
  - name: Performance Rollback Playbook
    type: doc
    provider: github
    url: https://github.com/vibecode/vibecode-webgui/blob/main/tests/performance/rollback-manager.ts
tags:
  - env:production
  - component:docs-search
  - runtime:azure-functions
  - language:typescript
  - business-unit:platform
  - cost-center:engineering
extensions:
  datadoghq.com/dora-metrics:
