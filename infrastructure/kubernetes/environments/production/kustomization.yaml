# Production Environment Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: vibecode-production

namespace: vibecode-webgui-production

resources:
- ../base
- pod-disruption-budget.yaml
- pod-security-policy.yaml
- network-security.yaml

namePrefix: prod-

commonLabels:
  environment: production
  tier: production
  criticality: high

commonAnnotations:
  environment: production
  deployment.kubernetes.io/revision: "1"
  security.policy/enforced: "true"

images:
- name: vibecode-webgui
  newName: ghcr.io/ryanmaclean/vibecode-webgui
  newTag: main-latest

configMapGenerator:
- name: app-config-production
  literals:
  - NODE_ENV=production
  - NEXT_PUBLIC_APP_URL=https://vibecode-webgui.yourdomain.com
  - DD_ENV=production
  - DD_SERVICE=vibecode-webgui
  - LITELLM_BASE_URL=http://prod-litellm:4000
  - DATABASE_POOL_MAX=20
  - DATABASE_POOL_MIN=5
  - REDIS_TTL=3600
  - CACHE_ENABLED=true
  - RATE_LIMIT_ENABLED=true
  - SECURITY_HEADERS_ENABLED=true
  behavior: merge

secretGenerator:
- name: app-secrets-production
  type: Opaque
  literals:
  - NEXTAUTH_URL=https://vibecode-webgui.yourdomain.com
  - NEXTAUTH_SECRET=production-secret-key-replace-in-sealed-secrets
  behavior: merge

patchesStrategicMerge:
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: vibecode-webgui
  spec:
    replicas: 5
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 2
    template:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "3000"
          prometheus.io/path: "/api/metrics"
          ad.datadoghq.com/vibecode-webgui.logs: '[{"source":"nodejs","service":"vibecode-webgui","tags":["env:production"]}]'
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: vibecode-webgui
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          env:
          - name: LOG_LEVEL
            value: info
          - name: ENABLE_DEBUG_FEATURES
            value: "false"
          - name: PERFORMANCE_MONITORING
            value: "true"
          readinessProbe:
            httpGet:
              path: /api/health/simple
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

- |-
  apiVersion: v1
  kind: Service
  metadata:
    name: vibecode-webgui
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  spec:
    type: ClusterIP
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 300

- |-
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: vibecode-webgui
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/rate-limit: "100"
      nginx.ingress.kubernetes.io/rate-limit-window: "1m"
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/configuration-snippet: |
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
  spec:
    tls:
    - hosts:
      - vibecode-webgui.yourdomain.com
      secretName: vibecode-production-tls
    rules:
    - host: vibecode-webgui.yourdomain.com
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: prod-vibecode-webgui
              port:
                number: 80

patchesJson6902:
- target:
    group: autoscaling
    version: v2
    kind: HorizontalPodAutoscaler
    name: vibecode-webgui
  patch: |-
    - op: replace
      path: /spec/minReplicas
      value: 3
    - op: replace
      path: /spec/maxReplicas
      value: 10
    - op: replace
      path: /spec/metrics/0/resource/target/averageUtilization
      value: 70

- target:
    group: apps
    version: v1
    kind: Deployment
    name: postgresql
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "2Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "4Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "1000m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "2000m"

- target:
    group: apps
    version: v1
    kind: Deployment
    name: redis
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "512Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "2Gi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "200m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "1000m"