---
# Default variables for initramfs role

initramfs_build_dir: "/tmp/initramfs-build"
initramfs_rootfs_dir: "{{ initramfs_build_dir }}/rootfs"
initramfs_packages_dir: "{{ initramfs_build_dir }}/packages"
initramfs_output_path: "/tmp/initramfs.cpio.gz"

# Ubuntu mirror and architecture
initramfs_ubuntu_mirror: "http://ports.ubuntu.com"
initramfs_ubuntu_arch: "arm64"
initramfs_ubuntu_codename: "jammy"

# Default packages (empty - should be overridden)
initramfs_packages: []

# Tasks to include after package extraction
initramfs_install_tasks:
  - libraries

