---
# Install shared libraries into initramfs

- name: Copy glibc libraries
  shell: |
    if [ -d {{ initramfs_packages_dir }}/libc6/lib/aarch64-linux-gnu ]; then
      cp -a {{ initramfs_packages_dir }}/libc6/lib/aarch64-linux-gnu/* {{ initramfs_rootfs_dir }}/lib/aarch64-linux-gnu/ 2>/dev/null || true
    fi
  when: "'libc6' in (initramfs_packages | map(attribute='name') | list)"

- name: Copy ICU libraries
  shell: |
    for pkg in libicu70 libicu74; do
      if [ -d {{ initramfs_packages_dir }}/$pkg/usr/lib/aarch64-linux-gnu ]; then
        cp -a {{ initramfs_packages_dir }}/$pkg/usr/lib/aarch64-linux-gnu/libicu*.so* {{ initramfs_rootfs_dir }}/usr/lib/aarch64-linux-gnu/ 2>/dev/null || true
      fi
    done
  when: "'libicu70' in (initramfs_packages | map(attribute='name') | list) or 'libicu74' in (initramfs_packages | map(attribute='name') | list)"

- name: Copy common libraries
  shell: |
    for pkg in {{ item.packages | join(' ') }}; do
      if [ -d {{ initramfs_packages_dir }}/$pkg/usr/lib/aarch64-linux-gnu ]; then
        cp -a {{ initramfs_packages_dir }}/$pkg/usr/lib/aarch64-linux-gnu/*.so* {{ initramfs_rootfs_dir }}/usr/lib/aarch64-linux-gnu/ 2>/dev/null || true
      fi
      if [ -d {{ initramfs_packages_dir }}/$pkg/lib/aarch64-linux-gnu ]; then
        cp -a {{ initramfs_packages_dir }}/$pkg/lib/aarch64-linux-gnu/*.so* {{ initramfs_rootfs_dir }}/lib/aarch64-linux-gnu/ 2>/dev/null || true
      fi
    done
  loop:
    - packages:
        - libldap
        - libsasl2
        - libsystemd
        - libdaemon
        - libdbus
        - libexpat
        - libcap
        - libtomcrypt
        - libtommath
        - libavahi-common
        - libavahi-core

