---
# Deploy K3s cluster with MLflow and OLLama
# Creates sandboxed GenAI coding editors on each node

- hosts: all
  become: true
  vars:
    k3s_version: "v1.31.0+k3s2"
    mflow_version: "2.14.1"
    ollama_version: "latest"
    
  pre_tasks:
    - name: Check OS
      debug:
        msg: "Running on {{ ansible_os_family }}"

    - name: Install prerequisites (macOS)
      when: ansible_os_family == "Darwin"
      homebrew:
        name:
          - k3s
          - ollama
        state: present

    - name: Install prerequisites (Pop!_OS/Linux)
      when: ansible_os_family == "Debian"
      apt:
        update_cache: yes
        cache_valid_time: 3600
        name:
          - curl
          - git
        state: present

  tasks:
    - name: Download K3s installer
      get_url:
        url: "https://get.k3s.io"
        dest: /tmp/get_k3s.sh
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: Install K3s
      shell: /tmp/get_k3s.sh
      when: ansible_os_family == "Debian"
      register: k3s_install

    - name: Start K3s
      systemd:
        name: k3s
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Wait for K3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 300
        delay: 5

- hosts: control-plane
  become: true
  tasks:
    - name: Get K3s config
      command: cat /etc/rancher/k3s/k3s.yaml
      register: k3s_config
      changed_when: false

    - name: Save K3s config
      copy:
        content: "{{ k3s_config.stdout }}"
        dest: "{{ playbook_dir }}/kubeconfig"

    - name: Get cluster token
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token
      changed_when: false

    - name: Save cluster token
      copy:
        content: "{{ k3s_token.stdout }}"
        dest: "{{ playbook_dir }}/k3s_token"
        mode: '0600'

- hosts: workers
  become: true
  tasks:
    - name: Read cluster token
      slurp:
        src: "{{ playbook_dir }}/k3s_token"
      register: k3s_token_file

    - name: Get control plane IP
      set_fact:
        k3s_server_ip: "{{ hostvars[groups['control-plane'][0]]['ansible_host'] }}"

    - name: Join worker to cluster
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ k3s_server_ip }}:6443 K3S_TOKEN={{ k3s_token_file.content | b64decode | trim }} sh -
      when: ansible_os_family == "Debian"

- hosts: all
  become: true
  tasks:
    - name: Install kubectl
      shell: |
        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/$(uname -m)/kubectl"
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/
      when: ansible_os_family == "Debian"

    - name: Copy Kubeconfig to home directory
      copy:
        src: "{{ playbook_dir }}/kubeconfig"
        dest: "~/.kube/config"
        mode: '0600'

- hosts: all
  become: true
  tasks:
    - name: Create namespace for ML services
      kubernetes.core.k8s:
        name: mlflow-ollama
        api_version: v1
        kind: Namespace
        state: present

    - name: Deploy OLLama
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ollama
            namespace: mlflow-ollama
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: ollama
            template:
              metadata:
                labels:
                  app: ollama
              spec:
                containers:
                - name: ollama
                  image: ollama/ollama:latest
                  ports:
                  - containerPort: 11434
                  resources:
                    requests:
                      memory: "4Gi"
                      cpu: "2"
                  volumeMounts:
                  - name: ollama-data
                    mountPath: /root/.ollama
                volumes:
                - name: ollama-data
                  hostPath:
                    path: /tmp/ollama-data
                    type: DirectoryOrCreate

    - name: Deploy OLLama Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: ollama
            namespace: mlflow-ollama
          spec:
            selector:
              app: ollama
            ports:
            - port: 11434
              targetPort: 11434

    - name: Deploy MLflow
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mlflow
            namespace: mlflow-ollama
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mlflow
            template:
              metadata:
                labels:
                  app: mlflow
              spec:
                containers:
                - name: mlflow
                  image: ghcr.io/mlflow/mlflow:{{ mflow_version }}
                  command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
                  ports:
                  - containerPort: 5000
                  env:
                  - name: BACKEND_STORE_URI
                    value: "sqlite:///tmp/mlflow.db"
                  resources:
                    requests:
                      memory: "512Mi"
                      cpu: "0.5"

    - name: Deploy MLflow Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: mlflow
            namespace: mlflow-ollama
          spec:
            selector:
              app: mlflow
            ports:
            - port: 5000
              targetPort: 5000

- hosts: all
  become: true
  tasks:
    - name: Wait for services to be ready
      kubernetes.core.k8s:
        api_version: v1
        kind: Pod
        namespace: mlflow-ollama
        wait: yes
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 300
      register: pod_status
      until: pod_status | json_query('items[0].status.phase') == "Running"
      retries: 30
      delay: 10

    - name: Display service endpoints
      debug:
        msg: |
          Services deployed:
          - OLLama: http://localhost:11434
          - MLflow: http://localhost:5000
          
          Access via:
          kubectl port-forward -n mlflow-ollama svc/ollama 11434:11434
          kubectl port-forward -n mlflow-ollama svc/mlflow 5000:5000
