  consumer.js: "'use strict';\n\nrequire('dd-trace').init({\n  service: process.env.DD_SERVICE\
    \ || 'gastown-kafka-consumer',\n  env: process.env.DD_ENV || 'local',\n  version:\
    \ process.env.DD_VERSION || '0.1.0',\n  logInjection: true\n});\n\nconst { Kafka\
    \ } = require('kafkajs');\n\nconst BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');\n\
    const TOPIC = process.env.KAFKA_TOPIC || 'tundra-beads-created';\nconst GROUP_ID\
    \ = process.env.KAFKA_GROUP_ID || 'gastown-consumer';\n\nasync function run()\
    \ {\n  const kafka = new Kafka({ clientId: 'gastown-consumer', brokers: BROKERS\
    \ });\n  const consumer = kafka.consumer({ groupId: GROUP_ID });\n  await consumer.connect();\n\
    \  await consumer.subscribe({ topic: TOPIC, fromBeginning: true });\n\n  await\
    \ consumer.run({\n    eachMessage: async ({ message }) => {\n      const value\
    \ = message.value ? message.value.toString('utf8') : '';\n      try {\n      \
    \  JSON.parse(value);\n      } catch (err) {\n        console.error('consumer\
    \ parse error', err);\n      }\n    }\n  });\n}\n\nrun().catch((err) => {\n  console.error('consumer\
    \ error', err);\n  process.exit(1);\n});\n"
  gastown-to-tundra-bridge.env.example: 'DD_SERVICE=gastown-to-tundra-bridge

    DD_ENV=local

    DD_VERSION=0.1.0

    DD_DATA_STREAMS_ENABLED=true

    DD_TRACE_ENABLED=true

    KAFKA_BROKERS=localhost:9092

    SOURCE_TOPIC=tundra-beads-created

    KAFKA_GROUP_ID=gastown-to-tundra-bridge

    BRIDGE_DRY_RUN=true

    TD_TOPIC_WORK=tundra-work-intake

    TD_TOPIC_CREATED=tundra-beads-created

    TD_LANE_PREFIX=tundra-lane

    TD_DEFAULT_LANE=standard

    '
  gastown-to-tundra-bridge.js: "'use strict';\n\nrequire('dd-trace').init({\n  service:\
    \ process.env.DD_SERVICE || 'gastown-to-tundra-bridge',\n  env: process.env.DD_ENV\
    \ || 'local',\n  version: process.env.DD_VERSION || '0.1.0',\n  logInjection:\
    \ true\n});\n\nconst { Kafka } = require('kafkajs');\n\nconst BROKERS = (process.env.KAFKA_BROKERS\
    \ || 'localhost:9092').split(',');\nconst SOURCE_TOPIC = process.env.SOURCE_TOPIC\
    \ || 'tundra-beads-created';\nconst GROUP_ID = process.env.KAFKA_GROUP_ID || 'gastown-to-tundra-bridge';\n\
    const DRY_RUN = (process.env.BRIDGE_DRY_RUN || '').toLowerCase() === 'true';\n\
    \nconst TD_TOPIC_WORK = process.env.TD_TOPIC_WORK || 'tundra-work-intake';\nconst\
    \ TD_TOPIC_CREATED = process.env.TD_TOPIC_CREATED || 'tundra-beads-created';\n\
    const TD_LANE_PREFIX = process.env.TD_LANE_PREFIX || 'tundra-lane';\nconst TD_DEFAULT_LANE\
    \ = (process.env.TD_DEFAULT_LANE || 'standard').toLowerCase();\n\nasync function\
    \ run() {\n  const kafka = new Kafka({ clientId: 'gastown-to-tundra-bridge', brokers:\
    \ BROKERS });\n  const consumer = kafka.consumer({ groupId: GROUP_ID });\n  const\
    \ producer = kafka.producer();\n\n  await consumer.connect();\n  await producer.connect();\n\
    \  await consumer.subscribe({ topic: SOURCE_TOPIC, fromBeginning: false });\n\n\
    \  await consumer.run({\n    eachMessage: async ({ message }) => {\n      const\
    \ value = message.value ? message.value.toString('utf8') : '';\n      if (!value)\
    \ return;\n\n      let evt;\n      try {\n        evt = JSON.parse(value);\n \
    \     } catch {\n        return;\n      }\n\n      const lane = (evt.lane || evt.payload?.lane\
    \ || TD_DEFAULT_LANE || 'standard').toLowerCase();\n      const laneTopic = `${TD_LANE_PREFIX}-${lane}-beads`;\n\
    \      const payload = JSON.stringify({\n        ...evt,\n        source: evt.source\
    \ || 'tundra-beads-created',\n        bridge: 'gastown-to-tundra'\n      });\n\
    \n      if (DRY_RUN) return;\n\n      await producer.send({ topic: TD_TOPIC_WORK,\
    \ messages: [{ value: payload }] });\n      await producer.send({ topic: TD_TOPIC_CREATED,\
    \ messages: [{ value: payload }] });\n      await producer.send({ topic: laneTopic,\
    \ messages: [{ value: payload }] });\n    }\n  });\n}\n\nrun().catch((err) =>\
    \ {\n  console.error('gastown-to-tundra-bridge error', err);\n  process.exit(1);\n\
    });\n"
  github-issue-dispatcher.js: "'use strict';\n\nrequire('dd-trace').init({\n  service:\
    \ process.env.DD_SERVICE || 'gastown-github-dispatcher',\n  env: process.env.DD_ENV\
    \ || 'local',\n  version: process.env.DD_VERSION || '0.1.0',\n  logInjection:\
    \ true\n});\n\nconst fs = require('fs');\nconst https = require('https');\nconst\
    \ { execFileSync } = require('child_process');\nconst { Kafka } = require('kafkajs');\n\
    \nconst BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');\n\
    const OWNER = process.env.GITHUB_OWNER || '';\nconst REPO = process.env.GITHUB_REPO\
    \ || '';\nconst TOKEN = process.env.GITHUB_TOKEN || '';\nconst API_BASE = process.env.GITHUB_API\
    \ || 'https://api.github.com';\nconst STATE_PATH = process.env.GITHUB_STATE_PATH\
    \ || '/Users/studio/gt/logs/github-issues.state.json';\nconst SINCE_DAYS = parseInt(process.env.GITHUB_SINCE_DAYS\
    \ || '7', 10);\nconst BD_CMD = process.env.BD_CMD || 'bd';\nconst GT_CMD = process.env.GT_CMD\
    \ || 'gt';\nconst GT_AUTO_SLING = (process.env.GT_AUTO_SLING || '').toLowerCase()\
    \ === 'true';\nconst GT_AUTO_SLING_TARGET = process.env.GT_AUTO_SLING_TARGET ||\
    \ 'mayor';\nconst DRY_RUN = (process.env.GITHUB_DRY_RUN || '').toLowerCase() ===\
    \ 'true';\n\nconst LANE_CRITICAL = (process.env.GITHUB_LABEL_LANE_CRITICAL ||\
    \ 'critical,sev1,p0').split(',').map((s) => s.trim()).filter(Boolean);\nconst\
    \ LANE_STANDARD = (process.env.GITHUB_LABEL_LANE_STANDARD || 'standard,sev2,p1').split(',').map((s)\
    \ => s.trim()).filter(Boolean);\nconst LANE_EXPERIMENTAL = (process.env.GITHUB_LABEL_LANE_EXPERIMENTAL\
    \ || 'experimental,spike,idea').split(',').map((s) => s.trim()).filter(Boolean);\n\
    \nconst PRIORITY_MAP = (process.env.GITHUB_PRIORITY_MAP || 'p0:0,p1:1,p2:2,p3:3,p4:4,critical:0,high:1,medium:2,low:3').split(',')\n\
    \  .map((pair) => pair.trim())\n  .filter(Boolean)\n  .reduce((acc, pair) => {\n\
    \    const [label, value] = pair.split(':');\n    if (!label || value === undefined)\
    \ return acc;\n    acc[label.toLowerCase()] = value;\n    return acc;\n  }, {});\n\
    \nfunction loadState() {\n  try {\n    const raw = fs.readFileSync(STATE_PATH,\
    \ 'utf8');\n    return JSON.parse(raw);\n  } catch {\n    return { since: null,\
    \ seen: [] };\n  }\n}\n\nfunction saveState(state) {\n  fs.writeFileSync(STATE_PATH,\
    \ JSON.stringify(state, null, 2));\n}\n\nfunction requestJson(url) {\n  return\
    \ new Promise((resolve, reject) => {\n    const opts = new URL(url);\n    const\
    \ headers = {\n      'User-Agent': 'gastown-github-dispatcher',\n      'Accept':\
    \ 'application/vnd.github+json'\n    };\n    if (TOKEN) headers.Authorization\
    \ = `Bearer ${TOKEN}`;\n\n    const req = https.request({\n      hostname: opts.hostname,\n\
    \      path: opts.pathname + opts.search,\n      method: 'GET',\n      headers\n\
    \    }, (res) => {\n      let data = '';\n      res.on('data', (chunk) => { data\
    \ += chunk; });\n      res.on('end', () => {\n        if (res.statusCode && res.statusCode\
    \ >= 200 && res.statusCode < 300) {\n          try {\n            resolve(JSON.parse(data));\n\
    \          } catch (err) {\n            reject(err);\n          }\n          return;\n\
    \        }\n        reject(new Error(`GitHub API ${res.statusCode}: ${data}`));\n\
    \      });\n    });\n    req.on('error', reject);\n    req.end();\n  });\n}\n\n\
    function issueLane(labels) {\n  const set = new Set(labels.map((l) => l.toLowerCase()));\n\
    \  if (LANE_CRITICAL.some((label) => set.has(label))) return 'critical';\n  if\
    \ (LANE_EXPERIMENTAL.some((label) => set.has(label))) return 'experimental';\n\
    \  if (LANE_STANDARD.some((label) => set.has(label))) return 'standard';\n  return\
    \ 'standard';\n}\n\nfunction issuePriority(labels) {\n  for (const label of labels)\
    \ {\n    const mapped = PRIORITY_MAP[label.toLowerCase()];\n    if (mapped !==\
    \ undefined) return mapped;\n  }\n  return '2';\n}\n\nfunction buildDescription(issue)\
    \ {\n  const body = issue.body ? issue.body.trim() : '';\n  const link = issue.html_url\
    \ || '';\n  const meta = [\n    `GitHub: ${link}`,\n    `Repo: ${OWNER}/${REPO}`,\n\
    \    `Issue: #${issue.number}`,\n    `Author: ${issue.user ? issue.user.login\
    \ : 'unknown'}`\n  ].join('\\n');\n  if (!body) return meta;\n  return `${meta}\\\
    n\\n${body}`;\n}\n\nfunction createBead(issue, priority, labels) {\n  const title\
    \ = issue.title || `GitHub issue #${issue.number}`;\n  const description = buildDescription(issue);\n\
    \  const externalRef = `gh-${issue.number}`;\n  const args = [\n    'create',\n\
    \    '--title', title,\n    '--description', description,\n    '--external-ref',\
    \ externalRef,\n    '--priority', String(priority),\n    '--labels', labels.join(','),\n\
    \    '--silent'\n  ];\n  const output = execFileSync(BD_CMD, args, { encoding:\
    \ 'utf8' }).trim();\n  return output || null;\n}\n\nfunction sendKafka(topic,\
    \ payload) {\n  const kafka = new Kafka({ clientId: 'gastown-github-dispatcher',\
    \ brokers: BROKERS });\n  const producer = kafka.producer();\n  return producer.connect()\n\
    \    .then(() => producer.send({ topic, messages: [{ value: JSON.stringify(payload)\
    \ }] }))\n    .then(() => producer.disconnect());\n}\n\nasync function run() {\n\
    \  if (!OWNER || !REPO) throw new Error('GITHUB_OWNER and GITHUB_REPO are required');\n\
    \  if (!TOKEN) throw new Error('GITHUB_TOKEN is required');\n\n  const state =\
    \ loadState();\n  const since = state.since || new Date(Date.now() - SINCE_DAYS\
    \ * 86400000).toISOString();\n\n  const url = `${API_BASE}/repos/${OWNER}/${REPO}/issues?state=open&per_page=100&since=${encodeURIComponent(since)}`;\n\
    \  const issues = await requestJson(url);\n  const seen = new Set(state.seen ||\
    \ []);\n  let newest = state.since || since;\n\n  for (const issue of issues)\
    \ {\n    if (issue.pull_request) continue;\n    if (seen.has(issue.id)) continue;\n\
    \    const labels = (issue.labels || []).map((label) => label.name || '').filter(Boolean);\n\
    \    const lane = issueLane(labels);\n    const priority = issuePriority(labels);\n\
    \    if (DRY_RUN) {\n      seen.add(issue.id);\n      if (issue.updated_at &&\
    \ issue.updated_at > newest) newest = issue.updated_at;\n      continue;\n   \
    \ }\n\n    const beadId = createBead(issue, priority, labels);\n    if (!beadId)\
    \ continue;\n\n    await sendKafka(`tundra-lane-${lane}-beads`, {\n      ts: new\
    \ Date().toISOString(),\n      type: 'issue',\n      action: 'created',\n    \
    \  lane,\n      priority,\n      bead: beadId,\n      issue: {\n        id: issue.id,\n\
    \        number: issue.number,\n        title: issue.title,\n        url: issue.html_url,\n\
    \        labels\n      }\n    });\n\n    if (GT_AUTO_SLING) {\n      try {\n \
    \       execFileSync(GT_CMD, ['sling', beadId, GT_AUTO_SLING_TARGET], { stdio:\
    \ 'ignore' });\n      } catch {\n        // ignore sling errors\n      }\n   \
    \ }\n\n    seen.add(issue.id);\n    if (issue.updated_at && issue.updated_at >\
    \ newest) newest = issue.updated_at;\n  }\n\n  state.since = newest;\n  state.seen\
    \ = Array.from(seen).slice(-2000);\n  saveState(state);\n}\n\nrun().catch((err)\
    \ => {\n  console.error('github-issue-dispatcher error', err.message || err);\n\
    \  process.exit(1);\n});\n"
  github-issue-dispatcher.sh: "#!/usr/bin/env bash\nset -euo pipefail\nexport PATH=\"\
    /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin\"\nDIR=\"$(cd \"\
    $(dirname \"${BASH_SOURCE[0]}\")\" && pwd)\"\nENV_FILE=\"$DIR/github-issue-dispatcher.env\"\
    \nif [ -f \"$ENV_FILE\" ]; then\n  set -a\n  # shellcheck disable=SC1090\n  source\
    \ \"$ENV_FILE\"\n  set +a\nfi\nnode \"$DIR/github-issue-dispatcher.js\"\n"
  gt-action-producer.js: "'use strict';\n\nrequire('dd-trace').init({\n  service:\
