    \ TimeoutNegativeWarning noise.\nconst _setTimeout = global.setTimeout;\nglobal.setTimeout\
    \ = (fn, ms, ...args) => _setTimeout(fn, Math.max(0, Number(ms) || 0), ...args);\n\
    \nconst BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');\n\
    const GT_CMD = process.env.GT_CMD || '/Users/studio/go/bin/gt';\nconst TD_RIG\
    \ = process.env.TD_RIG || 'mbp_m1';\nconst TD_ACTOR = process.env.TD_ACTOR ||\
    \ 'mayor';\nconst TD_LANE_DEFAULT = process.env.TD_LANE || 'standard';\nconst\
    \ TD_DRY_RUN = (process.env.TD_DRY_RUN || '').toLowerCase() === 'true';\nconst\
    \ DD_AGENT_HOST = process.env.DD_AGENT_HOST || '127.0.0.1';\nconst DD_DOGSTATSD_PORT\
    \ = Number(process.env.DD_DOGSTATSD_PORT || 8125);\nconst DD_ENV = process.env.DD_ENV\
    \ || 'local';\nconst DD_SERVICE = process.env.DD_SERVICE || 'tundra-td-sling';\n\
    const DD_TAGS = (process.env.DD_TAGS || '').split(',').map((t) => t.trim()).filter(Boolean);\n\
    \nconst TOPIC_LANE_PREFIX = process.env.TD_LANE_PREFIX || 'tundra-lane';\nconst\
    \ TOPIC_WORK = process.env.TD_TOPIC_WORK || 'tundra-work-intake';\nconst TOPIC_AUDIT\
    \ = process.env.TD_TOPIC_AUDIT || 'tundra-audit-actions';\nconst TOPIC_IN_PROGRESS\
    \ = process.env.TD_TOPIC_IN_PROGRESS || 'tundra-beads-in-progress';\n\nfunction\
    \ metricLine(name, value, tags) {\n  const tagStr = tags && tags.length ? `|#${tags.join(',')}`\
    \ : '';\n  return `${name}:${value}|c${tagStr}`;\n}\n\nfunction sendMetric(name,\
    \ value, extraTags = []) {\n  try {\n    const dgram = require('dgram');\n   \
    \ const client = dgram.createSocket('udp4');\n    const tags = [`env:${DD_ENV}`,\
    \ `service:${DD_SERVICE}`, ...DD_TAGS, ...extraTags];\n    const line = metricLine(name,\
    \ value, tags);\n    client.send(Buffer.from(line), DD_DOGSTATSD_PORT, DD_AGENT_HOST,\
    \ () => client.close());\n  } catch {\n    // ignore metric errors\n  }\n}\n\n\
    function parseArgs(argv) {\n  const args = argv.slice(2);\n  const out = { lane:\
    \ TD_LANE_DEFAULT };\n  const positional = [];\n  for (let i = 0; i < args.length;\
    \ i += 1) {\n    const a = args[i];\n    if (a === '--lane' && args[i + 1]) {\n\
    \      out.lane = args[i + 1];\n      i += 1;\n      continue;\n    }\n    if\
    \ (a === '--message' && args[i + 1]) {\n      out.message = args[i + 1];\n   \
    \   i += 1;\n      continue;\n    }\n    if (a === '--dry-run') {\n      out.dryRun\
    \ = true;\n      continue;\n    }\n    positional.push(a);\n  }\n  out.bead =\
    \ positional[0];\n  out.target = positional[1];\n  return out;\n}\n\nfunction\
    \ buildEvent({ bead, target, lane, message }) {\n  return {\n    ts: new Date().toISOString(),\n\
    \    event: 'bead.lifecycle',\n    type: 'sling',\n    stage: 'in_progress',\n\
    \    bead,\n    lane,\n    target,\n    message: message || '',\n    rig: TD_RIG,\n\
    \    role: TD_ACTOR,\n    source: 'td-sling',\n    policy: 'superdome'\n  };\n\
    }\n\nasync function emitKafka(evt) {\n  const kafka = new Kafka({ clientId: 'tundra-td-sling',\
    \ brokers: BROKERS });\n  const producer = kafka.producer();\n  await producer.connect();\n\
    \n  const laneTopic = `${TOPIC_LANE_PREFIX}-${evt.lane}-beads`;\n  const payload\
    \ = JSON.stringify(evt);\n  await producer.send({\n    topic: TOPIC_WORK,\n  \
    \  messages: [{ value: payload }]\n  });\n  await producer.send({\n    topic:\
    \ TOPIC_AUDIT,\n    messages: [{ value: payload }]\n  });\n  await producer.send({\n\
    \    topic: laneTopic,\n    messages: [{ value: payload }]\n  });\n  await producer.send({\n\
    \    topic: TOPIC_IN_PROGRESS,\n    messages: [{ value: payload }]\n  });\n\n\
    \  await producer.disconnect();\n}\n\nfunction execGT(bead, target) {\n  if (!bead)\
    \ return;\n  if (TD_DRY_RUN) return;\n  if (target) {\n    execFileSync(GT_CMD,\
    \ ['sling', bead, target], { stdio: 'ignore' });\n    return;\n  }\n  execFileSync(GT_CMD,\
    \ ['sling', bead], { stdio: 'ignore' });\n}\n\nasync function run() {\n  const\
    \ args = parseArgs(process.argv);\n  if (!args.bead) {\n    console.error('Usage:\
    \ td sling <bead-id> [target] [--lane <lane>] [--message <msg>] [--dry-run]');\n\
    \    process.exit(2);\n  }\n  const lane = (args.lane || TD_LANE_DEFAULT || 'standard').toLowerCase();\n\
    \  const evt = buildEvent({ bead: args.bead, target: args.target, lane, message:\
    \ args.message });\n\n  sendMetric('tundra.td_sling.invoked', 1, [`lane:${lane}`]);\n\
    \  await emitKafka(evt);\n  sendMetric('tundra.td_sling.emitted', 1, [`lane:${lane}`]);\n\
    \n  execGT(args.bead, args.target);\n}\n\nrun().catch((err) => {\n  console.error('td-sling\
    \ error', err);\n  process.exit(1);\n});\n"
