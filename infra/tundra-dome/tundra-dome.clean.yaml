    \ '';\n}\n\nasync function run() {\n  const state = loadState();\n  const buf\
    \ = fs.readFileSync(EVENTS_PATH);\n  const offset = state.offset || 0;\n  if (offset\
    \ >= buf.length) return;\n\n  const lines = buf.slice(offset).toString('utf8').split('\\\
    n').filter(Boolean);\n  const nextOffset = buf.length;\n  if (!lines.length) {\n\
    \    saveState(nextOffset);\n    return;\n  }\n\n  const kafka = new Kafka({ clientId:\
    \ 'gastown-bead-emitter', brokers: BROKERS });\n  const producer = kafka.producer();\n\
    \  await producer.connect();\n\n  const messages = [];\n\n  for (const line of\
    \ lines) {\n    let evt;\n    try {\n      evt = JSON.parse(line);\n    } catch\
    \ {\n      continue;\n    }\n    const evtType = evt.type;\n    if (!beadEvents.has(evtType))\
    \ continue;\n\n    const actor = evt.actor || '';\n    const payload = evt.payload\
    \ || {};\n    const rig = inferRig(actor, payload);\n    const role = inferRole(actor);\n\
    \    const stage = stageForEvent(evtType);\n    const bead = payload.bead || '';\n\
    \n    for (const service of SERVICES) {\n      const value = JSON.stringify({\n\
    \        ts: evt.ts,\n        type: evtType,\n        bead,\n        actor,\n\
