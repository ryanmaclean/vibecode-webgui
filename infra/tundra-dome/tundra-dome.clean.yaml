apiVersion: v1
data:
  tundra_dome_integrations.py: "from __future__ import annotations\n\nfrom datetime\
    \ import datetime\nfrom airflow import DAG\nfrom airflow.providers.standard.operators.bash\
    \ import BashOperator\n\n\ndefault_args = {\"owner\": \"tundra\", \"retries\"\
    : 0}\n\nwith DAG(\n    dag_id=\"tundra_dome_integrations\",\n    description=\"\
    Coordinate Gas Town + OpenClaw + OpenCode + OpenRouter (placeholders)\",\n   \
    \ schedule=\"*/10 * * * *\",\n    start_date=datetime(2026, 2, 1),\n    catchup=False,\n\
    \    default_args=default_args,\n    tags=[\"tundra\", \"gastown\", \"openclaw\"\
    , \"opencode\", \"openrouter\"],\n) as dag:\n    BashOperator(\n        task_id=\"\
    gastown_tick\",\n        bash_command=\"echo 'tundra dome: gastown tick'\",\n\
    \    )\n\n    BashOperator(\n        task_id=\"openclaw_tick\",\n        bash_command=\"\
    echo 'tundra dome: openclaw tick'\",\n    )\n\n    BashOperator(\n        task_id=\"\
    opencode_tick\",\n        bash_command=\"echo 'tundra dome: opencode tick'\",\n\
    \    )\n\n    BashOperator(\n        task_id=\"openrouter_tick\",\n        bash_command=\"\
    echo 'tundra dome: openrouter tick'\",\n    )\n"
  tundra_dome_kafka.py: "from __future__ import annotations\n\nfrom datetime import\
    \ datetime\nimport json\nimport os\n\nfrom airflow import DAG\nfrom airflow.providers.standard.operators.python\
    \ import PythonOperator\n\n\ndef emit_bead_event() -> None:\n    # Import inside\
    \ task to avoid DagBag import-time Kafka dependency/timeout\n    from kafka import\
    \ KafkaProducer\n    brokers = os.environ.get(\"KAFKA_BROKERS\", \"localhost:9092\"\
    ).split(\",\")\n    topic = os.environ.get(\"KAFKA_TOPIC\", \"tundra-beads-created\"\
    )\n    payload = {\n        \"ts\": datetime.utcnow().isoformat() + \"Z\",\n \
    \       \"type\": \"hook\",\n        \"bead\": f\"tundra-{int(datetime.utcnow().timestamp())}\"\
    ,\n        \"actor\": \"tundra/airflow\",\n        \"payload\": {\"source\": \"\
