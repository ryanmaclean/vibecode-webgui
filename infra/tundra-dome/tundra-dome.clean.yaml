    ENV_FILE=\"$DIR/td-sling.env\"\n\nif [ -f \"$ENV_FILE\" ]; then\n  set -a\n  .\
    \ \"$ENV_FILE\"\n  set +a\nfi\n\nnode \"$DIR/td-sling.js\" \"$@\"\n"
  tundra-observer.js: "'use strict';\n\nrequire('dd-trace').init({\n  service: process.env.DD_SERVICE\
    \ || 'tundra-observer',\n  env: process.env.DD_ENV || 'local',\n  version: process.env.DD_VERSION\
    \ || '0.1.0',\n  logInjection: true\n});\n\nconst fs = require('fs');\nconst crypto\
    \ = require('crypto');\nconst https = require('https');\nconst { Kafka } = require('kafkajs');\n\
    \n// Clamp negative timeouts to avoid Node TimeoutNegativeWarning noise.\nconst\
    \ _setTimeout = global.setTimeout;\nglobal.setTimeout = (fn, ms, ...args) => _setTimeout(fn,\
    \ Math.max(0, Number(ms) || 0), ...args);\n\nconst BROKERS = (process.env.KAFKA_BROKERS\
    \ || 'localhost:9092').split(',');\nconst TOPICS = (process.env.OBSERVER_TOPICS\
    \ || '').split(',').map((t) => t.trim()).filter(Boolean);\nconst GROUP_ID = process.env.OBSERVER_GROUP_ID\
    \ || 'tundra-observer';\nconst OUT_PATH = process.env.OBSERVER_LOG || '/Users/studio/gt/logs/tundra-observer.jsonl';\n\
    const RULES_PATH = process.env.OBSERVER_RULES || '/Users/studio/gt/settings/observer-rules.json';\n\
    const DD_CFG = process.env.OBSERVER_DD_CONFIG || '/Users/studio/gt/settings/observer-dd-metrics.json';\n\
    const SCHEMA_QUARANTINE_TOPIC = process.env.OBSERVER_SCHEMA_QUARANTINE_TOPIC ||\
    \ 'tundra-beads-failed';\nconst DD_API_KEY = process.env.DD_API_KEY || '';\nconst\
    \ DD_APP_KEY = process.env.DD_APP_KEY || '';\nconst DD_SITE = process.env.DD_SITE\
    \ || 'datadoghq.com';\nconst DD_AGENT_HOST = process.env.DD_AGENT_HOST || '127.0.0.1';\n\
    const DD_DOGSTATSD_PORT = Number(process.env.DD_DOGSTATSD_PORT || 8125);\nconst\
    \ DD_ENV = process.env.DD_ENV || 'local';\nconst DD_SERVICE = process.env.DD_SERVICE\
    \ || 'tundra-observer';\nconst DD_TAGS = (process.env.DD_TAGS || '').split(',').map((t)\
    \ => t.trim()).filter(Boolean);\n\nfunction loadJson(path, fallback) {\n  try\
    \ {\n    return JSON.parse(fs.readFileSync(path, 'utf8'));\n  } catch {\n    return\
    \ fallback;\n  }\n}\n\nconst rules = loadJson(RULES_PATH, { topics: [], allow_event_types:\
    \ [], redact: { max_len: 280, hash_private_body: true, strip_code: true } });\n\
    const ddConfig = loadJson(DD_CFG, { interval_sec: 120, queries: [] });\n\nfunction\
    \ hashText(text) {\n  return crypto.createHash('sha256').update(text).digest('hex');\n\
    }\n\nfunction stripCode(text) {\n  if (!text) return text;\n  return text.replace(/```[\\\
    s\\S]*?```/g, '[code]').replace(/`[^`]*`/g, '[code]');\n}\n\nfunction redactText(text)\
    \ {\n  if (!text) return '';\n  let output = String(text);\n  if (rules.redact\
    \ && rules.redact.strip_code) {\n    output = stripCode(output);\n  }\n  output\
    \ = output.replace(/(sk-[a-zA-Z0-9]{20,})/g, '[redacted]');\n  output = output.replace(/(ghp_[a-zA-Z0-9]{20,})/g,\
    \ '[redacted]');\n  const maxLen = rules.redact && rules.redact.max_len ? rules.redact.max_len\
    \ : 280;\n  if (output.length > maxLen) output = output.slice(0, maxLen) + '\u2026\
    ';\n  return output;\n}\n\nfunction summarize(evt) {\n  const summary = {\n  \
    \  ts: evt.ts || new Date().toISOString(),\n    type: evt.type || evt.event ||\
    \ 'unknown',\n    lane: evt.lane,\n    severity: evt.severity,\n    bead: evt.bead,\n\
    \    issue: evt.issue && (evt.issue.id || evt.issue.number),\n    role: evt.role,\n\
    \    rig: evt.rig,\n    source: evt.source,\n    schema_name: evt.schema_name\
    \ || (evt.schema && evt.schema.name),\n    schema_id: evt.schema_id || (evt.schema\
    \ && evt.schema.id),\n    schema_version: evt.schema_version || (evt.schema &&\
    \ evt.schema.version),\n    schema_status: evt.schema_status\n  };\n\n  const\
    \ body = evt.body || evt.message || evt.description || '';\n  const isPrivate\
    \ = evt.type === 'private' || evt.visibility === 'private' || evt.topic === 'tundra-chat-private';\n\
    \  if (isPrivate && rules.redact && rules.redact.hash_private_body) {\n    summary.body_hash\
    \ = hashText(String(body));\n  } else if (body) {\n    summary.body = redactText(body);\n\
    \  }\n\n  return summary;\n}\n\nfunction isSchemaError(evt) {\n  if (evt.schema_error\
    \ === true) return true;\n  if (evt.schema_status && String(evt.schema_status).toLowerCase()\
    \ === 'error') return true;\n  const type = String(evt.type || evt.event || '').toLowerCase();\n\
    \  if (type === 'schema_error' || type === 'schema.invalid') return true;\n  return\
