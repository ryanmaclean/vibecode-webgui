data:
  bd-kafka-producer.js: "'use strict';\n\nrequire('dd-trace').init({\n  service: process.env.DD_SERVICE\
    \ || 'gastown-bd-producer',\n  env: process.env.DD_ENV || 'local',\n  version:\
    \ process.env.DD_VERSION || '0.1.0',\n  logInjection: true\n});\n\nconst { execFileSync\
    \ } = require('child_process');\nconst { Kafka } = require('kafkajs');\nconst\
    \ fs = require('fs');\n\nconst BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');\n\
    const TOPIC = process.env.KAFKA_TOPIC || 'tundra-beads-created';\nconst STATE_PATH\
    \ = process.env.BD_SYNC_STATE || '/Users/studio/gt/daemon/bd-kafka-producer.state.json';\n\
    \nfunction loadState() {\n  try {\n    return JSON.parse(fs.readFileSync(STATE_PATH,\
    \ 'utf8'));\n  } catch {\n    return { last: {} };\n  }\n}\n\nfunction saveState(state)\
    \ {\n  fs.writeFileSync(STATE_PATH, JSON.stringify(state));\n}\n\nfunction fetchReady()\
    \ {\n  const out = execFileSync('bd', ['ready', '--json'], { encoding: 'utf8'\
    \ });\n  return JSON.parse(out);\n}\n\nasync function run() {\n  const state =\
    \ loadState();\n  const ready = fetchReady();\n\n  const kafka = new Kafka({ clientId:\
    \ 'gastown-bd-producer', brokers: BROKERS });\n  const producer = kafka.producer();\n\
    \  await producer.connect();\n\n  const messages = [];\n  for (const issue of\
    \ ready) {\n    const id = issue.id || issue.bead || issue.key;\n    if (!id)\
    \ continue;\n    const fingerprint = JSON.stringify(issue);\n    if (state.last[id]\
    \ === fingerprint) continue;\n    state.last[id] = fingerprint;\n    messages.push({\n\
    \      value: JSON.stringify({\n        event: 'bd.ready',\n        ts: new Date().toISOString(),\n\
    \        issue\n      })\n    });\n  }\n\n  if (messages.length) {\n    await\
    \ producer.send({ topic: TOPIC, messages });\n  }\n\n  await producer.disconnect();\n\
    \  saveState(state);\n}\n\nrun().catch((err) => {\n  console.error('bd-kafka-producer\
    \ error', err);\n  process.exit(1);\n});\n"
  bd-kafka-producer.sh: '#!/bin/zsh

