    \ JSON.parse(value);\n      } catch {\n        return;\n      }\n      evt.topic\
    \ = topic;\n      if (!shouldProcess(evt)) return;\n      if (isSchemaError(evt))\
    \ {\n        await quarantineSchema(evt, producer);\n      }\n      const summary\
    \ = summarize(evt);\n      writeLog(summary);\n      sendMetric('tundra.observer.processed',\
    \ 1, [`topic:${topic}`]);\n    }\n  });\n}\n\nrun().catch((err) => {\n  console.error('tundra-observer\
    \ error', err);\n  process.exit(1);\n});\n"
