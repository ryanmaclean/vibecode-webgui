apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '4'
  name: airflow-api-server
  namespace: tundra-dome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-api-server
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: airflow-api-server
    spec:
      containers:
      - command:
        - airflow
        - webserver
        - --port
        - '8080'
        env:
        - name: AIRFLOW_HOME
          value: /opt/airflow
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: sqlite:////opt/airflow/airflow.db
        - name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS
          value: tundra:admin
        - name: AIRFLOW__METRICS__STATSD_ON
          value: 'True'
        - name: AIRFLOW__METRICS__STATSD_HOST
          value: datadog-agent.datadog.svc.cluster.local
        - name: AIRFLOW__METRICS__STATSD_PORT
          value: '8125'
        - name: AIRFLOW__METRICS__STATSD_PREFIX
          value: airflow
        - name: OPENLINEAGE__TRANSPORT__TYPE
          value: datadog
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              key: DD_API_KEY
              name: tundra-dome-secrets
              optional: true
        - name: DD_SITE
          value: datadoghq.com
        - name: OPENLINEAGE_NAMESPACE
          value: kind
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              key: DD_API_KEY
              name: tundra-dome-secrets
              optional: true
        - name: DD_SITE
          value: datadoghq.com
        - name: DD_SERVICE
          value: tundra-airflow-api
        - name: DD_ENV
          value: kind
        - name: DD_VERSION
          value: 0.1.0
        - name: DD_TAGS
          value: rig:mbp_m1,service:airflow-api,cluster:tundra-dome
        - name: OPENLINEAGE__TRANSPORT__TYPE
          value: datadog
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              key: DD_API_KEY
              name: tundra-dome-secrets
              optional: true
        - name: DD_SITE
          value: datadoghq.com
        - name: OPENLINEAGE_NAMESPACE
          value: kind
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              key: DD_API_KEY
              name: tundra-dome-secrets
              optional: true
        - name: DD_SITE
          value: datadoghq.com
        image: apache/airflow:2.8.0
        imagePullPolicy: IfNotPresent
        name: api-server
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 512Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/airflow
          name: airflow-home
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - sh
        - -c
        - airflow db init && airflow users create --username tundra --password admin
          --firstname Tundra --lastname Dome --role Admin --email tundra@example.com
          || true
        env:
        - name: AIRFLOW_HOME
          value: /opt/airflow
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          value: sqlite:////opt/airflow/airflow.db
        image: apache/airflow:2.8.0
        imagePullPolicy: IfNotPresent
        name: init-db
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/airflow
          name: airflow-home
      - command:
        - sh
        - -c
        - pip install --user apache-airflow-providers-openlineage>=2.7.3 && cp -r
          /root/.local/lib/python3.*/site-packages/* /opt/airflow/ 2>/dev/null ||
          true
        image: apache/airflow:2.8.0
        imagePullPolicy: IfNotPresent
        name: install-openlineage
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /opt/airflow
          name: airflow-home
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: airflow-home
---
