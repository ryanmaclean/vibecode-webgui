    \ require('fs');\nconst path = require('path');\nconst { Kafka } = require('kafkajs');\n\
    \nconst EVENTS_PATH = process.env.GT_EVENTS_PATH || '/Users/studio/gt/.events.jsonl';\n\
    const STATE_PATH = process.env.GT_EVENTS_STATE || '/Users/studio/gt/daemon/gt-kafka-emitter.state.json';\n\
    const BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');\n\
    const TOPIC = process.env.KAFKA_TOPIC || 'tundra-beads-created';\nconst SERVICES\
    \ = (process.env.EMIT_SERVICES || 'gastown,openclaw')\n  .split(',')\n  .map((s)\
    \ => s.trim())\n  .filter(Boolean);\nconst RIG_DEFAULT = process.env.EMIT_RIG\
    \ || 'mbp_m1';\nconst SCHEMA_NAME = process.env.EMIT_SCHEMA_NAME || '';\nconst\
    \ SCHEMA_VERSION = process.env.EMIT_SCHEMA_VERSION || '';\nconst SCHEMA_STATUS\
    \ = process.env.EMIT_SCHEMA_STATUS || '';\n\nconst beadEvents = new Set(['hook',\
    \ 'sling', 'done', 'escalation_sent']);\n\nfunction loadState() {\n  try {\n \
    \   return JSON.parse(fs.readFileSync(STATE_PATH, 'utf8'));\n  } catch {\n   \
    \ return { offset: 0 };\n  }\n}\n\nfunction saveState(offset) {\n  fs.writeFileSync(STATE_PATH,\
    \ JSON.stringify({ offset }));\n}\n\nfunction inferRig(actor, payload) {\n  const\
    \ rig = payload.rig || payload.rig_name;\n  if (typeof rig === 'string' && rig)\
    \ return rig;\n  if (actor.includes('/')) return actor.split('/')[0];\n  const\
    \ target = payload.target || '';\n  if (typeof target === 'string' && target.includes('/'))\
    \ return target.split('/')[0];\n  return RIG_DEFAULT;\n}\n\nfunction inferRole(actor)\
    \ {\n  if (actor === 'mayor') return 'mayor';\n  if (actor === 'deacon') return\
    \ 'deacon';\n  if (actor === 'refinery') return 'refinery';\n  if (actor === 'overseer')\
    \ return 'overseer';\n  if (actor.includes('/crew/')) return 'crew';\n  if (actor.includes('/witness')\
    \ || actor.endsWith('/witness')) return 'witness';\n  if (actor.includes('/polecats/'))\
    \ return 'polecat';\n  if (actor.includes('/')) return 'polecat';\n  return 'unknown';\n\
    }\n\nfunction stageForEvent(evtType) {\n  if (evtType === 'hook') return 'hooked';\n\
    \  if (evtType === 'sling') return 'in_progress';\n  if (evtType === 'done') return\
