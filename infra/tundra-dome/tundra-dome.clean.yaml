    \ lane: evt.lane || 'critical',\n    severity: evt.severity || 'high',\n    bead:\
    \ evt.bead,\n    rig: evt.rig,\n    role: evt.role,\n    schema_name: evt.schema_name\
    \ || (evt.schema && evt.schema.name),\n    schema_id: evt.schema_id || (evt.schema\
    \ && evt.schema.id),\n    schema_version: evt.schema_version || (evt.schema &&\
    \ evt.schema.version),\n    message: evt.message || evt.description || 'Schema\
    \ error detected',\n    original_event: evt.event || evt.type\n  };\n  await producer.send({\
    \ topic: SCHEMA_QUARANTINE_TOPIC, messages: [{ value: JSON.stringify(payload)\
    \ }] });\n  sendMetric('tundra.observer.schema_quarantine', 1, [`topic:${SCHEMA_QUARANTINE_TOPIC}`]);\n\
    }\n\nfunction shouldProcess(evt) {\n  if (rules.allow_event_types && rules.allow_event_types.length)\
    \ {\n    const type = evt.type || evt.event || '';\n    if (!rules.allow_event_types.includes(type))\
    \ return false;\n  }\n  return true;\n}\n\nfunction writeLog(entry) {\n  fs.appendFileSync(OUT_PATH,\
    \ JSON.stringify(entry) + '\\n');\n}\n\nfunction metricLine(name, value, tags)\
    \ {\n  const tagStr = tags && tags.length ? `|#${tags.join(',')}` : '';\n  return\
    \ `${name}:${value}|c${tagStr}`;\n}\n\nfunction sendMetric(name, value, extraTags\
    \ = []) {\n  try {\n    const dgram = require('dgram');\n    const client = dgram.createSocket('udp4');\n\
    \    const tags = [`env:${DD_ENV}`, `service:${DD_SERVICE}`, ...DD_TAGS, ...extraTags];\n\
    \    const line = metricLine(name, value, tags);\n    client.send(Buffer.from(line),\
    \ DD_DOGSTATSD_PORT, DD_AGENT_HOST, () => client.close());\n  } catch {\n    //\
    \ ignore metric errors\n  }\n}\n\nfunction ddQuery(query, fromMs, toMs) {\n  if\
    \ (!DD_API_KEY || !DD_APP_KEY) return Promise.resolve(null);\n  const params =\
    \ new URLSearchParams({ from: String(Math.floor(fromMs / 1000)), to: String(Math.floor(toMs\
    \ / 1000)), query });\n  const url = `https://api.${DD_SITE}/api/v1/query?${params.toString()}`;\n\
    \  return new Promise((resolve) => {\n    const req = https.request(url, {\n \
    \     method: 'GET',\n      headers: {\n        'DD-API-KEY': DD_API_KEY,\n  \
    \      'DD-APPLICATION-KEY': DD_APP_KEY\n      }\n    }, (res) => {\n      let\
    \ data = '';\n      res.on('data', (chunk) => { data += chunk; });\n      res.on('end',\
    \ () => {\n        try {\n          const payload = JSON.parse(data);\n      \
    \    resolve(payload);\n        } catch {\n          resolve(null);\n        }\n\
    \      });\n    });\n    req.on('error', () => resolve(null));\n    req.end();\n\
    \  });\n}\n\nfunction evaluateResult(result) {\n  if (!result || !result.series\
    \ || !result.series.length) return null;\n  const points = result.series[0].pointlist\
    \ || [];\n  if (!points.length) return null;\n  const last = points[points.length\
    \ - 1][1];\n  return typeof last === 'number' ? last : null;\n}\n\nasync function\
    \ runDdLoop(producer) {\n  if (!ddConfig.queries || !ddConfig.queries.length)\
    \ return;\n  const interval = Math.max(30, ddConfig.interval_sec || 120);\n  setInterval(async\
    \ () => {\n    const now = Date.now();\n    for (const q of ddConfig.queries)\
    \ {\n      const result = await ddQuery(q.query, now - 15 * 60 * 1000, now);\n\
    \      const value = evaluateResult(result);\n      if (value === null) continue;\n\
    \      let triggered = false;\n      if (q.op === '>' && value > q.threshold)\
    \ triggered = true;\n      if (q.op === '>=' && value >= q.threshold) triggered\
    \ = true;\n      if (q.op === '<' && value < q.threshold) triggered = true;\n\
    \      if (q.op === '<=' && value <= q.threshold) triggered = true;\n      if\
    \ (!triggered) continue;\n\n      const payload = {\n        ts: new Date().toISOString(),\n\
    \        type: 'action',\n        action: q.action || 'nudge',\n        target:\
    \ q.target,\n        severity: q.severity,\n        lane: q.lane,\n        message:\
    \ q.message || `${q.name} threshold triggered (${value})`,\n        metric: q.name,\n\
    \        value\n      };\n\n      const topic = q.topic || 'tundra-deacon-commands';\n\
    \      await producer.send({ topic, messages: [{ value: JSON.stringify(payload)\
    \ }] });\n      writeLog({ observer: 'dd-loop', payload });\n      sendMetric('tundra.observer.dd_triggered',\
    \ 1, [`metric:${q.name}`]);\n    }\n  }, interval * 1000);\n}\n\nasync function\
    \ run() {\n  const kafka = new Kafka({ clientId: 'tundra-observer', brokers: BROKERS\
    \ });\n  const consumer = kafka.consumer({ groupId: GROUP_ID });\n  const producer\
