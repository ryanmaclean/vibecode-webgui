data:
  BRIDGE_DRY_RUN: 'false'
  DD_AGENT_HOST: datadog-agent.datadog.svc.cluster.local
  DD_DOGSTATSD_PORT: '8125'
  DD_ENV: kind
  DD_SERVICE: tundra-observer
  DD_SITE: datadoghq.com
  KAFKA_BROKERS: kafka-service:9092
  KAFKA_TOPICS: tundra-work-intake,tundra-beads-created,tundra-beads-completed,tundra-polecat-commands
  OBSERVER_DD_CONFIG: /etc/tundra-dome/observer-dd-metrics.json
  OBSERVER_GROUP_ID: tundra-observer
  OBSERVER_LOG: /var/log/tundra-observer.jsonl
  OBSERVER_RULES: /etc/tundra-dome/observer-rules.json
  OBSERVER_TOPICS: tundra-work-intake,tundra-beads-created,tundra-beads-completed,tundra-polecat-commands,tundra-mayor-commands,tundra-deacon-commands
  SOURCE_TOPIC: tundra-beads-created
  TD_DEFAULT_LANE: standard
  TD_LANE_PREFIX: tundra-lane
  TD_RIG: mbp_m1
  TD_TOPIC_CREATED: tundra-beads-created
  TD_TOPIC_WORK: tundra-work-intake
kind: ConfigMap
metadata:
  name: tundra-dome-config
  namespace: tundra-dome
---
apiVersion: v1
data:
  kpi-thresholds.json: "{\n  \"beads_failed_15m\": 3,\n  \"role_activity_min_15m\"\
    : 1,\n  \"agent_churn_15m\": 1,\n  \"escalations_stale_4h\": 1,\n  \"ci_failed_15m\"\
    : 1,\n  \"mail_backlog_15m\": 5,\n  \"nudges_unanswered_15m\": 3,\n  \"convoy_stall_4h\"\
    : 1,\n  \"merge_backlog_4h\": 1\n}\n"
  observer-dd-metrics.json: "{\n  \"interval_sec\": 120,\n  \"queries\": [\n    {\n\
    \      \"name\": \"beads_failed_15m\",\n      \"query\": \"sum:last_15m:sum:gastown.beads.failed{*}\"\
    ,\n      \"op\": \">\",\n      \"threshold\": 3,\n      \"action\": \"escalate\"\
    ,\n      \"target\": \"deacon\",\n      \"severity\": \"high\",\n      \"lane\"\
    : \"critical\",\n      \"topic\": \"tundra-deacon-commands\",\n      \"message\"\
    : \"Beads failed > 3 in 15m\"\n    },\n    {\n      \"name\": \"escalations_stale_4h\"\
    ,\n      \"query\": \"sum:last_4h:sum:gastown.escalations.stale{*}\",\n      \"\
    op\": \">\",\n      \"threshold\": 0,\n      \"action\": \"escalate\",\n     \
    \ \"target\": \"mayor\",\n      \"severity\": \"critical\",\n      \"lane\": \"\
    critical\",\n      \"topic\": \"tundra-mayor-commands\",\n      \"message\": \"\
    Stale escalations > 4h\"\n    }\n  ]\n}\n"
  observer-rules.json: "{\n  \"topics\": [\n    \"tundra-chat-private\",\n    \"tundra-chat-shared\"\
    ,\n    \"tundra-chat-gossip\",\n    \"tundra-work-intake\",\n    \"tundra-audit-actions\"\
    ,\n    \"tundra-metrics-kpi\"\n  ],\n  \"allow_event_types\": [\"bead.lifecycle\"\
    , \"role.activity\", \"bead_provenance\", \"issue\", \"pr\", \"push\", \"action\"\
    , \"chat\"],\n  \"redact\": {\n    \"max_len\": 280,\n    \"hash_private_body\"\
    : true,\n    \"strip_code\": true\n  }\n}\n"
  tundra-defaults.json: "{\n  \"nat64\": {\n    \"deploy_mode\": \"per_rig\",\n  \
    \  \"binary_path\": \"plugins/tundra-nat64/bin/tundra-nat64\",\n    \"tags\":\
    \ [\"service:nat64\", \"component:tundra-nat64\"],\n    \"notes\": \"Run one shared\
    \ NAT64 gateway per rig by default.\"\n  },\n  \"sessions\": {\n    \"primary_mux\"\
    : \"tmux\",\n    \"optional_mux\": \"zellij\",\n    \"policy\": \"tmux for automation\
    \ + reconciler; zellij allowed for human operators.\"\n  },\n  \"openclaw\": {\n\
    \    \"routing\": {\n      \"critical\": \"mayor\",\n      \"escalation\": \"\
    deacon\",\n      \"default\": \"deacon\"\n    },\n    \"target\": \"\",\n    \"\
    notes\": \"Set OPENCLAW_MESSAGE_TARGET explicitly per rig.\"\n  },\n  \"gitea\"\
    : {\n    \"mbp_m1_root_url\": \"http://mbp-m1.local:3000/\",\n    \"studio_root_url\"\
    : \"http://studio.local:3000/\"\n  },\n  \"github_dispatcher\": {\n    \"dry_run\"\
    : true,\n    \"owner\": \"\",\n    \"repo\": \"\",\n    \"notes\": \"Set owner/repo/token\
    \ to enable.\"\n  },\n  \"polecats\": {\n    \"k8s_target\": \"both\"\n  },\n\
    \  \"vector\": {\n    \"placement\": \"host_and_k8s\",\n    \"private_redaction\"\
    : \"hash_body\"\n  },\n  \"skills\": {\n    \"path\": \"skills/\",\n    \"list\"\
    : [\"tundra-ops\", \"tundra-observer\", \"kafka-ops\", \"openclaw-ops\"]\n  }\n\
    }\n"
kind: ConfigMap
metadata:
  name: tundra-dome-settings
  namespace: tundra-dome
