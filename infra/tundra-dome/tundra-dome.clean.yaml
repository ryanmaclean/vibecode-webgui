apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '1'
  name: gt-kafka-consumer
  namespace: tundra-dome
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gt-kafka-consumer
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gt-kafka-consumer
    spec:
      containers:
      - command:
        - sh
        - -c
        - cp -r /app/. /work/ 2>/dev/null || cp -r /app/* /work/ && cd /work && npm
          install --production && node gt-kafka-consumer.js
        envFrom:
        - configMapRef:
            name: tundra-dome-config
        image: node:20-alpine
        imagePullPolicy: IfNotPresent
        name: consumer
        resources:
          limits:
            cpu: 250m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app
          name: code
          readOnly: true
        - mountPath: /work
          name: work
        workingDir: /work
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - configMap:
          defaultMode: 420
          name: kafka-dsm-code
        name: code
      - emptyDir: {}
        name: work
