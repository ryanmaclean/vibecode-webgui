apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: playbooks.tundra.dome
  labels:
    tundra.dome/component: crd
    tundra.dome/primitive: playbook
spec:
  group: tundra.dome
  names:
    kind: Playbook
    listKind: PlaybookList
    plural: playbooks
    singular: playbook
    shortNames:
      - pb
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - dagId
                - errands
              properties:
                dagId:
                  type: string
                  description: Airflow DAG ID
                displayName:
                  type: string
                  description: Human-readable name
                description:
                  type: string
                  description: What this playbook accomplishes
                owner:
                  type: string
                  description: Team or person responsible
                schedule:
                  type: object
                  properties:
                    cron:
                      type: string
                      description: "Cron expression (e.g., '0 * * * *')"
                    interval:
                      type: string
                      description: "Interval (e.g., '@hourly', '@daily')"
                    enabled:
                      type: boolean
                      default: true
                triggers:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [kafka, webhook, bead, manual]
                      kafkaTopic:
                        type: string
                      webhookPath:
                        type: string
                      beadPhase:
                        type: string
                        enum: [created, in-progress, completed, escalated, failed]
                  description: Events that trigger this playbook
                errands:
                  type: array
                  items:
                    type: object
                    required:
                      - taskId
                      - operator
                    properties:
                      taskId:
                        type: string
                        description: Airflow task ID
                      displayName:
                        type: string
                      operator:
                        type: string
                        enum: [bash, python, kafka_produce, kafka_consume, http, sql, branch, sensor]
                      command:
                        type: string
                        description: For bash operator
                      pythonCallable:
                        type: string
                        description: For python operator (module:function)
                      dependencies:
                        type: array
                        items:
                          type: string
                        description: Task IDs this errand depends on
                      retries:
                        type: integer
                        default: 2
                      timeout:
                        type: string
                        default: "10m"
                      pool:
                        type: string
                        description: Airflow pool (Guild) to use
                defaultArgs:
                  type: object
                  additionalProperties:
                    type: string
                  description: Default arguments for all errands
                lanes:
                  type: array
                  items:
                    type: string
                    enum: [critical, standard, experimental]
                  description: Lanes this playbook operates on
                tags:
                  type: array
                  items:
                    type: string
                  description: Tags for organization
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [active, paused, error]
                dagSynced:
                  type: boolean
                  description: Whether DAG is synced to Airflow
                lastSyncTime:
                  type: string
                  format: date-time
                lastRunTime:
                  type: string
                  format: date-time
                lastRunStatus:
                  type: string
                  enum: [success, failed, running]
                runsTotal:
                  type: integer
                runsSuccess:
                  type: integer
                runsFailed:
                  type: integer
                avgDuration:
                  type: string
                nextScheduledRun:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: DAG
          type: string
          jsonPath: .spec.dagId
        - name: Schedule
          type: string
          jsonPath: .spec.schedule.cron
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Last-Run
          type: string
          jsonPath: .status.lastRunStatus
        - name: Success-Rate
          type: string
          jsonPath: .status.runsSuccess
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
