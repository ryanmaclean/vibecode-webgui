apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: errands.tundra.dome
  labels:
    tundra.dome/component: crd
    tundra.dome/primitive: errand
spec:
  group: tundra.dome
  names:
    kind: Errand
    listKind: ErrandList
    plural: errands
    singular: errand
    shortNames:
      - er
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - taskId
                - playbookRef
              properties:
                taskId:
                  type: string
                  description: Airflow task ID
                playbookRef:
                  type: string
                  description: Reference to parent Playbook (DAG)
                runId:
                  type: string
                  description: DAG run ID
                beadRef:
                  type: string
                  description: Reference to Bead being processed (if any)
                operator:
                  type: string
                  enum: [bash, python, kafka_produce, kafka_consume, http, sql, branch, sensor, unknown]
                  default: unknown
                displayName:
                  type: string
                description:
                  type: string
                inputs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      type:
                        type: string
                  description: Input datasets (OpenLineage facets)
                outputs:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                      type:
                        type: string
                  description: Output datasets (OpenLineage facets)
                retries:
                  type: integer
                  default: 0
                maxRetries:
                  type: integer
                  default: 2
                timeout:
                  type: string
                  default: "10m"
                pool:
                  type: string
                  description: Airflow pool (Guild) used
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [pending, queued, running, success, failed, skipped, upstream_failed, retry]
                  default: pending
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                duration:
                  type: string
                  description: Human-readable duration (e.g., "2m30s")
                durationSeconds:
                  type: number
                attempt:
                  type: integer
                  default: 1
                errorMessage:
                  type: string
                logUrl:
                  type: string
                  description: URL to task logs
                traceId:
                  type: string
                  description: Datadog trace ID
                openlineageRunId:
                  type: string
                  description: OpenLineage run ID for this task
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Playbook
          type: string
          jsonPath: .spec.playbookRef
        - name: Task
          type: string
          jsonPath: .spec.taskId
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Duration
          type: string
          jsonPath: .status.duration
        - name: Attempt
          type: integer
          jsonPath: .status.attempt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
