apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: polecats.tundra.dome
  labels:
    tundra.dome/component: crd
    tundra.dome/primitive: polecat
spec:
  group: tundra.dome
  names:
    kind: Polecat
    listKind: PolecatList
    plural: polecats
    singular: polecat
    shortNames:
      - pc
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - role
                - image
              properties:
                role:
                  type: string
                  enum: [polecat, mayor, deacon, reaper, witness, overseer]
                  description: The role this polecat fulfills
                image:
                  type: string
                  description: Container image for this polecat
                replicas:
                  type: integer
                  default: 1
                  minimum: 0
                  description: Number of polecat instances (creates a Crew)
                lanes:
                  type: array
                  items:
                    type: string
                    enum: [critical, standard, experimental]
                  description: Lanes this polecat will service
                skills:
                  type: array
                  items:
                    type: string
                  description: Capabilities/skills this polecat has
                kafkaTopics:
                  type: object
                  properties:
                    consume:
                      type: array
                      items:
                        type: string
                      description: Topics to consume from
                    produce:
                      type: array
                      items:
                        type: string
                      description: Topics to produce to
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                    limits:
                      type: object
                      properties:
                        cpu:
                          type: string
                        memory:
                          type: string
                env:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      valueFrom:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                concurrency:
                  type: integer
                  default: 1
                  description: Max beads to process concurrently
                heartbeatInterval:
                  type: string
                  default: "30s"
                  description: Interval for health heartbeats
                retryPolicy:
                  type: object
                  properties:
                    maxAttempts:
                      type: integer
                      default: 3
                    backoffMultiplier:
                      type: number
                      default: 2.0
                    initialDelay:
                      type: string
                      default: "1s"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [pending, running, degraded, failed]
                readyReplicas:
                  type: integer
                availableReplicas:
                  type: integer
                lastHeartbeat:
                  type: string
                  format: date-time
                beadsProcessed:
                  type: integer
                beadsInProgress:
                  type: integer
                currentBeads:
                  type: array
                  items:
                    type: string
                  description: Names of beads currently being processed
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.readyReplicas
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .spec.role
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Processed
          type: integer
          jsonPath: .status.beadsProcessed
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
