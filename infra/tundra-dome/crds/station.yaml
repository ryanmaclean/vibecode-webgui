apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stations.tundra.dome
  labels:
    tundra.dome/component: crd
    tundra.dome/primitive: station
spec:
  group: tundra.dome
  names:
    kind: Station
    listKind: StationList
    plural: stations
    singular: station
    shortNames:
      - st
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum: [kafka, http, grpc, redis, postgres, external]
                  description: Type of station
                displayName:
                  type: string
                host:
                  type: string
                  description: Hostname or service name
                port:
                  type: integer
                  description: Port number
                protocol:
                  type: string
                  enum: [tcp, udp, http, https, grpc]
                  default: tcp
                selector:
                  type: object
                  additionalProperties:
                    type: string
                  description: Pod selector for the backing service
                externalName:
                  type: string
                  description: For external services
                healthCheck:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    path:
                      type: string
                      description: Health check path for HTTP
                    interval:
                      type: string
                      default: "30s"
                    timeout:
                      type: string
                      default: "5s"
                auth:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [none, basic, token, mtls]
                    secretRef:
                      type: string
                      description: Secret containing credentials
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [healthy, degraded, unhealthy, unknown]
                endpoint:
                  type: string
                  description: Resolved endpoint URL
                lastHealthCheck:
                  type: string
                  format: date-time
                healthChecksPassed:
                  type: integer
                healthChecksFailed:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
