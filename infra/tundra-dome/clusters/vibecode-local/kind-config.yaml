# Vibecode Local KIND Cluster Configuration
# Development cluster for local testing
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vibecode-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "tundra-dome/role=control-plane,tundra-dome/cluster=vibecode-local"
    extraPortMappings:
      # HTTP Service
      - containerPort: 30080
        hostPort: 8082
        protocol: TCP
      # PostgreSQL
      - containerPort: 30432
        hostPort: 5434
        protocol: TCP
networking:
  podSubnet: "10.246.0.0/16"
  serviceSubnet: "10.98.0.0/12"
