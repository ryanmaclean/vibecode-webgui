# Tundra Dome KIND Cluster Configuration
# Turnkey solution with worker node for increased capacity
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tundra-dome
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "tundra-dome/role=control-plane"
    extraPortMappings:
      # Airflow API
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Kafka
      - containerPort: 30092
        hostPort: 9092
        protocol: TCP
      # PostgreSQL
      - containerPort: 30432
        hostPort: 5432
        protocol: TCP
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "tundra-dome/role=worker"
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
