---
# Kafka Topics Initialization Job
# Creates all Tundra Dome topics on cluster startup
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-list
  namespace: tundra-dome
data:
  topics.txt: |
    # Bead Lifecycle Topics
    tundra-work-intake
    tundra-beads-created
    tundra-beads-in-progress
    tundra-beads-completed
    tundra-beads-escalated
    tundra-beads-failed
    tundra-schema-dlq
    # Lane Topics (Priority Queues)
    tundra-lane-critical-beads
    tundra-lane-standard-beads
    tundra-lane-experimental-beads
    # Role Command Topics
    tundra-mayor-commands
    tundra-deacon-commands
    tundra-polecat-commands
    tundra-reaper-commands
    tundra-witness-commands
    tundra-overseer-commands
    # Communication Topics
    tundra-nudges
    tundra-whispers
    tundra-chat-private
    tundra-chat-shared
    tundra-chat-gossip
    tundra-mail-outbox
    tundra-mail-inbox
    # Operations Topics
    tundra-polecats-events
    tundra-metrics-kpi
    tundra-audit-actions
    tundra-beads-sync-request
    tundra-beads-sync-complete
    # Gas Town Integration
    gastown-beads
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: tundra-dome
  labels:
    app: kafka-topics-init
    tundra.dome/component: init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: kafka-topics-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until nc -z kafka-service 9092; do
                echo "Kafka not ready, waiting..."
                sleep 2
              done
              echo "Kafka is ready!"
      containers:
        - name: create-topics
          image: bitnami/kafka:3.6
          command:
            - sh
            - -c
            - |
              echo "Creating Tundra Dome Kafka topics..."

              # Read topics from configmap, skip comments and empty lines
              grep -v '^#' /config/topics.txt | grep -v '^$' | while read topic; do
                echo "Creating topic: $topic"
                kafka-topics.sh --bootstrap-server kafka-service:9092 \
                  --create \
                  --if-not-exists \
                  --topic "$topic" \
                  --partitions 3 \
                  --replication-factor 1 \
                  --config retention.ms=604800000 \
                  --config cleanup.policy=delete \
                  2>/dev/null || echo "  (already exists or error)"
              done

              echo ""
              echo "Topic creation complete. Listing all topics:"
              kafka-topics.sh --bootstrap-server kafka-service:9092 --list

              echo ""
              echo "Done!"
          volumeMounts:
            - name: topics-config
              mountPath: /config
      volumes:
        - name: topics-config
          configMap:
            name: kafka-topics-list
---
# CronJob to ensure topics exist (runs daily)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kafka-topics-ensure
  namespace: tundra-dome
  labels:
    app: kafka-topics-ensure
    tundra.dome/component: maintenance
spec:
  schedule: "0 4 * * *"  # 4 AM daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: kafka-topics-ensure
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ensure-topics
              image: bitnami/kafka:3.6
              command:
                - sh
                - -c
                - |
                  echo "Ensuring Tundra Dome Kafka topics exist..."
                  grep -v '^#' /config/topics.txt | grep -v '^$' | while read topic; do
                    kafka-topics.sh --bootstrap-server kafka-service:9092 \
                      --create --if-not-exists --topic "$topic" \
                      --partitions 3 --replication-factor 1 2>/dev/null || true
                  done
                  echo "Done!"
              volumeMounts:
                - name: topics-config
                  mountPath: /config
          volumes:
            - name: topics-config
              configMap:
                name: kafka-topics-list
