image:
  repository: ghcr.io/ryanmaclean/vibecode-codeserver
  tag: latest
  pullPolicy: IfNotPresent

auth:
  password: changeme

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

workspace:
  persistentVolume:
    enabled: false
    size: 50Gi
    storageClass: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8765

nodeSelector: {}
tolerations: []
affinity: {}

sidecar:
  datadog:
    enabled: false
    image: datadog/docker-dd-agent:latest-alpine
    site: datadoghq.com
    env: development
    apiKeySecretName: datadog-secret
    config: |
      api_key: ${DD_API_KEY}
      site: datadoghq.com
      logs_enabled: true
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
