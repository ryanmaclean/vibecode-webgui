{{/*
This template creates per-user ingress for code-server instances
It should be used with Helm template functions to generate ingress for each user
*/}}
{{- define "vibecode-platform.ingress" }}
{{- $userId := .userId | required "userId is required for ingress" }}
{{- $root := .root }}
{{- if $root.Values.codeServer.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vibecode-platform.codeServerName" . }}
  namespace: {{ $root.Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.codeServerLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    vibecode.dev/user-id: {{ $userId | quote }}
    {{- with $root.Values.codeServer.ingress.annotations }}
    {{- range $key, $value := . }}
    {{ $key }}: {{ $value | replace "{USER_ID}" $userId | quote }}
    {{- end }}
    {{- end }}
    {{- if $root.Values.codeServer.ingress.security.headers }}
    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none';";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
    {{- end }}
    {{- if $root.Values.codeServer.ingress.rateLimit.enabled }}
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: {{ $root.Values.codeServer.ingress.rateLimit.rps | quote }}
    nginx.ingress.kubernetes.io/limit-connections: {{ $root.Values.codeServer.ingress.rateLimit.connections | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: {{ $root.Values.codeServer.ingress.rateLimit.burstMultiplier | quote }}
    {{- end }}
    # Request Size Limits
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $root.Values.codeServer.ingress.requestLimits.proxyBodySize | quote }}
    nginx.ingress.kubernetes.io/client-body-buffer-size: {{ $root.Values.codeServer.ingress.requestLimits.clientBodyBufferSize | quote }}
    {{- if $root.Values.codeServer.ingress.tls.hardening }}
    # TLS Hardening
    nginx.ingress.kubernetes.io/ssl-protocols: {{ $root.Values.codeServer.ingress.tls.protocols | quote }}
    nginx.ingress.kubernetes.io/ssl-ciphers: {{ $root.Values.codeServer.ingress.tls.ciphers | quote }}
    nginx.ingress.kubernetes.io/ssl-prefer-server-ciphers: "true"
    {{- end }}
    # Timeouts for long-running code-server sessions
    nginx.ingress.kubernetes.io/proxy-connect-timeout: {{ $root.Values.codeServer.ingress.timeouts.connect | quote }}
    nginx.ingress.kubernetes.io/proxy-send-timeout: {{ $root.Values.codeServer.ingress.timeouts.send | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: {{ $root.Values.codeServer.ingress.timeouts.read | quote }}
    {{- if $root.Values.codeServer.ingress.ipWhitelist }}
    # IP Whitelist
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ $root.Values.codeServer.ingress.ipWhitelist | quote }}
    {{- end }}
spec:
  {{- if $root.Values.codeServer.ingress.className }}
  ingressClassName: {{ $root.Values.codeServer.ingress.className }}
  {{- end }}
  {{- if $root.Values.codeServer.ingress.tls }}
  tls:
    {{- range $root.Values.codeServer.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | replace "{USER_ID}" $userId | quote }}
        {{- end }}
      secretName: {{ .secretName | replace "{USER_ID}" $userId | quote }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $root.Values.codeServer.ingress.hosts }}
    - host: {{ .host | replace "{USER_ID}" $userId | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                name: {{ include "vibecode-platform.codeServerName" $ }}
                port:
                  number: {{ $root.Values.codeServer.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}

{{/*
Example usage - this would typically be called from a job or external controller
For demonstration, here's how you would create an ingress for a specific user:
*/}}
{{- if .Values.examples.createSampleUser }}
{{- $context := dict "userId" "sample-user" "root" . }}
{{ include "vibecode-platform.ingress" $context }}
{{- end }}
