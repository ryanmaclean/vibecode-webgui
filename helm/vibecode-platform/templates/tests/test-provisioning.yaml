apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vibecode-platform.fullname" . }}-test-provisioning"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "vibecode-platform.serviceAccountName" . }}
  automountServiceAccountToken: true
  volumes:
  - name: tmp
    emptyDir: {}
  containers:
  - name: test-provisioning
    image: bitnami/kubectl:latest
    command: ['sh', '-c']
    env:
    - name: HOME
      value: "/tmp"
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    args:
    - |
      set -e
      # Force kubectl to use in-cluster auth explicitly
      SA_TOKEN_PATH="/var/run/secrets/kubernetes.io/serviceaccount/token"
      SA_CA_PATH="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      KCTL="kubectl --server=https://kubernetes.default.svc:443 --certificate-authority=${SA_CA_PATH} --token=$(cat ${SA_TOKEN_PATH}) --request-timeout=30s"
      echo "Waiting for Kubernetes API to become reachable..."
      for i in $(seq 1 120); do
        if ${KCTL} get --raw=/version >/dev/null 2>&1; then
          echo "✓ Kubernetes API reachable"
          break
        fi
        sleep 2
        if [ "$i" -eq 120 ]; then
          echo "❌ Kubernetes API not reachable within timeout" >&2
          exit 1
        fi
      done

      # Simple retry helper: retry <cmd...>
      retry() {
        local n=0
        local max=${RETRY_MAX:-120}
        local delay=${RETRY_DELAY:-5}
        until [ $n -ge $max ]; do
          "$@" && return 0
          n=$((n+1))
          echo "Retry $n/$max: $*" >&2
          sleep $delay
        done
        return 1
      }
      echo "Testing VibeCode Platform provisioning capabilities..."


      # Skip explicit RBAC can-i checks (can be flaky due to discovery); subsequent operations validate permissions implicitly

      # Test ConfigMap access
      echo "Testing ConfigMap access..."
      retry ${KCTL} get --raw "/api/v1/namespaces/{{ .Values.global.namespace }}/configmaps/{{ include "vibecode-platform.configMapName" . }}"
      echo "✓ ConfigMap accessible"

      # Test Secret access
      echo "Testing Secret access..."
      retry ${KCTL} get --raw "/api/v1/namespaces/{{ .Values.global.namespace }}/secrets/{{ include "vibecode-platform.secretName" . }}"
      echo "✓ Secret accessible"

      # Test ServiceAccount
      echo "Testing ServiceAccount..."
      retry ${KCTL} get --raw "/api/v1/namespaces/{{ .Values.global.namespace }}/serviceaccounts/{{ include "vibecode-platform.serviceAccountName" . }}"
      echo "✓ ServiceAccount exists"

      {{- if .Values.security.rbac.enabled }}
      # Test RBAC resources
      echo "Testing RBAC resources..."
      retry ${KCTL} get --raw "/apis/rbac.authorization.k8s.io/v1/namespaces/{{ .Values.global.namespace }}/roles/{{ include "vibecode-platform.rbacName" . }}-workspace"
      retry ${KCTL} get --raw "/apis/rbac.authorization.k8s.io/v1/namespaces/{{ .Values.global.namespace }}/rolebindings/{{ include "vibecode-platform.rbacName" . }}-workspace"
      echo "✓ RBAC resources exist"
      {{- end }}

      {{- if .Values.codeServer.persistence.enabled }}
      # Test storage class
      echo "Testing storage class..."
      retry ${KCTL} get --raw "/apis/storage.k8s.io/v1/storageclasses/{{ default .Values.global.storageClass .Values.codeServer.persistence.storageClass }}"
      echo "✓ Storage class exists"
      {{- end }}

      # Test that we can create a test PVC
      echo "Testing PVC creation..."
      cat <<EOF | retry ${KCTL} apply -f -
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: test-pvc-$RANDOM
        namespace: {{ .Values.global.namespace }}
        labels:
          app.kubernetes.io/name: {{ include "vibecode-platform.name" . }}
          app.kubernetes.io/component: test
      spec:
        accessModes:
          - {{ .Values.codeServer.persistence.accessMode }}
        resources:
          requests:
            storage: 1Gi
        storageClassName: {{ default .Values.global.storageClass .Values.codeServer.persistence.storageClass }}
      EOF
      echo "✓ PVC creation successful"

      # Cleanup test PVC
      retry ${KCTL} delete pvc -l app.kubernetes.io/component=test --namespace={{ .Values.global.namespace }}
      echo "✓ Test PVC cleaned up"

      {{- if .Values.security.networkPolicies.enabled }}
      # Test network policies
      echo "Testing network policies..."
      retry ${KCTL} get networkpolicy --namespace={{ .Values.global.namespace }}
      echo "✓ Network policies configured"
      {{- end }}

      echo "✅ All provisioning tests passed!"
