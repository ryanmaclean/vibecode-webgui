apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vibecode-platform.fullname" . }}-test-provisioning"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "vibecode-platform.serviceAccountName" . }}
  automountServiceAccountToken: true
  containers:
  - name: test-provisioning
    image: bitnami/kubectl:latest
    command: ['sh', '-c']
    env:
    - name: KUBERNETES_SERVICE_HOST
      value: "kubernetes.default.svc"
    - name: KUBERNETES_SERVICE_PORT
      value: "443"
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    args:
    - |
      set -e
      echo "Waiting for Kubernetes API to become reachable..."
      for i in $(seq 1 120); do
        if kubectl get --raw=/version >/dev/null 2>&1; then
          echo "✓ Kubernetes API reachable"
          break
        fi
        sleep 2
        if [ "$i" -eq 120 ]; then
          echo "❌ Kubernetes API not reachable within timeout" >&2
          exit 1
        fi
      done

      # Simple retry helper: retry <cmd...>
      retry() {
        local n=0
        local max=${RETRY_MAX:-120}
        local delay=${RETRY_DELAY:-5}
        until [ $n -ge $max ]; do
          "$@" && return 0
          n=$((n+1))
          echo "Retry $n/$max: $*" >&2
          sleep $delay
        done
        return 1
      }
      echo "Testing VibeCode Platform provisioning capabilities..."


      # Test RBAC permissions
      echo "Testing RBAC permissions..."
      retry kubectl --request-timeout=10s auth can-i get pods --namespace={{ .Values.global.namespace }}
      retry kubectl --request-timeout=10s auth can-i create deployments --namespace={{ .Values.global.namespace }}
      retry kubectl --request-timeout=10s auth can-i create services --namespace={{ .Values.global.namespace }}
      retry kubectl --request-timeout=10s auth can-i create persistentvolumeclaims --namespace={{ .Values.global.namespace }}
      echo "✓ RBAC permissions verified"

      # Test ConfigMap access
      echo "Testing ConfigMap access..."
      retry kubectl --request-timeout=10s get configmap {{ include "vibecode-platform.configMapName" . }} --namespace={{ .Values.global.namespace }}
      echo "✓ ConfigMap accessible"

      # Test Secret access
      echo "Testing Secret access..."
      retry kubectl --request-timeout=10s get secret {{ include "vibecode-platform.secretName" . }} --namespace={{ .Values.global.namespace }}
      echo "✓ Secret accessible"

      # Test ServiceAccount
      echo "Testing ServiceAccount..."
      retry kubectl --request-timeout=10s get serviceaccount {{ include "vibecode-platform.serviceAccountName" . }} --namespace={{ .Values.global.namespace }}
      echo "✓ ServiceAccount exists"

      {{- if .Values.security.rbac.enabled }}
      # Test RBAC resources
      echo "Testing RBAC resources..."
      retry kubectl --request-timeout=10s get role {{ include "vibecode-platform.rbacName" . }}-workspace --namespace={{ .Values.global.namespace }}
      retry kubectl --request-timeout=10s get rolebinding {{ include "vibecode-platform.rbacName" . }}-workspace --namespace={{ .Values.global.namespace }}
      echo "✓ RBAC resources exist"
      {{- end }}

      {{- if .Values.codeServer.persistence.enabled }}
      # Test storage class
      echo "Testing storage class..."
      retry kubectl --request-timeout=10s get storageclass {{ default .Values.global.storageClass .Values.codeServer.persistence.storageClass }}
      echo "✓ Storage class exists"
      {{- end }}

      # Test that we can create a test PVC
      echo "Testing PVC creation..."
      cat <<EOF | retry kubectl --request-timeout=10s apply -f -
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: test-pvc-$RANDOM
        namespace: {{ .Values.global.namespace }}
        labels:
          app.kubernetes.io/name: {{ include "vibecode-platform.name" . }}
          app.kubernetes.io/component: test
      spec:
        accessModes:
          - {{ .Values.codeServer.persistence.accessMode }}
        resources:
          requests:
            storage: 1Gi
        storageClassName: {{ default .Values.global.storageClass .Values.codeServer.persistence.storageClass }}
      EOF
      echo "✓ PVC creation successful"

      # Cleanup test PVC
      retry kubectl --request-timeout=10s delete pvc -l app.kubernetes.io/component=test --namespace={{ .Values.global.namespace }}
      echo "✓ Test PVC cleaned up"

      {{- if .Values.security.networkPolicies.enabled }}
      # Test network policies
      echo "Testing network policies..."
      retry kubectl --request-timeout=10s get networkpolicy --namespace={{ .Values.global.namespace }}
      echo "✓ Network policies configured"
      {{- end }}

      echo "✅ All provisioning tests passed!"
