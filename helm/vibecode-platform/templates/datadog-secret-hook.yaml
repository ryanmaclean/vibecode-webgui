{{- if .Values.datadog.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vibecode-platform.fullname" . }}-datadog-secret-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-setup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "vibecode-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: secret-setup
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "vibecode-platform.serviceAccountName" . }}-secret-manager
      containers:
      - name: secret-setup
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: NAMESPACE
          value: {{ .Release.Namespace }}
        - name: DD_API_KEY
          value: {{ .Values.datadog.datadog.apiKey | quote }}
        - name: DD_POSTGRES_PASSWORD
          value: {{ .Values.database.postgresql.auth.datadogPassword | quote }}
        - name: DD_POSTGRES_USER
          value: {{ default "datadog" .Values.database.postgresql.auth.datadogUser | quote }}
        - name: DATADOG_POSTGRES_PASSWORD
          value: {{ .Values.database.postgresql.auth.datadogPassword | quote }}
        - name: POSTGRES_PASSWORD  
          value: {{ .Values.database.postgresql.auth.postgresPassword | quote }}
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "🔐 Setting up Datadog secrets for namespace: $NAMESPACE"
          
          # Create canonical secret 'datadog-secret'
          if ! kubectl get secret datadog-secret -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "📝 Creating datadog-secret..."
            kubectl create secret generic datadog-secret \
              --from-literal=api-key="$DD_API_KEY" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl label secret datadog-secret \
              app.kubernetes.io/managed-by=Helm \
              app.kubernetes.io/instance={{ .Release.Name }} \
              app.kubernetes.io/version={{ .Chart.AppVersion }} \
              --namespace="$NAMESPACE"
            echo "✅ datadog-secret created successfully"
          else
            echo "ℹ️  datadog-secret already exists, updating..."
            kubectl patch secret datadog-secret \
              --patch="{\"data\":{\"api-key\":\"$(echo -n \"$DD_API_KEY\" | base64 | tr -d '\n')\"}}" \
              --namespace="$NAMESPACE"
            echo "✅ datadog-secret updated successfully"  
          fi

          # Maintain legacy alias 'datadog-secrets' for backward compatibility
          if ! kubectl get secret datadog-secrets -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "📝 Creating legacy alias datadog-secrets..."
            kubectl create secret generic datadog-secrets \
              --from-literal=api-key="$DD_API_KEY" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl label secret datadog-secrets \
              app.kubernetes.io/managed-by=Helm \
              app.kubernetes.io/instance={{ .Release.Name }} \
              app.kubernetes.io/version={{ .Chart.AppVersion }} \
              --namespace="$NAMESPACE"
            echo "✅ legacy alias datadog-secrets created successfully"
          else
            echo "ℹ️  legacy alias datadog-secrets exists, updating to match..."
            kubectl patch secret datadog-secrets \
              --patch="{\"data\":{\"api-key\":\"$(echo -n \"$DD_API_KEY\" | base64 | tr -d '\n')\"}}" \
              --namespace="$NAMESPACE"
            echo "✅ legacy alias datadog-secrets updated successfully"  
          fi
          
          # Create postgres-credentials if it doesn't exist
          # Prefer DD_POSTGRES_PASSWORD; fall back to legacy DATADOG_POSTGRES_PASSWORD
          if [ -n "$DD_POSTGRES_PASSWORD" ] && [ -n "$DATADOG_POSTGRES_PASSWORD" ] && [ "$DD_POSTGRES_PASSWORD" != "$DATADOG_POSTGRES_PASSWORD" ]; then
            echo "⚠️  Both DD_POSTGRES_PASSWORD and DATADOG_POSTGRES_PASSWORD are set and differ; using DD_POSTGRES_PASSWORD"
          fi
          DB_DD_PASSWORD="${DD_POSTGRES_PASSWORD:-$DATADOG_POSTGRES_PASSWORD}"
          DB_DD_USER="${DD_POSTGRES_USER:-datadog}"
          if ! kubectl get secret postgres-credentials -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "📝 Creating postgres-credentials..."
            kubectl create secret generic postgres-credentials \
              --from-literal=postgres-password="$POSTGRES_PASSWORD" \
              --from-literal=datadog-username="$DB_DD_USER" \
              --from-literal=datadog-password="$DB_DD_PASSWORD" \
              --namespace="$NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl label secret postgres-credentials \
              app.kubernetes.io/managed-by=Helm \
              app.kubernetes.io/instance={{ .Release.Name }} \
              app.kubernetes.io/version={{ .Chart.AppVersion }} \
              --namespace="$NAMESPACE"
            echo "✅ postgres-credentials created successfully"
          else
            echo "ℹ️  postgres-credentials already exists, updating..."
            kubectl patch secret postgres-credentials \
              --patch="{\"data\":{\"postgres-password\":\"$(echo -n \"$POSTGRES_PASSWORD\" | base64 | tr -d '\n')\",\"datadog-username\":\"$(echo -n \"$DB_DD_USER\" | base64 | tr -d '\n')\",\"datadog-password\":\"$(echo -n \"$DB_DD_PASSWORD\" | base64 | tr -d '\n')\"}}" \
              --namespace="$NAMESPACE"
            echo "✅ postgres-credentials updated successfully"
          fi
          
          echo "🎉 All secrets configured successfully!"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vibecode-platform.serviceAccountName" . }}-secret-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-setup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vibecode-platform.fullname" . }}-secret-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-setup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vibecode-platform.fullname" . }}-secret-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: secret-setup
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
subjects:
- kind: ServiceAccount
  name: {{ include "vibecode-platform.serviceAccountName" . }}-secret-manager
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "vibecode-platform.fullname" . }}-secret-manager
  apiGroup: rbac.authorization.k8s.io
{{- end }}