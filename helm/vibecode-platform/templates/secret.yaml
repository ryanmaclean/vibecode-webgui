{{- if not .Values.externalSecrets.enabled }}
{{/*
WARNING: This Secret uses hardcoded values and is NOT RECOMMENDED for production use.

SECURITY RISK:
- Secrets are stored in plain text in your Helm values and version control
- Default passwords and tokens are insecure
- No automatic rotation or centralized secret management

RECOMMENDED APPROACH:
Enable External Secrets Operator integration by setting:
  externalSecrets.enabled: true

This will use external-secret.yaml to sync secrets from:
- AWS Secrets Manager
- Google Secret Manager
- HashiCorp Vault
- Azure Key Vault
- Other supported backends

For production deployments, you MUST either:
1. Enable externalSecrets.enabled=true and configure a SecretStore
2. Manually create this Secret with secure values before deployment
3. Use a GitOps tool with sealed secrets (e.g., Bitnami Sealed Secrets, SOPS)

See: https://external-secrets.io/ for setup instructions
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibecode-platform.secretName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
  annotations:
    vibecode.dev/warning: "hardcoded-secrets-not-for-production"
    vibecode.dev/recommendation: "enable-external-secrets-operator"
type: Opaque
data:
  # Default password for code-server instances
  # WARNING: Change this in production!
  password: {{ "vibecode-default" | b64enc | quote }}

  # Database connection string for user management
  # WARNING: This contains credentials in plain text!
  database-url: {{ "postgresql://vibecode:vibecode@postgres:5432/vibecode" | b64enc | quote }}

  # JWT secret for session management
  # WARNING: Use a cryptographically secure random value in production!
  jwt-secret: {{ "your-jwt-secret-change-in-production" | b64enc | quote }}

  # OAuth secrets (populate these with actual values)
  # WARNING: Empty secrets will cause OAuth to fail!
  github-client-id: {{ "" | b64enc | quote }}
  github-client-secret: {{ "" | b64enc | quote }}
  google-client-id: {{ "" | b64enc | quote }}
  google-client-secret: {{ "" | b64enc | quote }}
{{- end }}
---
{{- if and .Values.aiIntegration.openRouter.enabled (not .Values.externalSecrets.enabled) }}
{{/*
WARNING: OpenRouter API key is empty and hardcoded.
Consider using External Secrets Operator for secure key management.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.aiIntegration.openRouter.secretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-integration
  annotations:
    vibecode.dev/warning: "empty-api-key-will-cause-failures"
    vibecode.dev/recommendation: "enable-external-secrets-operator"
type: Opaque
data:
  # WARNING: Empty API key will cause authentication failures!
  # Provide this via --set or enable External Secrets Operator
  api-key: {{ "" | b64enc | quote }}
{{- end }}
---
{{- if and .Values.aiIntegration.artificialAnalysis.enabled (not .Values.externalSecrets.enabled) }}
{{/*
WARNING: Artificial Analysis API key is empty and hardcoded.
Consider using External Secrets Operator for secure key management.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.aiIntegration.artificialAnalysis.secretName }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-integration
  annotations:
    vibecode.dev/warning: "empty-api-key-will-cause-failures"
    vibecode.dev/recommendation: "enable-external-secrets-operator"
type: Opaque
data:
  # WARNING: Empty API key will cause authentication failures!
  # Provide this via --set or enable External Secrets Operator
  api-key: {{ "" | b64enc | quote }}
{{- end }}
