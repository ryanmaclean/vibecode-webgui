# CI-friendly overrides for provisioning integration tests.
# Disables optional dependencies and replaces storage classes/images with
# public alternatives so Kind clusters can install the chart quickly.

datadog:
  enabled: false

mongodb:
  enabled: false

global:
  namespace: vibecode-platform
  storageClass: standard
  imagePullPolicy: IfNotPresent

codeServer:
  image:
    repository: codercom/code-server
    tag: "4.22.1"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
    accessMode: ReadWriteOnce
  ingress:
    enabled: false
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  env:
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: code-server-config
          key: password
    - name: SHELL
      value: "/bin/bash"
    - name: DOCKER_HOST
      value: "tcp://localhost:2375"

userManagement:
  workspace:
    defaultSize: 5Gi
    maxSize: 10Gi
    storageClass: standard

aiIntegration:
  openRouter:
    enabled: false
  mcp:
    enabled: false
  artificialAnalysis:
    enabled: false

monitoring:
  enabled: false

freeModelUpdater:
  enabled: false

ingress:
  enabled: false

security:
  podSecurityStandards:
    enforce: baseline
    audit: baseline
    warn: baseline
  networkPolicies:
    enabled: false
  rbac:
    enabled: true

examples:
  createSampleUser: false
  createProvisionerJob: false
