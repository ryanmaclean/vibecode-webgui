# AgentAPI Configuration
host: 127.0.0.1
port: 3284
terminal_dir: /tmp/terminals
max_concurrent_agents: 5
agent_timeout: 300
log_level: info

# CORS configuration
allowed_origins:
  - http://localhost:8765
  - http://127.0.0.1:8765
  - http://localhost:3000

# Agent configurations
agents:
  - name: aider
    command: aider
    default_model: claude-3-5-sonnet
    enabled: true

  - name: goose
    command: goose
    default_profile: default
    enabled: true

  - name: cline
    command: npx
    args: ["-y", "@cline/cli"]
    enabled: true

  - name: continue
    command: continue
    enabled: false

# Resource limits
resources:
  max_memory_mb: 2048
  max_cpu_percent: 100
  max_disk_mb: 1024

# Monitoring
metrics:
  enabled: true
  port: 9090
  path: /metrics

health_check:
  enabled: true
  interval_seconds: 30
