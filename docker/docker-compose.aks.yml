# AKS Production Environment with Datadog Integration
version: '3.8'

services:
  webgui:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
      args:
        NODE_VERSION: 20
        BASE_OS: alpine
        BUILD_TARGET: production
        INCLUDE_DEV_DEPS: false
        ENABLE_SOURCE_MAPS: true
        ENABLE_DATADOG: true
        ENABLE_LIGHTNINGCSS: true
        ENABLE_PRISMA: true
        ENABLE_HEALTH_CHECK: true
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # Datadog Configuration
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_SERVICE=vibecode-webgui
      - DD_ENV=production
      - DD_VERSION=${DD_VERSION:-latest}
      - DD_TRACE_ENABLED=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_DYNAMIC_INSTRUMENTATION_ENABLED=true
      - DD_SOURCE_MAP_PATH=/app/source-maps
      - DD_IAST_ENABLED=true
      - DD_APPSEC_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - vibecode-aks

  # RAG Ingestion Worker
  rag-ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ingestion
      args:
        NODE_VERSION: 20
        BASE_OS: alpine
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - RAG_DOCS_PATH=/app/docs/src/content/docs
      - RAG_INTER_CHUNK_DELAY_MS=250
      - RAG_CHUNK_MAX_ATTEMPTS=5
      - RAG_RETRY_BACKOFF_MS=2000
      - RAG_SKIP_TEST_SEARCH=true
      - USE_LOCAL_EMBEDDINGS=true
    volumes:
      - ../docs:/app/docs:ro
    depends_on:
      - webgui
    networks:
      - vibecode-aks

volumes:
  postgres_data:
  redis_data:

networks:
  vibecode-aks:
    driver: bridge
