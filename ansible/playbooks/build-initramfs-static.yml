---
# Ansible playbook to build VibeCode Services initramfs with STATIC binaries
# Usage: ansible-playbook -i inventory/localhost.yml playbooks/build-initramfs-static.yml
#
# Benefits of static binaries:
# - No shared library dependencies
# - Works with any libc (musl, glibc, etc.)
# - Simpler, smaller initramfs
# - More reliable across kernel versions

- name: Build VibeCode Services Initramfs (Static Binaries)
  hosts: localhost
  gather_facts: true
  
  vars:
    # Build directories
    build_dir: "/tmp/vibecode-initramfs-static"
    rootfs_dir: "{{ build_dir }}/rootfs"
    downloads_dir: "{{ build_dir }}/downloads"
    
    # Output
    output_dir: "{{ playbook_dir }}/../../azure"
    output_file: "unified-services-static.cpio.gz"
    
    # VM hostname
    vm_hostname: "vibecode-vm"
    
    # Static binary sources
    # Using Alpine Linux packages (musl-based, often static or easily made static)
    # and official static builds where available
    
    static_binaries:
      # BusyBox - static build from Alpine
      - name: busybox
        url: "https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox"
        arm64_url: "https://github.com/docker-library/busybox/raw/dist-arm64v8/stable/musl/busybox.tar.xz"
        dest: "/bin/busybox"
        mode: "0755"
      
      # Valkey/Redis - use static build
      - name: valkey
        # Valkey doesn't provide official static builds, we'll build or use Redis static
        url: "https://github.com/valkey-io/valkey/releases/download/8.0.2/valkey-8.0.2-linux-arm64.tar.gz"
        extract: true
        binary: "valkey-server"
        dest: "/bin/valkey-server"
        mode: "0755"
      
      # Dropbear SSH - Alpine static package
      - name: dropbear
        alpine_pkg: "dropbear"
        dest: "/usr/sbin/dropbear"
        mode: "0755"
      
      # PostgreSQL - use Alpine's static-ish build or compile static
      - name: postgresql
        # PostgreSQL is harder to make fully static, use Alpine's musl build
        alpine_pkg: "postgresql16"
        dest: "/usr/bin/postgres"
        mode: "0755"

    # Alpine Linux mirror for static/musl packages
    alpine_mirror: "https://dl-cdn.alpinelinux.org/alpine"
    alpine_version: "v3.20"
    alpine_arch: "aarch64"

    # Root password hash for 'vibecode' (openssl passwd -6 -salt vibecode vibecode)
    shadow_password: "$6$vibecode$vQV9vbWp4TC3qmWb/NZzb.VCtcJRd8c.1N0o6S4q1D50tuRDDfbhtkfIqN6cuyenVRkOm8xiH8i7gH6D/ZM.K0"

    # Services configuration
    services:
      valkey:
        enabled: true
        port: 6379
      postgresql:
        enabled: true
        port: 5432
        version: "16"
      openvscode:
        enabled: true
        port: 8080
      ssh:
        enabled: true
        port: 22
      avahi:
        enabled: false  # Avahi requires dbus, skip for static build

  tasks:
    - name: Create build directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ build_dir }}"
        - "{{ rootfs_dir }}"
        - "{{ downloads_dir }}"
        - "{{ rootfs_dir }}/bin"
        - "{{ rootfs_dir }}/sbin"
        - "{{ rootfs_dir }}/usr/bin"
        - "{{ rootfs_dir }}/usr/sbin"
        - "{{ rootfs_dir }}/lib"
        - "{{ rootfs_dir }}/lib64"
        - "{{ rootfs_dir }}/etc"
        - "{{ rootfs_dir }}/etc/dropbear"
        - "{{ rootfs_dir }}/dev"
        - "{{ rootfs_dir }}/proc"
        - "{{ rootfs_dir }}/sys"
        - "{{ rootfs_dir }}/tmp"
        - "{{ rootfs_dir }}/var/log"
        - "{{ rootfs_dir }}/var/lib/postgresql/data"
        - "{{ rootfs_dir }}/run/postgresql"
        - "{{ rootfs_dir }}/root"
        - "{{ rootfs_dir }}/home"

    # ========================================
    # Extract base initramfs first (for BusyBox, Valkey, OpenVSCode, kernel modules)
    # ========================================
    - name: Check if base initramfs exists
      stat:
        path: "{{ output_dir }}/unified-services-with-datadog.cpio.gz"
      register: base_initramfs

    - name: Extract base initramfs
      shell: |
        cd {{ downloads_dir }}
        mkdir -p base
        cd base
        gunzip -c {{ output_dir }}/unified-services-with-datadog.cpio.gz | cpio -idmv 2>/dev/null
      when: base_initramfs.stat.exists
      args:
        creates: "{{ downloads_dir }}/base/bin/busybox"

    # ========================================
    # BUSYBOX - Copy from base initramfs
    # ========================================
    - name: Copy BusyBox from base initramfs
      shell: |
        cp {{ downloads_dir }}/base/bin/busybox {{ rootfs_dir }}/bin/
        chmod +x {{ rootfs_dir }}/bin/busybox
      when: base_initramfs.stat.exists

    # ========================================
    # VALKEY - From Alpine (Linux ELF binary)
    # ========================================
    - name: Download Valkey from Alpine
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/valkey-7.2.11-r0.apk"
        dest: "{{ downloads_dir }}/valkey.apk"
        mode: '0644'

    - name: Extract Valkey APK
      shell: |
        cd {{ downloads_dir }}
        mkdir -p valkey
        cd valkey
        tar -xzf ../valkey.apk 2>/dev/null || true
        cp usr/bin/valkey-server {{ rootfs_dir }}/bin/ 2>/dev/null || true
        chmod +x {{ rootfs_dir }}/bin/valkey-server 2>/dev/null || true

    - name: Download Valkey CLI from Alpine
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/valkey-cli-7.2.11-r0.apk"
        dest: "{{ downloads_dir }}/valkey-cli.apk"
        mode: '0644'
      ignore_errors: true

    - name: Extract Valkey CLI APK
      shell: |
        cd {{ downloads_dir }}
        mkdir -p valkey-cli
        cd valkey-cli
        tar -xzf ../valkey-cli.apk 2>/dev/null || true
        cp usr/bin/valkey-cli {{ rootfs_dir }}/bin/ 2>/dev/null || true
        chmod +x {{ rootfs_dir }}/bin/valkey-cli 2>/dev/null || true
      ignore_errors: true

    # ========================================
    # KERNEL MODULES - Copy from base initramfs
    # ========================================
    - name: Copy kernel modules from base initramfs
      shell: |
        if [ -d {{ downloads_dir }}/base/lib/modules ]; then
          cp -a {{ downloads_dir }}/base/lib/modules {{ rootfs_dir }}/lib/
        fi
      when: base_initramfs.stat.exists

    # ========================================
    # DROPBEAR SSH - From Alpine (musl/static)
    # ========================================
    - name: Download Dropbear from Alpine
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/dropbear-2024.85-r0.apk"
        dest: "{{ downloads_dir }}/dropbear.apk"
        mode: '0644'
      register: dropbear_download
      ignore_errors: true

    - name: Extract Dropbear APK
      shell: |
        cd {{ downloads_dir }}
        mkdir -p dropbear
        cd dropbear
        tar -xzf ../dropbear.apk 2>/dev/null || true
        # Dropbear binary is in usr/sbin/dropbear
        cp usr/sbin/dropbear {{ rootfs_dir }}/usr/sbin/ 2>/dev/null || true
        cp usr/bin/dropbearkey {{ rootfs_dir }}/usr/bin/ 2>/dev/null || true
        chmod +x {{ rootfs_dir }}/usr/sbin/dropbear {{ rootfs_dir }}/usr/bin/dropbearkey 2>/dev/null || true
      when: dropbear_download is succeeded
      ignore_errors: true

    # ========================================
    # POSTGRESQL - From Alpine (musl-linked)
    # ========================================
    - name: Download PostgreSQL from Alpine
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/postgresql16-16.11-r0.apk"
        dest: "{{ downloads_dir }}/postgresql.apk"
        mode: '0644'
      register: postgresql_download
      ignore_errors: true

    - name: Download PostgreSQL client from Alpine
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/postgresql16-client-16.11-r0.apk"
        dest: "{{ downloads_dir }}/postgresql-client.apk"
        mode: '0644'
      ignore_errors: true

    - name: Download musl libc for Alpine binaries
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/musl-1.2.5-r1.apk"
        dest: "{{ downloads_dir }}/musl.apk"
        mode: '0644'
      register: musl_download

    - name: Extract musl
      shell: |
        cd {{ downloads_dir }}
        mkdir -p musl
        cd musl
        tar -xzf ../musl.apk 2>/dev/null || true
        cp lib/ld-musl-aarch64.so.1 {{ rootfs_dir }}/lib/ 2>/dev/null || true
        ln -sf /lib/ld-musl-aarch64.so.1 {{ rootfs_dir }}/lib/libc.musl-aarch64.so.1 2>/dev/null || true
      when: musl_download is succeeded
      ignore_errors: true

    - name: Extract PostgreSQL APK
      shell: |
        cd {{ downloads_dir }}
        mkdir -p postgresql
        cd postgresql
        tar -xzf ../postgresql.apk 2>/dev/null || true
        tar -xzf ../postgresql-client.apk 2>/dev/null || true
        # PostgreSQL binaries are in usr/libexec/postgresql16/
        cp usr/libexec/postgresql16/postgres {{ rootfs_dir }}/usr/bin/ 2>/dev/null || true
        cp usr/libexec/postgresql16/initdb {{ rootfs_dir }}/usr/bin/ 2>/dev/null || true
        cp usr/libexec/postgresql16/pg_ctl {{ rootfs_dir }}/usr/bin/ 2>/dev/null || true
        # Client tools from client package
        cp usr/libexec/postgresql16/psql {{ rootfs_dir }}/usr/bin/ 2>/dev/null || true
        # Shared files
        mkdir -p {{ rootfs_dir }}/usr/share/postgresql16
        cp -r usr/share/postgresql16/* {{ rootfs_dir }}/usr/share/postgresql16/ 2>/dev/null || true
        # Libraries
        mkdir -p {{ rootfs_dir }}/usr/lib/postgresql16
        cp -r usr/lib/postgresql16/* {{ rootfs_dir }}/usr/lib/postgresql16/ 2>/dev/null || true
        chmod +x {{ rootfs_dir }}/usr/bin/postgres {{ rootfs_dir }}/usr/bin/initdb 2>/dev/null || true
      when: postgresql_download is succeeded
      ignore_errors: true

    - name: Download PostgreSQL dependencies from Alpine
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/{{ item }}"
        dest: "{{ downloads_dir }}/{{ item }}"
        mode: '0644'
      loop:
        - "libpq-16.11-r0.apk"
        - "libxml2-2.12.10-r0.apk"
        - "libssl3-3.3.5-r0.apk"
        - "libcrypto3-3.3.5-r0.apk"
        - "zlib-1.3.1-r1.apk"
        - "lz4-libs-1.9.4-r5.apk"
        - "zstd-libs-1.5.6-r0.apk"
        - "icu-libs-74.2-r1.apk"
        - "xz-libs-5.6.2-r1.apk"
        - "libldap-2.6.8-r0.apk"
        - "libstdc++-13.2.1_git20240309-r1.apk"
        - "libgcc-13.2.1_git20240309-r1.apk"
        - "libsasl-2.1.28-r6.apk"
        - "icu-data-full-74.2-r1.apk"
      ignore_errors: true

    - name: Extract Alpine dependencies
      shell: |
        cd {{ downloads_dir }}
        mkdir -p deps
        for apk in libpq*.apk libxml2*.apk libssl*.apk libcrypto*.apk zlib*.apk lz4-libs*.apk zstd-libs*.apk icu-libs*.apk icu-data*.apk xz-libs*.apk libldap*.apk libstdc++*.apk libgcc*.apk libsasl*.apk; do
          if [ -f "$apk" ]; then
            cd deps
            tar -xzf ../$apk 2>/dev/null || true
            cd ..
          fi
        done
        # Copy all .so files to /lib (dereferencing symlinks to get actual files)
        find deps -name "*.so*" -type f -exec cp {} {{ rootfs_dir }}/lib/ \; 2>/dev/null || true
        # Also copy symlinks
        find deps -name "*.so*" -type l -exec cp -P {} {{ rootfs_dir }}/lib/ \; 2>/dev/null || true
        # Fix broken symlinks by copying actual files
        cd {{ rootfs_dir }}/lib
        # Remove broken symlinks and create correct ones
        rm -f libcrypto.so.3 libssl.so.3 2>/dev/null || true
        # Find and copy the actual libcrypto and libssl
        find {{ downloads_dir }}/deps -name "libcrypto.so.3" -type f -exec cp {} {{ rootfs_dir }}/lib/ \; 2>/dev/null || true
        find {{ downloads_dir }}/deps -name "libssl.so.3" -type f -exec cp {} {{ rootfs_dir }}/lib/ \; 2>/dev/null || true
        # Create symlinks for expected library names
        ln -sf libzstd.so.1.5.6 libzstd.so.1 2>/dev/null || true
        ln -sf liblz4.so.1.9.4 liblz4.so.1 2>/dev/null || true
        ln -sf liblzma.so.5.6.2 liblzma.so.5 2>/dev/null || true
        ln -sf libldap.so.2.0.200 libldap.so.2 2>/dev/null || true
        # Copy ICU data files
        if [ -d {{ downloads_dir }}/deps/usr/share/icu ]; then
          mkdir -p {{ rootfs_dir }}/usr/share
          cp -r {{ downloads_dir }}/deps/usr/share/icu {{ rootfs_dir }}/usr/share/
          echo "ICU data copied"
        fi
        # List what we have
        echo "Libraries in /lib:"
        ls -la *.so* 2>/dev/null | head -30
      ignore_errors: true

    # ========================================
    # OPENVSCODE - Copy from base initramfs
    # ========================================
    - name: Copy OpenVSCode from base initramfs
      shell: |
        if [ -d {{ downloads_dir }}/base/opt/openvscode ]; then
          cp -a {{ downloads_dir }}/base/opt {{ rootfs_dir }}/
        fi
      when: base_initramfs.stat.exists
      ignore_errors: true

    # ========================================
    # NODE.JS - From Alpine (musl-compatible)
    # ========================================
    - name: Download Node.js from Alpine
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/nodejs-20.15.1-r0.apk"
        dest: "{{ downloads_dir }}/nodejs.apk"
        mode: '0644'
      ignore_errors: true

    - name: Extract Node.js APK and replace glibc node
      shell: |
        cd {{ downloads_dir }}
        mkdir -p nodejs
        cd nodejs
        tar -xzf ../nodejs.apk 2>/dev/null || true
        # Replace the glibc node with musl node
        if [ -f usr/bin/node ]; then
          cp usr/bin/node {{ rootfs_dir }}/opt/openvscode/node 2>/dev/null || true
          chmod +x {{ rootfs_dir }}/opt/openvscode/node 2>/dev/null || true
          echo "Replaced node with Alpine musl version"
        fi
      ignore_errors: true

    - name: Download Node.js dependencies from Alpine
      get_url:
        url: "{{ alpine_mirror }}/{{ alpine_version }}/main/{{ alpine_arch }}/{{ item }}"
        dest: "{{ downloads_dir }}/{{ item }}"
        mode: '0644'
      loop:
        - "c-ares-1.33.1-r0.apk"
        - "libgcc-13.2.1_git20240309-r1.apk"
        - "libstdc++-13.2.1_git20240309-r1.apk"
        - "libuv-1.48.0-r0.apk"
        - "brotli-libs-1.1.0-r2.apk"
        - "nghttp2-libs-1.62.1-r0.apk"
        - "ada-libs-2.7.8-r0.apk"
        - "libbase64-0.5.2-r0.apk"
        - "llhttp-libs-9.2.1-r0.apk"
      ignore_errors: true

    - name: Extract Node.js dependencies
      shell: |
        cd {{ downloads_dir }}
        mkdir -p nodejs-deps
        for apk in c-ares*.apk libuv*.apk brotli-libs*.apk nghttp2-libs*.apk ada-libs*.apk libbase64*.apk llhttp-libs*.apk; do
          if [ -f "$apk" ]; then
            cd nodejs-deps
            tar -xzf ../$apk 2>/dev/null || true
            cd ..
          fi
        done
        # Copy libraries
        find nodejs-deps -name "*.so*" -type f -exec cp {} {{ rootfs_dir }}/lib/ \; 2>/dev/null || true
        find nodejs-deps -name "*.so*" -type l -exec cp -P {} {{ rootfs_dir }}/lib/ \; 2>/dev/null || true
        # Create symlinks for expected names
        cd {{ rootfs_dir }}/lib
        ln -sf libcares.so.2.* libcares.so.2 2>/dev/null || true
        ln -sf libada.so.2.* libada.so.2 2>/dev/null || true
        ln -sf libbase64.so.0.* libbase64.so.0 2>/dev/null || true
        ls -la libcares* libada* libbase64* 2>/dev/null || true
      ignore_errors: true

    # ========================================
    # CONFIGURATION FILES
    # ========================================
    - name: Create /etc/passwd
      copy:
        dest: "{{ rootfs_dir }}/etc/passwd"
        content: |
          root:x:0:0:root:/root:/bin/sh
          postgres:x:999:999:PostgreSQL:/var/lib/postgresql:/bin/sh
          nobody:x:65534:65534:nobody:/:/bin/false
        mode: '0644'

    - name: Create /etc/shadow (password is vibecode)
      copy:
        dest: "{{ rootfs_dir }}/etc/shadow"
        # Password hash for 'vibecode' generated with openssl passwd -6 -salt vibecode vibecode
        content: "root:{{ shadow_password }}:19000:0:99999:7:::\npostgres:*:19000:0:99999:7:::\nnobody:*:19000:0:99999:7:::\n"
        mode: '0640'

    - name: Create /etc/group
      copy:
        dest: "{{ rootfs_dir }}/etc/group"
        content: |
          root:x:0:
          postgres:x:999:
          nobody:x:65534:
        mode: '0644'

    - name: Create /etc/hosts
      copy:
        dest: "{{ rootfs_dir }}/etc/hosts"
        content: |
          127.0.0.1 localhost {{ vm_hostname }}
          ::1       localhost
        mode: '0644'

    - name: Create /etc/hostname
      copy:
        dest: "{{ rootfs_dir }}/etc/hostname"
        content: "{{ vm_hostname }}\n"
        mode: '0644'

    - name: Create /etc/resolv.conf
      copy:
        dest: "{{ rootfs_dir }}/etc/resolv.conf"
        content: |
          nameserver 8.8.8.8
          nameserver 1.1.1.1
        mode: '0644'

    # ========================================
    # INIT SCRIPT
    # ========================================
    - name: Create init script
      copy:
        dest: "{{ rootfs_dir }}/init"
        content: |
          #!/bin/busybox sh
          # VibeCode Services VM Init Script (Static Binaries)
          
          echo "=== Booting {{ vm_hostname }} (static) ==="
          
          # Install busybox applets
          /bin/busybox --install -s /bin
          /bin/busybox --install -s /sbin
          
          # Mount filesystems
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev
          mkdir -p /tmp && mount -t tmpfs tmp /tmp
          mkdir -p /run && mount -t tmpfs run /run
          
          # Create device nodes
          mknod -m 666 /dev/null c 1 3 2>/dev/null || true
          mknod -m 666 /dev/zero c 1 5 2>/dev/null || true
          mknod -m 666 /dev/random c 1 8 2>/dev/null || true
          mknod -m 666 /dev/urandom c 1 9 2>/dev/null || true
          mknod -m 666 /dev/tty c 5 0 2>/dev/null || true
          mknod -m 620 /dev/console c 5 1 2>/dev/null || true
          mknod -m 666 /dev/ptmx c 5 2 2>/dev/null || true
          mkdir -p /dev/pts
          mount -t devpts devpts /dev/pts
          
          # Load network modules
          insmod /lib/modules/*/kernel/net/core/failover.ko 2>/dev/null || true
          insmod /lib/modules/*/kernel/drivers/net/net_failover.ko 2>/dev/null || true
          insmod /lib/modules/*/kernel/drivers/net/virtio_net.ko 2>/dev/null || true
          sleep 2
          
          # Setup hostname
          hostname {{ vm_hostname }}
          
          echo ""
          echo "=== Network ==="
          ip link set lo up
          
          FOUND_IFACE=""
          for iface in enp0s1 eth0 ens3 ens4; do
              if ip link show $iface > /dev/null 2>&1; then
                  FOUND_IFACE=$iface
                  break
              fi
          done
          
          if [ -n "$FOUND_IFACE" ]; then
              echo "Found interface: $FOUND_IFACE"
              ip link set $FOUND_IFACE up
              sleep 1
              
              # Simple DHCP script
              cat > /tmp/udhcpc.script << 'DHCPEOF'
          #!/bin/sh
          case "$1" in
              deconfig)
                  ip addr flush dev $interface
                  ;;
              bound|renew)
                  ip addr add $ip/$mask dev $interface
                  [ -n "$router" ] && ip route add default via $router dev $interface
                  [ -n "$dns" ] && echo "nameserver $dns" > /etc/resolv.conf
                  ;;
          esac
          DHCPEOF
              chmod +x /tmp/udhcpc.script
              
              # Try DHCP first with verbose output
              echo "Requesting DHCP..."
              udhcpc -i $FOUND_IFACE -s /tmp/udhcpc.script -t 5 -T 3 -n 2>&1 | head -3
              VM_IP=$(ip addr show $FOUND_IFACE | grep 'inet ' | awk '{print $2}' | cut -d/ -f1)
              
              # If DHCP failed, use static IP (Apple VZ NAT typically uses 192.168.64.x)
              if [ -z "$VM_IP" ]; then
                  echo "DHCP failed, using static IP"
                  ip addr add 192.168.64.10/24 dev $FOUND_IFACE
                  ip route add default via 192.168.64.1 dev $FOUND_IFACE
                  VM_IP="192.168.64.10"
              fi
              
              echo "IP: $VM_IP"
              echo "Gateway: $(ip route | grep default | awk '{print $3}')"
              
              # Test DNS
              echo "Testing DNS..."
              nslookup google.com 8.8.8.8 2>&1 | head -3 || echo "DNS test failed (expected in minimal env)"
          else
              echo "No network interface found"
              VM_IP="unknown"
          fi
          
          # Environment
          export PATH=/bin:/sbin:/usr/bin:/usr/sbin
          export LD_LIBRARY_PATH=/lib:/usr/lib:/usr/lib/postgresql16
          export HOME=/root
          export PS1='{{ vm_hostname }}# '
          
          {% if services.valkey.enabled %}
          echo ""
          echo "=== Valkey ==="
          if [ -x /bin/valkey-server ]; then
              /bin/valkey-server --bind 0.0.0.0 --port {{ services.valkey.port }} --protected-mode no --daemonize yes --dir /tmp
              sleep 1
              ps | grep -v grep | grep -q valkey && echo "Valkey OK on port {{ services.valkey.port }}" || echo "Valkey FAIL"
          else
              echo "Valkey binary not found"
          fi
          {% endif %}
          
          {% if services.postgresql.enabled %}
          echo ""
          echo "=== PostgreSQL ==="
          if [ -x /usr/bin/postgres ]; then
              # Create directories with proper permissions
              mkdir -p /var/lib/postgresql/data
              mkdir -p /run/postgresql
              
              # Set ownership (use numeric IDs in case names aren't resolved yet)
              chown -R 999:999 /var/lib/postgresql
              chown -R 999:999 /run/postgresql
              chmod 700 /var/lib/postgresql/data
              chmod 755 /run/postgresql
              
              if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
                  echo "Initializing database..."
                  # Run initdb as postgres user
                  su -s /bin/sh postgres -c "/usr/bin/initdb -D /var/lib/postgresql/data --no-locale --encoding=UTF8" 2>&1 | tail -5
                  if [ -f /var/lib/postgresql/data/pg_hba.conf ]; then
                      echo "host all all 0.0.0.0/0 trust" >> /var/lib/postgresql/data/pg_hba.conf
                      echo "listen_addresses = '*'" >> /var/lib/postgresql/data/postgresql.conf
                  fi
              fi
              
              if [ -f /var/lib/postgresql/data/PG_VERSION ]; then
                  su -s /bin/sh postgres -c "/usr/bin/postgres -D /var/lib/postgresql/data" > /tmp/postgresql.log 2>&1 &
                  sleep 3
                  ps | grep -v grep | grep -q "postgres" && echo "PostgreSQL OK on port {{ services.postgresql.port }}" || { echo "PostgreSQL FAIL"; cat /tmp/postgresql.log | head -5; }
              else
                  echo "PostgreSQL FAIL - initdb failed"
              fi
          else
              echo "PostgreSQL binary not found"
          fi
          {% endif %}
          
          {% if services.openvscode.enabled %}
          echo ""
          echo "=== OpenVSCode ==="
          if [ -d /opt/openvscode ] && [ -x /opt/openvscode/node ]; then
              mkdir -p /tmp/vscode-data /tmp/vscode-extensions
              cd /opt/openvscode
              
              # Create settings for dark mode and disable welcome
              mkdir -p /tmp/vscode-data/User
              cat > /tmp/vscode-data/User/settings.json << 'SETTINGS'
          {
            "workbench.colorTheme": "Default Dark Modern",
            "workbench.startupEditor": "none",
            "workbench.tips.enabled": false,
            "workbench.welcomePage.walkthroughs.openOnInstall": false,
            "update.mode": "none",
            "telemetry.telemetryLevel": "off"
          }
          SETTINGS
              
              # Start OpenVSCode Server
              ./node out/server-main.js \
                --host 0.0.0.0 \
                --port {{ services.openvscode.port }} \
                --without-connection-token \
                --accept-server-license-terms \
                --user-data-dir /tmp/vscode-data \
                --extensions-dir /tmp/vscode-extensions \
                > /tmp/openvscode.log 2>&1 &
              
              sleep 3
              if ps | grep -v grep | grep -q "node"; then
                  echo "OpenVSCode OK at http://$VM_IP:{{ services.openvscode.port }}"
                  echo "  Theme: Dark Modern"
                  echo "  Welcome: Disabled"
              else
                  echo "OpenVSCode FAIL"
                  cat /tmp/openvscode.log 2>/dev/null | head -5
              fi
          else
              echo "OpenVSCode not found or node missing"
          fi
          {% endif %}
          
          {% if services.ssh.enabled %}
          echo ""
          echo "=== Dropbear SSH ==="
          if [ -x /usr/sbin/dropbear ]; then
              mkdir -p /etc/dropbear /root/.ssh
              chmod 700 /root/.ssh
              
              # Generate host keys
              if [ ! -f /etc/dropbear/dropbear_rsa_host_key ]; then
                  /usr/bin/dropbearkey -t rsa -f /etc/dropbear/dropbear_rsa_host_key 2>/dev/null
              fi
              if [ ! -f /etc/dropbear/dropbear_ecdsa_host_key ]; then
                  /usr/bin/dropbearkey -t ecdsa -f /etc/dropbear/dropbear_ecdsa_host_key 2>/dev/null
              fi
              
              # Start dropbear (-R regenerate keys if needed, -E log to stderr, -F foreground but we use &)
              # -s disables password login for root, so we omit it to allow password auth
              /usr/sbin/dropbear -R -E 2>&1 &
              sleep 1
              ps | grep -v grep | grep -q dropbear && echo "SSH OK on port {{ services.ssh.port }} (password: vibecode)" || echo "SSH FAIL"
          else
              echo "Dropbear binary not found"
          fi
          {% endif %}
          
          echo ""
          echo "========================================="
          echo "  {{ vm_hostname }} Ready"
          echo "  IP: $VM_IP"
          echo "  SSH: ssh root@$VM_IP"
          {% if services.valkey.enabled %}
          echo "  Valkey: $VM_IP:{{ services.valkey.port }}"
          {% endif %}
          {% if services.postgresql.enabled %}
          echo "  PostgreSQL: $VM_IP:{{ services.postgresql.port }}"
          {% endif %}
          {% if services.openvscode.enabled %}
          echo "  OpenVSCode: http://$VM_IP:{{ services.openvscode.port }}"
          {% endif %}
          echo "========================================="
          
          # Drop to shell
          while true; do /bin/sh -i 2>&1; sleep 1; done
        mode: '0755'

    # ========================================
    # BUILD INITRAMFS
    # ========================================
    - name: Build initramfs
      shell: |
        cd {{ rootfs_dir }}
        find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9 > {{ output_dir }}/{{ output_file }}
      register: build_result

    - name: Get initramfs size
      stat:
        path: "{{ output_dir }}/{{ output_file }}"
      register: initramfs_stat

    - name: Show build result
      debug:
        msg: |
          ✅ Static initramfs built successfully!
          Path: {{ output_dir }}/{{ output_file }}
          Size: {{ (initramfs_stat.stat.size / 1024 / 1024) | round(1) }} MB
          
          Benefits:
          - No glibc/musl compatibility issues
          - Smaller footprint
          - More reliable
          
          To use: Update Swift app to use unified-services-static.cpio.gz

    - name: Cleanup build directory
      file:
        path: "{{ build_dir }}"
        state: absent
      when: cleanup | default(false) | bool

