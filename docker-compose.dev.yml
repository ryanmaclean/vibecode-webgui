version: '3.8'

services:
  vibecode-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Bind mount source code for hot reloading
      - .:/app
      # CRITICAL: Anonymous volume for node_modules to prevent host override
      - /app/node_modules
      # Prevent .next cache conflicts
      - /app/.next
    environment:
      - NODE_ENV=development
      - DOCKER=true
      - REDIS_URL=valkey://valkey:6379
      - VALKEY_URL=valkey://valkey:6379
    stdin_open: true
    tty: true
    networks:
      - vibecode-network

  # Valkey for Redis compatibility
  valkey:
    image: valkey/valkey:7-alpine
    container_name: vibecode-valkey-dev
    ports:
      - "6379:6379"
    volumes:
      - valkey-data-dev:/data
    command: valkey-server --save 900 1 --maxmemory 256mb --appendonly yes
    networks:
      - vibecode-network

  # PostgreSQL database with pgvector extension
  postgres:
    image: ankane/pgvector:latest
    container_name: vibecode-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vibecode
      - POSTGRES_PASSWORD=vibecode
      - POSTGRES_DB=vibecode
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    networks:
      - vibecode-network

networks:
  vibecode-network:
    driver: bridge

volumes:
  valkey-data-dev:
  postgres-data-dev: