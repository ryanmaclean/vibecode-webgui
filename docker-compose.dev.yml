version: '3.8'

services:
  vibecode-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: vibecode-dev-local
    ports:
      - "3000:3000"
    volumes:
      # Bind mount source code for hot reloading
      - .:/app
      # CRITICAL: Anonymous volume for node_modules to prevent host override
      - node-modules-dev:/app/node_modules
      # Prevent .next cache conflicts
      - next-cache-dev:/app/.next
      # Share generated free model lists with other services
      - free-llm-models:/app/runtime/free-llm-models
    environment:
      - NODE_ENV=development
      - DOCKER=true
      - DD_IAST_ENABLED=true
      - DD_DBM_PROPAGATION_MODE=full
      - DD_SERVICE=vibecode-webgui
      - DD_ENV=development
      - DD_VERSION=0.1.0-dev
      - FREE_LLM_MODELS_FILE=/app/runtime/free-llm-models/models.txt
    stdin_open: true
    tty: true
    networks:
      - vibecode-network

  # Valkey for Redis compatibility
  valkey:
    image: valkey/valkey:7-alpine
    container_name: vibecode-valkey-dev
    ports:
      - "6379:6379"
    volumes:
      - valkey-data-dev:/data
    command: valkey-server --save 900 1 --maxmemory 256mb --appendonly yes
    networks:
      - vibecode-network

  free-llm-model-updater:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: vibecode-dev-local
    working_dir: /app
    command: >
      bash -lc "mkdir -p runtime/free-llm-models && while true; do node -r dd-trace/init scripts/jobs/update-openrouter-free-models.js && sleep 43200; done"
    environment:
      - OUTPUT_JSON_PATH=/app/runtime/free-llm-models/models.json
      - OUTPUT_TEXT_PATH=/app/runtime/free-llm-models/models.txt
      - FREE_LLM_MODELS_FILE=/app/runtime/free-llm-models/models.txt
      - ENABLE_CONFIGMAP_SYNC=false
      - MAX_FREE_MODELS=10
      - MIN_WORKING_MODELS=3
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-}
      - DD_API_KEY=${DD_API_KEY:-}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_ENV=${DD_ENV:-development}
      - DD_DBM_PROPAGATION_MODE=full
      - DD_SERVICE=vibecode-webgui
      - DD_VERSION=0.1.0-dev
      - DATADOG_METRIC_TAGS=environment:local_dev
    volumes:
      - .:/app
      - node-modules-dev:/app/node_modules
      - next-cache-dev:/app/.next
      - free-llm-models:/app/runtime/free-llm-models
    depends_on:
      - vibecode-dev
    networks:
      - vibecode-network

networks:
  vibecode-network:
    driver: bridge

volumes:
  valkey-data-dev:
  node-modules-dev:
  next-cache-dev:
  free-llm-models:
