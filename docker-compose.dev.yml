version: '3.8'

services:
  vibecode-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      # Bind mount source code for hot reloading
      - .:/app
      # CRITICAL: Anonymous volume for node_modules to prevent host override
      - /app/node_modules
      # Prevent .next cache conflicts
      - /app/.next
    environment:
      - NODE_ENV=development
      - DOCKER=true
      - DD_TRACE_ENABLED=true
      - DD_ENV=dev
      - DD_SERVICE=vibecode-agent-builder
      - DD_TRACE_GLOBAL_TAGS=workflow:agent-builder,scenario:dev-compose
      - DD_SITE=datadoghq.com
      - DD_AGENT_HOST=host.docker.internal
      - DD_DYNAMIC_INSTRUMENTATION_ENABLED=true
      - DD_CODE_ORIGIN_FOR_SPANS_ENABLED=true
      - DD_LLMOBS_ENABLED=true
      - DD_LLMOBS_ML_APP=vibecode-ai-dev
      - DD_TRACE_ANALYTICS_ENABLED=true
      - DD_APM_ENABLE_TRACE_SEARCH=true
    stdin_open: true
    tty: true
    networks:
      - vibecode-network

  # Valkey for Redis compatibility
  valkey:
    image: valkey/valkey:7-alpine
    container_name: vibecode-valkey-dev
    ports:
      - "6379:6379"
    volumes:
      - valkey-data-dev:/data
    command: valkey-server --save 900 1 --maxmemory 256mb --appendonly yes
    networks:
      - vibecode-network

networks:
  vibecode-network:
    driver: bridge

volumes:
  valkey-data-dev:
