# Lima config: Sandbox VM with code-server and VibeCode CLI
arch: "aarch64"
vmType: "vz"
images:
  - location: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: ""
cpus: 4
memory: "4GiB"
disk: "30GiB"
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -y
      apt-get install -y curl git ca-certificates
  - mode: user
    script: |
      #!/bin/bash
      set -euxo pipefail
      # Prepare workspace directory
      mkdir -p $HOME/work
portForwards:
  - guestPort: 8080
    hostPort: 8080
    hostIP: 127.0.0.1
    proto: tcp
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
