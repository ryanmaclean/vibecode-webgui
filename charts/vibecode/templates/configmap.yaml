apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vibecode.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode.labels" . | nindent 4 }}
data:
{{- if .Values.configFiles }}
{{- range $filename, $content := .Values.configFiles }}
  {{ $filename }}: |
{{ tpl $content $ | indent 4 }}
{{- end }}
{{- else }}
  README.md: |
    Provide configuration data by overriding `configFiles` in values.
{{- end }}
