apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vibecode.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- if .Values.envSecrets }}
{{- range $key, $value := .Values.envSecrets }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- else }}
  placeholder: ""
{{- end }}
