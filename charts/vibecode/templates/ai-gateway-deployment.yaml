{{- if .Values.aiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vibecode.aiGateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode.aiGateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aiGateway.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "vibecode.aiGateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vibecode.aiGateway.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.aiGateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.aiGateway.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ai-gateway
          image: {{ .Values.aiGateway.image.repository }}:{{ .Values.aiGateway.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.aiGateway.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: {{ .Values.aiGateway.service.targetPort | default 3001 }}
          env:
            {{- range $name, $value := .Values.aiGateway.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.aiGateway.secretName }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- with .Values.aiGateway.readinessProbe }}
          readinessProbe:
            httpGet:
              path: {{ .path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds | default 10 }}
            periodSeconds: {{ .periodSeconds | default 15 }}
            timeoutSeconds: {{ .timeoutSeconds | default 1 }}
            failureThreshold: {{ .failureThreshold | default 3 }}
          {{- end }}
          {{- with .Values.aiGateway.livenessProbe }}
          livenessProbe:
            httpGet:
              path: {{ .path | default "/health/live" }}
              port: http
            initialDelaySeconds: {{ .initialDelaySeconds | default 30 }}
            periodSeconds: {{ .periodSeconds | default 20 }}
            timeoutSeconds: {{ .timeoutSeconds | default 1 }}
            failureThreshold: {{ .failureThreshold | default 3 }}
          {{- end }}
          {{- with .Values.aiGateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.aiGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
