{{- if .Values.freeModelUpdater.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vibecode.freeLlmConfigMapName" . }}
  labels:
    {{- include "vibecode.labels" . | nindent 4 }}
data:
  {{ .Values.freeModelUpdater.configMap.jsonKey }}: |
    {{- $payload := dict "updatedAt" "1970-01-01T00:00:00Z" "models" .Values.freeModelUpdater.initialModels }}
    {{- $payload | toJson | nindent 4 }}
  {{ .Values.freeModelUpdater.configMap.textKey }}: |
{{- range $model := .Values.freeModelUpdater.initialModels }}
    {{ $model }}
{{- end }}
{{- end }}
