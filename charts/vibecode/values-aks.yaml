# Production values for VibeCode WebGUI on Azure Kubernetes Service (AKS)
# This file contains Azure-specific configurations for production deployment

# Global configuration
global:
  imageRegistry: ""
  storageClass: "managed-csi"
  
# Application image configuration
image:
  registry: ""  # Will be set to ACR during deployment
  repository: "vibecode-webgui"
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Deployment configuration
replicaCount: 1

# Resource allocation for production workloads
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Pod security context
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

# Node selection and affinity for Azure
nodeSelector:
  kubernetes.io/os: linux

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "agentpool"
              operator: "In"
              values: ["application", "system"]
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: In
                values: ["vibecode"]
          topologyKey: "kubernetes.io/hostname"

# Tolerations for Azure node pools
tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-backend-protocol: "tcp"

# Ingress configuration for Azure Application Gateway or NGINX
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: vibecode.eastus2.cloudapp.azure.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vibecode-tls
      hosts:
        - vibecode.eastus2.cloudapp.azure.com

# Persistent storage for uploads and cache
persistence:
  enabled: false
  storageClass: "managed-csi"
  accessMode: ReadWriteOnce
  size: 50Gi
  mountPath: /app/uploads
  annotations:
    volume.beta.kubernetes.io/storage-class: "managed-csi"

# Environment variables
env:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  DD_ENV: "production"
  DD_SERVICE: "vibecode-webgui"
  DD_VERSION: "1.0.0"
  DD_TRACE_ENABLED: "true"
  DD_LOGS_INJECTION: "true"
  DD_IAST_ENABLED: "true"
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_DYNAMIC_INSTRUMENTATION_ENABLED: "true"
  DD_SOURCE_MAP: "true"
  DD_PROFILING_ENABLED: "true"
  DD_SITE: "datadoghq.com"
  DD_AGENT_HOST: "datadog.datadog.svc.cluster.local"
  DD_TRACE_AGENT_PORT: "8126"
  DD_LLMOBS_ENABLED: "1"
  DD_LLMOBS_AGENTLESS_ENABLED: "1"
  DD_LLMOBS_ML_APP: "vibecode-ai"
  DD_DOGSTATSD_HOST: "datadog.datadog.svc.cluster.local"
  VIBECODE_DEFAULT_LLM_MODEL: "mistralai/mistral-small-3.2-24b-instruct:free"
  OPENROUTER_FREE_MODEL: "openai/gpt-oss-20b:free"
  FREE_LLM_MODELS: |
    mistralai/mistral-small-3.2-24b-instruct:free
    openai/gpt-oss-20b:free
    openai/gpt-oss-120b:free
    x-ai/grok-4-fast:free
    deepseek/deepseek-chat-v3.1:free
    nvidia/nemotron-nano-9b-v2:free
    z-ai/glm-4.5-air:free
    google/gemma-3n-e4b-it:free
  FREE_LLM_MODELS_FILE: /etc/vibecode/free-llm-models/models.txt
  REDIS_URL: "redis://valkey-service.vibecode-platform.svc.cluster.local:6379"
  VALKEY_URL: "redis://valkey-service.vibecode-platform.svc.cluster.local:6379"
  VECTOR_DB_CACHE_ENABLED: "true"

freeModelUpdater:
  enabled: true
  schedule: "15 */12 * * *"
  maxFreeModels: 10
  minWorkingModels: 3
  syncConfigMap: true
  backoffLimit: 1
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  ttlSecondsAfterFinished: 172800
  configMap:
    name: ""
    jsonKey: models.json
    textKey: models.txt
    mountPath: /etc/vibecode/free-llm-models
    filePath: /etc/vibecode/free-llm-models/models.txt
  initialModels:
    - deepseek/deepseek-chat-v3.1:free
    - openai/gpt-oss-20b:free
    - openai/gpt-oss-120b:free
    - x-ai/grok-4-fast:free
    - nvidia/nemotron-nano-9b-v2:free
  env: {}
  resources:
    limits:
      cpu: 250m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

# Secret management with Azure Key Vault
secrets:
  enabled: true
  provider: "azure-keyvault"  # or "kubernetes"
  keyVault:
    name: "vibecode-keyvault"
    resourceGroup: "vibecode-rg"
    subscriptionId: ""  # Set during deployment
    tenantId: ""        # Set during deployment
  keys:
    - name: "database-url"
      key: "DATABASE-URL"
    - name: "nextauth-secret"
      key: "NEXTAUTH-SECRET"
    - name: "openrouter-api-key"
      key: "OPENROUTER-API-KEY"
    - name: "dd-api-key"
      key: "DD-API-KEY"

# Database configuration
database:
  type: "postgresql"
  host: "postgresql.vibecode-platform.svc.cluster.local"
  port: 5432
  name: "vibecode"
  ssl: false
  
# Redis/Valkey configuration
redis:
  enabled: true
  host: "valkey-service.vibecode-platform.svc.cluster.local"
  port: 6379
  ssl: false

aiGateway:
  enabled: true
  replicaCount: 2
  image:
    repository: vibecodecr6c3db0e6.azurecr.io/vibecode-ai-gateway
    tag: latest
    pullPolicy: Always
  secretName: ai-gateway-secrets
  env:
    NODE_ENV: production
    PORT: "3001"
    HOST: 0.0.0.0
    PROVIDERS_ENABLED: openrouter
    DISABLE_REDIS: "true"
    ALLOW_START_WITHOUT_REDIS: "true"
    ENABLE_METRICS: "true"
    ENABLE_TRACING: "false"
    DD_ENV: production
    DD_SERVICE: vibecode-ai-gateway
    DD_LOGS_INJECTION: "true"
    DD_RUNTIME_METRICS_ENABLED: "true"
    DD_TRACE_ENABLED: "true"
    DD_AGENT_HOST: datadog-cluster-agent.datadog.svc.cluster.local
    DD_TRACE_AGENT_PORT: "8126"
  readinessProbe:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 15
  livenessProbe:
    path: /health/live
    initialDelaySeconds: 30
    periodSeconds: 20
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    host: vibecode.eastus2.cloudapp.azure.com
    path: /ai-gateway(/|$)(.*)
    pathType: ImplementationSpecific
    tls:
      - hosts:
          - vibecode.eastus2.cloudapp.azure.com
        secretName: vibecode-tls

# Health checks
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Startup probe for slow startup
startupProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

# Monitoring and observability
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
  datadog:
    enabled: true
    annotations:
      ad.datadoghq.com/vibecode.check_names: '["http_check"]'
      ad.datadoghq.com/vibecode.init_configs: '[{}]'
      ad.datadoghq.com/vibecode.instances: '[{"name":"vibecode-health","url":"http://%%host%%:%%port%%/api/health","timeout":5}]'

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              name: datadog
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: vibecode-platform
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
    - to:
        - namespaceSelector:
            matchLabels:
              name: datadog
      ports:
        - protocol: TCP
          port: 8126  # Datadog APM trace agent
        - protocol: UDP
          port: 8125  # DogStatsD metrics
    - to: []
      ports:
        - protocol: TCP
          port: 443   # HTTPS outbound
        - protocol: TCP
          port: 80    # HTTP outbound
        - protocol: UDP
          port: 53    # DNS

# Service mesh integration (if using Istio)
serviceMesh:
  enabled: false
  istio:
    enabled: false
    virtualService:
      enabled: false
    destinationRule:
      enabled: false

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30d"
  storageAccount: "vibecodebkp"
  containerName: "backups"

# Migration jobs
migrations:
  enabled: true
  image:
    repository: "vibecodecr6c3db0e6.azurecr.io/vibecode-webgui"
    tag: "latest"
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi
  activeDeadlineSeconds: 600
  restartPolicy: Never
  backoffLimit: 3

# Init containers
initContainers:
  - name: wait-for-db
    image: busybox:1.35
    command:
      - sh
      - -c
      - |
        until nc -z postgresql.vibecode-platform.svc.cluster.local 5432; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready!"

# Additional labels and annotations
podLabels:
  app.kubernetes.io/component: "frontend"
  app.kubernetes.io/part-of: "vibecode-platform"
  tier: "application"

podAnnotations:
  # Prometheus scraping
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  
  # Datadog annotations
  ad.datadoghq.com/vibecode.logs: '[{"source":"nodejs","service":"vibecode-webgui","log_processing_rules":[{"type":"multi_line","name":"log_start_with_date","pattern":"\\d{4}-\\d{2}-\\d{2}"}]}]'
  
  # Azure annotations
  azure.workload.identity/use: "true"

# RBAC
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps", "secrets"]
      verbs: ["get", "list", "watch"]

# Service account
serviceAccount:
  create: true
  name: "vibecode-app"
  annotations:
    azure.workload.identity/client-id: ""  # Set during deployment
    azure.workload.identity/tenant-id: ""  # Set during deployment

# Pod security standards
podSecurityStandards:
  enforce: "restricted"
  audit: "restricted"
  warn: "restricted"
