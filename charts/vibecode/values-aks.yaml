# Production values for VibeCode WebGUI on Azure Kubernetes Service (AKS)
# This file contains Azure-specific configurations for production deployment

# Global configuration
global:
  imageRegistry: ""
  storageClass: "managed-csi"
  
# Application image configuration
image:
  registry: ""  # Will be set to ACR during deployment
  repository: "vibecode-webgui"
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Deployment configuration
replicaCount: 3

# Resource allocation for production workloads
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Pod security context
podSecurityContext:
  fsGroup: 1001
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

# Node selection and affinity for Azure
nodeSelector:
  kubernetes.io/os: linux

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: "agentpool"
              operator: "In"
              values: ["application", "system"]
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: "app.kubernetes.io/name"
                operator: In
                values: ["vibecode"]
          topologyKey: "kubernetes.io/hostname"

# Tolerations for Azure node pools
tolerations:
  - key: "kubernetes.azure.com/scalesetpriority"
    operator: "Equal"
    value: "spot"
    effect: "NoSchedule"

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-backend-protocol: "tcp"

# Ingress configuration for Azure Application Gateway or NGINX
ingress:
  enabled: true
  className: "azure-application-gateway"  # or "nginx"
  annotations:
    kubernetes.io/ingress.class: "azure-application-gateway"
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/connection-draining: "true"
    appgw.ingress.kubernetes.io/connection-draining-timeout: "30"
    appgw.ingress.kubernetes.io/backend-protocol: "http"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: vibecode.eastus.cloudapp.azure.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vibecode-tls
      hosts:
        - vibecode.eastus.cloudapp.azure.com

# Persistent storage for uploads and cache
persistence:
  enabled: true
  storageClass: "managed-csi"
  accessMode: ReadWriteOnce
  size: 50Gi
  mountPath: /app/uploads
  annotations:
    volume.beta.kubernetes.io/storage-class: "managed-csi"

# Environment variables
env:
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  DD_ENV: "production"
  DD_SERVICE: "vibecode-webgui"
  DD_VERSION: "1.0.0"
  DD_TRACE_ENABLED: "true"
  DD_LOGS_INJECTION: "true"
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_DYNAMIC_INSTRUMENTATION_ENABLED: "true"
  DD_SOURCE_MAP: "true"
  DD_PROFILING_ENABLED: "true"

# Secret management with Azure Key Vault
secrets:
  enabled: true
  provider: "azure-keyvault"  # or "kubernetes"
  keyVault:
    name: "vibecode-keyvault"
    resourceGroup: "vibecode-rg"
    subscriptionId: ""  # Set during deployment
    tenantId: ""        # Set during deployment
  keys:
    - name: "database-url"
      key: "DATABASE-URL"
    - name: "nextauth-secret"
      key: "NEXTAUTH-SECRET"
    - name: "openrouter-api-key"
      key: "OPENROUTER-API-KEY"
    - name: "dd-api-key"
      key: "DD-API-KEY"

# Database configuration
database:
  type: "postgresql"
  host: "postgres-service.vibecode-platform.svc.cluster.local"
  port: 5432
  name: "vibecode"
  ssl: true
  
# Redis/Valkey configuration
redis:
  enabled: true
  host: "valkey.vibecode-platform.svc.cluster.local"
  port: 6379
  ssl: false

# Health checks
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Startup probe for slow startup
startupProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 12

# Monitoring and observability
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
  datadog:
    enabled: true
    annotations:
      ad.datadoghq.com/vibecode.check_names: '["http_check"]'
      ad.datadoghq.com/vibecode.init_configs: '[{}]'
      ad.datadoghq.com/vibecode.instances: '[{"name":"vibecode-health","url":"http://%%host%%:%%port%%/api/health","timeout":5}]'

# Network policies
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              name: datadog
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: vibecode-platform
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
    - to: []
      ports:
        - protocol: TCP
          port: 443   # HTTPS outbound
        - protocol: TCP
          port: 80    # HTTP outbound
        - protocol: UDP
          port: 53    # DNS

# Service mesh integration (if using Istio)
serviceMesh:
  enabled: false
  istio:
    enabled: false
    virtualService:
      enabled: false
    destinationRule:
      enabled: false

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30d"
  storageAccount: "vibecodebkp"
  containerName: "backups"

# Migration jobs
migrations:
  enabled: true
  image:
    repository: "vibecode-webgui"
    tag: "latest"
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 512Mi
  activeDeadlineSeconds: 600
  restartPolicy: Never
  backoffLimit: 3

# Init containers
initContainers:
  - name: wait-for-db
    image: busybox:1.35
    command:
      - sh
      - -c
      - |
        until nc -z postgres-service.vibecode-platform.svc.cluster.local 5432; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done
        echo "PostgreSQL is ready!"

# Additional labels and annotations
podLabels:
  app.kubernetes.io/component: "frontend"
  app.kubernetes.io/part-of: "vibecode-platform"
  tier: "application"

podAnnotations:
  # Prometheus scraping
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  
  # Datadog annotations
  ad.datadoghq.com/vibecode.logs: '[{"source":"nodejs","service":"vibecode-webgui","log_processing_rules":[{"type":"multi_line","name":"log_start_with_date","pattern":"\\d{4}-\\d{2}-\\d{2}"}]}]'
  
  # Azure annotations
  azure.workload.identity/use: "true"

# RBAC
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps", "secrets"]
      verbs: ["get", "list", "watch"]

# Service account
serviceAccount:
  create: true
  name: "vibecode-app"
  annotations:
    azure.workload.identity/client-id: ""  # Set during deployment
    azure.workload.identity/tenant-id: ""  # Set during deployment

# Pod security standards
podSecurityStandards:
  enforce: "restricted"
  audit: "restricted"
  warn: "restricted"
