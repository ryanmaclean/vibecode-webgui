image:
  repository: ghcr.io/berriai/litellm-pgvector
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: litellm.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  ENVIRONMENT: "production"
  DEFAULT_MODEL: "openai/gpt-oss-20b:free"
  LITELLM_MASTER_KEY: ""
  OPENROUTER_HTTP_REFERER: "https://vibecode.dev"
  OPENROUTER_APP_TITLE: "VibeCode WebGUI"

envSecretName: ""
extraEnv: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

persistence:
  enabled: false
  size: 1Gi

postgresql:
  enabled: true
  fullnameOverride: litellm-pgvector-postgresql
  auth:
    username: litellm
    database: litellm
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi

migrations:
  enabled: false
  image:
    repository: ghcr.io/berriai/litellm-pgvector
    tag: latest
    pullPolicy: IfNotPresent
  command:
    - /bin/sh
    - -c
  args:
    - |
      echo "Running placeholder migrations" && sleep 5

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
