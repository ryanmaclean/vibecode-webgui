{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "litellm-pgvector.fullname" . }}-migrations
  labels:
    {{- include "litellm-pgvector.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "litellm-pgvector.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          imagePullPolicy: {{ .Values.migrations.image.pullPolicy }}
          command: {{ toYaml .Values.migrations.command | nindent 10 }}
          args: {{ toYaml .Values.migrations.args | nindent 10 }}
          env:
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(POSTGRES_PASSWORD)@%s.%s.svc.cluster.local:%s/%s?sslmode=disable" .Values.postgresql.auth.username (include "litellm-pgvector.postgresql.host" .) .Release.Namespace (include "litellm-pgvector.postgresql.port" .) .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "litellm-pgvector.postgresql.secretName" . }}
                  key: {{ ternary "postgres-password" "password" (eq .Values.postgresql.auth.username "postgres") }}
{{- if .Values.envSecretName }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: OPENROUTER_API_KEY
{{- end }}
{{- if .Values.extraEnv }}
{{ toYaml .Values.extraEnv | indent 12 }}
{{- end }}
{{- end }}
