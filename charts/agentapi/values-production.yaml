# Production environment values
# High availability with full monitoring

global:
  environment: production
  cloudProvider: aws

# High availability with multiple replicas
replicaCount: 5

# Code-server configuration (production resources)
codeserver:
  image:
    repository: ghcr.io/ryanmaclean/vibecode-codeserver
    tag: v1.0.0  # Pin to specific version
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi

  workspace:
    storageClass: "fast-ssd"  # High-performance storage
    size: 100Gi
    accessMode: ReadWriteOnce

# AgentAPI configuration
agentapi:
  image:
    repository: ghcr.io/ryanmaclean/vibecode-agentapi
    tag: v0.1.0  # Pin to specific version
    pullPolicy: IfNotPresent

  config:
    host: 127.0.0.1
    port: 3284
    logLevel: warn
    maxConcurrentAgents: 10
    agentTimeout: 600  # 10 minutes for production

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

# External managed PostgreSQL (RDS Multi-AZ)
postgresql:
  enabled: false

externalPostgresql:
  enabled: true
  host: ""  # Set via Terraform output
  port: 5432
  username: vibecode
  password: ""  # Set via --set-sensitive
  database: vibecode_production
  sslMode: require

# External managed Redis (Elasticache Sentinel)
redis:
  enabled: false

externalRedis:
  enabled: true
  host: ""  # Set via Terraform output
  port: 6379
  password: ""  # Set via --set-sensitive
  database: 0

# Production ingress with TLS
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "10"
  hosts:
    - host: workspace.vibecode.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: workspace-production-tls
      hosts:
        - workspace.vibecode.com

# Production autoscaling
autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

# Pod disruption budget for HA
podDisruptionBudget:
  enabled: true
  minAvailable: 3  # Maintain quorum

# Comprehensive monitoring
monitoring:
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
  datadog:
    enabled: true
    apiKeySecretName: datadog-secret
    site: datadoghq.com
    env: production

# Service account with IRSA (AWS)
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set via Terraform

# RBAC enabled
rbac:
  create: true

# Network policies for security
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# Pod affinity for HA across availability zones
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - code-server
        topologyKey: topology.kubernetes.io/zone
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - code-server
          topologyKey: kubernetes.io/hostname

# Node affinity for on-demand instances (production stability)
nodeSelector:
  workload-type: workspace
  instance-lifecycle: on-demand

# Update strategy for zero-downtime deployments
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 2

# Resource quotas per namespace
resourceQuotas:
  enabled: true
  hard:
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    persistentvolumeclaims: "20"

# Security context (strict)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Pod annotations for monitoring
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: "/metrics"
  ad.datadoghq.com/agentapi.logs: '[{"source":"agentapi","service":"vibecode"}]'
  ad.datadoghq.com/code-server.logs: '[{"source":"code-server","service":"vibecode"}]'
