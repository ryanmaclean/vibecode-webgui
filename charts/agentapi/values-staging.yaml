# Staging environment values
# Production-like setup with reduced resources

global:
  environment: staging
  cloudProvider: aws

# Multiple replicas for testing HA
replicaCount: 2

# Code-server configuration
codeserver:
  image:
    tag: latest  # Use latest for staging
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  workspace:
    size: 30Gi

# AgentAPI configuration
agentapi:
  image:
    tag: latest
    pullPolicy: IfNotPresent

  config:
    logLevel: info
    maxConcurrentAgents: 5

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# External managed PostgreSQL (populate from Terraform outputs)
postgresql:
  enabled: false

externalPostgresql:
  enabled: true
  host: ""  # Set via --set-sensitive
  port: 5432
  username: vibecode
  password: ""  # Set via --set-sensitive
  database: vibecode_staging
  sslMode: require

# External managed Redis
redis:
  enabled: false

externalRedis:
  enabled: true
  host: ""  # Set via --set-sensitive
  port: 6379
  password: ""  # Set via --set-sensitive
  database: 0

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: workspace-staging.vibecode.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: workspace-staging-tls
      hosts:
        - workspace-staging.vibecode.dev

# Enable autoscaling with conservative limits
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Pod disruption budget for testing
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Full monitoring enabled
monitoring:
  prometheus:
    enabled: true
  datadog:
    enabled: true
    env: staging

# Network policies enabled
networkPolicy:
  enabled: true

# Node affinity for cost optimization (spot instances)
nodeSelector:
  workload-type: workspace
  instance-lifecycle: spot

tolerations:
  - key: spot-instance
    value: "true"
    effect: NoSchedule
