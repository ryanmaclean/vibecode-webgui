# AKS overrides for vibecode-platform

global:
  domain: "example.cloudapp.azure.com"
  storageClass: managed-csi-premium
  imagePullSecrets:
    - name: acr-pull

web:
  image:
    repository: "<ACR>.azurecr.io/vibecode-webgui"
    tag: "latest"
    pullPolicy: IfNotPresent
  nodeEnv: "production"

postgresql:
  enabled: false

redis:
  enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
