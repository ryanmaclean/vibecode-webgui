{{- if .Values.primaryDatabaseExternalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.primaryDatabaseExternalSecret.name | default "primary-database" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  refreshInterval: {{ .Values.primaryDatabaseExternalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.primaryDatabaseExternalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ .Values.primaryDatabaseExternalSecret.secretStoreRef.name | default "akv-store" }}
  target:
    name: {{ .Values.primaryDatabaseExternalSecret.target.name | default (.Values.primaryDatabaseExternalSecret.name | default "primary-database") }}
    creationPolicy: {{ .Values.primaryDatabaseExternalSecret.target.creationPolicy | default "Owner" }}
  data:
    - secretKey: {{ .Values.primaryDatabaseExternalSecret.data.secretKey | default "url" }}
      remoteRef:
        key: {{ .Values.primaryDatabaseExternalSecret.data.remoteRef.key | default "prod-db-url" }}
        {{- if .Values.primaryDatabaseExternalSecret.data.remoteRef.property }}
        property: {{ .Values.primaryDatabaseExternalSecret.data.remoteRef.property }}
        {{- end }}
{{- end }}
