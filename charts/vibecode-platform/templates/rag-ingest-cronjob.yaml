{{- if .Values.ragIngest.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vibecode-platform.fullname" . }}-rag-ingest
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vibecode-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: rag-ingest
spec:
  schedule: {{ .Values.ragIngest.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "vibecode-platform.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: rag-ingest
        spec:
          restartPolicy: OnFailure
          {{- /* Prefer per-job imagePullSecrets override, else fallback to global */}}
          {{- $pullSecrets := .Values.ragIngest.imagePullSecrets | default .Values.global.imagePullSecrets }}
          {{- with $pullSecrets }}
          imagePullSecrets:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* Attempt to auto-detect a primary DB URL secret if none provided */}}
          {{- $autoDbSecret := (lookup "v1" "Secret" .Release.Namespace "primary-database") }}
          containers:
            - name: rag-ingest
              image: "{{ .Values.ragIngest.image.repository }}:{{ .Values.ragIngest.image.tag }}"
              imagePullPolicy: {{ .Values.ragIngest.image.pullPolicy }}
              env:
                # Database URL to in-cluster Postgres service created by this chart
                {{- if .Values.ragIngest.databaseUrl }}
                - name: DATABASE_URL
                  value: {{ .Values.ragIngest.databaseUrl | quote }}
                {{- else if .Values.ragIngest.databaseUrlSecret.name }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.ragIngest.databaseUrlSecret.name }}
                      key: {{ .Values.ragIngest.databaseUrlSecret.key | default "url" }}
                {{- else if $autoDbSecret }}
                {{- if (hasKey $autoDbSecret.data (default "url" .Values.ragIngest.databaseUrlSecret.key)) }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: primary-database
                      key: {{ .Values.ragIngest.databaseUrlSecret.key | default "url" }}
                {{- else }}
                - name: DATABASE_URL
                  value: {{ printf "postgresql://%s:%s@%s:%d/%s" "vibecode" "changeme-in-production" (printf "%s-postgres" (include "vibecode-platform.fullname" .)) 5432 "vibecode_dev" | quote }}
                {{- end }}
                {{- else }}
                - name: DATABASE_URL
                  value: {{ printf "postgresql://%s:%s@%s:%d/%s" "vibecode" "changeme-in-production" (printf "%s-postgres" (include "vibecode-platform.fullname" .)) 5432 "vibecode_dev" | quote }}
                {{- end }}
                # Embedding configuration
                - name: USE_LOCAL_EMBEDDINGS
                  value: {{ ternary "true" "false" .Values.ragIngest.useLocalEmbeddings | quote }}
                - name: RAG_DOCS_PATH
                  value: {{ .Values.ragIngest.docsPath | quote }}
                - name: RAG_SKIP_TEST_SEARCH
                  value: "true"
                # Optional: OpenAI / OpenRouter / Azure OpenAI, if mounted via secrets
                {{- if .Values.chatUi.secrets.openaiApiKey }}
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "vibecode-platform.fullname" . }}-chat-ui-secrets
                      key: openai-api-key
                {{- end }}
              resources:
                {{- toYaml .Values.ragIngest.resources | nindent 16 }}
{{- end }}
