title = "Vibecode Secrets Policy"

# Gate: `gitleaks dir --config .gitleaks.toml --redact .` must report 0 findings
# (gitleaks 8.30.1, see .github/workflows/gitleaks.yml). Known test fixtures are
# allowlisted by fingerprint in .gitleaksignore, never by directory or stopword.

[extend]
useDefault = true

[allowlist]
description = "Vendored deps and password-masking code (not secrets)"
paths = [
  '''(^|/)node_modules/''',
  '''^src/lib/vector-db/DatabaseTracing\.ts$''',
  '''^src/lib/monitoring/distributed-tracing\.ts$''',
]
regexes = [
  # Password masking (replacing values with ***)
  '''password\s*=\s*['"]\*{1,}['"]''',
  # Obvious placeholders
  '''sk-[xX]{20,}''',
  '''AKIA[X]{16}''',
]

[[rules]]
id = "datadog-api-key-pattern"
description = "Datadog dapi_ token"
regex = '''dapi_[A-Za-z0-9]{20,}'''
keywords = ["dapi_"]

[[rules]]
id = "env-var-datadog-keys"
description = "Datadog API (32 hex) or application (40 hex) key assigned to a DD_* variable"
regex = '''(?i)\b(?:DD_API_KEY|DATADOG_API_KEY|DD_APP_KEY|DD_APPLICATION_KEY|DATADOG_APP_KEY|DATADOG_APPLICATION_KEY)['"]?\s*[:=]\s*['"]?([a-f0-9]{40}|[a-f0-9]{32})\b'''
secretGroup = 1
keywords = ["dd_api_key", "datadog_api_key", "dd_app_key", "dd_application_key", "datadog_app_key", "datadog_application_key"]
