# Simple test application deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibecode-test-app
  namespace: vibecode-webgui-staging
  labels:
    app: vibecode-webgui
    environment: staging
    test: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibecode-webgui
      test: "true"
  template:
    metadata:
      labels:
        app: vibecode-webgui
        test: "true"
    spec:
      containers:
      - name: vibecode-test
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: ENVIRONMENT
          value: "staging"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vibecode-test-service
  namespace: vibecode-webgui-staging
  labels:
    app: vibecode-webgui
    test: "true"
spec:
  type: NodePort
  selector:
    app: vibecode-webgui
    test: "true"
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
    name: http