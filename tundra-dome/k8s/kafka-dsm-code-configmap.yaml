apiVersion: v1
data:
  bd-kafka-producer.js: |
    'use strict';

    require('dd-trace').init({
      service: process.env.DD_SERVICE || 'gastown-bd-producer',
      env: process.env.DD_ENV || 'local',
      version: process.env.DD_VERSION || '0.1.0',
      logInjection: true
    });

    const { execFileSync } = require('child_process');
    const { Kafka } = require('kafkajs');
    const fs = require('fs');

    const BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');
    const TOPIC = process.env.KAFKA_TOPIC || 'tundra-beads-created';
    const STATE_PATH = process.env.BD_SYNC_STATE || '/Users/studio/gt/daemon/bd-kafka-producer.state.json';

    function loadState() {
      try {
        return JSON.parse(fs.readFileSync(STATE_PATH, 'utf8'));
      } catch {
        return { last: {} };
      }
    }

    function saveState(state) {
      fs.writeFileSync(STATE_PATH, JSON.stringify(state));
    }

    function fetchReady() {
      const out = execFileSync('bd', ['ready', '--json'], { encoding: 'utf8' });
      return JSON.parse(out);
    }

    async function run() {
      const state = loadState();
      const ready = fetchReady();

      const kafka = new Kafka({ clientId: 'gastown-bd-producer', brokers: BROKERS });
      const producer = kafka.producer();
      await producer.connect();

      const messages = [];
      for (const issue of ready) {
        const id = issue.id || issue.bead || issue.key;
        if (!id) continue;
        const fingerprint = JSON.stringify(issue);
        if (state.last[id] === fingerprint) continue;
        state.last[id] = fingerprint;
        messages.push({
          value: JSON.stringify({
            event: 'bd.ready',
            ts: new Date().toISOString(),
            issue
          })
        });
      }

      if (messages.length) {
        await producer.send({ topic: TOPIC, messages });
      }

      await producer.disconnect();
      saveState(state);
    }

    run().catch((err) => {
      console.error('bd-kafka-producer error', err);
      process.exit(1);
    });
  bd-kafka-producer.sh: |
    #!/bin/zsh
    set -euo pipefail
    set -a
    source /Users/studio/gt/daemon/kafka-dsm/bd-kafka-producer.env
    set +a
    cd /Users/studio/gt/daemon/kafka-dsm
    exec /opt/homebrew/bin/node bd-kafka-producer.js
  consumer.js: |
    'use strict';

    require('dd-trace').init({
      service: process.env.DD_SERVICE || 'gastown-kafka-consumer',
      env: process.env.DD_ENV || 'local',
      version: process.env.DD_VERSION || '0.1.0',
      logInjection: true
    });

    const { Kafka } = require('kafkajs');

    const BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');
    const TOPIC = process.env.KAFKA_TOPIC || 'tundra-beads-created';
    const GROUP_ID = process.env.KAFKA_GROUP_ID || 'gastown-consumer';

    async function run() {
      const kafka = new Kafka({ clientId: 'gastown-consumer', brokers: BROKERS });
      const consumer = kafka.consumer({ groupId: GROUP_ID });
      await consumer.connect();
      await consumer.subscribe({ topic: TOPIC, fromBeginning: true });

      await consumer.run({
        eachMessage: async ({ message }) => {
          const value = message.value ? message.value.toString('utf8') : '';
          try {
            JSON.parse(value);
          } catch (err) {
            console.error('consumer parse error', err);
          }
        }
      });
    }

    run().catch((err) => {
      console.error('consumer error', err);
      process.exit(1);
    });
  gastown-to-tundra-bridge.env.example: |
    DD_SERVICE=gastown-to-tundra-bridge
    DD_ENV=local
    DD_VERSION=0.1.0
    DD_DATA_STREAMS_ENABLED=true
    DD_TRACE_ENABLED=true
    KAFKA_BROKERS=localhost:9092
    SOURCE_TOPIC=tundra-beads-created
    KAFKA_GROUP_ID=gastown-to-tundra-bridge
    BRIDGE_DRY_RUN=true
    TD_TOPIC_WORK=tundra-work-intake
    TD_TOPIC_CREATED=tundra-beads-created
    TD_LANE_PREFIX=tundra-lane
    TD_DEFAULT_LANE=standard
  gastown-to-tundra-bridge.js: |
    'use strict';

    require('dd-trace').init({
      service: process.env.DD_SERVICE || 'gastown-to-tundra-bridge',
      env: process.env.DD_ENV || 'local',
      version: process.env.DD_VERSION || '0.1.0',
      logInjection: true
    });

    const { Kafka } = require('kafkajs');

    const BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');
    const SOURCE_TOPIC = process.env.SOURCE_TOPIC || 'tundra-beads-created';
    const GROUP_ID = process.env.KAFKA_GROUP_ID || 'gastown-to-tundra-bridge';
    const DRY_RUN = (process.env.BRIDGE_DRY_RUN || '').toLowerCase() === 'true';

    const TD_TOPIC_WORK = process.env.TD_TOPIC_WORK || 'tundra-work-intake';
    const TD_TOPIC_CREATED = process.env.TD_TOPIC_CREATED || 'tundra-beads-created';
    const TD_LANE_PREFIX = process.env.TD_LANE_PREFIX || 'tundra-lane';
    const TD_DEFAULT_LANE = (process.env.TD_DEFAULT_LANE || 'standard').toLowerCase();

    async function run() {
      const kafka = new Kafka({ clientId: 'gastown-to-tundra-bridge', brokers: BROKERS });
      const consumer = kafka.consumer({ groupId: GROUP_ID });
      const producer = kafka.producer();

      await consumer.connect();
      await producer.connect();
      await consumer.subscribe({ topic: SOURCE_TOPIC, fromBeginning: false });

      await consumer.run({
        eachMessage: async ({ message }) => {
          const value = message.value ? message.value.toString('utf8') : '';
          if (!value) return;

          let evt;
          try {
            evt = JSON.parse(value);
          } catch {
            return;
          }

          const lane = (evt.lane || evt.payload?.lane || TD_DEFAULT_LANE || 'standard').toLowerCase();
          const laneTopic = `${TD_LANE_PREFIX}-${lane}-beads`;
          const payload = JSON.stringify({
            ...evt,
            source: evt.source || 'tundra-beads-created',
            bridge: 'gastown-to-tundra'
          });

          if (DRY_RUN) return;

          await producer.send({ topic: TD_TOPIC_WORK, messages: [{ value: payload }] });
          await producer.send({ topic: TD_TOPIC_CREATED, messages: [{ value: payload }] });
          await producer.send({ topic: laneTopic, messages: [{ value: payload }] });
        }
      });
    }

    run().catch((err) => {
      console.error('gastown-to-tundra-bridge error', err);
      process.exit(1);
    });
  github-issue-dispatcher.js: |
    'use strict';

    require('dd-trace').init({
      service: process.env.DD_SERVICE || 'gastown-github-dispatcher',
      env: process.env.DD_ENV || 'local',
      version: process.env.DD_VERSION || '0.1.0',
      logInjection: true
    });

    const fs = require('fs');
    const https = require('https');
    const { execFileSync } = require('child_process');
    const { Kafka } = require('kafkajs');

    const BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');
    const OWNER = process.env.GITHUB_OWNER || '';
    const REPO = process.env.GITHUB_REPO || '';
    const TOKEN = process.env.GITHUB_TOKEN || '';
    const API_BASE = process.env.GITHUB_API || 'https://api.github.com';
    const STATE_PATH = process.env.GITHUB_STATE_PATH || '/Users/studio/gt/logs/github-issues.state.json';
    const SINCE_DAYS = parseInt(process.env.GITHUB_SINCE_DAYS || '7', 10);
    const BD_CMD = process.env.BD_CMD || 'bd';
    const GT_CMD = process.env.GT_CMD || 'gt';
    const GT_AUTO_SLING = (process.env.GT_AUTO_SLING || '').toLowerCase() === 'true';
    const GT_AUTO_SLING_TARGET = process.env.GT_AUTO_SLING_TARGET || 'mayor';
    const DRY_RUN = (process.env.GITHUB_DRY_RUN || '').toLowerCase() === 'true';

    const LANE_CRITICAL = (process.env.GITHUB_LABEL_LANE_CRITICAL || 'critical,sev1,p0').split(',').map((s) => s.trim()).filter(Boolean);
    const LANE_STANDARD = (process.env.GITHUB_LABEL_LANE_STANDARD || 'standard,sev2,p1').split(',').map((s) => s.trim()).filter(Boolean);
    const LANE_EXPERIMENTAL = (process.env.GITHUB_LABEL_LANE_EXPERIMENTAL || 'experimental,spike,idea').split(',').map((s) => s.trim()).filter(Boolean);

    const PRIORITY_MAP = (process.env.GITHUB_PRIORITY_MAP || 'p0:0,p1:1,p2:2,p3:3,p4:4,critical:0,high:1,medium:2,low:3').split(',')
      .map((pair) => pair.trim())
      .filter(Boolean)
      .reduce((acc, pair) => {
        const [label, value] = pair.split(':');
        if (!label || value === undefined) return acc;
        acc[label.toLowerCase()] = value;
        return acc;
      }, {});

    function loadState() {
      try {
        const raw = fs.readFileSync(STATE_PATH, 'utf8');
        return JSON.parse(raw);
      } catch {
        return { since: null, seen: [] };
      }
    }

    function saveState(state) {
      fs.writeFileSync(STATE_PATH, JSON.stringify(state, null, 2));
    }

    function requestJson(url) {
      return new Promise((resolve, reject) => {
        const opts = new URL(url);
        const headers = {
          'User-Agent': 'gastown-github-dispatcher',
          'Accept': 'application/vnd.github+json'
        };
        if (TOKEN) headers.Authorization = `Bearer ${TOKEN}`;

        const req = https.request({
          hostname: opts.hostname,
          path: opts.pathname + opts.search,
          method: 'GET',
          headers
        }, (res) => {
          let data = '';
          res.on('data', (chunk) => { data += chunk; });
          res.on('end', () => {
            if (res.statusCode && res.statusCode >= 200 && res.statusCode < 300) {
              try {
                resolve(JSON.parse(data));
              } catch (err) {
                reject(err);
              }
              return;
            }
            reject(new Error(`GitHub API ${res.statusCode}: ${data}`));
          });
        });
        req.on('error', reject);
        req.end();
      });
    }

    function issueLane(labels) {
      const set = new Set(labels.map((l) => l.toLowerCase()));
      if (LANE_CRITICAL.some((label) => set.has(label))) return 'critical';
      if (LANE_EXPERIMENTAL.some((label) => set.has(label))) return 'experimental';
      if (LANE_STANDARD.some((label) => set.has(label))) return 'standard';
      return 'standard';
    }

    function issuePriority(labels) {
      for (const label of labels) {
        const mapped = PRIORITY_MAP[label.toLowerCase()];
        if (mapped !== undefined) return mapped;
      }
      return '2';
    }

    function buildDescription(issue) {
      const body = issue.body ? issue.body.trim() : '';
      const link = issue.html_url || '';
      const meta = [
        `GitHub: ${link}`,
        `Repo: ${OWNER}/${REPO}`,
        `Issue: #${issue.number}`,
        `Author: ${issue.user ? issue.user.login : 'unknown'}`
      ].join('\n');
      if (!body) return meta;
      return `${meta}\n\n${body}`;
    }

    function createBead(issue, priority, labels) {
      const title = issue.title || `GitHub issue #${issue.number}`;
      const description = buildDescription(issue);
      const externalRef = `gh-${issue.number}`;
      const args = [
        'create',
        '--title', title,
        '--description', description,
        '--external-ref', externalRef,
        '--priority', String(priority),
        '--labels', labels.join(','),
        '--silent'
      ];
      const output = execFileSync(BD_CMD, args, { encoding: 'utf8' }).trim();
      return output || null;
    }

    function sendKafka(topic, payload) {
      const kafka = new Kafka({ clientId: 'gastown-github-dispatcher', brokers: BROKERS });
      const producer = kafka.producer();
      return producer.connect()
        .then(() => producer.send({ topic, messages: [{ value: JSON.stringify(payload) }] }))
        .then(() => producer.disconnect());
    }

    async function run() {
      if (!OWNER || !REPO) throw new Error('GITHUB_OWNER and GITHUB_REPO are required');
      if (!TOKEN) throw new Error('GITHUB_TOKEN is required');

      const state = loadState();
      const since = state.since || new Date(Date.now() - SINCE_DAYS * 86400000).toISOString();

      const url = `${API_BASE}/repos/${OWNER}/${REPO}/issues?state=open&per_page=100&since=${encodeURIComponent(since)}`;
      const issues = await requestJson(url);
      const seen = new Set(state.seen || []);
      let newest = state.since || since;

      for (const issue of issues) {
        if (issue.pull_request) continue;
        if (seen.has(issue.id)) continue;
        const labels = (issue.labels || []).map((label) => label.name || '').filter(Boolean);
        const lane = issueLane(labels);
        const priority = issuePriority(labels);
        if (DRY_RUN) {
          seen.add(issue.id);
          if (issue.updated_at && issue.updated_at > newest) newest = issue.updated_at;
          continue;
        }

        const beadId = createBead(issue, priority, labels);
        if (!beadId) continue;

        await sendKafka(`tundra-lane-${lane}-beads`, {
          ts: new Date().toISOString(),
          type: 'issue',
          action: 'created',
          lane,
          priority,
          bead: beadId,
          issue: {
            id: issue.id,
            number: issue.number,
            title: issue.title,
            url: issue.html_url,
            labels
          }
        });

        if (GT_AUTO_SLING) {
          try {
            execFileSync(GT_CMD, ['sling', beadId, GT_AUTO_SLING_TARGET], { stdio: 'ignore' });
          } catch {
            // ignore sling errors
          }
        }

        seen.add(issue.id);
        if (issue.updated_at && issue.updated_at > newest) newest = issue.updated_at;
      }

      state.since = newest;
      state.seen = Array.from(seen).slice(-2000);
      saveState(state);
    }

    run().catch((err) => {
      console.error('github-issue-dispatcher error', err.message || err);
      process.exit(1);
    });
  github-issue-dispatcher.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
    ENV_FILE="$DIR/github-issue-dispatcher.env"
    if [ -f "$ENV_FILE" ]; then
      set -a
      # shellcheck disable=SC1090
      source "$ENV_FILE"
      set +a
    fi
    node "$DIR/github-issue-dispatcher.js"
  gt-action-producer.js: |
    'use strict';

    require('dd-trace').init({
      service: process.env.DD_SERVICE || 'gastown-action-producer',
      env: process.env.DD_ENV || 'local',
      version: process.env.DD_VERSION || '0.1.0',
      logInjection: true
    });

    const { Kafka } = require('kafkajs');

    const BROKERS = (process.env.KAFKA_BROKERS || 'localhost:9092').split(',');
    const TOPIC = process.env.KAFKA_TOPIC || 'tundra-beads-created';
    const TARGET = process.env.GT_ACTION_TARGET || 'mayor';
    const MESSAGE = process.env.GT_ACTION_MESSAGE || 'Tundra Dome: action ping';
    const ACTION = process.env.GT_ACTION || 'nudge';

    async function run() {
      const kafka = new Kafka({ clientId: 'gastown-action-producer', brokers: BROKERS });
      const producer = kafka.producer();
      await producer.connect();
      await producer.send({
        topic: TOPIC,
        messages: [{
          value: JSON.stringify({
            action: ACTION,
            target: TARGET,
            message: MESSAGE,
            ts: new Date().toISOString()
          })
        }]
      });
      await producer.disconnect();
    }

    run().catch((err) => {
      console.error('gt-action-producer error', err);
      process.exit(1);
    });
