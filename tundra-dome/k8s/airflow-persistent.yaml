# Airflow Persistent Deployment for Tundra Dome
# Uses custom image with pre-installed packages and PVC for state persistence
# Designed for KIND clusters: kind-tundra-dome, kind-gastown, kind-vibecode-local
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-data
  namespace: tundra-dome
  labels:
    app: airflow-api-server
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi  # Small footprint for KIND
  storageClassName: standard  # KIND local-path provisioner
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-dags
  namespace: tundra-dome
  labels:
    app: airflow-api-server
    component: dags
data:
  tundra_dome_kafka.py: |
    from __future__ import annotations
    from datetime import datetime
    import json
    import os
    from airflow import DAG
    from airflow.operators.python import PythonOperator
    from kafka import KafkaProducer

    def emit_bead_event() -> None:
        brokers = os.environ.get("KAFKA_BROKERS", "localhost:9092").split(",")
        topic = os.environ.get("KAFKA_TOPIC", "tundra-beads-created")
        payload = {
            "ts": datetime.utcnow().isoformat() + "Z",
            "type": "hook",
            "bead": f"tundra-{int(datetime.utcnow().timestamp())}",
            "actor": "tundra/airflow",
            "payload": {"source": "airflow", "rig": "tundra"},
            "rig": "tundra",
            "role": "mayor",
            "stage": "hooked",
            "service": "gastown",
        }
        producer = KafkaProducer(bootstrap_servers=brokers)
        producer.send(topic, json.dumps(payload).encode("utf-8"))
        producer.flush(10)
        producer.close(5)

    default_args = {"owner": "tundra", "retries": 0}

    with DAG(
        dag_id="tundra_dome_kafka_emit",
        description="Emit real bead events into Kafka for DSM + GT/OC coordination",
        schedule="*/5 * * * *",
        start_date=datetime(2026, 2, 1),
        catchup=False,
        default_args=default_args,
        tags=["tundra", "gastown", "openclaw", "kafka"],
    ) as dag:
        PythonOperator(task_id="emit_bead_event", python_callable=emit_bead_event)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-openlineage-config
  namespace: tundra-dome
  labels:
    app: airflow-api-server
    component: openlineage
data:
  # HTTP transport to Datadog via OpenLineage endpoint
  TRANSPORT: |
    {"type": "http", "url": "https://api.datadoghq.com/api/intake/openlineage", "auth": {"type": "api_key", "api_key": "${DD_API_KEY}"}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-api-server
  namespace: tundra-dome
  labels:
    app: airflow-api-server
    component: airflow
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for PVC with ReadWriteOnce
  selector:
    matchLabels:
      app: airflow-api-server
  template:
    metadata:
      labels:
        app: airflow-api-server
        tags.datadoghq.com/service: airflow
        tags.datadoghq.com/env: tundra-dome
      annotations:
        # OpenLineage annotations for Datadog
        ad.datadoghq.com/airflow.logs: '[{"source": "airflow", "service": "airflow"}]'
    spec:
      # No init containers - packages are pre-installed in custom image
      containers:
      - name: airflow
        image: tundra-dome/airflow:latest
        imagePullPolicy: Never  # Local KIND image
        args: ["standalone"]
        env:
        - name: AIRFLOW__CORE__LOAD_EXAMPLES
          value: "false"
        - name: AIRFLOW__CORE__EXECUTOR
          value: "SequentialExecutor"
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: "/opt/airflow/dags"
        - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
          value: "false"  # Start DAGs unpaused by default
        - name: AIRFLOW__WEBSERVER__EXPOSE_CONFIG
          value: "true"
        - name: AIRFLOW__WEBSERVER__RBAC
          value: "false"  # Simpler auth for dev
        - name: KAFKA_BROKERS
          value: "kafka-service:9092"
        - name: KAFKA_TOPIC
          value: "tundra-beads-created"
        - name: AIRFLOW__OPENLINEAGE__NAMESPACE
          value: "tundra-dome-local"
        - name: AIRFLOW__OPENLINEAGE__TRANSPORT
          valueFrom:
            configMapKeyRef:
              name: airflow-openlineage-config
              key: TRANSPORT
        - name: DD_SERVICE
          value: "airflow"
        - name: DD_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-secret
              key: api-key
              optional: true
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: airflow-data
          mountPath: /opt/airflow
        - name: dags-src
          mountPath: /dags-src
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 3Gi  # Increased from 2Gi to prevent OOMKilled
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: airflow-data
        persistentVolumeClaim:
          claimName: airflow-data
      - name: dags-src
        configMap:
          name: airflow-dags
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-service
  namespace: tundra-dome
  labels:
    app: airflow-api-server
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app: airflow-api-server
