# Default values for vibecode-webgui
# This is a YAML-formatted file.

# Image configuration
image:
  repository: vibecodeacr.azurecr.io/vibecode-webgui
  tag: "latest"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
  annotations: {}

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: app.vibecode.dev
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vibecode-webgui-tls
      hosts:
        - app.vibecode.dev

# Deployment configuration
deployment:
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  # Container configuration
  container:
    port: 3000
    env:
      - name: NEXT_TELEMETRY_DISABLED
        value: "1"

  # Resource limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Health checks
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  # Security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1001
    capabilities:
      drop:
        - ALL

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

  # Node selector and tolerations
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Environment variables from secrets
envFrom:
  - secretRef:
      name: vibecode-webgui-secrets
      optional: true

# Horizontal Pod Autoscaler
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "vibecode-webgui"

# Network Policy
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    scrape: true
    port: 3000
    path: /metrics
  datadog:
    enabled: true
    tags:
      - "service:vibecode-webgui"
      - "component:webgui"
      - "tier:frontend"

# Datadog environment variables
datadog:
  env:
    DD_AGENT_HOST:
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    DD_SERVICE: "vibecode-webgui"
    DD_VERSION: "1.5.0"
    DD_ENV: "production"
    DD_LOGS_INJECTION: "true"
    DD_TRACE_ENABLED: "true"
    DD_PROFILING_ENABLED: "true"
    DD_RUNTIME_METRICS_ENABLED: "true"

# Additional labels and annotations
labels: {}
annotations: {}

# Environment-specific overrides
environment: production

# Volume configuration
volumes: []
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: next-cache
    mountPath: /app/.next/cache

# Default volumes for security
defaultVolumes:
  - name: tmp
    emptyDir: {}
  - name: next-cache
    emptyDir: {}
