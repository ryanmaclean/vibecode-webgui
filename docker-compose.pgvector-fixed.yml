version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: vibecode-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-vibecode-db.sh:/docker-entrypoint-initdb.d/init-vibecode-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecode -d vibecode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
