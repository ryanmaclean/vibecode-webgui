<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* ws://localhost:*; frame-src http://localhost:*; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>VibeCode - OpenVSCode Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
            z-index: 1000;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
        #vscode-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #007acc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #f48771;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div style="margin-top: 20px;">Starting OpenVSCode Server...</div>
        <div id="status">Initializing VM and services</div>
        <div id="error" class="error" style="display: none;"></div>
    </div>
    <iframe id="vscode-frame" src="http://localhost:8080" allow="fullscreen"></iframe>
    <script>
        console.log('VibeCode index.html loaded');
        
        const frame = document.getElementById('vscode-frame');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        const error = document.getElementById('error');
        
        let retryCount = 0;
        const maxRetries = 60; // 2 minutes total (60 * 2 seconds)
        
        function updateStatus(message) {
            console.log('Status:', message);
            status.textContent = message;
        }
        
        function showError(message) {
            error.textContent = message;
            error.style.display = 'block';
            console.error('Error:', message);
        }
        
        function checkOpenVSCode() {
            console.log(`Checking OpenVSCode Server (attempt ${retryCount + 1}/${maxRetries})...`);
            
            // Try to fetch the server
            fetch('http://localhost:8080', { 
                method: 'HEAD', 
                mode: 'no-cors',
                cache: 'no-cache'
            })
                .then(() => {
                    console.log('OpenVSCode Server detected!');
                    loading.style.display = 'none';
                    frame.style.display = 'block';
                    updateStatus('Connected!');
                })
                .catch((err) => {
                    retryCount++;
                    if (retryCount < maxRetries) {
                        const secondsRemaining = (maxRetries - retryCount) * 2;
                        updateStatus(`Waiting for OpenVSCode Server... (${secondsRemaining}s remaining)`);
                        setTimeout(checkOpenVSCode, 2000);
                    } else {
                        updateStatus('OpenVSCode Server did not start.');
                        showError('Please check VM status and ensure port forwarding is configured. The VM may need to be started manually.');
                    }
                });
        }
        
        frame.onload = function() {
            console.log('Iframe loaded successfully');
            loading.style.display = 'none';
            frame.style.display = 'block';
        };
        
        frame.onerror = function(e) {
            console.error('Iframe error:', e);
            showError('Failed to load OpenVSCode Server. Ensure VM is running and port 8080 is forwarded.');
        };
        
        // Start checking immediately
        console.log('Starting OpenVSCode Server check...');
        updateStatus('Checking for OpenVSCode Server...');
        setTimeout(checkOpenVSCode, 2000);
    </script>
</body>
</html>
