<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCode - OpenVSCode Server</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #cccccc;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #cccccc;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
        #vscode-frame {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #007acc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Starting OpenVSCode Server...</div>
        <div id="status">Initializing VM and services</div>
    </div>
    <iframe id="vscode-frame" src="http://localhost:8080"></iframe>
    <script>
        const frame = document.getElementById('vscode-frame');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        
        let retryCount = 0;
        const maxRetries = 60; // 2 minutes total (60 * 2 seconds)
        
        function updateStatus(message) {
            status.textContent = message;
        }
        
        function checkOpenVSCode() {
            fetch('http://localhost:8080', { method: 'HEAD', mode: 'no-cors' })
                .then(() => {
                    // Server is up
                    loading.style.display = 'none';
                    frame.style.display = 'block';
                    updateStatus('Connected!');
                })
                .catch(() => {
                    retryCount++;
                    if (retryCount < maxRetries) {
                        const secondsRemaining = (maxRetries - retryCount) * 2;
                        updateStatus(`Waiting for OpenVSCode Server... (${secondsRemaining}s remaining)`);
                        setTimeout(checkOpenVSCode, 2000);
                    } else {
                        updateStatus('OpenVSCode Server did not start. Please check VM status and ensure port forwarding is configured.');
                    }
                });
        }
        
        // Start checking after 5 seconds (give VM time to start)
        setTimeout(() => {
            updateStatus('Checking for OpenVSCode Server...');
            checkOpenVSCode();
        }, 5000);
        
        frame.onload = function() {
            loading.style.display = 'none';
            frame.style.display = 'block';
        };
        
        frame.onerror = function() {
            updateStatus('Failed to load OpenVSCode Server. Ensure VM is running and port 8080 is forwarded.');
        };
    </script>
</body>
</html>
