# PostgreSQL Read Replicas for Vector Database Horizontal Scaling
# This manifest provides read-only replicas for load distribution and high availability

apiVersion: v1
kind: Service
metadata:
  name: vector-db-read
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: database
    tier: read-replica
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: vector-db
    role: replica
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db-read-headless
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: database
    tier: read-replica
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: vector-db
    role: replica
---
# Connection routing service for intelligent read/write split
apiVersion: v1
kind: Service
metadata:
  name: vector-db-router
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: connection-router
spec:
  type: ClusterIP
  ports:
    - name: postgres-write
      port: 5432
      targetPort: 6432
      protocol: TCP
    - name: postgres-read
      port: 5433
      targetPort: 6433
      protocol: TCP
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP
  selector:
    app: vector-db-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-db-router
  namespace: vibecode-platform
  labels:
    app: vector-db-router
    component: connection-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-db-router
  template:
    metadata:
      labels:
        app: vector-db-router
        component: connection-router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: pgbouncer
          image: pgbouncer/pgbouncer:1.21.0
          imagePullPolicy: IfNotPresent
          
          env:
            - name: DATABASES_HOST
              value: "vector-db.vibecode-platform.svc.cluster.local"
            - name: DATABASES_PORT
              value: "5432"
            - name: DATABASES_USER
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: app-password
            - name: DATABASES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: app-password
            - name: DATABASES_DBNAME
              value: "vibecode"
            - name: POOL_MODE
              value: "transaction"
            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "50"
            - name: RESERVE_POOL_SIZE
              value: "5"
            - name: LISTEN_PORT
              value: "6432"
            - name: STATS_USERS
              value: "postgres"
            - name: ADMIN_USERS
              value: "postgres"
            - name: AUTH_TYPE
              value: "scram-sha-256"
          
          ports:
            - name: pgbouncer
              containerPort: 6432
              protocol: TCP
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          
          volumeMounts:
            - name: pgbouncer-config
              mountPath: /etc/pgbouncer
              readOnly: true
          
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 20
          
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
        
        # PgBouncer exporter for metrics
        - name: pgbouncer-exporter
          image: prometheuscommunity/pgbouncer-exporter:v0.7.0
          imagePullPolicy: IfNotPresent
          
          env:
            - name: PGBOUNCER_EXPORTER_HOST
              value: "localhost"
            - name: PGBOUNCER_EXPORTER_PORT
              value: "6432"
            - name: PGBOUNCER_EXPORTER_DATABASE
              value: "pgbouncer"
            - name: PGBOUNCER_EXPORTER_USER
              value: "postgres"
            - name: PGBOUNCER_EXPORTER_PASS
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: postgres-password
          
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      
      volumes:
        - name: pgbouncer-config
          configMap:
            name: pgbouncer-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: vibecode-platform
  labels:
    app: vector-db-router
    component: configuration
data:
  pgbouncer.ini: |
    [databases]
    vibecode_write = host=vector-db.vibecode-platform.svc.cluster.local port=5432 dbname=vibecode
    vibecode_read = host=vector-db-read.vibecode-platform.svc.cluster.local port=5432 dbname=vibecode
    
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/userlist.txt
    
    # Connection pooling
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 50
    reserve_pool_size = 5
    max_db_connections = 100
    
    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    
    # Security
    ignore_startup_parameters = extra_float_digits,application_name
    
    # Performance
    server_reset_query = DISCARD ALL
    server_check_query = SELECT 1
    server_check_delay = 30
    
    # Admin
    admin_users = postgres
    stats_users = postgres
    
  userlist.txt: |
    "postgres" "SCRAM-SHA-256$4096:placeholder$placeholder"
    "vibecode_app" "SCRAM-SHA-256$4096:placeholder$placeholder"
    "datadog" "SCRAM-SHA-256$4096:placeholder$placeholder"
---
# Read replica StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vector-db-replica
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: database
    role: replica
spec:
  serviceName: vector-db-read-headless
  replicas: 2
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: vector-db
      role: replica
  template:
    metadata:
      labels:
        app: vector-db
        component: database
        role: replica
        version: "16"
      annotations:
        # Prometheus monitoring
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
        
        # Datadog monitoring for read replicas
        ad.datadoghq.com/vector-db-replica.check_names: '["postgres"]'
        ad.datadoghq.com/vector-db-replica.init_configs: '[{}]'
        ad.datadoghq.com/vector-db-replica.instances: |
          [{
            "host": "%%host%%",
            "port": 5432,
            "username": "datadog",
            "password": "%%env_DD_POSTGRES_PASSWORD%%",
            "dbname": "vibecode",
            "ssl": "require",
            "tags": ["environment:production", "service:vector-db", "role:replica"],
            "collect_count_metrics": true,
            "collect_activity_metrics": true,
            "collect_database_size_metrics": false,
            "read_only": true
          }]
    spec:
      # Security context
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      
      # Node affinity for read replicas - prefer different nodes than primary
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            # Avoid same node as primary database
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["vector-db"]
                    - key: role
                      operator: In
                      values: ["primary"]
                topologyKey: kubernetes.io/hostname
            # Distribute replicas across nodes
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["vector-db"]
                    - key: role
                      operator: In
                      values: ["replica"]
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["Standard_D8s_v3", "Standard_D16s_v3", "Standard_E8s_v3"]
      
      initContainers:
        # Initialize replica from primary using pg_basebackup
        - name: init-replica
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Initializing read replica from primary..."
              
              # Wait for primary to be ready
              until pg_isready -h vector-db.vibecode-platform.svc.cluster.local -p 5432 -U postgres; do
                echo "Waiting for primary database..."
                sleep 5
              done
              
              # Check if data directory is empty
              if [ "$(ls -A $PGDATA)" ]; then
                echo "Data directory not empty, skipping initialization"
                exit 0
              fi
              
              # Create base backup from primary
              PGPASSWORD=$POSTGRES_PASSWORD pg_basebackup \
                -h vector-db.vibecode-platform.svc.cluster.local \
                -D $PGDATA \
                -U replication \
                -v \
                -P \
                -W \
                -R
              
              echo "Base backup complete"
          env:
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: replication-password
          volumeMounts:
            - name: replica-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      
      containers:
        # PostgreSQL read replica
        - name: vector-db-replica
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          
          command:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: postgres-password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_DB
              value: "vibecode"
            - name: DD_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: datadog-password
          
          # Reduced resources for read replicas
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: 4000m
              memory: 8Gi
              ephemeral-storage: 5Gi
          
          # Health checks
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U postgres -h localhost -p 5432 -d vibecode
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U postgres -h localhost -p 5432 -d vibecode && psql -U postgres -d vibecode -c "SELECT 1"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U postgres -h localhost -p 5432 -d vibecode
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          
          # Volume mounts
          volumeMounts:
            - name: replica-data
              mountPath: /var/lib/postgresql/data
            - name: replica-config
              mountPath: /etc/postgresql
              readOnly: true
            - name: ssl-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: ssl-private
              mountPath: /etc/ssl/private
              readOnly: true
            - name: shared-memory
              mountPath: /dev/shm
          
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
        
        # PostgreSQL Exporter for replica metrics
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://datadog:$(DD_POSTGRES_PASSWORD)@localhost:5432/vibecode?sslmode=require"
            - name: DD_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: datadog-password
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: "/etc/postgres-exporter/queries.yaml"
          
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          
          volumeMounts:
            - name: postgres-exporter-config
              mountPath: /etc/postgres-exporter
              readOnly: true
      
      volumes:
        - name: replica-config
          configMap:
            name: vector-db-replica-config
        - name: ssl-certs
          secret:
            secretName: vector-db-ssl-certs
            defaultMode: 0644
            optional: true
        - name: ssl-private
          secret:
            secretName: vector-db-ssl-private
            defaultMode: 0600
            optional: true
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: postgres-exporter-config
          configMap:
            name: postgres-exporter-config
  
  # Volume claim templates for replica storage
  volumeClaimTemplates:
    - metadata:
        name: replica-data
        labels:
          app: vector-db
          role: replica
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 500Gi
---
# Read replica specific configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-db-replica-config
  namespace: vibecode-platform
  labels:
    app: vector-db
    role: replica
data:
  postgresql.conf: |
    # PostgreSQL 16 read replica configuration
    
    # Include base configuration from primary
    include = '/var/lib/postgresql/data/pgdata/postgresql.auto.conf'
    
    # Read replica specific settings
    hot_standby = on
    hot_standby_feedback = on
    max_standby_streaming_delay = 30s
    max_standby_archive_delay = 60s
    
    # Connection settings
    listen_addresses = '*'
    port = 5432
    max_connections = 200
    
    # Memory settings - reduced for read replicas
    shared_buffers = '2GB'
    effective_cache_size = '6GB'
    work_mem = '16MB'
    maintenance_work_mem = '256MB'
    
    # Logging - reduced verbosity for replicas
    log_statement = 'none'
    log_min_duration_statement = 1000
    log_connections = off
    log_disconnections = off
    
    # Performance tuning for read workloads
    random_page_cost = 1.1
    seq_page_cost = 1.0
    effective_io_concurrency = 300
    max_worker_processes = 8
    max_parallel_workers = 4
    max_parallel_workers_per_gather = 2
    
    # Vector search optimizations for read replicas
    jit = on
    jit_above_cost = 100000
    
    # Read replica cannot perform writes
    default_transaction_read_only = on
    
    # Statistics and monitoring
    track_activities = on
    track_counts = on
    track_io_timing = on
    track_functions = all
    
  pg_hba.conf: |
    # Read replica authentication configuration
    
    # Local connections
    local   all             postgres                                peer
    local   all             all                                     scram-sha-256
    
    # SSL required for all network connections
    hostssl all             all             0.0.0.0/0               scram-sha-256
    
    # Application and monitoring users
    hostssl vibecode        vibecode_app    10.0.0.0/8              scram-sha-256
    hostssl vibecode        datadog         10.0.0.0/8              scram-sha-256
    
    # Deny unencrypted connections
    host    all             all             0.0.0.0/0               reject
---
# Pod Disruption Budget for replicas
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vector-db-replica-pdb
  namespace: vibecode-platform
  labels:
    app: vector-db
    role: replica
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vector-db
      role: replica
---
# Horizontal Pod Autoscaler for read replicas based on query load
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vector-db-replica-hpa
  namespace: vibecode-platform
  labels:
    app: vector-db
    role: replica
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: vector-db-replica
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
    # Custom metrics for vector query performance
    - type: Pods
      pods:
        metric:
          name: postgres_stat_database_tup_fetched_rate
        target:
          type: AverageValue
          averageValue: "1000"
    - type: Pods
      pods:
        metric:
          name: postgres_stat_activity_active_sessions
        target:
          type: AverageValue
          averageValue: "20"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 120  # 2 minutes
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max