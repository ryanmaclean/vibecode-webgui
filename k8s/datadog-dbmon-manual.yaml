apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-dbmon-dev
  namespace: datadog
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-dbmon-staging
  namespace: datadog
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-dbmon-prod
  namespace: datadog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-dbmon-dev
  namespace: datadog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datadog-dbmon-dev
  template:
    metadata:
      labels:
        app: datadog-dbmon-dev
        env: dev
    spec:
      serviceAccountName: datadog-dbmon-dev
      containers:
        - name: datadog-agent
          image: gcr.io/datadoghq/agent:7.66.1
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: api-key
            - name: DD_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: app-key
            - name: DD_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: db-host
            - name: DD_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: db-name
            - name: DD_DB_USER
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: db-user
            - name: DD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: db-password
            - name: DD_SITE
              value: datadoghq.com
            - name: DD_ENV
              value: dev
            - name: DD_SERVICE
              value: vibecode-postgres
            - name: DD_VERSION
              value: "2025.09.23"
            - name: DD_HOSTNAME
              value: vibecode-dbmon-dev
            - name: DD_DBM_ENABLED
              value: "true"
            - name: DD_LOGS_ENABLED
              value: "false"
            - name: DD_APM_ENABLED
              value: "false"
            - name: DD_PROCESS_AGENT_ENABLED
              value: "false"
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "false"
            - name: DD_REMOTE_CONFIGURATION_ENABLED
              value: "false"
            - name: DD_RUNTIME_SECURITY_CONFIG_ENABLED
              value: "false"
            - name: DD_SYSTEM_PROBE_ENABLED
              value: "false"
            - name: DD_KUBELET_ENABLED
              value: "false"
            - name: DD_AC_EXCLUDE
              value: "name:kubelet"
          volumeMounts:
            - name: db-conf
              mountPath: /etc/datadog-agent/conf.d/postgres.d/
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: db-conf
          configMap:
            name: datadog-dbmon-config-dev
---
