apiVersion: v1
kind: ConfigMap
metadata:
  name: datadog-dbmon-config-dev
  namespace: datadog
  labels:
    app.kubernetes.io/name: datadog-dbmon-dev
    app.kubernetes.io/component: monitoring
    env: dev
data:
  postgres.yaml: |
    init_config:

    instances:
      - host: "%%env_DD_DB_HOST%%"
        port: 5432
        username: "%%env_DD_DB_USER%%"
        password: "%%env_DD_DB_PASSWORD%%"
        dbname: "%%env_DD_DB_NAME%%"
        ssl: 'require'
        dbm: true
        query_metrics:
          enabled: true
          run_sync: true
          collection_interval: 15
        query_activity:
          enabled: true
          collection_interval: 10
        query_samples:
          enabled: false
        collect_schemas:
          enabled: true
          collection_interval: 60
        collect_settings:
          enabled: true
          collection_interval: 60
        tags:
          - env:dev
          - service:vibecode-postgres
          - component:database
          - cloud:azure
---
