# Datadog Helm values for AKS production deployment
# Production-grade configuration with Azure-specific optimizations

datadog:
  # Core configuration
  site: datadoghq.com
  
  # Kubernetes integration
  kubeStateMetricsEnabled: true
  kubeStateMetricsCore:
    enabled: true
  
  # Container runtime
  criSocketPath: /run/containerd/containerd.sock
  
  # Azure-specific node labels as tags
  nodeLabelsAsTags:
    kubernetes.azure.com/cluster: cluster
    kubernetes.azure.com/instance-type: instance_type
    kubernetes.azure.com/os: os
    kubernetes.azure.com/arch: arch
    kubernetes.azure.com/scalesetpriority: scalesetpriority
    node.kubernetes.io/instance-type: instance_type
  
  # Pod labels as tags
  podLabelsAsTags:
    app: app
    version: version
    component: component
    tier: tier
  
  # Logs collection
  logs:
    enabled: true
    containerCollectAll: true
    containerExclude: "image:datadog/agent"
    containerExcludeByName:
      - datadog-agent
      - datadog-cluster-agent
  
  # APM and tracing
  apm:
    enabled: true
    portEnabled: true
    socketEnabled: true
    hostSocketPath: /var/run/datadog/apm.socket
  
  # Process monitoring
  processAgent:
    enabled: true
    processCollection: true
  
  # Network monitoring  
  networkMonitoring:
    enabled: true
  
  # Security monitoring
  securityAgent:
    enabled: true
  
  # Database monitoring
  databaseMonitoring:
    enabled: true
  
  # Service discovery
  serviceDiscovery:
    enabled: true
  
  # Environment tags
  tags:
    - env:production
    - provider:aks
    - platform:kubernetes
    - monitoring:datadog

# Cluster Agent configuration
clusterAgent:
  enabled: true
  
  # Image configuration
  image:
    tag: latest
  
  # Resources for AKS
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # External metrics for HPA
  metricsProvider:
    enabled: true
    useDatadogMetrics: true
    wpaController: true
  
  # Admission controller
  admissionController:
    enabled: true
    mutateUnlabelled: true
    serviceName: datadog-admission-controller
  
  # Cluster checks
  clusterChecks:
    enabled: true
  
  # Node selector for Linux nodes
  nodeSelector:
    kubernetes.io/os: linux
  
  # Azure-specific tolerations
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule

# Agent DaemonSet configuration
agents:
  # Image configuration
  image:
    tag: latest
  
  # Resource requirements optimized for AKS
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Node selector for Linux nodes only
  nodeSelector:
    kubernetes.io/os: linux
  
  # Tolerations for AKS system nodes and spot instances
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule
  
  # Use host networking for proper metrics collection
  useHostNetwork: true
  useHostPID: true
  useHostPort: true
  
  # Azure-specific volume mounts
  volumes:
    # Docker socket
    - name: dockersocket
      hostPath:
        path: /var/run/docker.sock
    # Containerd socket
    - name: containerdsocket
      hostPath:
        path: /run/containerd/containerd.sock
    # Host proc filesystem
    - name: procdir
      hostPath:
        path: /proc
    # Host sys filesystem  
    - name: cgroups
      hostPath:
        path: /sys/fs/cgroup
    # Host passwd for user resolution
    - name: passwd
      hostPath:
        path: /etc/passwd
  
  volumeMounts:
    - name: dockersocket
      mountPath: /var/run/docker.sock
      readOnly: true
    - name: containerdsocket
      mountPath: /run/containerd/containerd.sock
      readOnly: true
    - name: procdir
      mountPath: /host/proc
      readOnly: true
    - name: cgroups
      mountPath: /host/sys/fs/cgroup
      readOnly: true
    - name: passwd
      mountPath: /etc/passwd
      readOnly: true

# RBAC configuration
rbac:
  create: true
  serviceAccountName: datadog-agent

# Service account
serviceAccount:
  create: true
  name: datadog-agent

# Windows node support (disabled for now)
winAgent:
  enabled: false

# System probe for network monitoring
systemProbe:
  enabled: true
  debugPort: 0
  enableConntrack: true
  bpfDebug: false
  apparmor: unconfined
  seccomp: unconfined
  
  # Security context for system probe
  securityContext:
    capabilities:
      add:
        - SYS_ADMIN
        - SYS_RESOURCE
        - SYS_PTRACE
        - NET_ADMIN
        - NET_BROADCAST
        - NET_RAW
        - IPC_LOCK
        - CHOWN

# Kube state metrics configuration
kubeStateMetricsCore:
  enabled: true
  useClusterRole: true
  labelsAsTags:
    pod:
      app: app
      version: version
    deployment:
      app: app
      version: version
    service:
      app: app

# Cluster checks runner
clusterChecksRunner:
  enabled: true
  replicas: 2
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  
  nodeSelector:
    kubernetes.io/os: linux
  
  tolerations:
    - key: kubernetes.azure.com/scalesetpriority
      operator: Equal
      value: spot
      effect: NoSchedule