# Datadog Helm Values for AKS Production Deployment
# Production-grade configuration with Azure-specific optimizations

datadog:
  # Use existing secrets created by OpenTofu
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  
  # Datadog site configuration
  site: "datadoghq.com"
  
  # Cluster name for identification (set by OpenTofu)
  clusterName: "vibecode-aks"
  
  # Production resource configuration
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  
  # Enable comprehensive monitoring features
  logs:
    enabled: true
    containerCollectAll: true
    configMapName: "datadog-logs"
  
  # Enable APM for application tracing with Dynamic Instrumentation
  apm:
    portEnabled: true
    socketEnabled: true
    hostSocketPath: /var/run/datadog
  
  # Enable process monitoring
  processAgent:
    enabled: true
    
  # Enable network monitoring for AKS
  networkMonitoring:
    enabled: true
    
  # Enable database monitoring for PostgreSQL
  dbm:
    enabled: true
    
  # Enable orchestrator explorer for AKS
  orchestratorExplorer:
    enabled: true
    
  # Production tags for AKS
  tags:
    - "env:production"
    - "provider:azure"
    - "cluster:aks"
    - "project:vibecode"
    - "region:eastus2"

# Cluster Agent configuration for AKS
clusterAgent:
  enabled: true
  image:
    tag: "1.24.0"
  
  # Production resources for Cluster Agent
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  
  # Enable metrics provider for HPA
  metricsProvider:
    enabled: true
    
  # Enable cluster checks
  clusterChecks:
    enabled: true
    
  # Enable external metrics for autoscaling
  externalMetrics:
    enabled: true
    
  # Azure-specific configurations
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"

# Node Agent configuration for AKS
agents:
  image:
    tag: "7.66.1"
    
  # Production resources for Node Agents
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
      
  # Azure-specific configurations
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"
      
  # Use host network for better performance on AKS
  useHostNetwork: true
  
  # Azure Disk mounts for persistent data
  volumeMounts:
    - name: datadog-agent-storage
      mountPath: /opt/datadog-agent/run
    - name: proc
      mountPath: /host/proc
      readOnly: true
    - name: cgroup
      mountPath: /host/sys/fs/cgroup
      readOnly: true
      
  volumes:
    - name: datadog-agent-storage
      persistentVolumeClaim:
        claimName: datadog-agent-storage
    - name: proc
      hostPath:
        path: /proc
    - name: cgroup
      hostPath:
        path: /sys/fs/cgroup

# System Probe for network monitoring (AKS-optimized)
systemProbe:
  enabled: true
  # Enable network security monitoring
  seccomp: "runtime/default"
  appArmor: "runtime/default"
  
# Security Agent for runtime security
securityAgent:
  enabled: true
  runtime:
    enabled: true
    
# Additional AKS-specific configurations
nodeSelector:
  kubernetes.io/os: linux

# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Service Account with Azure RBAC
serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: "" # Will be set by OpenTofu
    
# Azure-specific storage class for persistent volumes
persistence:
  enabled: true
  storageClass: "managed-csi"
  size: "10Gi"
  
# Ingress for Datadog Agent (if needed)
ingress:
  enabled: false # Typically not needed for agents

# Azure Monitor integration
azureMonitor:
  enabled: true
  workspace:
    # Will be configured by OpenTofu
    id: ""
    key: ""