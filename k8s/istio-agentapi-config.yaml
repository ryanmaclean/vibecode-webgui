# Istio Configuration for AgentAPI Integration
# This configuration provides service mesh capabilities for the VibeCode platform
# including mTLS, traffic management, and observability

---
# Gateway: External entry point for traffic
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: vibecode-gateway
  namespace: vibecode-platform
spec:
  selector:
    istio: ingressgateway
  servers:
  # HTTP port (redirect to HTTPS)
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "vibecode.example.com"
    - "agentapi.vibecode.example.com"
    - "*.workspace.vibecode.example.com"
    tls:
      httpsRedirect: true

  # HTTPS port with TLS termination
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "vibecode.example.com"
    - "agentapi.vibecode.example.com"
    - "*.workspace.vibecode.example.com"
    tls:
      mode: SIMPLE
      credentialName: vibecode-tls-cert
      minProtocolVersion: TLSV1_3
      cipherSuites:
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384

---
# Virtual Service: Traffic routing rules
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: vibecode-routing
  namespace: vibecode-platform
spec:
  hosts:
  - "vibecode.example.com"
  - "agentapi.vibecode.example.com"
  - "*.workspace.vibecode.example.com"

  gateways:
  - vibecode-gateway

  http:
  # Route 1: Next.js Frontend (with canary deployment)
  - name: "nextjs-frontend-route"
    match:
    - uri:
        prefix: "/"
      headers:
        accept:
          regex: ".*text/html.*"
    route:
    - destination:
        host: nextjs-frontend.vibecode-platform.svc.cluster.local
        port:
          number: 3000
        subset: stable
      weight: 95
    - destination:
        host: nextjs-frontend.vibecode-platform.svc.cluster.local
        port:
          number: 3000
        subset: canary
      weight: 5
    timeout: 30s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
    corsPolicy:
      allowOrigins:
      - regex: ".*"
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - authorization
      - content-type
      - x-request-id
      - x-workspace-id
      maxAge: 24h

  # Route 2: AgentAPI HTTP Endpoints
  - name: "agentapi-http-route"
    match:
    - uri:
        prefix: "/api/agents"
      method:
        regex: "GET|POST|PUT|DELETE"
    route:
    - destination:
        host: code-server-agentapi.vibecode-platform.svc.cluster.local
        port:
          number: 3284
    timeout: 300s  # 5 minutes for long-running operations
    retries:
      attempts: 2
      perTryTimeout: 150s
      retryOn: reset,refused-stream,503
    headers:
      request:
        add:
          x-forwarded-proto: https
          x-request-id: "%REQ(X-REQUEST-ID)%"
        remove:
        - x-envoy-internal

  # Route 3: AgentAPI WebSocket Upgrade
  - name: "agentapi-websocket-route"
    match:
    - uri:
        prefix: "/api/agents/ws"
      headers:
        upgrade:
          exact: "websocket"
    route:
    - destination:
        host: code-server-agentapi.vibecode-platform.svc.cluster.local
        port:
          number: 3284
    timeout: 3600s  # 1 hour for WebSocket connections
    websocketUpgrade: true

  # Route 4: code-server IDE (per-workspace routing)
  - name: "code-server-ide-route"
    match:
    - uri:
        prefix: "/ide/"
    - headers:
        host:
          regex: ".*\\.workspace\\.vibecode\\.example\\.com"
    route:
    - destination:
        host: code-server-agentapi.vibecode-platform.svc.cluster.local
        port:
          number: 8765
    timeout: 3600s
    websocketUpgrade: true

  # Route 5: Health Check Endpoints (no auth required)
  - name: "health-check-route"
    match:
    - uri:
        exact: "/health"
    - uri:
        exact: "/ready"
    route:
    - destination:
        host: code-server-agentapi.vibecode-platform.svc.cluster.local
        port:
          number: 3284
    timeout: 5s

---
# Destination Rule: Traffic policies for AgentAPI
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: agentapi-traffic-policy
  namespace: vibecode-platform
spec:
  host: code-server-agentapi.vibecode-platform.svc.cluster.local

  trafficPolicy:
    # Connection pool settings for high concurrency
    connectionPool:
      tcp:
        maxConnections: 2000
        connectTimeout: 30s
        tcpKeepalive:
          time: 7200s
          interval: 75s
          probes: 10
      http:
        http1MaxPendingRequests: 2048
        http2MaxRequests: 2048
        maxRequestsPerConnection: 20
        maxRetries: 3
        idleTimeout: 300s

    # Load balancing with consistent hashing
    loadBalancer:
      consistentHash:
        httpHeaderName: x-workspace-id

    # Outlier detection (circuit breaker)
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
      splitExternalLocalOriginErrors: true

    # TLS settings (mTLS with Istio)
    tls:
      mode: ISTIO_MUTUAL
      sni: code-server-agentapi.vibecode-platform.svc.cluster.local

  # Subsets for canary deployments
  subsets:
  - name: stable
    labels:
      version: stable
    trafficPolicy:
      connectionPool:
        http:
          maxRequestsPerConnection: 10
  - name: canary
    labels:
      version: canary
    trafficPolicy:
      connectionPool:
        http:
          maxRequestsPerConnection: 5  # Limit canary traffic

---
# Destination Rule: Traffic policies for Next.js Frontend
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: nextjs-traffic-policy
  namespace: vibecode-platform
spec:
  host: nextjs-frontend.vibecode-platform.svc.cluster.local

  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1000
        connectTimeout: 10s
      http:
        http1MaxPendingRequests: 1024
        http2MaxRequests: 1024
        maxRequestsPerConnection: 50

    loadBalancer:
      simple: LEAST_REQUEST

    outlierDetection:
      consecutiveErrors: 3
      interval: 10s
      baseEjectionTime: 30s

    tls:
      mode: ISTIO_MUTUAL

  subsets:
  - name: stable
    labels:
      version: stable
  - name: canary
    labels:
      version: canary

---
# Peer Authentication: Enforce mTLS for all services
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-mtls
  namespace: vibecode-platform
spec:
  mtls:
    mode: STRICT  # Enforce mTLS for all inter-service communication

---
# Authorization Policy: AgentAPI access control
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: agentapi-auth-policy
  namespace: vibecode-platform
spec:
  selector:
    matchLabels:
      app: code-server
      component: workspace
  action: ALLOW
  rules:
  # Allow Next.js API to call AgentAPI
  - from:
    - source:
        principals:
        - "cluster.local/ns/vibecode-platform/sa/nextjs-frontend"
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        paths:
        - "/api/agents/*"
        - "/api/terminals/*"

  # Allow ingress gateway to call AgentAPI
  - from:
    - source:
        namespaces: ["istio-system"]
    to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        paths:
        - "/api/agents/*"

  # Allow health checks from anywhere
  - to:
    - operation:
        methods: ["GET"]
        paths:
        - "/health"
        - "/ready"
        - "/metrics"

---
# Telemetry: Distributed tracing configuration
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: vibecode-tracing
  namespace: vibecode-platform
spec:
  tracing:
  - providers:
    - name: jaeger
    randomSamplingPercentage: 1.0  # 1% sampling in production
    customTags:
      workspace_id:
        header:
          name: x-workspace-id
      user_id:
        header:
          name: x-user-id
      request_id:
        header:
          name: x-request-id

---
# Service Entry: Allow egress to external LLM APIs
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-llm-apis
  namespace: vibecode-platform
spec:
  hosts:
  - "api.anthropic.com"
  - "api.openai.com"
  - "api.together.xyz"
  - "openrouter.ai"
  ports:
  - number: 443
    name: https
    protocol: TLS
  location: MESH_EXTERNAL
  resolution: DNS

---
# Virtual Service: Retry and timeout policies for external APIs
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: external-llm-retry-policy
  namespace: vibecode-platform
spec:
  hosts:
  - "api.anthropic.com"
  - "api.openai.com"
  tls:
  - match:
    - port: 443
      sniHosts:
      - "api.anthropic.com"
      - "api.openai.com"
    route:
    - destination:
        host: api.anthropic.com
        port:
          number: 443
      weight: 50
    - destination:
        host: api.openai.com
        port:
          number: 443
      weight: 50
    timeout: 60s
    retries:
      attempts: 3
      perTryTimeout: 20s
      retryOn: connect-failure,refused-stream,503
