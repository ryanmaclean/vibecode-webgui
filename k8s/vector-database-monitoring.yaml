# Comprehensive monitoring integration for Vector Database
# ServiceMonitor resources for Prometheus and Datadog configuration

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vector-db-primary
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: monitoring
    role: primary
spec:
  selector:
    matchLabels:
      app: vector-db
      role: primary
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: kubernetes_namespace
        - targetLabel: cluster
          replacement: production
        - targetLabel: service
          replacement: vector-db
        - targetLabel: role
          replacement: primary
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vector-db-replicas
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: monitoring
    role: replica
spec:
  selector:
    matchLabels:
      app: vector-db
      role: replica
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: kubernetes_namespace
        - targetLabel: cluster
          replacement: production
        - targetLabel: service
          replacement: vector-db
        - targetLabel: role
          replacement: replica
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vector-db-router
  namespace: vibecode-platform
  labels:
    app: vector-db-router
    component: monitoring
spec:
  selector:
    matchLabels:
      app: vector-db-router
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - targetLabel: cluster
          replacement: production
        - targetLabel: service
          replacement: pgbouncer
---
# PrometheusRule for vector database alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vector-db-alerts
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: alerting
spec:
  groups:
    - name: vector-database.rules
      interval: 30s
      rules:
        # High-level availability alerts
        - alert: VectorDatabaseDown
          expr: up{service="vector-db"} == 0
          for: 1m
          labels:
            severity: critical
            service: vector-db
          annotations:
            summary: "Vector database is down"
            description: "Vector database {{ $labels.pod }} in {{ $labels.kubernetes_namespace }} has been down for more than 1 minute"
        
        - alert: VectorDatabaseReadReplicaDown
          expr: up{service="vector-db",role="replica"} == 0
          for: 2m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector database read replica is down"
            description: "Vector database read replica {{ $labels.pod }} has been down for more than 2 minutes"
        
        # Performance alerts
        - alert: VectorDatabaseHighCPU
          expr: rate(container_cpu_usage_seconds_total{pod=~"vector-db-.*"}[5m]) * 100 > 80
          for: 5m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector database high CPU usage"
            description: "Vector database {{ $labels.pod }} CPU usage is {{ $value }}% for more than 5 minutes"
        
        - alert: VectorDatabaseHighMemory
          expr: container_memory_usage_bytes{pod=~"vector-db-.*"} / container_spec_memory_limit_bytes{pod=~"vector-db-.*"} * 100 > 85
          for: 5m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector database high memory usage"
            description: "Vector database {{ $labels.pod }} memory usage is {{ $value }}% for more than 5 minutes"
        
        # Database-specific alerts
        - alert: VectorDatabaseTooManyConnections
          expr: pg_stat_database_numbackends{datname="vibecode"} / pg_settings_max_connections * 100 > 80
          for: 2m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector database too many connections"
            description: "Vector database has {{ $value }}% of max connections in use"
        
        - alert: VectorDatabaseReplicationLag
          expr: pg_replication_lag_seconds > 60
          for: 1m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector database replication lag high"
            description: "Replication lag is {{ $value }} seconds on {{ $labels.pod }}"
        
        - alert: VectorDatabaseSlowQueries
          expr: rate(pg_stat_statements_total_exec_time_seconds[5m]) / rate(pg_stat_statements_calls[5m]) > 1
          for: 3m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector database slow queries detected"
            description: "Average query time is {{ $value }} seconds over the last 5 minutes"
        
        # Storage alerts
        - alert: VectorDatabaseDiskSpaceLow
          expr: (1 - (pg_database_size_bytes{datname="vibecode"} / (1024^3 * 400))) * 100 < 20
          for: 10m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector database disk space running low"
            description: "Vector database has less than 20% disk space remaining"
        
        - alert: VectorDatabaseDiskSpaceCritical
          expr: (1 - (pg_database_size_bytes{datname="vibecode"} / (1024^3 * 400))) * 100 < 10
          for: 5m
          labels:
            severity: critical
            service: vector-db
          annotations:
            summary: "Vector database disk space critically low"
            description: "Vector database has less than 10% disk space remaining"
        
        # Vector-specific alerts
        - alert: VectorEmbeddingIngestionSlow
          expr: rate(vector_embeddings_inserted_total[5m]) < 10
          for: 5m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector embedding ingestion rate is slow"
            description: "Vector embedding ingestion rate is {{ $value }} embeddings/second over the last 5 minutes"
        
        - alert: VectorSearchLatencyHigh
          expr: histogram_quantile(0.95, rate(vector_search_duration_seconds_bucket[5m])) > 2
          for: 3m
          labels:
            severity: warning
            service: vector-db
          annotations:
            summary: "Vector search latency is high"
            description: "95th percentile vector search latency is {{ $value }} seconds"
        
        # Index health alerts
        - alert: VectorIndexNotUsed
          expr: increase(pg_stat_user_indexes_idx_tup_read[1h]) == 0 and on(indexrelid) pg_stat_user_indexes{indexname=~".*embedding.*"}
          for: 1h
          labels:
            severity: info
            service: vector-db
          annotations:
            summary: "Vector index not being used"
            description: "Vector index {{ $labels.indexname }} has not been used in the last hour"
---
