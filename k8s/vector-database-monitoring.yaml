# Datadog Custom Metrics and Logs Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: datadog-vector-db-config
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: datadog-monitoring
data:
  postgres.yaml: |
    # Datadog PostgreSQL integration for vector database
    init_config:
      
    instances:
      - host: vector-db.vibecode-platform.svc.cluster.local
        port: 5432
        username: datadog
        password: "ENC[datadog_password]"
        dbname: vibecode
        ssl: require
        
        # Enhanced monitoring options
        collect_count_metrics: true
        collect_activity_metrics: true
        collect_database_size_metrics: true
        collect_default_db: true
        collect_bloat_metrics: true
        collect_wal_metrics: true
        
        # Database monitoring (DBM)
        dbm: true
        query_metrics:
          enabled: true
          run_sync: true
          collection_interval: 10
        query_activity:
          enabled: true
          collection_interval: 10
        query_samples:
          enabled: true
          collection_interval: 1
        
        # Custom queries for vector operations
        custom_queries:
          - query: |
              SELECT 
                namespace,
                count(*) as embedding_count,
                avg(array_length(embedding, 1)) as avg_dimensions,
                pg_size_pretty(pg_total_relation_size('vectors.document_embeddings')) as table_size
              FROM vectors.document_embeddings 
              GROUP BY namespace
            columns:
              - name: namespace
                type: tag
              - name: embedding_count
                type: gauge
              - name: avg_dimensions
                type: gauge
            tags:
              - vector_db_metrics
              
          - query: |
              SELECT 
                indexname,
                idx_tup_read,
                idx_tup_fetch,
                pg_size_pretty(pg_relation_size(indexrelid)) as index_size_pretty,
                pg_relation_size(indexrelid) as index_size_bytes
              FROM pg_stat_user_indexes 
              WHERE schemaname = 'vectors'
            columns:
              - name: indexname
                type: tag
              - name: idx_tup_read
                type: gauge
              - name: idx_tup_fetch
                type: gauge
              - name: index_size_bytes
                type: gauge
            tags:
              - vector_index_metrics
              
          - query: |
              SELECT 
                'vector_similarity_search' as query_type,
                count(*) as total_queries,
                avg(total_exec_time) as avg_exec_time_ms,
                sum(total_exec_time) as total_exec_time_ms
              FROM pg_stat_statements 
              WHERE query LIKE '%<->%' OR query LIKE '%<#>%' OR query LIKE '%<=>%'
            columns:
              - name: query_type
                type: tag
              - name: total_queries
                type: gauge
              - name: avg_exec_time_ms
                type: gauge  
              - name: total_exec_time_ms
                type: gauge
            tags:
              - vector_search_performance
        
        # Tagging
        tags:
          - environment:production
          - service:vector-db
          - cluster:aks-production
          - component:primary
          - database:vibecode
        
        # Performance settings
        min_collection_interval: 15
        
  logs.yaml: |
    # Datadog log configuration for PostgreSQL
    logs:
      - type: file
        path: /var/lib/postgresql/data/log/*.log
        source: postgresql
        service: vector-db
        tags:
          - environment:production
          - component:primary
        log_processing_rules:
          - type: multi_line
            name: postgresql_multiline
            pattern: \d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}
          - type: exclude_at_match
            name: exclude_pg_stat_statements
            pattern: pg_stat_statements
            
      # WAL and error logs
      - type: file
        path: /var/lib/postgresql/data/log/postgresql-*.log
        source: postgresql
        service: vector-db
        tags:
          - environment:production
          - component:primary
          - log_type:database
          
  custom_metrics.py: |
    # Custom Python metrics for Datadog
    from datadog_checks.base import AgentCheck
    import psycopg2
    from psycopg2.extras import DictCursor
    
    class VectorDatabaseCheck(AgentCheck):
        def check(self, instance):
            # Database connection parameters
            host = instance.get('host', 'localhost')
            port = instance.get('port', 5432)
            database = instance.get('database', 'vibecode')
            username = instance.get('username', 'datadog')
            password = instance.get('password')
            
            try:
                # Connect to database
                conn = psycopg2.connect(
                    host=host,
                    port=port,
                    database=database,
                    user=username,
                    password=password,
                    sslmode='require'
                )
                
                with conn.cursor(cursor_factory=DictCursor) as cursor:
                    # Vector embedding growth rate
                    cursor.execute("""
                        SELECT 
                            extract(epoch from now()) - extract(epoch from created_at) as age_seconds,
                            count(*) as embeddings_created
                        FROM vectors.document_embeddings 
                        WHERE created_at >= now() - interval '1 hour'
                        GROUP BY date_trunc('minute', created_at)
                        ORDER BY age_seconds DESC
                        LIMIT 1
                    """)
                    
                    result = cursor.fetchone()
                    if result:
                        self.gauge('vector_db.embeddings.hourly_growth', 
                                 result['embeddings_created'],
                                 tags=['service:vector-db'])
                    
                    # Vector search performance by namespace
                    cursor.execute("""
                        SELECT 
                            namespace,
                            count(*) as search_count,
                            avg(query_time_ms) as avg_query_time
                        FROM vectors.vector_search_stats 
                        WHERE search_timestamp >= now() - interval '5 minutes'
                        GROUP BY namespace
                    """)
                    
                    for row in cursor.fetchall():
                        tags = [f'namespace:{row["namespace"]}', 'service:vector-db']
                        self.gauge('vector_db.search.count', row['search_count'], tags=tags)
                        self.gauge('vector_db.search.avg_latency', row['avg_query_time'], tags=tags)
                    
                    # Index efficiency metrics
                    cursor.execute("""
                        SELECT 
                            indexname,
                            CASE WHEN idx_tup_read > 0 
                                THEN (idx_tup_fetch::float / idx_tup_read::float) * 100 
                                ELSE 0 
                            END as index_efficiency
                        FROM pg_stat_user_indexes 
                        WHERE schemaname = 'vectors'
                        AND indexname LIKE '%embedding%'
                    """)
                    
                    for row in cursor.fetchall():
                        tags = [f'index:{row["indexname"]}', 'service:vector-db']
                        self.gauge('vector_db.index.efficiency_percent', 
                                 row['index_efficiency'], tags=tags)
                
                conn.close()
                
            except Exception as e:
                self.service_check('vector_db.can_connect', AgentCheck.CRITICAL, 
                                 message=str(e))
                self.log.error(f"Error connecting to vector database: {e}")
                return
            
            self.service_check('vector_db.can_connect', AgentCheck.OK)
---
# Network Policy for secure database access
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vector-db-network-policy
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: security
spec:
  podSelector:
    matchLabels:
      app: vector-db
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow connections from application pods
    - from:
        - podSelector:
            matchLabels:
              app: vibecode-webgui
        - podSelector:
            matchLabels:
              app: vector-db-router
      ports:
        - protocol: TCP
          port: 5432
    
    # Allow monitoring from Prometheus and Datadog
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - namespaceSelector:
            matchLabels:
              name: datadog
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9187
    
    # Allow inter-replica communication for replication
    - from:
        - podSelector:
            matchLabels:
              app: vector-db
      ports:
        - protocol: TCP
          port: 5432
  
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    
    # Allow NTP
    - to: []
      ports:
        - protocol: UDP
          port: 123
    
    # Allow connections to backup storage (Azure Blob Storage)
    - to: []
      ports:
        - protocol: TCP
          port: 443
      namespaceSelector:
        matchLabels:
          name: kube-system