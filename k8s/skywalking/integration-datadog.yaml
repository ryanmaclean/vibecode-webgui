---
# Integration Layer between SkyWalking and Datadog
# Forward traces via OTLP and create unified observability dashboard

apiVersion: v1
kind: ConfigMap
metadata:
  name: skywalking-datadog-integration
  namespace: skywalking
  labels:
    app.kubernetes.io/name: skywalking
    app.kubernetes.io/component: integration
data:
  # OTLP exporter configuration for forwarding to Datadog
  otlp-exporter.yaml: |
    # OpenTelemetry Collector configuration for trace forwarding
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # Receive traces from SkyWalking OAP
      skywalking:
        protocols:
          grpc:
            endpoint: 0.0.0.0:11800
          http:
            endpoint: 0.0.0.0:12800

    processors:
      # Batch processor for efficiency
      batch:
        timeout: 10s
        send_batch_size: 1024

      # Resource detection
      resourcedetection:
        detectors: [env, system, docker, kubernetes]
        timeout: 5s

      # Add Datadog-specific attributes
      attributes:
        actions:
          - key: dd.service
            from_attribute: service.name
            action: insert
          - key: dd.version
            from_attribute: service.version
            action: insert
          - key: dd.env
            from_attribute: deployment.environment
            action: insert
          - key: source
            value: skywalking
            action: insert

      # Transform SkyWalking trace format to Datadog format
      transform:
        trace_statements:
          - context: span
            statements:
              # Map SkyWalking span IDs to Datadog format
              - set(attributes["dd.span_id"], Hex(span_id.bytes))
              - set(attributes["dd.trace_id"], Hex(trace_id.bytes))
              # Map SkyWalking tags to Datadog tags
              - set(attributes["component"], attributes["sw.component"])
              - set(attributes["span.kind"], attributes["sw.span.kind"])

    exporters:
      # Forward to Datadog via OTLP
      otlphttp/datadog:
        endpoint: https://http-intake.logs.datadoghq.com
        headers:
          DD-API-KEY: ${DD_API_KEY}
        compression: gzip
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      # Also export metrics to Prometheus
      prometheus:
        endpoint: 0.0.0.0:9090
        namespace: skywalking
        const_labels:
          source: skywalking

      # Logging for debugging
      logging:
        loglevel: info
        sampling_initial: 5
        sampling_thereafter: 200

    service:
      pipelines:
        traces:
          receivers: [otlp, skywalking]
          processors: [resourcedetection, attributes, transform, batch]
          exporters: [otlphttp/datadog, logging]

        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus, logging]

  # Unified dashboard configuration
  unified-dashboard.json: |
    {
      "dashboard": {
        "title": "Unified Observability Dashboard (SkyWalking + Datadog)",
        "description": "Combined view of SkyWalking AI anomalies and Datadog APM",
        "widgets": [
          {
            "title": "Service Overview",
            "definition": {
              "type": "query_table",
              "requests": [
                {
                  "q": "avg:skywalking.service.response_time{*} by {service}",
                  "alias": "Avg Response Time (SkyWalking)"
                },
                {
                  "q": "avg:trace.servlet.request.duration{*} by {service}",
                  "alias": "Avg Response Time (Datadog)"
                },
                {
                  "q": "avg:skywalking.anomaly_score{*} by {service}",
                  "alias": "Anomaly Score"
                }
              ]
            }
          },
          {
            "title": "AI-Detected Anomalies Timeline",
            "definition": {
              "type": "timeseries",
              "requests": [
                {
                  "q": "skywalking.anomaly_score{*}",
                  "display_type": "line",
                  "style": {
                    "palette": "warm",
                    "line_type": "solid",
                    "line_width": "normal"
                  }
                }
              ],
              "markers": [
                {
                  "value": "y = 0.8",
                  "display_type": "warning dashed"
                },
                {
                  "value": "y = 0.95",
                  "display_type": "error dashed"
                }
              ]
            }
          },
          {
            "title": "Response Time: SkyWalking vs Datadog",
            "definition": {
              "type": "timeseries",
              "requests": [
                {
                  "q": "avg:skywalking.service.response_time_p99{*}",
                  "display_type": "line",
                  "style": {
                    "palette": "dog_classic",
                    "line_type": "solid"
                  }
                },
                {
                  "q": "avg:trace.servlet.request.duration.by.service.99p{*}",
                  "display_type": "line",
                  "style": {
                    "palette": "cool",
                    "line_type": "dashed"
                  }
                }
              ]
            }
          },
          {
            "title": "Error Rate Comparison",
            "definition": {
              "type": "timeseries",
              "requests": [
                {
                  "q": "avg:skywalking.service.error_rate{*}",
                  "display_type": "bars"
                },
                {
                  "q": "avg:trace.servlet.request.errors{*}/avg:trace.servlet.request.hits{*}",
                  "display_type": "line"
                }
              ]
            }
          },
          {
            "title": "Anomaly Alerts (Last 24h)",
            "definition": {
              "type": "alert_graph",
              "alert_id": "skywalking-anomaly-*",
              "viz_type": "timeseries"
            }
          },
          {
            "title": "Agent Task Anomalies",
            "definition": {
              "type": "toplist",
              "requests": [
                {
                  "q": "top(avg:skywalking.agent.task.anomaly_score{*} by {agent_id,agent_type}, 10, 'mean', 'desc')"
                }
              ]
            }
          },
          {
            "title": "Service Dependency Map (SkyWalking)",
            "definition": {
              "type": "servicemap",
              "service": "*",
              "env": "${DD_ENV}",
              "requests": [
                {
                  "request_type": "skywalking"
                }
              ]
            }
          },
          {
            "title": "Distributed Trace Correlation",
            "definition": {
              "type": "trace_service",
              "env": "${DD_ENV}",
              "service": "*",
              "span_name": "*",
              "show_errors": true,
              "show_latency": true,
              "show_hits": true
            }
          },
          {
            "title": "Infrastructure Correlation",
            "definition": {
              "type": "hostmap",
              "requests": [
                {
                  "q": "avg:skywalking.anomaly_score{*} by {host}"
                }
              ],
              "style": {
                "palette": "hostmap_blues",
                "palette_flip": false
              }
            }
          }
        ],
        "layout_type": "ordered",
        "notify_list": [],
        "template_variables": [
          {
            "name": "service",
            "default": "*",
            "prefix": "service"
          },
          {
            "name": "env",
            "default": "production",
            "prefix": "env"
          }
        ]
      }
    }

  # Alert routing configuration
  alert-routing.yaml: |
    # Route SkyWalking anomaly alerts to appropriate channels
    routes:
      # Critical anomalies to PagerDuty
      - match:
          severity: critical
          component: skywalking
          type: anomaly
        receiver: pagerduty-critical
        continue: true

      # Warning anomalies to Slack
      - match:
          severity: warning
          component: skywalking
          type: anomaly
        receiver: slack-alerts
        continue: true

      # Agent-specific anomalies
      - match:
          category: agent
          component: skywalking
        receiver: slack-agents
        continue: true

      # All anomalies to Datadog events
      - match:
          component: skywalking
          type: anomaly
        receiver: datadog-events
        continue: false

    receivers:
      # PagerDuty for critical alerts
      - name: pagerduty-critical
        pagerduty:
          service_key: ${PAGERDUTY_ROUTING_KEY}
          url: https://events.pagerduty.com/v2/enqueue
          client: SkyWalking AI Anomaly Detection
          client_url: https://skywalking.vibecode.local
          description: "{{ .CommonAnnotations.summary }}"
          severity: critical
          details:
            anomaly_score: "{{ .CommonLabels.anomaly_score }}"
            service: "{{ .CommonLabels.service }}"
            metric: "{{ .CommonLabels.metric }}"

      # Slack for all anomalies
      - name: slack-alerts
        slack:
          api_url: ${SLACK_WEBHOOK_URL}
          channel: "#alerts-anomaly"
          username: SkyWalking Anomaly Detection
          icon_emoji: ":chart_with_upwards_trend:"
          title: "{{ .CommonAnnotations.summary }}"
          text: |
            {{ range .Alerts }}
            *Service:* {{ .Labels.service }}
            *Metric:* {{ .Labels.metric }}
            *Anomaly Score:* {{ .Labels.anomaly_score }}
            *Description:* {{ .Annotations.description }}
            *Runbook:* {{ .Annotations.runbook }}
            {{ end }}

      # Slack for agent anomalies
      - name: slack-agents
        slack:
          api_url: ${SLACK_WEBHOOK_URL}
          channel: "#alerts-agents"
          username: SkyWalking Agent Monitor
          icon_emoji: ":robot_face:"
          title: "Agent Anomaly Detected"
          text: |
            {{ range .Alerts }}
            *Agent ID:* {{ .Labels.agent_id }}
            *Agent Type:* {{ .Labels.agent_type }}
            *Task Type:* {{ .Labels.task_type }}
            *Anomaly Score:* {{ .Labels.anomaly_score }}
            *Description:* {{ .Annotations.description }}
            {{ end }}

      # Datadog Events API
      - name: datadog-events
        webhook:
          url: https://api.datadoghq.com/api/v1/events
          http_config:
            headers:
              DD-API-KEY: ${DD_API_KEY}
              Content-Type: application/json
          send_resolved: true
          body: |
            {
              "title": "{{ .CommonAnnotations.summary }}",
              "text": "{{ .CommonAnnotations.description }}",
              "priority": "{{ if eq .CommonLabels.severity \"critical\" }}normal{{ else }}low{{ end }}",
              "tags": [
                "source:skywalking",
                "component:{{ .CommonLabels.component }}",
                "type:{{ .CommonLabels.type }}",
                "service:{{ .CommonLabels.service }}",
                "metric:{{ .CommonLabels.metric }}"
              ],
              "alert_type": "{{ if eq .Status \"firing\" }}error{{ else }}success{{ end }}",
              "aggregation_key": "skywalking-anomaly-{{ .CommonLabels.service }}-{{ .CommonLabels.metric }}"
            }

  # Trace correlation configuration
  trace-correlation.yaml: |
    # Configure trace context propagation between SkyWalking and Datadog
    propagation:
      # Support multiple propagation formats
      formats:
        - sw8          # SkyWalking v8 format
        - datadog      # Datadog native format
        - tracecontext # W3C Trace Context
        - b3           # Zipkin B3 format

      # Header mapping
      headers:
        skywalking:
          traceid: sw8
          spanid: sw8-span
          parentid: sw8-parent
        datadog:
          traceid: x-datadog-trace-id
          spanid: x-datadog-parent-id
          sampling: x-datadog-sampling-priority

      # Correlation rules
      rules:
        # Create correlation between SkyWalking and Datadog traces
        - name: skywalking-to-datadog
          source: skywalking
          target: datadog
          mapping:
            trace_id: hex_to_decimal
            span_id: hex_to_decimal
            parent_id: hex_to_decimal

        # Bidirectional correlation
        - name: datadog-to-skywalking
          source: datadog
          target: skywalking
          mapping:
            trace_id: decimal_to_hex
            span_id: decimal_to_hex
            parent_id: decimal_to_hex

---
# OpenTelemetry Collector Deployment for integration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywalking-otel-collector
  namespace: skywalking
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: integration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.115.0
        command:
        - /otelcol-contrib
        - --config=/conf/otlp-exporter.yaml
        ports:
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        - name: prometheus
          containerPort: 9090
          protocol: TCP
        env:
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-secret
              key: api-key
        volumeMounts:
        - name: config
          mountPath: /conf
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /
            port: 13133
        readinessProbe:
          httpGet:
            path: /
            port: 13133
      volumes:
      - name: config
        configMap:
          name: skywalking-datadog-integration
          items:
          - key: otlp-exporter.yaml
            path: otlp-exporter.yaml

---
# Service for OTLP Collector
apiVersion: v1
kind: Service
metadata:
  name: skywalking-otel-collector
  namespace: skywalking
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: integration
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP
  - name: prometheus
    port: 9090
    targetPort: 9090
    protocol: TCP

---
# ServiceMonitor for Prometheus metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: skywalking-otel-collector
  namespace: skywalking
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: integration
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  endpoints:
  - port: prometheus
    interval: 30s
    path: /metrics
