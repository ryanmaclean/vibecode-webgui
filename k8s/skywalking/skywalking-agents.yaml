---
# SkyWalking Agent Configuration for Next.js Frontend
apiVersion: v1
kind: ConfigMap
metadata:
  name: skywalking-nodejs-agent-config
  namespace: vibecode-platform
  labels:
    app.kubernetes.io/name: skywalking-agent
    app.kubernetes.io/component: nodejs
data:
  agent.config.js: |
    // SkyWalking Node.js Agent Configuration
    // Auto-instrumentation for Next.js application
    module.exports = {
      serviceName: 'vibecode-webgui',
      serviceInstance: process.env.HOSTNAME || 'default-instance',
      collectorAddress: 'oap.skywalking:11800',

      // Trace configuration
      tracing: {
        // 100% sampling initially, tune down in production
        sampleRate: 1.0,
        // Trace ID format compatible with Datadog
        traceIdFormat: 'hex',
        // Correlation with Datadog traces
        correlationHeaders: ['x-datadog-trace-id', 'x-datadog-parent-id'],
      },

      // Instrumentation plugins
      plugins: {
        http: {
          enabled: true,
          // Capture request/response details
          collectHttpParams: true,
          collectHttpHeaders: ['user-agent', 'referer'],
          // Filter sensitive data
          httpParamsFilter: ['password', 'token', 'api_key'],
        },
        https: {
          enabled: true,
        },
        express: {
          enabled: true,
          // Capture route parameters
          collectHttpParams: true,
        },
        mongodb: {
          enabled: true,
          // Capture query statements (sanitized)
          collectStatements: true,
        },
        redis: {
          enabled: true,
          collectStatements: true,
        },
        postgres: {
          enabled: true,
          collectStatements: true,
        },
      },

      // Custom span tags for agent context
      tags: {
        env: process.env.NODE_ENV || 'development',
        version: process.env.DD_VERSION || '1.0.0',
        platform: 'vibecode',
        runtime: 'nodejs',
        framework: 'nextjs',
      },

      // Performance optimization
      buffer: {
        size: 1000,
        timeout: 5000, // 5 seconds
      },

      // Logging
      logging: {
        level: process.env.SW_AGENT_LOG_LEVEL || 'info',
        // Send logs to console for Kubernetes log aggregation
        transports: ['console'],
      },

      // Agent metadata for anomaly detection
      metadata: {
        // Additional context for AI/ML models
        deployment_type: 'kubernetes',
        container_runtime: 'docker',
        orchestrator: 'kubernetes',
      },
    };

---
# SkyWalking Agent Configuration for Python AgentAPI
apiVersion: v1
kind: ConfigMap
metadata:
  name: skywalking-python-agent-config
  namespace: vibecode-platform
  labels:
    app.kubernetes.io/name: skywalking-agent
    app.kubernetes.io/component: python
data:
  sw_python.ini: |
    [skywalking]
    # Service configuration
    SW_AGENT_NAME = agentapi
    SW_AGENT_INSTANCE = ${HOSTNAME}
    SW_AGENT_COLLECTOR_BACKEND_SERVICES = oap.skywalking:11800

    # Trace configuration
    SW_AGENT_SAMPLE_N_PER_3_SECS = -1  # Unlimited sampling
    SW_AGENT_PROTOCOL = grpc
    SW_AGENT_LOGGING_LEVEL = INFO

    # Instrumentation plugins
    SW_AGENT_PLUGIN_AIOHTTP = true
    SW_AGENT_PLUGIN_ASYNCIO = true
    SW_AGENT_PLUGIN_HTTP = true

    # Custom tags for agent context
    SW_AGENT_TAGS = env=${NODE_ENV:-development},platform=vibecode,runtime=python,framework=aiohttp

    # Performance tuning
    SW_AGENT_QUEUE_TIMEOUT = 5
    SW_AGENT_BUFFER_SIZE = 1000

    # Correlation with other traces
    SW_AGENT_CORRELATION_ELEMENT_MAX_NUMBER = 3
    SW_AGENT_CORRELATION_VALUE_MAX_LENGTH = 256

    # Agent metadata for anomaly detection
    SW_AGENT_METADATA_DEPLOYMENT_TYPE = kubernetes
    SW_AGENT_METADATA_CONTAINER_RUNTIME = docker
    SW_AGENT_METADATA_ORCHESTRATOR = kubernetes

---
# Patch for Next.js Deployment to add SkyWalking Agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibecode-webgui
  namespace: vibecode-platform
spec:
  template:
    metadata:
      annotations:
        # SkyWalking injection annotation
        sidecar.skywalking.apache.org/inject: "true"
    spec:
      initContainers:
      - name: skywalking-agent
        image: apache/skywalking-nodejs-agent:1.0.0
        command:
        - sh
        - -c
        - |
          cp -r /usr/local/lib/node_modules/skywalking-backend-js /skywalking
          cp /config/agent.config.js /skywalking/agent.config.js
        volumeMounts:
        - name: skywalking-agent
          mountPath: /skywalking
        - name: agent-config
          mountPath: /config
      containers:
      - name: vibecode-webgui
        env:
        # SkyWalking agent configuration
        - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
          value: "oap.skywalking:11800"
        - name: SW_AGENT_NAME
          value: "vibecode-webgui"
        - name: NODE_OPTIONS
          value: "-r /skywalking/index.js"
        # Existing Datadog configuration
        - name: DD_SERVICE
          value: "vibecode-webgui"
        - name: DD_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DD_VERSION
          value: "1.0.0"
        # Trace correlation
        - name: DD_TRACE_PROPAGATION_STYLE
          value: "datadog,tracecontext"
        - name: SW_TRACE_PROPAGATION_STYLE
          value: "sw8,tracecontext"
        volumeMounts:
        - name: skywalking-agent
          mountPath: /skywalking
          readOnly: true
      volumes:
      - name: skywalking-agent
        emptyDir: {}
      - name: agent-config
        configMap:
          name: skywalking-nodejs-agent-config

---
# Patch for AgentAPI Deployment to add SkyWalking Agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentapi
  namespace: vibecode-platform
spec:
  template:
    metadata:
      annotations:
        # SkyWalking injection annotation
        sidecar.skywalking.apache.org/inject: "true"
    spec:
      initContainers:
      - name: skywalking-agent
        image: apache/skywalking-python-agent:1.1.0
        command:
        - sh
        - -c
        - |
          cp -r /usr/local/lib/python3.11/site-packages/skywalking /skywalking
          cp /config/sw_python.ini /skywalking/sw_python.ini
        volumeMounts:
        - name: skywalking-agent
          mountPath: /skywalking
        - name: agent-config
          mountPath: /config
      containers:
      - name: agentapi
        env:
        # SkyWalking agent configuration
        - name: SW_AGENT_COLLECTOR_BACKEND_SERVICES
          value: "oap.skywalking:11800"
        - name: SW_AGENT_NAME
          value: "agentapi"
        - name: SW_AGENT_INSTANCE
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: PYTHONPATH
          value: "/skywalking:$PYTHONPATH"
        - name: SW_PYTHON_AGENT_CONFIG
          value: "/skywalking/sw_python.ini"
        # Existing Datadog configuration (maintain compatibility)
        - name: DD_SERVICE
          value: "agentapi"
        - name: DD_ENV
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DD_VERSION
          value: "1.0.0"
        # Trace correlation
        - name: DD_TRACE_PROPAGATION_STYLE
          value: "datadog,tracecontext"
        - name: SW_TRACE_PROPAGATION_STYLE
          value: "sw8,tracecontext"
        volumeMounts:
        - name: skywalking-agent
          mountPath: /skywalking
          readOnly: true
      volumes:
      - name: skywalking-agent
        emptyDir: {}
      - name: agent-config
        configMap:
          name: skywalking-python-agent-config

---
# Custom Span Attributes for Agent Metadata
apiVersion: v1
kind: ConfigMap
metadata:
  name: skywalking-custom-attributes
  namespace: vibecode-platform
  labels:
    app.kubernetes.io/name: skywalking-agent
    app.kubernetes.io/component: configuration
data:
  custom-attributes.yaml: |
    # Custom span attributes for enhanced observability
    # These attributes enable better anomaly detection and correlation

    # Agent identification
    agent:
      - key: agent.id
        type: string
        description: "Unique agent identifier"
      - key: agent.type
        type: string
        description: "Agent type (aider, goose, cline)"
      - key: agent.version
        type: string
        description: "Agent version"

    # Task context
    task:
      - key: task.id
        type: string
        description: "Task identifier"
      - key: task.type
        type: string
        description: "Task type"
      - key: task.priority
        type: string
        description: "Task priority (high, medium, low)"
      - key: task.duration
        type: number
        description: "Task duration in milliseconds"

    # Workspace context
    workspace:
      - key: workspace.path
        type: string
        description: "Workspace path"
      - key: workspace.files_count
        type: number
        description: "Number of files in workspace"

    # Model context (for LLM operations)
    model:
      - key: model.provider
        type: string
        description: "LLM provider (openai, anthropic, etc)"
      - key: model.name
        type: string
        description: "Model name"
      - key: model.tokens_used
        type: number
        description: "Tokens consumed"
      - key: model.cost
        type: number
        description: "Estimated cost"

    # Error context
    error:
      - key: error.type
        type: string
        description: "Error type/class"
      - key: error.code
        type: string
        description: "Error code"
      - key: error.recoverable
        type: boolean
        description: "Whether error is recoverable"

    # Performance metrics
    performance:
      - key: perf.queue_depth
        type: number
        description: "Current queue depth"
      - key: perf.active_agents
        type: number
        description: "Number of active agents"
      - key: perf.memory_mb
        type: number
        description: "Memory usage in MB"
      - key: perf.cpu_percent
        type: number
        description: "CPU usage percentage"

    # Business metrics
    business:
      - key: business.user_id
        type: string
        description: "User identifier"
      - key: business.session_id
        type: string
        description: "Session identifier"
      - key: business.feature
        type: string
        description: "Feature being used"

---
# SkyWalking Agent Initialization Script
apiVersion: v1
kind: ConfigMap
metadata:
  name: skywalking-agent-init
  namespace: vibecode-platform
  labels:
    app.kubernetes.io/name: skywalking-agent
    app.kubernetes.io/component: initialization
data:
  init-agent.sh: |
    #!/bin/bash
    set -e

    echo "Initializing SkyWalking agent..."

    # Wait for OAP to be ready
    until nc -z oap.skywalking 11800; do
      echo "Waiting for SkyWalking OAP..."
      sleep 2
    done

    echo "SkyWalking OAP is ready"

    # Verify agent configuration
    if [ -f "/skywalking/agent.config.js" ]; then
      echo "Node.js agent configuration found"
      cat /skywalking/agent.config.js
    fi

    if [ -f "/skywalking/sw_python.ini" ]; then
      echo "Python agent configuration found"
      cat /skywalking/sw_python.ini
    fi

    # Test connectivity
    if command -v curl &> /dev/null; then
      echo "Testing OAP connectivity..."
      curl -f http://oap.skywalking:12800/internal/l7check || {
        echo "Warning: OAP health check failed"
      }
    fi

    echo "SkyWalking agent initialization complete"

  verify-instrumentation.sh: |
    #!/bin/bash
    # Verify that instrumentation is working

    echo "Verifying SkyWalking instrumentation..."

    # Check if agent is loaded
    if [ "$NODE_OPTIONS" != "" ]; then
      echo "Node.js agent loaded: $NODE_OPTIONS"
    fi

    if [ "$PYTHONPATH" != "" ]; then
      echo "Python agent loaded: $PYTHONPATH"
    fi

    # Check if traces are being sent
    TRACE_COUNT=$(curl -s "http://oap.skywalking:12800/graphql" \
      -H "Content-Type: application/json" \
      -d '{"query":"query {getTrace(traceId: \"test\"){spans{traceId}}}"}' | \
      jq -r '.data.getTrace.spans | length')

    if [ "$TRACE_COUNT" -gt 0 ]; then
      echo "Traces are being collected: $TRACE_COUNT spans"
    else
      echo "Warning: No traces found yet"
    fi

    echo "Verification complete"

---
# Service for accessing agent configuration
apiVersion: v1
kind: Service
metadata:
  name: skywalking-agent-config
  namespace: vibecode-platform
  labels:
    app.kubernetes.io/name: skywalking-agent
    app.kubernetes.io/component: configuration
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: vibecode-webgui
  ports:
  - name: agent
    port: 11800
    targetPort: 11800
