apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-server-workspace-netpol
  namespace: vibecode-platform
spec:
  podSelector:
    matchLabels:
      app: code-server
      component: workspace

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: vibecode-platform
          podSelector:
            matchLabels:
              app: vibecode-frontend
      ports:
        - protocol: TCP
          port: 8765

    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443

    - to:
        - namespaceSelector:
            matchLabels:
              name: vibecode-platform
      ports:
        - protocol: TCP
          port: 8765
        - protocol: TCP
          port: 3284
