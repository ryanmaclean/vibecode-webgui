datadog:
  site: "datadoghq.com"
  clusterName: "vibecode-kind-test"

  # Enable Kubernetes Autoscaling (GA 2025)
  autoscaling:
    workload:
      enabled: true

  # Enhanced Kubernetes Events
  kubernetesEvents:
    unbundleEvents: true

  # Core monitoring features
  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true
  apm:
    enabled: true
  processAgent:
    enabled: true

  # Network monitoring
  networkMonitoring:
    enabled: true

  # Security Agent
  securityAgent:
    runtime:
      enabled: true

  # System Probe features
  systemProbe:
    enableTCPQueueLength: true
    enableOOMKill: true

  # Orchestrator Explorer (Required for Pod collection)
  orchestratorExplorer:
    enabled: true

  # Kubernetes State Metrics
  kubeStateMetricsCore:
    enabled: true
  kubeStateMetricsScrape:
    enabled: true

  # Collect Kubernetes events
  collectEvents: true

  # Database Monitoring
  databaseMonitoring:
    enabled: true

  env:
    - name: DD_HOSTNAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: DD_LLMOBS_ENABLED
      value: "1"
    - name: DD_LLMOBS_AGENTLESS_ENABLED
      value: "1"
    - name: DD_LLMOBS_ML_APP
      value: "vibecode-ai"
    - name: DD_SERVICE
      value: "vibecode-webgui"
    - name: DD_ENV
      value: "production"
    - name: DD_VERSION
      value: "1.0.0"
    - name: DD_APPSEC_ENABLED
      value: "true"
    - name: DD_IAST_ENABLED
      value: "true"
    - name: DD_IAST_REQUEST_SAMPLING
      value: "1.0"
    - name: DD_PROFILING_ENABLED
      value: "true"
    - name: DD_TRACE_SAMPLE_RATE
      value: "1"
    - name: DD_TRACE_ENABLED
      value: "true"
    - name: DD_LOGS_ENABLED
      value: "true"
    - name: DD_APM_FEATURES
      value: "appsec,profiling,ci_visibility"
    - name: DD_DBM_PROPAGATION_MODE
      value: "full"
    - name: DD_DBM_TRACE_INJECTION
      value: "true"

  confd:
    redisdb.yaml: |
      init_config:
      instances:
        - host: valkey-service.vibecode-platform.svc.cluster.local
          port: 6379
          password: ${DD_VALKEY_PASSWORD:-${DATADOG_VALKEY_PASSWORD}}
          tags:
            - env:production
            - service:vibecode-valkey
            - component:cache

agents:
  image:
    tag: "1.24.0"  # Ensure we meet minimum version requirement
  
  # Enable custom metrics for autoscaling
  metricsProvider:
    enabled: true
    useDatadogMetrics: true

  # Additional RBAC for DatadogMetric CRD
  rbac:
    create: true

  # Autoscaling configuration
  autoscaling:
    workload:
      enabled: true
  
  # Orchestrator Explorer (Required for Pod collection)
  orchestratorExplorer:
    enabled: true

clusterChecksRunner:
  enabled: true

orchestratorExplorer:
  enabled: true

networkMonitoring:
  enabled: true

securityAgent:
  enabled: true
  runtime:
    enabled: true
  compliance:
    enabled: true

systemProbe:
  enabled: true
  enableTCPQueueLength: true
  enableHTTPMonitoring: true
  collectDNSStats: true

# Target Allocator for advanced metrics
targetAllocator:
  enabled: false
