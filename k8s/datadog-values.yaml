datadog:
  site: "datadoghq.com"
  apiKeyExistingSecret: datadog-secret
  appKeyExistingSecret: datadog-secret
  clusterName: "vibecode-prod-aks-84859296"
  logs:
    enabled: true
    containerCollectAll: true
    containerCollectUsingFiles: true
  apm:
    enabled: true
  processAgent:
    enabled: true
  networkMonitoring:
    enabled: true
  databaseMonitoring:
    enabled: true
  collectEvents: true
  kubeStateMetricsCore:
    enabled: true
  kubeStateMetricsScrape:
    enabled: true
  env:
    - name: DD_LLMOBS_ENABLED
      value: "1"
    - name: DD_LLMOBS_AGENTLESS_ENABLED
      value: "1"
    - name: DD_LLMOBS_ML_APP
      value: "vibecode-ai"
    - name: DD_SERVICE
      value: "vibecode-webgui"
    - name: DD_ENV
      value: "production"
    - name: DD_VERSION
      value: "1.0.0"
    - name: DD_APPSEC_ENABLED
      value: "true"
    - name: DD_IAST_ENABLED
      value: "true"
    - name: DD_IAST_REQUEST_SAMPLING
      value: "1.0"
    - name: DD_PROFILING_ENABLED
      value: "true"
    - name: DD_TRACE_SAMPLE_RATE
      value: "1"
    - name: DD_TRACE_ENABLED
      value: "true"
    - name: DD_LOGS_ENABLED
      value: "true"
    - name: DD_APM_FEATURES
      value: "appsec,profiling,ci_visibility"
    - name: DD_DBM_PROPAGATION_MODE
      value: "full"
    - name: DD_DBM_TRACE_INJECTION
      value: "true"

  confd:
    redisdb.yaml: |
      init_config:
      instances:
        - host: valkey-service.vibecode-platform.svc.cluster.local
          port: 6379
          password: ${DD_VALKEY_PASSWORD:-${DATADOG_VALKEY_PASSWORD}}
          tags:
            - env:production
            - service:vibecode-valkey
            - component:cache

agents:
  image:
    tag: "7.66.1"
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Exists"
  useHostNetwork: false

clusterAgent:
  enabled: true
  replicas: 2
  metricsProvider:
    enabled: true
    useDatadogMetrics: true
  rbac:
    create: true
  admissionController:
    enabled: true

clusterChecksRunner:
  enabled: true

orchestratorExplorer:
  enabled: true

networkMonitoring:
  enabled: true

securityAgent:
  enabled: true
  runtime:
    enabled: true
  compliance:
    enabled: true

systemProbe:
  enabled: true
  enableTCPQueueLength: true
  enableOOMKill: true
  enableHTTPMonitoring: true
  collectDNSStats: true
