apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeserver-cloud
  labels:
    app: codeserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codeserver
  template:
    metadata:
      labels:
        app: codeserver
    spec:
      containers:
        - name: codeserver
          image: ghcr.io/ryanmaclean/vibecode-codeserver:latest
          ports:
            - containerPort: 8765
          env:
            - name: PASSWORD
              value: changeme
          volumeMounts:
            - name: workspace
              mountPath: /home/coder/project
      volumes:
        - name: workspace
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: codeserver-cloud
spec:
  type: ClusterIP
  selector:
    app: codeserver
  ports:
    - port: 80
      targetPort: 8765
      name: http
