apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vector-db-with-affinity
  namespace: vibecode
spec:
  serviceName: vector-db
  replicas: 3
  selector:
    matchLabels:
      app: vector-db
  template:
    metadata:
      labels:
        app: vector-db
        component: database
    spec:
      # Anti-affinity to spread pods across nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - vector-db
            topologyKey: kubernetes.io/hostname
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - vector-db
              topologyKey: topology.kubernetes.io/zone
        
        # Node affinity for preferred node types
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values:
                - database
                - compute
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - database
          - weight: 60
            preference:
              matchExpressions:
              - key: disk-type
                operator: In
                values:
                - ssd
                - nvme
          - weight: 40
            preference:
              matchExpressions:
              - key: network-performance
                operator: In
                values:
                - high
                - enhanced
      
      # Topology spread constraints for even distribution
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: vector-db
      - maxSkew: 2
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: vector-db
      
      # Tolerations for dedicated database nodes
      tolerations:
      - key: database-workload
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: high-memory
        operator: Equal
        value: "true"
        effect: NoSchedule
      
      containers:
      - name: postgres
        image: postgres:15-alpine
        # ... rest of container spec would go here
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"