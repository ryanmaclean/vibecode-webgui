# Datadog Database Monitoring agents for Azure PostgreSQL Flexible Servers
# Ensures a dedicated Datadog agent instance per environment (dev/staging/prod).
# Secrets are sourced via ExternalSecrets from the configured secret store.

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: datadog-dbmon-dev
  namespace: datadog
  labels:
    app.kubernetes.io/name: datadog-dbmon-dev
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vibecode-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vibecode-cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: datadog-dbmon-dev
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: datadog-dbmon-dev
          app.kubernetes.io/component: monitoring
      data:
        api-key: "{{ .apiKey }}"
        app-key: "{{ .appKey }}"
        db-host: "{{ .dbHost }}"
        db-name: "{{ .dbName }}"
        db-user: "{{ .dbUser }}"
        db-password: "{{ .dbPassword }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: datadog-dbmon-dev
        property: api-key
    - secretKey: appKey
      remoteRef:
        key: datadog-dbmon-dev
        property: app-key
    - secretKey: dbHost
      remoteRef:
        key: datadog-dbmon-dev
        property: db-host
    - secretKey: dbName
      remoteRef:
        key: datadog-dbmon-dev
        property: db-name
    - secretKey: dbUser
      remoteRef:
        key: datadog-dbmon-dev
        property: db-user
    - secretKey: dbPassword
      remoteRef:
        key: datadog-dbmon-dev
        property: db-password

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: datadog-dbmon-config-dev
  namespace: datadog
  labels:
    app.kubernetes.io/name: datadog-dbmon-dev
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vibecode-platform
    env: dev
data:
  postgres.yaml: |
    init_config:

    instances:
      - host: "%%env_DD_DB_HOST%%"
        port: 5432
        username: "%%env_DD_DB_USER%%"
        password: "%%env_DD_DB_PASSWORD%%"
        dbname: "%%env_DD_DB_NAME%%"
        ssl: 'require'
        dbm: true
        query_metrics:
          enabled: true
          run_sync: true
          collection_interval: 15
        query_activity:
          enabled: true
          collection_interval: 10
        query_samples:
          enabled: false
        collect_schemas:
          enabled: true
          collection_interval: 60
        collect_settings:
          enabled: true
          collection_interval: 60
        tags:
          - env:dev
          - service:vibecode-postgres
          - cloud:azure
          - component:database

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-dbmon-dev
  namespace: datadog
  labels:
    app.kubernetes.io/name: datadog-dbmon-dev
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vibecode-platform

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-dbmon-dev
  namespace: datadog
  labels:
    app.kubernetes.io/name: datadog-dbmon-dev
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vibecode-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: datadog-dbmon-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datadog-dbmon-dev
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: vibecode-platform
        env: dev
    spec:
      serviceAccountName: datadog-dbmon-dev
      containers:
        - name: datadog-agent
          image: datadog/docker-dd-agent:latest-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: api-key
            - name: DD_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: app-key
            - name: DD_SITE
              value: "datadoghq.com"
            - name: DD_DBM_ENABLED
              value: "true"
            - name: DD_LOGS_ENABLED
              value: "false"
            - name: DD_APM_ENABLED
              value: "false"
            - name: DD_PROCESS_AGENT_ENABLED
              value: "false"
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "true"
            - name: DD_CLUSTER_AGENT_ENABLED
              value: "true"
            - name: DD_CLUSTER_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: datadog-cluster-agent
                  key: token
            - name: DD_CLUSTER_AGENT_URL
              value: "http://datadog-dbmon-dev-cluster-agent.datadog.svc.cluster.local:5005"
            - name: DD_CLUSTER_AGENT_USE_TLS
              value: "false"
            - name: DD_COLLECT_KUBERNETES_EVENTS
              value: "false"
            - name: DD_CLUSTER_NAME
              value: "vibecode-dbmon-dev"
            - name: DD_ENV
              value: "dev"
            - name: DD_SERVICE
              value: "vibecode-postgres"
            - name: DD_VERSION
              value: "2025.09.23"
            - name: DD_HOSTNAME
              value: "vibecode-dbmon-dev"
            - name: DD_REMOTE_CONFIGURATION_ENABLED
              value: "false"
            - name: DD_RUNTIME_SECURITY_CONFIG_ENABLED
              value: "false"
            - name: DD_SYSTEM_PROBE_ENABLED
              value: "false"
            - name: DD_SKIP_KUBERNETES_EVENTS
              value: "true"
            - name: DD_KUBELET_ENABLED
              value: "false"
            - name: DD_CONTAINER_COLLECT_KUBERNETES_TAGS
              value: "false"
            - name: DD_AC_EXCLUDE
              value: "name:kubelet"
            - name: DD_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: db-host
            - name: DD_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: db-name
            - name: DD_DB_USER
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: db-user
            - name: DD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: db-password
          volumeMounts:
            - name: dbmon-config
              mountPath: /etc/datadog-agent/conf.d/postgres.d/
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: dbmon-config
          configMap:
            name: datadog-dbmon-config-dev

