image:
  repository: vibecode-webgui
  tag: kind
  pullPolicy: IfNotPresent

fullnameOverride: vibecode-webgui

env:
  NODE_ENV: development
  DD_ENV: developement
  DD_SERVICE: vibecode-webgui
  DD_VERSION: "kind"
  DD_TRACE_ENABLED: "true"
  DD_LOGS_INJECTION: "true"
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_DYNAMIC_INSTRUMENTATION_ENABLED: "false"
  DD_SOURCE_MAP: "false"
  DD_PROFILING_ENABLED: "true"
  DD_APPSEC_ENABLED: "true"
  DD_IAST_ENABLED: "true"

extraEnv:
  DD_ENABLED: "true"
  OTEL_ENABLED: "true"
  NODE_OPTIONS: "--require ./src/instrument.cjs"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://datadog.datadog.svc.cluster.local:4318/v1/traces"
  DD_AGENT_HOST: "datadog.datadog.svc.cluster.local"
  DD_TRACE_AGENT_PORT: "8126"
  DD_DOGSTATSD_PORT: "8125"
  DD_HTTP_PLUGIN: "true"
  DD_TRACE_DEBUG: "true"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  hosts:
    - host: localhost

monitoring:
  prometheus:
    enabled: false
  datadog:
    enabled: true

envSecrets:
  database-url: "postgresql://postgres:postgres@vibecode-postgres-postgresql.vibecode.svc.cluster.local:5432/vibecode"
  nextauth-secret: "kind-local-secret"
  openrouter-api-key: ""
  dd-api-key: ""

redis:
  enabled: false

database:
  host: vibecode-postgres-postgresql.vibecode.svc.cluster.local
  port: 5432
  name: vibecode
  username: postgres
  password: postgres
  ssl: false
