---
# ⚠️ WARNING: DEVELOPMENT/TESTING ONLY
# This file contains placeholder credentials for local development and testing.
# DO NOT use these values in production or external deployments.
# See k8s/SECRETS-SETUP.md and k8s/templates/ for production configuration.
apiVersion: v1
kind: Secret
metadata:
  name: vibecode-secrets
  namespace: vibecode-platform
type: Opaque
stringData:
  ADMIN_EMAIL: admin@vibecode.dev
  ADMIN_PASSWORD: admin123
  NODE_ENV: production
  NEXTAUTH_SECRET: REPLACE_WITH_SECURE_JWT_SECRET
  DD_API_KEY: REPLACE_WITH_DATADOG_API_KEY
  DD_APP_KEY: REPLACE_WITH_DATADOG_APP_KEY
  OPENROUTER_API_KEY: REPLACE_WITH_OPENROUTER_API_KEY
  NEXT_PUBLIC_DD_APPLICATION_ID: REPLACE_WITH_DATADOG_APP_ID
  NEXT_PUBLIC_DD_CLIENT_TOKEN: REPLACE_WITH_DATADOG_CLIENT_TOKEN
  NEXT_PUBLIC_DD_SITE: REPLACE_WITH_DATADOG_SITE
  # Legacy NEXT_PUBLIC_DATADOG_* keys are intentionally omitted.
  # The app falls back to legacy names if NEXT_PUBLIC_DD_* are unset.
  # For migration-only scenarios, you may add them temporarily:
  # NEXT_PUBLIC_DATADOG_RUM_APPLICATION_ID: REPLACE_WITH_DATADOG_APP_ID
  # NEXT_PUBLIC_DATADOG_RUM_CLIENT_TOKEN: REPLACE_WITH_DATADOG_CLIENT_TOKEN
  # NEXT_PUBLIC_DATADOG_SITE: REPLACE_WITH_DATADOG_SITE
