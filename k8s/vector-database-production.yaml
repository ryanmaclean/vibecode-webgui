# Production-ready PostgreSQL with pgvector StatefulSet
# Comprehensive deployment with resource allocations, initialization scripts, 
# backup configuration, and monitoring integration

apiVersion: v1
kind: Namespace
metadata:
  name: vibecode-platform
  labels:
    name: vibecode-platform
    tier: production
---
apiVersion: v1
kind: Secret
metadata:
  name: vector-db-credentials
  namespace: vibecode-platform
type: Opaque
data:
  # Base64 encoded secure passwords - replace with actual values in production
  postgres-password: VmVjdG9yREJfc2VjdXJlX3Bhc3N3b3JkXzEyMyE=  # VectorDB_secure_password_123!
  replication-password: UmVwbGljYXRpb25fc2VjdXJlX3Bhc3N3b3JkXzEyMyE=  # Replication_secure_password_123!
  datadog-password: RGF0YWRvZ19tb25pdG9yaW5nX3Bhc3N3b3JkXzEyMyE=  # Datadog_monitoring_password_123!
  app-password: QXBwX3NlY3VyZV9wYXNzd29yZF8xMjMh  # App_secure_password_123!
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-db-config
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: configuration
data:
  postgresql.conf: |
    # PostgreSQL 16 configuration optimized for pgvector and production workloads
    
    # Connection settings
    listen_addresses = '*'
    port = 5432
    max_connections = 300
    superuser_reserved_connections = 3
    
    # Memory settings - optimized for 16Gi+ nodes
    shared_buffers = '4GB'
    effective_cache_size = '12GB'
    work_mem = '32MB'
    maintenance_work_mem = '512MB'
    dynamic_shared_memory_type = 'posix'
    
    # WAL and checkpoint settings for durability and performance
    wal_level = 'replica'
    max_wal_size = '2GB'
    min_wal_size = '256MB'
    wal_compression = 'on'
    wal_buffers = '64MB'
    checkpoint_completion_target = 0.9
    checkpoint_timeout = '10min'
    
    # Archiving and point-in-time recovery
    archive_mode = 'on'
    archive_command = '/usr/local/bin/pgbackrest --stanza=main archive-push %p'
    restore_command = '/usr/local/bin/pgbackrest --stanza=main archive-get %f %p'
    
    # Logging configuration for monitoring and debugging
    logging_collector = 'on'
    log_directory = '/var/lib/postgresql/data/log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = '1d'
    log_rotation_size = '100MB'
    log_statement = 'ddl'
    log_min_duration_statement = '500ms'
    log_checkpoints = 'on'
    log_connections = 'on'
    log_disconnections = 'on'
    log_lock_waits = 'on'
    log_temp_files = '0'
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    
    # Replication settings
    max_wal_senders = 5
    wal_keep_size = '1GB'
    hot_standby = 'on'
    hot_standby_feedback = 'on'
    max_standby_streaming_delay = '30s'
    
    # Performance tuning for SSD storage
    random_page_cost = 1.1
    seq_page_cost = 1.0
    effective_io_concurrency = 300
    max_worker_processes = 16
    max_parallel_workers = 8
    max_parallel_workers_per_gather = 4
    max_parallel_maintenance_workers = 4
    
    # pgvector extension settings
    shared_preload_libraries = 'pg_stat_statements,vector,pg_prewarm'
    pg_stat_statements.max = 10000
    pg_stat_statements.track = 'all'
    
    # Vector-specific optimizations
    # Enable JIT for complex vector operations
    jit = 'on'
    jit_above_cost = 100000
    jit_inline_above_cost = 500000
    jit_optimize_above_cost = 500000
    
    # HNSW index optimization
    hnsw.ef_search = 100
    
    # Security settings
    ssl = 'on'
    ssl_cert_file = '/etc/ssl/certs/server.crt'
    ssl_key_file = '/etc/ssl/private/server.key'
    ssl_ca_file = '/etc/ssl/certs/ca.crt'
    ssl_prefer_server_ciphers = 'on'
    ssl_ciphers = 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256'
    password_encryption = 'scram-sha-256'
    
    # Vacuum and autovacuum settings for vector data
    autovacuum = 'on'
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05
    autovacuum_vacuum_cost_limit = 2000
    autovacuum_naptime = '15s'
    
  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    
    # Local connections
    local   all             postgres                                peer
    local   all             all                                     scram-sha-256
    
    # Host connections with SSL required
    hostssl all             all             0.0.0.0/0               scram-sha-256
    
    # Kubernetes pod network (adjust CIDR for your cluster)
    hostssl all             vibecode_app    10.0.0.0/8              scram-sha-256
    hostssl all             datadog         10.0.0.0/8              scram-sha-256
    
    # Replication connections
    hostssl replication     replication     10.0.0.0/8              scram-sha-256
    
    # Deny unencrypted connections
    host    all             all             0.0.0.0/0               reject
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-db-init-scripts
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: initialization
data:
  00_extensions.sql: |
    -- Install required extensions for vector database
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS btree_gin;
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    CREATE EXTENSION IF NOT EXISTS pg_prewarm;
    CREATE EXTENSION IF NOT EXISTS pg_stat_monitor;
    
    -- Show installed extensions
    SELECT extname, extversion FROM pg_extension WHERE extname IN 
      ('vector', 'pg_stat_statements', 'pgcrypto', 'pg_trgm', 'btree_gin', 'btree_gist');
    
  01_users.sql: |
    -- Create application user with appropriate privileges
    CREATE USER vibecode_app WITH PASSWORD :'APP_PASSWORD';
    GRANT CONNECT ON DATABASE postgres TO vibecode_app;
    
    -- Create monitoring user for Datadog
    CREATE USER datadog WITH PASSWORD :'DATADOG_PASSWORD';
    GRANT CONNECT ON DATABASE postgres TO datadog;
    GRANT SELECT ON pg_stat_database TO datadog;
    GRANT SELECT ON pg_stat_activity TO datadog;
    GRANT SELECT ON pg_stat_statements TO datadog;
    GRANT SELECT ON pg_locks TO datadog;
    GRANT SELECT ON pg_stat_bgwriter TO datadog;
    GRANT SELECT ON pg_stat_archiver TO datadog;
    GRANT SELECT ON pg_stat_replication TO datadog;
    
    -- Create replication user
    CREATE USER replication WITH REPLICATION PASSWORD :'REPLICATION_PASSWORD';
    
  02_databases.sql: |
    -- Create main application database
    CREATE DATABASE vibecode 
      WITH OWNER vibecode_app
      ENCODING 'UTF8'
      LC_COLLATE = 'en_US.UTF-8'
      LC_CTYPE = 'en_US.UTF-8'
      TEMPLATE template0;
    
    -- Connect to the new database
    \c vibecode;
    
    -- Ensure extensions are available in the application database
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
    CREATE EXTENSION IF NOT EXISTS pg_trgm;
    CREATE EXTENSION IF NOT EXISTS btree_gin;
    CREATE EXTENSION IF NOT EXISTS btree_gist;
    
  03_schema.sql: |
    -- Create schemas for organization
    \c vibecode;
    
    CREATE SCHEMA IF NOT EXISTS vectors AUTHORIZATION vibecode_app;
    CREATE SCHEMA IF NOT EXISTS app_data AUTHORIZATION vibecode_app;
    CREATE SCHEMA IF NOT EXISTS monitoring AUTHORIZATION vibecode_app;
    
    -- Grant schema usage
    GRANT USAGE ON SCHEMA vectors TO vibecode_app;
    GRANT USAGE ON SCHEMA app_data TO vibecode_app;
    GRANT USAGE ON SCHEMA monitoring TO vibecode_app;
    GRANT USAGE ON SCHEMA vectors TO datadog;
    GRANT USAGE ON SCHEMA app_data TO datadog;
    GRANT USAGE ON SCHEMA monitoring TO datadog;
    
  04_vector_tables.sql: |
    -- Create optimized vector storage tables
    \c vibecode;
    SET search_path = vectors, public;
    
    -- Main document embeddings table
    CREATE TABLE IF NOT EXISTS document_embeddings (
        id BIGSERIAL PRIMARY KEY,
        document_id VARCHAR(255) UNIQUE NOT NULL,
        content TEXT NOT NULL,
        embedding vector(1536) NOT NULL,
        metadata JSONB DEFAULT '{}',
        namespace VARCHAR(100) DEFAULT 'default',
        embedding_model VARCHAR(100) DEFAULT 'text-embedding-3-small',
        embedding_generation_time_ms INTEGER,
        content_hash CHAR(64),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
    
    -- Indexes for optimal vector search performance
    -- HNSW index for cosine similarity (most common for embeddings)
    CREATE INDEX CONCURRENTLY IF NOT EXISTS document_embeddings_embedding_cosine_idx 
      ON document_embeddings USING hnsw (embedding vector_cosine_ops);
    
    -- IVFFlat index for L2 distance as backup
    CREATE INDEX CONCURRENTLY IF NOT EXISTS document_embeddings_embedding_l2_idx 
      ON document_embeddings USING ivfflat (embedding vector_l2_ops) WITH (lists = 100);
    
    -- Traditional B-tree indexes for filtering
    CREATE INDEX CONCURRENTLY IF NOT EXISTS document_embeddings_document_id_idx 
      ON document_embeddings(document_id);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS document_embeddings_namespace_idx 
      ON document_embeddings(namespace);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS document_embeddings_created_at_idx 
      ON document_embeddings(created_at);
    
    -- GIN index for metadata JSONB queries
    CREATE INDEX CONCURRENTLY IF NOT EXISTS document_embeddings_metadata_idx 
      ON document_embeddings USING gin (metadata);
    
    -- Trigger for updating updated_at timestamp
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ language 'plpgsql';
    
    CREATE TRIGGER update_document_embeddings_updated_at 
      BEFORE UPDATE ON document_embeddings 
      FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();
    
    -- Vector search performance optimization table
    CREATE TABLE IF NOT EXISTS vector_search_stats (
        id BIGSERIAL PRIMARY KEY,
        query_vector vector(1536),
        search_timestamp TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        results_count INTEGER,
        query_time_ms FLOAT,
        similarity_threshold FLOAT,
        index_used VARCHAR(100)
    );
    
    -- Grant permissions to application user
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA vectors TO vibecode_app;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA vectors TO vibecode_app;
    GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA vectors TO vibecode_app;
    
    -- Grant read permissions to monitoring user
    GRANT SELECT ON ALL TABLES IN SCHEMA vectors TO datadog;
    
  05_performance_views.sql: |
    -- Create monitoring and performance views
    \c vibecode;
    SET search_path = monitoring, vectors, public;
    
    -- View for vector database health monitoring
    CREATE OR REPLACE VIEW vector_db_health AS
    SELECT 
        'document_embeddings' as table_name,
        count(*) as total_embeddings,
        avg(array_length(embedding::float[], 1)) as avg_dimension,
        min(created_at) as oldest_embedding,
        max(created_at) as newest_embedding,
        count(DISTINCT namespace) as namespace_count,
        pg_size_pretty(pg_total_relation_size('vectors.document_embeddings')) as table_size
    FROM vectors.document_embeddings;
    
    -- View for index usage statistics
    CREATE OR REPLACE VIEW vector_index_stats AS
    SELECT 
        schemaname,
        tablename,
        indexname,
        idx_tup_read,
        idx_tup_fetch,
        pg_size_pretty(pg_relation_size(indexrelid)) as index_size
    FROM pg_stat_user_indexes 
    WHERE schemaname = 'vectors' 
    ORDER BY idx_tup_read DESC;
    
    -- View for query performance monitoring
    CREATE OR REPLACE VIEW vector_query_performance AS
    SELECT 
        query,
        calls,
        total_exec_time,
        mean_exec_time,
        rows,
        100.0 * shared_blks_hit / nullif(shared_blks_hit + shared_blks_read, 0) AS hit_percent
    FROM pg_stat_statements 
    WHERE query LIKE '%vector%' OR query LIKE '%embedding%'
    ORDER BY total_exec_time DESC
    LIMIT 20;
    
    -- Grant access to views
    GRANT SELECT ON ALL TABLES IN SCHEMA monitoring TO datadog;
    GRANT SELECT ON ALL TABLES IN SCHEMA monitoring TO vibecode_app;

  init.sh: |
    #!/bin/bash
    # Database initialization script with proper error handling
    
    set -e
    
    echo "Starting vector database initialization..."
    
    # Set environment variables for passwords
    export APP_PASSWORD="$APP_PASSWORD"
    export DATADOG_PASSWORD="$DATADOG_PASSWORD" 
    export REPLICATION_PASSWORD="$REPLICATION_PASSWORD"
    
    # Function to run SQL with error handling
    run_sql() {
        local file=$1
        echo "Executing $file..."
        if ! psql -v APP_PASSWORD="$APP_PASSWORD" -v DATADOG_PASSWORD="$DATADOG_PASSWORD" -v REPLICATION_PASSWORD="$REPLICATION_PASSWORD" -f "$file"; then
            echo "Error executing $file" >&2
            exit 1
        fi
    }
    
    # Initialize database components in order
    for sql_file in /docker-entrypoint-initdb.d/*.sql; do
        if [[ -f "$sql_file" ]]; then
            run_sql "$sql_file"
        fi
    done
    
    echo "Vector database initialization complete!"
    
    # Run basic validation
    echo "Running initialization validation..."
    psql -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';"
    psql -c "SELECT count(*) as tables_created FROM information_schema.tables WHERE table_schema = 'vectors';"
    
    echo "Initialization validation passed!"
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: database
    tier: primary
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: vector-db
    role: primary
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db-headless
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: vector-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vector-db
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: database
    tier: production
    version: "16"
spec:
  serviceName: vector-db-headless
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0
  selector:
    matchLabels:
      app: vector-db
  template:
    metadata:
      labels:
        app: vector-db
        component: database
        role: primary
        version: "16"
      annotations:
        # Prometheus monitoring annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
        
        # Datadog monitoring annotations for autodiscovery
        ad.datadoghq.com/vector-db.check_names: '["postgres"]'
        ad.datadoghq.com/vector-db.init_configs: '[{}]'
        ad.datadoghq.com/vector-db.instances: |
          [{
            "host": "%%host%%",
            "port": 5432,
            "username": "datadog",
            "password": "%%env_DD_POSTGRES_PASSWORD%%",
            "dbname": "vibecode",
            "ssl": "require",
            "tags": ["environment:production", "service:vector-db", "role:primary"],
            "collect_count_metrics": true,
            "collect_activity_metrics": true,
            "collect_database_size_metrics": true,
            "collect_default_db": true,
            "dbm": true,
            "query_metrics": {
              "enabled": true,
              "run_sync": true
            },
            "query_activity": {
              "enabled": true,
              "collection_interval": 10
            },
            "query_samples": {
              "enabled": true
            }
          }]
        ad.datadoghq.com/vector-db.logs: |
          [{
            "source": "postgresql",
            "service": "vector-db",
            "tags": ["environment:production", "role:primary"]
          }]
        
        # Custom metrics for vector operations
        ad.datadoghq.com/postgres-exporter.check_names: '["openmetrics"]'
        ad.datadoghq.com/postgres-exporter.init_configs: '[{}]'
        ad.datadoghq.com/postgres-exporter.instances: |
          [{
            "openmetrics_endpoint": "http://%%host%%:9187/metrics",
            "namespace": "vector_db",
            "metrics": [".*vector.*", ".*embedding.*", ".*pgvector.*"]
          }]
    spec:
      # Security context for PostgreSQL
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      
      # Node selection and affinity rules for optimal placement
      nodeSelector:
        kubernetes.io/arch: amd64
        
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["Standard_D16s_v3", "Standard_D32s_v3", "Standard_E16s_v3"]
            - weight: 50
              preference:
                matchExpressions:
                  - key: agentpool
                    operator: In
                    values: ["database", "system"]
        # Anti-affinity to avoid multiple vector-db pods on the same node
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["vector-db"]
                topologyKey: kubernetes.io/hostname
      
      # Tolerations for dedicated database nodes
      tolerations:
        - key: database
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      
      # Init container for database initialization
      initContainers:
        - name: init-vector-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/init-scripts/init.sh"]
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: postgres-password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: app-password
            - name: DATADOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: datadog-password
            - name: REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: replication-password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: vector-db-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: init-script
              mountPath: /init-scripts
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      
      containers:
        # Main PostgreSQL container with pgvector
        - name: vector-db
          image: pgvector/pgvector:pg16
          imagePullPolicy: IfNotPresent
          
          command:
            - postgres
            - -c
            - config_file=/etc/postgresql/postgresql.conf
            - -c
            - hba_file=/etc/postgresql/pg_hba.conf
          
          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: postgres-password
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256 --auth-local=peer --encoding=UTF8 --locale=en_US.UTF-8"
            - name: DD_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: datadog-password
          
          # Resource allocation - production sizing for 16-32Gi memory nodes
          resources:
            requests:
              cpu: 1000m
              memory: 8Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: 8000m
              memory: 16Gi
              ephemeral-storage: 10Gi
          
          # Health checks
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U postgres -h localhost -p 5432 -d postgres
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U postgres -h localhost -p 5432 -d postgres && psql -U postgres -d postgres -c "SELECT 1"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pg_isready -U postgres -h localhost -p 5432 -d postgres
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
            successThreshold: 1
          
          # Volume mounts
          volumeMounts:
            - name: vector-db-data
              mountPath: /var/lib/postgresql/data
            - name: config
              mountPath: /etc/postgresql
              readOnly: true
            - name: ssl-certs
              mountPath: /etc/ssl/certs
              readOnly: true
            - name: ssl-private
              mountPath: /etc/ssl/private
              readOnly: true
            - name: shared-memory
              mountPath: /dev/shm
          
          # Expose PostgreSQL port
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
        
        # PostgreSQL Exporter for Prometheus metrics
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://datadog:$(DD_POSTGRES_PASSWORD)@localhost:5432/vibecode?sslmode=require"
            - name: DD_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-db-credentials
                  key: datadog-password
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: "/etc/postgres-exporter/queries.yaml"
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          
          volumeMounts:
            - name: postgres-exporter-config
              mountPath: /etc/postgres-exporter
              readOnly: true
          
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 30
            periodSeconds: 30
          
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 10
      
      # Volume definitions
      volumes:
        - name: config
          configMap:
            name: vector-db-config
        - name: init-scripts
          configMap:
            name: vector-db-init-scripts
        - name: init-script
          configMap:
            name: vector-db-init-scripts
            items:
              - key: init.sh
                path: init.sh
                mode: 0755
        - name: ssl-certs
          secret:
            secretName: vector-db-ssl-certs
            defaultMode: 0644
            optional: true
        - name: ssl-private
          secret:
            secretName: vector-db-ssl-private
            defaultMode: 0600
            optional: true
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: postgres-exporter-config
          configMap:
            name: postgres-exporter-config
  
  # Volume claim templates for persistent storage
  volumeClaimTemplates:
    - metadata:
        name: vector-db-data
        labels:
          app: vector-db
          component: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi-premium
        resources:
          requests:
            storage: 500Gi
        # Azure Disk encryption at rest is automatically enabled
---
# Postgres Exporter custom queries configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
  namespace: vibecode-platform
  labels:
    app: vector-db
    component: monitoring
data:
  queries.yaml: |
    # Custom queries for vector database monitoring
    
    vector_embeddings_count:
      query: "SELECT namespace, count(*) as count FROM vectors.document_embeddings GROUP BY namespace"
      metrics:
        - namespace:
            usage: "LABEL"
            description: "Embedding namespace"
        - count:
            usage: "GAUGE"
            description: "Number of embeddings per namespace"
    
    vector_table_size:
      query: "SELECT 'document_embeddings' as table, pg_total_relation_size('vectors.document_embeddings') as size_bytes"
      metrics:
        - table:
            usage: "LABEL"
            description: "Table name"
        - size_bytes:
            usage: "GAUGE"
            description: "Table size in bytes"
    
    vector_index_usage:
      query: "SELECT indexname, idx_tup_read, idx_tup_fetch FROM pg_stat_user_indexes WHERE schemaname = 'vectors'"
      metrics:
        - indexname:
            usage: "LABEL"
            description: "Index name"
        - idx_tup_read:
            usage: "COUNTER"
            description: "Number of index entries returned by scans"
        - idx_tup_fetch:
            usage: "COUNTER"
            description: "Number of live table rows fetched by index scans"
    
    vector_query_performance:
      query: |
        SELECT 
          'vector_similarity_search' as query_type,
          count(*) as total_queries,
          avg(total_exec_time) as avg_exec_time_ms,
          sum(total_exec_time) as total_exec_time_ms
        FROM pg_stat_statements 
        WHERE query LIKE '%<->%' OR query LIKE '%<#>%' OR query LIKE '%<=>%'
      metrics:
        - query_type:
            usage: "LABEL" 
            description: "Type of vector query"
        - total_queries:
            usage: "COUNTER"
            description: "Total number of vector queries executed"
        - avg_exec_time_ms:
            usage: "GAUGE"
            description: "Average execution time for vector queries in milliseconds"
        - total_exec_time_ms:
            usage: "COUNTER" 
            description: "Total execution time for vector queries in milliseconds"
---
# Pod Disruption Budget to ensure availability during node maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vector-db-pdb
  namespace: vibecode-platform
  labels:
    app: vector-db
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vector-db
