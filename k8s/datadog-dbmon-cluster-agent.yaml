spec:
  replicas: 1
  selector:
    matchLabels:
      app: datadog-dbmon-prod-cluster-agent
  template:
    metadata:
      labels:
        app: datadog-dbmon-prod-cluster-agent
        app.kubernetes.io/name: datadog-cluster-agent
        env: production
    spec:
      serviceAccountName: datadog-dbmon-prod-cluster-agent
      containers:
        - name: cluster-agent
          image: datadog/cluster-agent:7.66.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
              name: agentapi
              protocol: TCP
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-prod
                  key: api-key
            - name: DD_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-prod
                  key: app-key
            - name: DD_SITE
              value: datadoghq.com
            - name: DD_CLUSTER_NAME
              value: vibecode-dbmon-prod
            - name: DD_CLUSTER_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: datadog-cluster-agent
                  key: token
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "true"
            - name: DD_CLUSTER_AGENT_LEADER_ELECTION
              value: "true"
            - name: DD_LOG_LEVEL
              value: INFO
            - name: KUBERNETES
              value: "true"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-dbmon-prod-cluster-agent
  namespace: datadog
  labels:
    app: datadog-dbmon-prod-cluster-agent
    env: production
spec:
  ports:
    - port: 5005
      targetPort: 5005
      protocol: TCP
      name: agentapi
  selector:
    app: datadog-dbmon-prod-cluster-agent
