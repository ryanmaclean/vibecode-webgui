# Datadog Cluster Agent deployments for dedicated DBM clusters.
# Provides Kubernetes resource collection so each logical DBM cluster
# reports "Enabled" for both Kubernetes State Metrics and Orchestrator Explorer.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-dbmon-dev-cluster-agent
  namespace: datadog
  labels:
    app.kubernetes.io/name: datadog-cluster-agent
    app.kubernetes.io/component: monitoring
    env: dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-dbmon-staging-cluster-agent
  namespace: datadog
  labels:
    app.kubernetes.io/name: datadog-cluster-agent
    app.kubernetes.io/component: monitoring
    env: staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-dbmon-prod-cluster-agent
  namespace: datadog
  labels:
    app.kubernetes.io/name: datadog-cluster-agent
    app.kubernetes.io/component: monitoring
    env: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-dbmon-cluster-agent
rules:
  - apiGroups: [""]
    resources:
      - services
      - events
      - endpoints
      - pods
      - nodes
      - namespaces
      - configmaps
      - persistentvolumes
      - persistentvolumeclaims
      - limitranges
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
      - roles
      - rolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-dbmon-dev-cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-dbmon-cluster-agent
subjects:
  - kind: ServiceAccount
    name: datadog-dbmon-dev-cluster-agent
    namespace: datadog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-dbmon-staging-cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-dbmon-cluster-agent
subjects:
  - kind: ServiceAccount
    name: datadog-dbmon-staging-cluster-agent
    namespace: datadog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-dbmon-prod-cluster-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-dbmon-cluster-agent
subjects:
  - kind: ServiceAccount
    name: datadog-dbmon-prod-cluster-agent
    namespace: datadog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datadog-dbmon-dev-cluster-agent
  namespace: datadog
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datadog-dbmon-staging-cluster-agent
  namespace: datadog
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datadog-dbmon-prod-cluster-agent
  namespace: datadog
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datadog-dbmon-dev-cluster-agent
  namespace: datadog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datadog-dbmon-dev-cluster-agent
subjects:
  - kind: ServiceAccount
    name: datadog-dbmon-dev-cluster-agent
    namespace: datadog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datadog-dbmon-staging-cluster-agent
  namespace: datadog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datadog-dbmon-staging-cluster-agent
subjects:
  - kind: ServiceAccount
    name: datadog-dbmon-staging-cluster-agent
    namespace: datadog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datadog-dbmon-prod-cluster-agent
  namespace: datadog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datadog-dbmon-prod-cluster-agent
subjects:
  - kind: ServiceAccount
    name: datadog-dbmon-prod-cluster-agent
    namespace: datadog
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-dbmon-dev-cluster-agent
  namespace: datadog
  labels:
    app: datadog-dbmon-dev-cluster-agent
    app.kubernetes.io/name: datadog-cluster-agent
    env: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datadog-dbmon-dev-cluster-agent
  template:
    metadata:
      labels:
        app: datadog-dbmon-dev-cluster-agent
        app.kubernetes.io/name: datadog-cluster-agent
        env: dev
    spec:
      serviceAccountName: datadog-dbmon-dev-cluster-agent
      containers:
        - name: cluster-agent
          image: datadog/cluster-agent:7.66.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
              name: agentapi
              protocol: TCP
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: api-key
            - name: DD_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-dev
                  key: app-key
            - name: DD_SITE
              value: datadoghq.com
            - name: DD_CLUSTER_NAME
              value: vibecode-dbmon-dev
            - name: DD_CLUSTER_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: datadog-cluster-agent
                  key: token
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "true"
            - name: DD_CLUSTER_AGENT_LEADER_ELECTION
              value: "true"
            - name: DD_LOG_LEVEL
              value: INFO
            - name: KUBERNETES
              value: "true"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-dbmon-dev-cluster-agent
  namespace: datadog
  labels:
    app: datadog-dbmon-dev-cluster-agent
    env: dev
spec:
  ports:
    - port: 5005
      targetPort: 5005
      protocol: TCP
      name: agentapi
  selector:
    app: datadog-dbmon-dev-cluster-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-dbmon-staging-cluster-agent
  namespace: datadog
  labels:
    app: datadog-dbmon-staging-cluster-agent
    app.kubernetes.io/name: datadog-cluster-agent
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datadog-dbmon-staging-cluster-agent
  template:
    metadata:
      labels:
        app: datadog-dbmon-staging-cluster-agent
        app.kubernetes.io/name: datadog-cluster-agent
        env: staging
    spec:
      serviceAccountName: datadog-dbmon-staging-cluster-agent
      containers:
        - name: cluster-agent
          image: datadog/cluster-agent:7.66.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
              name: agentapi
              protocol: TCP
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-staging
                  key: api-key
            - name: DD_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-dbmon-staging
                  key: app-key
            - name: DD_SITE
              value: datadoghq.com
            - name: DD_CLUSTER_NAME
              value: vibecode-dbmon-staging
            - name: DD_CLUSTER_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: datadog-cluster-agent
                  key: token
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "true"
            - name: DD_CLUSTER_AGENT_LEADER_ELECTION
              value: "true"
            - name: DD_LOG_LEVEL
              value: INFO
            - name: KUBERNETES
              value: "true"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: datadog-dbmon-staging-cluster-agent
  namespace: datadog
  labels:
    app: datadog-dbmon-staging-cluster-agent
    env: staging
spec:
  ports:
    - port: 5005
      targetPort: 5005
      protocol: TCP
      name: agentapi
  selector:
    app: datadog-dbmon-staging-cluster-agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datadog-dbmon-prod-cluster-agent
  namespace: datadog
  labels:
    app: datadog-dbmon-prod-cluster-agent
    app.kubernetes.io/name: datadog-cluster-agent
