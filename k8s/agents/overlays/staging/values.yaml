# Staging environment values for OpenAI Agents

global:
  environment: staging

replicaCount: 3

image:
  tag: latest
  pullPolicy: Always

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10

persistence:
  enabled: true
  storageClass: azure-file-standard
  size: 50Gi

cache:
  enabled: true
  storageClass: azure-file-standard
  size: 20Gi

ingress:
  enabled: true
  className: nginx
  hosts:
  - host: agents-staging.vibecode.io
    paths:
    - path: /
      pathType: Prefix
  tls:
  - secretName: openai-agents-staging-tls
    hosts:
    - agents-staging.vibecode.io

externalSecrets:
  enabled: true
  backend: azure-keyvault

agentConfig:
  monitoring:
    logLevel: debug

monitoring:
  enabled: true

networkPolicy:
  enabled: true

backup:
  enabled: true
  schedule: "0 3 * * *"
  retention: 7
