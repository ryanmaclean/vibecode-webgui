apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openai-agents-pdb
  namespace: openai-agents
  labels:
    app: openai-agents
    component: availability
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: openai-agents
      component: runtime
  unhealthyPodEvictionPolicy: AlwaysAllow
