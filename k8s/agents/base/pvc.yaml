apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openai-agents-data
  namespace: openai-agents
  labels:
    app: openai-agents
    component: storage
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: azure-file-premium
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openai-agents-cache
  namespace: openai-agents
  labels:
    app: openai-agents
    component: cache
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: azure-file-standard
  resources:
    requests:
      storage: 20Gi
