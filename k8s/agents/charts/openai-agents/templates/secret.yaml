{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openai-agents.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openai-agents.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  {{- if .Values.secrets.openaiOrgId }}
  openai-org-id: {{ .Values.secrets.openaiOrgId | quote }}
  {{- end }}
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.datadogApiKey }}
  datadog-api-key: {{ .Values.secrets.datadogApiKey | quote }}
  {{- end }}
{{- end }}
