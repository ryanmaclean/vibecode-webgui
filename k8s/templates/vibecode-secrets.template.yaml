---
apiVersion: v1
kind: Secret
metadata:
  name: vibecode-secrets
  namespace: vibecode-platform
type: Opaque
stringData:
  # REPLACE ALL VALUES BELOW WITH YOUR ACTUAL SECRETS
  # These are currently placeholder/development values

  # Admin user credentials for initial setup
  ADMIN_EMAIL: REPLACE_WITH_ACTUAL_ADMIN_EMAIL
  ADMIN_PASSWORD: REPLACE_WITH_SECURE_ADMIN_PASSWORD

  # Application environment
  NODE_ENV: production

  # NextAuth secret (must match oauth-secrets.yaml)
  # Generate with: openssl rand -base64 32
  NEXTAUTH_SECRET: REPLACE_WITH_SAME_NEXTAUTH_SECRET_AS_OAUTH

  # Datadog monitoring credentials (get from Datadog dashboard)
  DD_API_KEY: REPLACE_WITH_BASE64_ENCODED_DATADOG_API_KEY
  DD_APP_KEY: REPLACE_WITH_BASE64_ENCODED_DATADOG_APP_KEY_IF_NEEDED

  # OpenRouter API key for AI functionality (get from OpenRouter dashboard)
  OPENROUTER_API_KEY: REPLACE_WITH_BASE64_ENCODED_OPENROUTER_API_KEY

  # Datadog RUM (Real User Monitoring) - public keys, base64 encoded
  NEXT_PUBLIC_DD_APPLICATION_ID: REPLACE_WITH_BASE64_ENCODED_DD_APP_ID
  NEXT_PUBLIC_DD_CLIENT_TOKEN: REPLACE_WITH_BASE64_ENCODED_DD_CLIENT_TOKEN
  NEXT_PUBLIC_DD_SITE: REPLACE_WITH_BASE64_ENCODED_DD_SITE  # e.g., datadoghq.com

  # Legacy NEXT_PUBLIC_DATADOG_* keys are intentionally omitted.
  # The app falls back to legacy names if NEXT_PUBLIC_DD_* are unset.
  # For migration-only scenarios, you may add them temporarily:
  # NEXT_PUBLIC_DATADOG_RUM_APPLICATION_ID: REPLACE_IF_NEEDED
  # NEXT_PUBLIC_DATADOG_RUM_CLIENT_TOKEN: REPLACE_IF_NEEDED
  # NEXT_PUBLIC_DATADOG_SITE: REPLACE_IF_NEEDED