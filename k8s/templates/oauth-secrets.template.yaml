apiVersion: v1
kind: Secret
metadata:
  name: oauth-secrets
  namespace: vibecode-platform
type: Opaque
data:
  # REPLACE ALL VALUES BELOW WITH YOUR ACTUAL BASE64-ENCODED SECRETS
  #
  # To encode a secret: echo "your-actual-secret" | base64
  # Current values are placeholders and MUST be replaced for external deployment
  #
  # Get GitHub OAuth app credentials from: https://github.com/settings/developers
  GITHUB_ID: REPLACE_WITH_BASE64_ENCODED_GITHUB_CLIENT_ID
  GITHUB_SECRET: REPLACE_WITH_BASE64_ENCODED_GITHUB_CLIENT_SECRET

  # Get Google OAuth app credentials from: https://console.developers.google.com/
  GOOGLE_ID: REPLACE_WITH_BASE64_ENCODED_GOOGLE_CLIENT_ID
  GOOGLE_SECRET: REPLACE_WITH_BASE64_ENCODED_GOOGLE_CLIENT_SECRET

  # Generate secure random secret: openssl rand -base64 32 | base64
  NEXTAUTH_SECRET: REPLACE_WITH_BASE64_ENCODED_NEXTAUTH_SECRET

  # Base64 encode your deployment URL (e.g., https://your-domain.com)
  NEXTAUTH_URL: REPLACE_WITH_BASE64_ENCODED_NEXTAUTH_URL