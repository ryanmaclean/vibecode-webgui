# KIND cluster configuration for CI
# Single-node stable configuration for GitHub Actions
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vibecode-ci

# Single control-plane node for stability
nodes:
- role: control-plane
  # Use stable Kubernetes version  
  image: kindest/node:v1.29.0
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # HTTP Ingress
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  # HTTPS Ingress  
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # Next.js app port
  - containerPort: 30000
    hostPort: 3000
    protocol: TCP
  # PostgreSQL port
  - containerPort: 30432
    hostPort: 5432
    protocol: TCP

# Networking configuration optimized for CI
networking:
  # Use default CNI for stability
  disableDefaultCNI: false
  # Smaller subnets for CI
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
  # API server configuration
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443

# Enable only essential feature gates for CI stability
featureGates:
  TopologyAwareHints: true

# Minimal runtime configuration for CI
runtimeConfig:
  "api/all": "true"