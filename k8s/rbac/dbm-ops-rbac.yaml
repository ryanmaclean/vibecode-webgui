# Least-privilege RBAC for Datadog DBM operations
# Apply in each cluster to replace ad-hoc admin bindings.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datadog-ops
  namespace: datadog
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vibecode-platform
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datadog-ops-binding
  namespace: datadog
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: vibecode-platform
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    # Azure AD object for operational access; adjust as needed.
    name: 1b780d76-2508-44b6-96ee-445ab1cae41b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: datadog-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-db-ops
  namespace: vibecode-platform
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: vibecode-platform
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-db-ops-binding
  namespace: vibecode-platform
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: vibecode-platform
subjects:
  - kind: User
    apiGroup: rbac.authorization.k8s.io
    name: 1b780d76-2508-44b6-96ee-445ab1cae41b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-db-ops
