# AWS EKS Code-Server Workspace Deployment
# Optimized for EKS with Spot instances and EFS

apiVersion: v1
kind: Namespace
metadata:
  name: vibecode
  labels:
    name: vibecode
    environment: production
    pod-security.kubernetes.io/enforce: baseline

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-sa
  namespace: vibecode
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/vibecode-workspaces-workspace-role

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-XXXXXXXXXX
  directoryPerms: "700"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
  basePath: "/workspaces"
mountOptions:
  - nfsvers=4.1
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-server-config
  namespace: vibecode
data:
  config.yaml: |
    bind-addr: 0.0.0.0:8080
    auth: none
    cert: false
    disable-telemetry: true
    disable-update-check: true
    extensions-dir: /home/coder/.local/share/code-server/extensions
    user-data-dir: /home/coder/.local/share/code-server

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: code-server
  namespace: vibecode
  labels:
    app: code-server
    workload: cloud-workspace
spec:
  serviceName: code-server
  replicas: 0  # Scale up dynamically per user
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: code-server
  template:
    metadata:
      labels:
        app: code-server
        workload: cloud-workspace
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: workspace-sa

      # Prefer Spot instances for cost savings
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: eks.amazonaws.com/capacityType
                operator: In
                values:
                - SPOT
          - weight: 50
            preference:
              matchExpressions:
              - key: karpenter.sh/capacity-type
                operator: In
                values:
                - spot

      # Tolerate spot instances
      tolerations:
      - key: eks.amazonaws.com/capacityType
        operator: Equal
        value: SPOT
        effect: NoSchedule
      - key: karpenter.sh/capacity-type
        operator: Equal
        value: spot
        effect: NoSchedule

      # Graceful shutdown for spot interruptions
      terminationGracePeriodSeconds: 120

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      initContainers:
      # Initialize workspace directory
      - name: init-workspace
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          USER_DIR="/workspaces/$(USER_ID)"
          if [ ! -d "$USER_DIR" ]; then
            mkdir -p "$USER_DIR"
            echo "Created workspace directory: $USER_DIR"
          else
            echo "Workspace directory exists: $USER_DIR"
          fi
          chown -R 1000:1000 "$USER_DIR" 2>/dev/null || true
        volumeMounts:
        - name: workspace
          mountPath: /workspaces
        env:
        - name: USER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['user-id']
        securityContext:
          runAsUser: 0  # Need root to create dirs
          allowPrivilegeEscalation: false

      containers:
      - name: code-server
        image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/vibecode-code-server:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        env:
        - name: USER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['user-id']
        - name: PASSWORD
          value: ""  # Auth handled by ALB
        - name: SHELL
          value: "/bin/bash"
        - name: HOME
          value: "/home/coder"
        - name: WORKSPACE_DIR
          value: "/home/coder/workspace"
        - name: AWS_REGION
          value: "us-east-1"
        - name: DD_AGENT_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: DD_ENV
          value: "production"
        - name: DD_SERVICE
          value: "code-server"
        - name: DD_VERSION
          value: "1.0.0"
        - name: DD_TRACE_ENABLED
          value: "true"

        volumeMounts:
        - name: workspace
          mountPath: /home/coder/workspace
          subPathExpr: $(USER_ID)
        - name: config
          mountPath: /home/coder/.config/code-server
        - name: tmp
          mountPath: /tmp

        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 5Gi
          limits:
            cpu: 2000m
            memory: 4Gi
            ephemeral-storage: 10Gi

        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30  # Allow 150s for startup

        lifecycle:
          preStop:
            exec:
              command:
              - /bin/bash
              - -c
              - |
                echo "$(date): Starting graceful shutdown..."
                # Save all open files
                code-server --save-all 2>&1 | logger || true
                # Sync filesystem
                sync
                # Flush EFS cache
                echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
                # Wait for EFS sync
                sleep 10
                echo "$(date): Shutdown complete"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # code-server needs write access
          capabilities:
            drop:
            - ALL

      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: workspaces-pvc
      - name: config
        configMap:
          name: code-server-config
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi

  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
        - ReadWriteMany
      storageClassName: efs-sc
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: vibecode
  labels:
    app: code-server
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: code-server

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: code-server-hpa
  namespace: vibecode
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: code-server
  minReplicas: 0  # Scale to zero when idle
  maxReplicas: 5  # Limit concurrent sessions per user
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 min cooldown before scaling down
      policies:
      - type: Pods
        value: 1
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workspace-isolation
  namespace: vibecode
spec:
  podSelector:
    matchLabels:
      app: code-server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from ALB
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow all HTTPS egress
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow EFS mount
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 2049

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: code-server-pdb
  namespace: vibecode
spec:
  minAvailable: 0  # Allow disruption for spot instances
  selector:
    matchLabels:
      app: code-server

---
# DaemonSet for AWS Node Termination Handler
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-node-termination-handler
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: aws-node-termination-handler
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: aws-node-termination-handler
    spec:
      serviceAccountName: aws-node-termination-handler
      hostNetwork: true
      containers:
      - name: aws-node-termination-handler
        image: public.ecr.aws/aws-ec2/aws-node-termination-handler:v1.21.0
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ENABLE_SPOT_INTERRUPTION_DRAINING
          value: "true"
        - name: ENABLE_SCHEDULED_EVENT_DRAINING
          value: "true"
        - name: DELETE_LOCAL_DATA
          value: "true"
        - name: IGNORE_DAEMON_SETS
          value: "true"
        - name: POD_TERMINATION_GRACE_PERIOD
          value: "120"
        - name: INSTANCE_METADATA_URL
          value: "http://169.254.169.254"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-node-termination-handler
  namespace: kube-system
