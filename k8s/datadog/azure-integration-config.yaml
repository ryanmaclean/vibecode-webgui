apiVersion: v1
kind: ConfigMap
metadata:
  name: datadog-azure-config
  namespace: vibecode
  labels:
    app.kubernetes.io/name: datadog
    app.kubernetes.io/instance: datadog
    app.kubernetes.io/component: azure-integration
data:
  # Azure OpenAI Monitoring Configuration
  azure.d/conf.yaml: |
    init_config:
      
    instances:
      - resource_types:
          - "microsoft.cognitiveservices/accounts"
        tags:
          - "env:production"
          - "service:vibecode-ai"
          - "application:vibecode-platform"
          - "team:ai-engineering"
        
      # Enable Azure Monitor metrics collection
      - resource_type: "microsoft.insights/components"
        metrics:
          - "requests/duration"
          - "requests/count"
          - "requests/failed"
          - "exceptions/count"
          - "dependencies/count"
          - "dependencies/failed"
          - "dependencies/duration"

      # Monitor Azure OpenAI usage and quotas
      - resource_type: "microsoft.cognitiveservices/accounts"
        metrics:
          - "TotalCalls"
          - "SuccessfulCalls"
          - "TotalErrors"
          - "BlockedCalls"
          - "ServerErrors"
          - "DataIn"
          - "DataOut"
          - "Latency"
          - "TotalTokens"
          - "TotalTokenCount"
          - "TotalRequests"

      # Monitor Azure Application Insights for custom events and metrics
      - resource_type: "microsoft.insights/components"
        metrics:
          - "custom/embeddings_generated"
          - "custom/embedding_latency_ms"
          - "custom/tokens_used"
          - "custom/rate_limited_requests"
          - "custom/vector_search_latency_ms"

    # Log collection for Azure OpenAI
    logs:
      - type: azure
        source: azure.openai
        client_id: ${AZURE_CLIENT_ID}
        client_secret: ${AZURE_CLIENT_SECRET}
        tenant_id: ${AZURE_TENANT_ID}
        subscription_id: ${AZURE_SUBSCRIPTION_ID}
        resource_groups:
          - ${AZURE_OPENAI_RESOURCE_GROUP}
        type: "microsoft.cognitiveservices/accounts"
        log_level: INFO
        filter:
          - "*"

    # Custom metrics for Azure OpenAI
    custom_metrics:
      - name: "azure.openai.embedding.latency"
        type: "gauge"
        description: "Latency of embedding generation in milliseconds"
        unit: "milliseconds"
        tags:
          - "deployment:${DEPLOYMENT_NAME}"
          - "model:${MODEL_NAME}"
      - name: "azure.openai.embedding.tokens"
        type: "count"
        description: "Number of tokens used for embeddings"
        tags:
          - "deployment:${DEPLOYMENT_NAME}"
          - "model:${MODEL_NAME}"
      - name: "azure.openai.rate_limit.remaining"
        type: "gauge"
        description: "Remaining rate limit for Azure OpenAI API"
        tags:
          - "deployment:${DEPLOYMENT_NAME}"

    # Integration with Azure Monitor for custom metrics
    azure_metrics:
      - resource_type: "microsoft.cognitiveservices/accounts"
        metrics:
          - name: "TotalCalls"
            metric_name: "TotalCalls"
            aggregation: "Total"
          - name: "SuccessfulCalls"
            metric_name: "SuccessfulCalls"
            aggregation: "Total"
          - name: "TotalErrors"
            metric_name: "TotalErrors"
            aggregation: "Total"
          - name: "BlockedCalls"
            metric_name: "BlockedCalls"
            aggregation: "Total"
          - name: "ServerErrors"
            metric_name: "ServerErrors"
            aggregation: "Total"
          - name: "DataIn"
            metric_name: "DataIn"
            aggregation: "Average"
          - name: "DataOut"
            metric_name: "DataOut"
            aggregation: "Average"
          - name: "Latency"
            metric_name: "Latency"
            aggregation: "Average"
          - name: "TotalTokens"
            metric_name: "TotalTokens"
            aggregation: "Total"
          - name: "TotalTokenCount"
            metric_name: "TotalTokenCount"
            aggregation: "Total"
          - name: "TotalRequests"
            metric_name: "TotalRequests"
            aggregation: "Total"

    # Autodiscovery for Azure resources
    autodiscovery:
      enabled: true
      include:
        - resource_type: "microsoft.cognitiveservices/accounts"
          tags:
            - "environment:production"
            - "managed-by:vibecode"

    # Tracing configuration for Azure OpenAI calls
    tracing:
      enabled: true
      analytics_enabled: true
      sample_rate: 1.0
      tags:
        - "env:production"
        - "service:vibecode-ai"
        - "application:vibecode-platform"

    # Logs processing rules
    logs_config:
      processing_rules:
        - type: "exclude_at_match"
          name: "exclude_health_checks"
          pattern: "health_check"
        - type: "include_at_match"
          name: "include_errors"
          pattern: "error|exception|fail"

    # Custom tags for all metrics
    tags:
      - "env:production"
      - "service:vibecode-ai"
      - "application:vibecode-platform"
      - "team:ai-engineering"
      - "tier:ai-services"
      - "region:${AZURE_REGION}"
