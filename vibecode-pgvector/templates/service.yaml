apiVersion: v1
kind: Service
metadata:
  name: {{ include "vibecode-pgvector.fullname" . }}
  labels:
    {{- include "vibecode-pgvector.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "vibecode-pgvector.selectorLabels" . | nindent 4 }}
