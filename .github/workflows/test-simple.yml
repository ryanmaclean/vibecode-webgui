name: Simple Test

on:
  workflow_dispatch:

concurrency:
  group: test-simple
  cancel-in-progress: true

jobs:
  # Validate CI configuration and secrets
  validate-ci-config:
    name: Validate CI configuration (secrets/vars)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Datadog configuration
        run: |
          echo "🔧 Validating simple test CI configuration..."
          
          if [ -z "${{ secrets.DD_API_KEY }}" ]; then
            echo "::warning::Missing DD_API_KEY secret; Datadog steps will be skipped."
          else
            echo "✅ DD_API_KEY present"
          fi
          
          if [ -z "${{ secrets.DD_APP_KEY }}" ]; then
            echo "::warning::Missing DD_APP_KEY secret; some Datadog features will be limited."
          else
            echo "✅ DD_APP_KEY present"
          fi

  test-babel:
    runs-on: ubuntu-latest
    name: Test Babel Config
    needs: validate-ci-config
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Test Jest with Babel config
        run: |
          echo "Testing Jest with Babel config..."
          npx jest --version
          echo "✅ Jest can load Babel config successfully"

  test-datadog:
    runs-on: ubuntu-latest
    name: Test Datadog Integration
    needs: validate-ci-config
    if: secrets.DD_API_KEY != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Test Datadog CI Visibility
        run: |
          echo "Testing Datadog CI Visibility..."
          DD_CI_VISIBILITY_ENABLED=true DD_SERVICE=test-service DD_ENV=test DD_VERSION=test npm run test:root:infrastructure
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: datadoghq.com
          # Cloud Network Monitoring for GitHub Actions
          DD_SYSTEM_PROBE_NETWORK_ENABLED: true
          DD_PROCESS_AGENT_ENABLED: true
          DD_NETWORK_CONFIG_ENABLE_EBPFLESS: true
          DD_NETWORK_CONFIG_ENABLE_EBPF: false
          DD_SYSTEM_PROBE_ENABLED: true
          DD_CI_VISIBILITY_ENABLED: true
          DD_SERVICE: test-service
          DD_ENV: test
          DD_VERSION: test
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret-key
