name: Simple Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-babel:
    runs-on: ubuntu-latest
    name: Test Babel Config
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Test Jest with Babel config
        run: |
          echo "Testing Jest with Babel config..."
          npx jest --version
          echo "✅ Jest can load Babel config successfully"

  test-playwright-basic:
    runs-on: ubuntu-latest
    name: Test Playwright Setup
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright installation
        run: |
          echo "Testing Playwright installation..."
          npx playwright --version
          echo "✅ Playwright installed successfully"

      - name: Run basic E2E tests
        run: |
          echo "Running basic Playwright tests..."
          npx playwright test tests/e2e/simple-test.spec.ts --project=chromium
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 3

  test-datadog:
    runs-on: ubuntu-latest
    name: Test Datadog Integration
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Test Datadog CI Visibility
        run: |
          echo "Testing Datadog CI Visibility..."
          DD_CI_VISIBILITY_ENABLED=true DD_SERVICE=test-service DD_ENV=test DD_VERSION=test npm run test:root:infrastructure
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: datadoghq.com
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_SECRET: test-secret-key

  browser-compatibility:
    runs-on: ubuntu-latest
    name: Browser Compatibility Check
    timeout-minutes: 20
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser compatibility tests
        run: |
          echo "Testing ${{ matrix.browser }} compatibility..."
          npx playwright test tests/e2e/health-check.spec.ts --project=${{ matrix.browser }}
        env:
          CI: true
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.browser }}-test-results
          path: test-results/
          retention-days: 3
