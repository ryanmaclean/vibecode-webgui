name: PostgreSQL Vector Monitoring Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'src/lib/vector-db/**'
      - 'src/lib/datadog-database.ts'
      - 'monitoring/**'
      - 'database/**'
      - '.github/workflows/db-monitoring-deployment.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/lib/vector-db/**'
      - 'src/lib/datadog-database.ts'
      - 'monitoring/**'
      - 'database/**'
      - '.github/workflows/db-monitoring-deployment.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: db-monitoring-${{ github.ref }}
  cancel-in-progress: true

env:
  DD_SITE: "datadoghq.com"
  ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

jobs:
  validate-ci-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY || '' }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY || secrets.DATADOG_APP_KEY || '' }}
      POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION_STRING || '' }}
    steps:
      - name: Check required secrets
        run: |
          missing=0
          for key in DD_API_KEY DD_APP_KEY POSTGRES_CONNECTION; do
            if [ -z "${!key}" ]; then
              echo "::warning::Missing secret for $key; related steps will be skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "All required secrets present."
          fi

  validate-database-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION_STRING || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate PostgreSQL schema
        if: ${{ env.POSTGRES_CONNECTION != '' }}
        run: |
          echo "PostgreSQL connection available, validating schema..."
          # Basic connection test
          node -e "
          const { Pool } = require('pg');
          const pool = new Pool({ connectionString: process.env.POSTGRES_CONNECTION });
          pool.query('SELECT version()').then(res => {
            console.log('PostgreSQL version:', res.rows[0].version);
            pool.end();
          }).catch(err => {
            console.error('Connection failed:', err);
            process.exit(1);
          });
          "
        continue-on-error: false
          
      - name: Check for pgvector extension
        if: ${{ env.POSTGRES_CONNECTION != '' }}
        run: |
          node -e "
          const { Pool } = require('pg');
          const pool = new Pool({
            connectionString: process.env.POSTGRES_CONNECTION,
          });
          
          async function checkPgVector() {
            try {
              const client = await pool.connect();
              const result = await client.query(\"SELECT * FROM pg_extension WHERE extname = 'vector'\");
              client.release();
              
              if (result.rows.length === 0) {
                console.error('pgvector extension is not installed!');
                process.exit(1);
              } else {
                console.log('pgvector extension is properly installed');
              }
            } catch (err) {
              console.error('Error checking pgvector extension:', err);
              process.exit(1);
            } finally {
              await pool.end();
            }
          }
          
          checkPgVector();
          "

  validate-vector-index:
    runs-on: ubuntu-latest
    needs: validate-database-schema
    timeout-minutes: 10
    env:
      POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION_STRING || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Check vector indexes
        if: ${{ env.POSTGRES_CONNECTION != '' }}
        run: |
          node -e "
          const { Pool } = require('pg');
          const pool = new Pool({
            connectionString: process.env.POSTGRES_CONNECTION,
          });
          
          async function checkVectorIndexes() {
            try {
              const client = await pool.connect();
              const result = await client.query(\"SELECT indexname, indexdef FROM pg_indexes WHERE indexdef LIKE '%vector%'\");
              client.release();
              
              if (result.rows.length === 0) {
                console.error('No vector indexes found!');
                process.exit(1);
              } else {
                console.log('Found the following vector indexes:');
                result.rows.forEach(row => {
                  console.log(`${row.indexname}: ${row.indexdef}`);
                });
              }
            } catch (err) {
              console.error('Error checking vector indexes:', err);
              process.exit(1);
            } finally {
              await pool.end();
            }
          }
          
          checkVectorIndexes();
          "
      
      - name: Validate monitoring dashboards
        run: |
          echo "Validating Datadog dashboard definitions..."
          if [ -d "monitoring/dashboards" ]; then
            for file in monitoring/dashboards/*.json; do
              if [ -f "$file" ]; then
                echo "Validating $file"
                cat "$file" | jq empty || (echo "Invalid JSON in $file" && exit 1)
              fi
            done
            echo "All dashboard definitions are valid JSON"
          else
            echo "Warning: monitoring/dashboards directory not found, skipping validation"
          fi

  benchmark-vector-performance:
    runs-on: ubuntu-latest
    needs: validate-vector-index
    timeout-minutes: 15
    env:
      POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION_STRING || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run vector search benchmark
        if: ${{ env.POSTGRES_CONNECTION != '' }}
        run: |
          if [ -f "scripts/benchmark-vector-search.js" ]; then
            echo "Running vector search benchmark..."
            node scripts/benchmark-vector-search.js
          else
            echo "Warning: scripts/benchmark-vector-search.js not found"
            echo '{"averageQueryTimeMs":0,"p95QueryTimeMs":0,"queriesPerSecond":0,"indexType":"unknown","testDate":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > benchmark-results.json
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: vector-benchmark-results
          path: benchmark-results.json
          if-no-files-found: warn

  verify-monitoring-prerequisites:
    runs-on: ubuntu-latest
    needs: benchmark-vector-performance
    timeout-minutes: 10
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS || '' }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || '' }}
      SERVER_NAME: ${{ secrets.AZURE_POSTGRES_SERVER_NAME || '' }}
      DD_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY || '' }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY || secrets.DATADOG_APP_KEY || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Azure CLI
        if: ${{ env.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Verify Azure PostgreSQL server
        if: ${{ env.RESOURCE_GROUP != '' && env.SERVER_NAME != '' }}
        run: |
          echo "Verifying Azure PostgreSQL server configuration..."
          
          # Check if server exists
          az postgres flexible-server show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.SERVER_NAME }} \
            --output none || (echo "PostgreSQL server not found" && exit 1)
          
          # Check if pg_stat_statements is enabled
          SHARED_PRELOAD_LIBRARIES=$(az postgres flexible-server parameter show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.SERVER_NAME }} \
            --name shared_preload_libraries \
            --query value -o tsv)
          
          if [[ $SHARED_PRELOAD_LIBRARIES != *"pg_stat_statements"* ]]; then
            echo "Warning: pg_stat_statements is not enabled in shared_preload_libraries"
          else
            echo "pg_stat_statements is properly configured"
          fi
          
          echo "Azure PostgreSQL server verification completed"
      
      - name: Verify Datadog API access
        if: ${{ env.DD_API_KEY != '' }}
        run: |
          echo "Verifying Datadog API key via Datadog /validate endpoint..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.${{ env.DD_SITE }}/api/v1/validate" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}")
          if [ "$CODE" != "200" ]; then
            echo "::warning::Datadog API key validation failed with HTTP $CODE"
            exit 1
          fi
          echo "Datadog API key validated"

  deploy-monitoring:
    runs-on: ubuntu-latest
    needs: verify-monitoring-prerequisites
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS || '' }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || '' }}
      SERVER_NAME: ${{ secrets.AZURE_POSTGRES_SERVER_NAME || '' }}
      DD_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY || '' }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY || secrets.DATADOG_APP_KEY || '' }}
      POSTGRES_CONNECTION: ${{ secrets.POSTGRES_CONNECTION_STRING || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
          
      - name: Datadog CLI usage
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: echo "Using npx for @datadog/datadog-ci (no global install)"
      
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: vector-benchmark-results

      - name: Update baseline metrics
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: |
          if [ -f "scripts/update-datadog-baselines.js" ]; then
            echo "Updating Datadog baseline metrics..."
            node scripts/update-datadog-baselines.js
          else
            echo "Warning: scripts/update-datadog-baselines.js not found, skipping baseline update"
          fi
        continue-on-error: true
      
      - name: Configure PostgreSQL server for monitoring
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        if: ${{ (env.ENVIRONMENT == 'staging' || env.ENVIRONMENT == 'production') && env.AZURE_CREDENTIALS != '' }}
      
      - name: Setup PostgreSQL monitoring parameters
        if: ${{ (env.ENVIRONMENT == 'staging' || env.ENVIRONMENT == 'production') && env.AZURE_CREDENTIALS != '' && env.RESOURCE_GROUP != '' && env.SERVER_NAME != '' }}
        run: |
          echo "Configuring PostgreSQL server for monitoring..."
          
          # Set up PostgreSQL parameters for monitoring
          az postgres flexible-server parameter set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.SERVER_NAME }} \
            --name shared_preload_libraries \
            --value 'pg_stat_statements'
          
          az postgres flexible-server parameter set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.SERVER_NAME }} \
            --name pg_stat_statements.track \
            --value 'all'
          
          az postgres flexible-server parameter set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.SERVER_NAME }} \
            --name track_io_timing \
            --value 'on'
          
          az postgres flexible-server parameter set \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.SERVER_NAME }} \
            --name track_activity_query_size \
            --value 4096
          
          # Check if restart is needed
          RESTART_PENDING=$(az postgres flexible-server parameter list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.SERVER_NAME }} \
            --query "[?pending_restart==\`true\`].{Name:name}" -o tsv)
          
          if [ -n "$RESTART_PENDING" ]; then
            echo "Changes require a server restart, restarting server..."
            az postgres flexible-server restart \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --name ${{ env.SERVER_NAME }}
            echo "Server restarted successfully"
          else
            echo "No restart required"
          fi
          
          echo "PostgreSQL server configured for monitoring"
      
      - name: Deploy Datadog dashboards
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: |
          export ENVIRONMENT=${{ env.ENVIRONMENT }}

          # Check if dashboards directory exists
          if [ -d "monitoring/dashboards" ]; then
            echo "Deploying dashboards from monitoring/dashboards directory..."
            # Deploy all dashboards in the monitoring/dashboards directory
            for dashboard_file in monitoring/dashboards/*.json; do
              if [ -f "$dashboard_file" ]; then
                echo "Deploying dashboard: $dashboard_file"
                npx --yes @datadog/datadog-ci dashboards push "$dashboard_file" --env "$ENVIRONMENT" || echo "Warning: Failed to deploy $dashboard_file"
              fi
            done
          else
            echo "Warning: monitoring/dashboards directory not found, skipping dashboard deployment"
          fi
        env:
          DATADOG_API_KEY: ${{ env.DD_API_KEY }}
          DATADOG_APP_KEY: ${{ env.DD_APP_KEY }}
          DATADOG_SITE: ${{ env.DD_SITE }}
        continue-on-error: true
            
      - name: Deploy Datadog monitors
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: |
          export ENVIRONMENT=${{ env.ENVIRONMENT }}

          # Check if alerts directory exists
          if [ -d "monitoring/alerts" ]; then
            echo "Deploying monitors from monitoring/alerts directory..."
            npx --yes @datadog/datadog-ci monitors push monitoring/alerts/ --env "$ENVIRONMENT" || echo "Warning: Failed to deploy monitors"
          else
            echo "Warning: monitoring/alerts directory not found, skipping monitor deployment"
          fi
        env:
          DATADOG_API_KEY: ${{ env.DD_API_KEY }}
          DATADOG_APP_KEY: ${{ env.DD_APP_KEY }}
          DATADOG_SITE: ${{ env.DD_SITE }}
        continue-on-error: true

      - name: Set up database monitoring
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' && env.POSTGRES_CONNECTION != '' }}
        run: |
          export ENVIRONMENT=${{ env.ENVIRONMENT }}

          # Check if setup script exists
          if [ -f "scripts/setup-datadog-dbm.js" ] || [ -f "scripts/setup-datadog-dbm.ts" ]; then
            echo "Setting up Datadog Database Monitoring..."
            if [ -f "scripts/setup-datadog-dbm.ts" ]; then
              npx tsx scripts/setup-datadog-dbm.ts \
                --environment "$ENVIRONMENT" \
                --connection-string "$POSTGRES_CONNECTION"
            else
              node scripts/setup-datadog-dbm.js \
                --environment "$ENVIRONMENT" \
                --connection-string "$POSTGRES_CONNECTION"
            fi
          else
            echo "Warning: Database monitoring setup script not found, skipping"
          fi
        env:
          DATADOG_API_KEY: ${{ env.DD_API_KEY }}
          DATADOG_APP_KEY: ${{ env.DD_APP_KEY }}
          DATADOG_SITE: ${{ env.DD_SITE }}
        continue-on-error: true

      - name: Verify monitoring deployment
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: |
          if [ -f "scripts/verify-datadog-integration.js" ]; then
            echo "Verifying Datadog integration..."
            node scripts/verify-datadog-integration.js \
              --environment "${{ env.ENVIRONMENT }}" \
              --timeout 300 || echo "Warning: Verification failed"
          else
            echo "Warning: Verification script not found, skipping verification"
          fi
        env:
          DATADOG_API_KEY: ${{ env.DD_API_KEY }}
          DATADOG_APP_KEY: ${{ env.DD_APP_KEY }}
          DATADOG_SITE: ${{ env.DD_SITE }}
        continue-on-error: true

  generate-monitoring-report:
    runs-on: ubuntu-latest
    needs: deploy-monitoring
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: vector-benchmark-results
        continue-on-error: true
      
      - name: Generate monitoring report
        run: |
          echo "Generating monitoring setup report..."

          # Create report file
          cat > monitoring-report.md << 'EOF'
          # PostgreSQL Monitoring Deployment Report

          ## Deployment Information
          EOF

          cat >> monitoring-report.md << EOF
          - Environment: ${{ env.ENVIRONMENT }}
          - Deployment Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - Triggered By: ${{ github.actor }}
          - Commit: ${{ github.sha }}

          ## Deployed Resources
          - Datadog Dashboards:
            - GenAI PostgreSQL Dashboard
            - RAG Query Dashboard
            - Vector DB Error Monitoring Dashboard

          - PostgreSQL Monitoring Configuration:
            - pg_stat_statements enabled
            - Query tracking enabled
            - I/O timing enabled
            - Query size tracking increased

          ## Vector Search Benchmark Results
          EOF

          # Add benchmark results if file exists
          if [ -f "benchmark-results.json" ]; then
            cat benchmark-results.json | jq -r '"- Average Query Time: \(.averageQueryTimeMs) ms\n- p95 Query Time: \(.p95QueryTimeMs) ms\n- Throughput: \(.queriesPerSecond) queries/sec\n- Vector Index Type: \(.indexType)\n- Test Date: \(.testDate)"' >> monitoring-report.md 2>/dev/null || echo "- Benchmark data unavailable" >> monitoring-report.md
          else
            echo "- Benchmark results not available" >> monitoring-report.md
          fi

          cat >> monitoring-report.md << 'EOF'

          ## Next Steps
          - Review dashboards in Datadog
          - Set up additional alerts as needed
          - Schedule regular monitoring reviews
          EOF

          echo "Monitoring report generated"
          cat monitoring-report.md

      - name: Upload monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-report
          path: monitoring-report.md

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-monitoring, generate-monitoring-report]
    if: always()
    timeout-minutes: 5
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
    steps:
      - name: Notify deployment status
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": "PostgreSQL Vector Monitoring Deployment ${{ needs.deploy-monitoring.result == 'success' && 'Succeeded ✅' || 'Failed ❌' }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "PostgreSQL Vector Monitoring Deployment Status"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Environment:* ${{ env.ENVIRONMENT }}\n*Status:* ${{ needs.deploy-monitoring.result == 'success' && 'Succeeded ✅' || 'Failed ❌' }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "See the <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run> for more details."
                  }
                }
              ]
            }