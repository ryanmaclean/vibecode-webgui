name: VibeCode Docs (Astro)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'src/content/docs/**'
      - 'astro.config.mjs'
  workflow_dispatch:

env:
  DD_SERVICE: ${{ github.event.repository.name }}
  DD_ENV: ci
  DD_VERSION: ${{ github.sha }}
  DD_TAGS: team:platform,component:ci

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Astro
        run: npm run docs:build
        env:
          # Agent 4: Ensure GitHub Pages compatibility
          astro_site: "https://vibecode.github.io"
          astro_base: "/vibecode-webgui"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
