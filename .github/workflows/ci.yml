name: VibeCode CI/CD Pipeline - Simplified

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.0'

jobs:
  # Code Quality & Security
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Security
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Prepare environment (.env)
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Install dependencies
        run: |
          # Remove any existing package-lock.json to avoid platform-specific issues
          rm -f package-lock.json
          # Install dependencies for the current platform
          npm install --legacy-peer-deps --omit=optional

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Lint code
        run: npx eslint src/ --ext .ts,.tsx,.js,.jsx --max-warnings 1000 || echo "⚠️ Linting completed with warnings"
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets and API keys..."
          # Enhanced secret scanning with multiple patterns
          grep -r -E "(sk-[a-zA-Z0-9]{40,}|sk-ant-[a-zA-Z0-9]{40,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16})" src/ --exclude-dir=node_modules || echo "✅ No hardcoded secrets found"
          grep -r -E "(password\s*=\s*['\"][^'\"]+['\"]|api[_-]?key\s*=\s*['\"][^'\"]+['\"])" src/ --exclude-dir=node_modules || echo "✅ No hardcoded credentials found"

  # Root Tests (Integration & Validation) - Our Working Tests
  root-tests:
    runs-on: ubuntu-latest
    name: Root Integration Tests
    needs: code-quality
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: test-secret-key-for-ci
      # Datadog CI Visibility
      DD_CI_VISIBILITY_ENABLED: true
      # Use agentless to ensure results even without a local agent
      DD_CIVISIBILITY_AGENTLESS_ENABLED: true
      # Inject tracer for test visibility
      # NODE_OPTIONS: -r dd-trace/ci/init  # Removed - dd-trace not installed in CI
      DD_SERVICE: vibecode-webgui
      DD_ENV: ci
      DD_VERSION: ${{ github.sha }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: ${{ secrets.DD_SITE || 'datadoghq.com' }}
      # Git metadata for Datadog CI Visibility
      DD_GIT_COMMIT_SHA: ${{ github.sha }}
      DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      DD_GIT_BRANCH: ${{ github.ref_name }}
      DD_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      DD_GIT_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
      DD_GIT_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
      DD_GIT_COMMIT_AUTHOR_DATE: ${{ github.event.head_commit.timestamp }}
      DD_GIT_COMMIT_COMMITTER_NAME: ${{ github.event.head_commit.committer.name }}
      DD_GIT_COMMIT_COMMITTER_EMAIL: ${{ github.event.head_commit.committer.email }}
      DD_GIT_COMMIT_COMMITTER_DATE: ${{ github.event.head_commit.timestamp }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Setup test environment
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/testdb" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "NEXTAUTH_SECRET=test-secret-key-for-ci" >> .env
          echo "NODE_ENV=test" >> .env

      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U test; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

      - name: Run infrastructure tests
        run: npm run test:root:infrastructure
        continue-on-error: true

      - name: Run database tests
        run: npm run test:root:database
        continue-on-error: true

      - name: Run credentials tests
        run: npm run test:root:credentials
        continue-on-error: true

      - name: Run workflow tests
        run: npm run test:root:workflow
        continue-on-error: true

      - name: Run AI/Embedding tests (if API keys available)
        if: env.OPENAI_API_KEY != ''
        run: npm run test:root:ai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Azure Embedding tests (if API keys available)
        if: env.AZURE_OPENAI_API_KEY != ''
        run: npm run test:root:azure
        continue-on-error: true
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

      - name: Sanitize artifacts (redact secrets)
        if: always()
        run: npm run sanitize:artifacts --if-present

      - name: Upload root test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-test-results
          path: |
            test-results/
            logs/

  # Build Test
  build-test:
    runs-on: ubuntu-latest
    name: Build Test
    needs: code-quality
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Build project
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .next/
            public/

  # Docs Tests (Astro + Jest)
  docs-tests:
    runs-on: ubuntu-latest
    name: Astro Docs Tests
    needs: code-quality
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Install docs dependencies
        run: npm ci --legacy-peer-deps --omit=optional --prefix docs

      - name: Prepare test results directory
        run: mkdir -p .test-results

      - name: Run docs tests (Astro preview)
        env:
          ASTRO_USE_PREVIEW: '1'
          NEXT_DISABLE_SWC: '1'
          CI: 'true'
          JEST_INCLUDE_DOCS: '1'
          # Datadog Test Visibility (agentless)
          DD_CIVISIBILITY_AGENTLESS_ENABLED: 'true'
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ secrets.DD_SITE || 'datadoghq.com' }}
          # NODE_OPTIONS: '-r dd-trace/ci/init'  # Removed - dd-trace not installed in CI
          # Git metadata for Datadog CI Visibility
          DD_GIT_COMMIT_SHA: ${{ github.sha }}
          DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          DD_GIT_BRANCH: ${{ github.ref_name }}
          DD_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: bash -lc "set -o pipefail; npm run test:docs | tee .test-results/docs-tests.log"

      - name: Collect docs dist snapshot
        if: always()
        run: |
          if [ -d docs/dist ]; then
            echo "Docs dist exists, capturing snapshot..."
            find docs/dist -type f -name 'index.html' | sort > .test-results/docs-dist-indexes.txt
            # Keep the tree compact: only list top-level and first-level directories
            find docs/dist -maxdepth 2 -type d | sort > .test-results/docs-dist-tree.txt
            # Archive only HTML files to keep artifact size small
            find docs/dist -type f -name '*.html' -print0 | tar --null -czf .test-results/docs-dist-html.tar.gz --files-from -
          else
            echo "docs/dist not found" > .test-results/docs-dist-indexes.txt
            echo "docs/dist not found" > .test-results/docs-dist-tree.txt
          fi

      - name: Publish docs link validation summary
        if: always()
        run: |
          if [ -f .test-results/docs-link-report.json ]; then
            echo "## Docs Link Validation" >> $GITHUB_STEP_SUMMARY
            if command -v jq >/dev/null 2>&1; then
              jq -r '"- Pages checked: \(.pagesChecked)\n- Empty links: \(.emptyLinks)\n- Broken links: \(.brokenCount)"' .test-results/docs-link-report.json >> $GITHUB_STEP_SUMMARY || true
              if [ "$(jq -r '.brokenCount' .test-results/docs-link-report.json)" != "0" ]; then
                echo "\n### Examples" >> $GITHUB_STEP_SUMMARY
                jq -r '.brokenLinks[:10][] | "- \(.from) -> \(.to)"' .test-results/docs-link-report.json >> $GITHUB_STEP_SUMMARY || true
              fi
            else
              echo "(jq not available) Raw report:" >> $GITHUB_STEP_SUMMARY
              cat .test-results/docs-link-report.json >> $GITHUB_STEP_SUMMARY || true
            fi
          fi

      - name: Sanitize artifacts (redact secrets)
        if: always()
        run: npm run sanitize:artifacts --if-present

      - name: Upload docs test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-test-results
          path: |
            .test-results/
          retention-days: 14

  # Final Validation
  validation-complete:
    runs-on: ubuntu-latest
    name: CI/CD Validation Complete
    needs: [root-tests, build-test, docs-tests]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Check all jobs status
        run: |
          echo "Root Tests: ${{ needs.root-tests.result }}"
          echo "Build Test: ${{ needs.build-test.result }}"
          echo "Docs Tests: ${{ needs.docs-tests.result }}"
          
          if [[ "${{ needs.root-tests.result }}" == "success" && \
                "${{ needs.build-test.result }}" == "success" && \
                "${{ needs.docs-tests.result }}" == "success" ]]; then
            echo "✅ All CI/CD validations passed!"
          else
            echo "❌ Some validations failed"
            exit 1
          fi

      - name: Notify Datadog of CI completion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DD_API_KEY }}" \
            -d '{
              "title": "VibeCode CI/CD Pipeline Complete",
              "text": "Simplified CI/CD pipeline completed successfully with root tests and build validation",
              "tags": ["source:github", "env:ci", "service:vibecode-webgui", "event:ci-complete"],
              "alert_type": "success"
            }' || echo "Datadog notification skipped (no API key)"
