name: Simplified CI Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: simplified-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.0'

jobs:
  # Test just one job at a time
  test-root-tests-only:
    runs-on: ubuntu-latest
    name: Root Tests Only
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: test-secret-key-for-ci
      # Datadog CI Visibility
      DD_CI_VISIBILITY_ENABLED: ${{ secrets.DD_API_KEY != '' && 'true' || 'false' }}
      DD_SERVICE: vibecode-webgui
      DD_ENV: ci
      DD_VERSION: ${{ github.sha }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: datadoghq.com
      # Cloud Network Monitoring for GitHub Actions
      DD_SYSTEM_PROBE_NETWORK_ENABLED: true
      DD_PROCESS_AGENT_ENABLED: true
      DD_NETWORK_CONFIG_ENABLE_EBPFLESS: true
      DD_NETWORK_CONFIG_ENABLE_EBPF: false
      DD_SYSTEM_PROBE_ENABLED: true
      # NODE_OPTIONS: -r dd-trace/ci/init  # Removed - dd-trace not installed in CI
      # Git metadata for Datadog CI Visibility
      DD_GIT_COMMIT_SHA: ${{ github.sha }}
      DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      DD_GIT_BRANCH: ${{ github.ref_name }}
      DD_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      DD_GIT_COMMIT_AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
      DD_GIT_COMMIT_AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
      DD_GIT_COMMIT_AUTHOR_DATE: ${{ github.event.head_commit.timestamp }}
      DD_GIT_COMMIT_COMMITTER_NAME: ${{ github.event.head_commit.committer.name }}
      DD_GIT_COMMIT_COMMITTER_EMAIL: ${{ github.event.head_commit.committer.email }}
      DD_GIT_COMMIT_COMMITTER_DATE: ${{ github.event.head_commit.timestamp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Record start time
        run: echo "SIMPLIFIED_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Initialize containers
        run: |
          echo "Starting PostgreSQL and Redis containers..."
          docker run -d --name postgres-test -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=testdb -p 5432:5432 postgres:15-alpine
          docker run -d --name redis-test -p 6379:6379 redis:7-alpine
          
          # Wait for services to be ready
          echo "Waiting for PostgreSQL..."
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U test; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Setup test environment
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/testdb" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "NEXTAUTH_SECRET=test-secret-key-for-ci" >> .env
          echo "NODE_ENV=test" >> .env

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U test; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

      - name: Run infrastructure tests
        run: npm run test:root:infrastructure

      - name: Run database tests
        run: npm run test:root:database

      - name: Run credentials tests
        run: npm run test:root:credentials

      - name: Run workflow tests
        run: npm run test:root:workflow

      - name: Run AI/Embedding tests (if API keys available)
        id: ai-tests
        if: secrets.OPENAI_API_KEY != ''
        run: |
          set +e
          npm run test:root:ai-embedding
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Azure Embedding tests (if API keys available)
        id: azure-tests
        if: secrets.AZURE_OPENAI_API_KEY != '' && secrets.AZURE_OPENAI_ENDPOINT != ''
        run: |
          set +e
          npm run test:root:azure-embedding
          echo "status=$?" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

      - name: Stop containers
        if: always()
        run: |
          docker stop postgres-test redis-test || true
          docker rm postgres-test redis-test || true

      - name: Summary
        if: always()
        run: |
          end=$(date +%s)
          duration=$(( end - SIMPLIFIED_START ))
          mins=$(( duration / 60 ))
          secs=$(( duration % 60 ))
          ai_status='${{ steps.ai-tests.outputs.status || "skipped" }}'
          azure_status='${{ steps.azure-tests.outputs.status || "skipped" }}'
          fmt_status() {
            case "$1" in
              skipped) echo 'skipped';;
              0) echo '✅ success';;
              *) echo "⚠️ exit $1";;
            esac
          }
          echo "### Simplified CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration: ${duration}s (${mins}m ${secs}s)" >> "$GITHUB_STEP_SUMMARY"
          echo "- AI embedding tests: $(fmt_status "$ai_status")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Azure embedding tests: $(fmt_status "$azure_status")" >> "$GITHUB_STEP_SUMMARY"
