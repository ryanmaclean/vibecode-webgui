name: GitHub Actions Cost Monitor

on:
  schedule:
    - cron: '0 9 * * MON'  # Weekly on Monday
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to generate'
        required: false
        default: 'summary'
        type: choice
        options:
          - summary
          - detailed
          - optimization

jobs:
  cost-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch workflow runs data
        id: fetch-runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get workflow runs from the last 30 days
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

            console.log('Fetching workflow runs since:', thirtyDaysAgo.toISOString());

            // Fetch all workflows
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner,
              repo,
            });

            let totalRuns = 0;
            let totalDuration = 0;
            let workflowStats = {};

            // Fetch runs for each workflow
            for (const workflow of workflows.data.workflows) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflow.id,
                  per_page: 100,
                  created: `>=${thirtyDaysAgo.toISOString().split('T')[0]}`,
                });

                let workflowDuration = 0;
                let workflowCount = 0;

                for (const run of runs.data.workflow_runs) {
                  if (run.status === 'completed' && run.run_started_at && run.updated_at) {
                    const start = new Date(run.run_started_at);
                    const end = new Date(run.updated_at);
                    const durationMinutes = (end - start) / (1000 * 60);

                    workflowDuration += durationMinutes;
                    workflowCount++;
                    totalRuns++;
                    totalDuration += durationMinutes;
                  }
                }

                if (workflowCount > 0) {
                  workflowStats[workflow.name] = {
                    runs: workflowCount,
                    total_duration: Math.round(workflowDuration),
                    avg_duration: Math.round(workflowDuration / workflowCount),
                    path: workflow.path,
                  };
                }
              } catch (error) {
                console.log(`Error fetching runs for ${workflow.name}:`, error.message);
              }
            }

            // Calculate estimated costs (rough estimates for public repos)
            // GitHub Actions pricing for public repos is free but has limits
            // For private repos: $0.008 per minute for Linux runners
            const costPerMinute = 0.008; // For private repos
            const estimatedCost = totalDuration * costPerMinute;

            const summary = {
              total_runs: totalRuns,
              total_duration_minutes: Math.round(totalDuration),
              total_duration_hours: Math.round(totalDuration / 60 * 10) / 10,
              estimated_monthly_cost: Math.round(estimatedCost * 100) / 100,
              workflows: workflowStats,
              report_date: new Date().toISOString(),
            };

            core.setOutput('stats', JSON.stringify(summary));

            return summary;

      - name: Generate cost report
        run: |
          cat > cost-report.md << 'EOFMARKER'
          # GitHub Actions Cost Analysis Report

          **Report Date:** $(date +"%Y-%m-%d %H:%M:%S UTC")
          **Analysis Period:** Last 30 days

          ## Summary

          EOFMARKER

          # Parse the stats from the previous step
          echo '${{ steps.fetch-runs.outputs.stats }}' > stats.json

          # Extract key metrics using Node.js
          node -e "
          const fs = require('fs');
          const stats = JSON.parse(fs.readFileSync('stats.json', 'utf8'));

          console.log('- **Total Workflow Runs:** ' + stats.total_runs);
          console.log('- **Total Compute Time:** ' + stats.total_duration_hours + ' hours (' + stats.total_duration_minutes + ' minutes)');
          console.log('- **Estimated Monthly Cost:** \\$' + stats.estimated_monthly_cost + ' (for private repos)');
          console.log('');
          console.log('## Workflow Breakdown');
          console.log('');

          // Sort workflows by duration
          const workflows = Object.entries(stats.workflows)
            .sort((a, b) => b[1].total_duration - a[1].total_duration);

          console.log('| Workflow | Runs | Total Duration (min) | Avg Duration (min) |');
          console.log('|----------|------|---------------------|-------------------|');

          for (const [name, data] of workflows) {
            console.log(\`| \${name} | \${data.runs} | \${data.total_duration} | \${data.avg_duration} |\`);
          }

          console.log('');
          console.log('## Optimization Recommendations');
          console.log('');

          // Find workflows with high total duration
          const highUsage = workflows.filter(([_, data]) => data.total_duration > 100);
          if (highUsage.length > 0) {
            console.log('### High Usage Workflows');
            console.log('');
            console.log('The following workflows consume the most compute time:');
            console.log('');
            for (const [name, data] of highUsage.slice(0, 5)) {
              console.log(\`- **\${name}**: \${data.total_duration} minutes over \${data.runs} runs\`);
            }
            console.log('');
          }

          // Find workflows with long average duration
          const slowWorkflows = workflows.filter(([_, data]) => data.avg_duration > 10);
          if (slowWorkflows.length > 0) {
            console.log('### Workflows with Long Average Duration');
            console.log('');
            console.log('Consider optimizing these workflows:');
            console.log('');
            for (const [name, data] of slowWorkflows.slice(0, 5)) {
              console.log(\`- **\${name}**: Average \${data.avg_duration} minutes per run\`);
            }
            console.log('');
          }

          console.log('## Cost Optimization Strategies');
          console.log('');
          console.log('1. **Conditional Execution**: Run expensive workflows only on main/release branches');
          console.log('2. **Cache Dependencies**: Use actions/cache for npm, pip, etc.');
          console.log('3. **Matrix Strategy**: Reduce matrix combinations where possible');
          console.log('4. **Concurrency Groups**: Cancel in-progress runs for same PR');
          console.log('5. **Self-hosted Runners**: Consider for high-volume private repos');
          console.log('6. **Workflow Triggers**: Limit schedule frequency and use path filters');
          console.log('');
          console.log('## Current Optimization Status');
          console.log('');
          console.log('✅ Main branch: Lightweight CI only (~\\$0.05 per run)');
          console.log('🚀 Release branches: Full CI/CD (~\\$2-4 per run)');
          console.log('📊 Performance tests: Daily scheduled runs');
          console.log('🔒 Security scans: Conditional on code changes');
          console.log('');
          console.log('---');
          console.log('*This report is automatically generated weekly. For questions, contact DevOps team.*');
          " >> cost-report.md

          cat cost-report.md

      - name: Upload cost report
        uses: actions/upload-artifact@v4
        with:
          name: github-actions-cost-report
          path: |
            cost-report.md
            stats.json
          retention-days: 90

      - name: Create or update issue with report
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('cost-report.md', 'utf8');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Search for existing cost report issue
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: 'cost-monitoring',
              state: 'open',
              per_page: 1,
            });

            const issueBody = report + '\n\n---\n*Updated automatically by cost-monitor workflow*';

            if (issues.data.length > 0) {
              // Update existing issue
              const issue = issues.data[0];
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                body: issueBody,
              });
              console.log(`Updated issue #${issue.number}`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner,
                repo,
                title: 'GitHub Actions Cost Monitoring Report',
                body: issueBody,
                labels: ['cost-monitoring', 'devops', 'automation'],
              });
              console.log(`Created issue #${newIssue.data.number}`);
            }

      - name: Check for cost alerts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const stats = JSON.parse(fs.readFileSync('stats.json', 'utf8'));

            const alerts = [];

            // Alert if total duration exceeds threshold (e.g., 1000 minutes/month)
            const durationThreshold = 1000;
            if (stats.total_duration_minutes > durationThreshold) {
              alerts.push(`⚠️ Total compute time (${stats.total_duration_minutes} min) exceeds threshold (${durationThreshold} min)`);
            }

            // Alert if estimated cost exceeds budget
            const costThreshold = 10.0; // dollars
            if (stats.estimated_monthly_cost > costThreshold) {
              alerts.push(`⚠️ Estimated monthly cost ($${stats.estimated_monthly_cost}) exceeds budget ($${costThreshold})`);
            }

            // Alert for workflows with excessive average duration
            for (const [name, data] of Object.entries(stats.workflows)) {
              if (data.avg_duration > 20) {
                alerts.push(`⚠️ Workflow "${name}" has high average duration: ${data.avg_duration} minutes`);
              }
            }

            if (alerts.length > 0) {
              console.log('Cost Alerts Detected:');
              alerts.forEach(alert => console.log(alert));

              // Set job summary
              core.summary
                .addHeading('GitHub Actions Cost Alerts', 2)
                .addList(alerts)
                .write();
            } else {
              console.log('✅ No cost alerts detected');
              core.summary
                .addHeading('GitHub Actions Cost Monitor', 2)
                .addRaw('✅ All costs within acceptable thresholds')
                .addBreak()
                .addRaw(`Total Duration: ${stats.total_duration_hours} hours`)
                .addBreak()
                .addRaw(`Estimated Cost: $${stats.estimated_monthly_cost}`)
                .write();
            }

      - name: Print optimization tips
        run: |
          echo ""
          echo "💡 GitHub Actions Optimization Tips:"
          echo ""
          echo "1. Use caching to reduce dependency installation time"
          echo "   - npm ci with cache can save 2-5 minutes per run"
          echo "   - Docker layer caching can save 5-10 minutes per build"
          echo ""
          echo "2. Implement workflow concurrency groups"
          echo "   - Automatically cancel outdated workflow runs"
          echo "   - Can reduce costs by 30-50% on active branches"
          echo ""
          echo "3. Use conditional job execution"
          echo "   - Skip jobs based on changed files"
          echo "   - Run expensive tests only on specific branches"
          echo ""
          echo "4. Optimize test parallelization"
          echo "   - Balance between speed and cost"
          echo "   - More parallel jobs = faster but more expensive"
          echo ""
          echo "5. Review scheduled workflows"
          echo "   - Do you need nightly builds?"
          echo "   - Can some checks run less frequently?"
          echo ""
          echo "📊 Full report available in artifacts"
