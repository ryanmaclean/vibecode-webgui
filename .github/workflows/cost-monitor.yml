name: GitHub Actions Cost Monitor

on:
  schedule:
    - cron: '0 9 * * MON'
  workflow_dispatch:

concurrency:
  group: cost-monitor
  cancel-in-progress: true

jobs:
  gather-usage:
    runs-on: ubuntu-latest
    env:
      BILLING_TOKEN: ${{ secrets.GH_BILLING_PAT }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Verify billing token
        id: verify
        run: |
          if [ -z "${BILLING_TOKEN}" ]; then
            echo "::notice::GH_BILLING_PAT not configured; skipping billing query." >> "$GITHUB_STEP_SUMMARY"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch billing (API)
        id: billing
        if: steps.verify.outputs.has_token == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_BILLING_PAT }}
        run: |
          set -euo pipefail
          OWNER=${{ github.repository_owner }}
          RESPONSE=$(gh api graphql -F owner="$OWNER" -f query='query($owner: String!) { organization(login: $owner) { name billingInfo { totalMinutesUsed totalPaidSeatMinutes } } }')
          echo "$RESPONSE" > billing.json
          TOTAL_MINUTES=$(jq '.data.organization.billingInfo.totalMinutesUsed' billing.json)
          echo "total_minutes=$TOTAL_MINUTES" >> "$GITHUB_OUTPUT"

      - name: Cost summary
        run: |
          echo "### GitHub Actions Cost Monitor" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verify.outputs.has_token }}" != 'true' ]; then
            echo "- Billing token not configured; skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Total minutes (month-to-date): ${{ steps.billing.outputs.total_minutes }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Reminder: using lightweight CI on main, full CI on release branches." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Slack notification
        if: steps.verify.outputs.has_token == 'true' && env.SLACK_WEBHOOK_URL != ''
        run: |
          payload=$(jq -n --arg text "GitHub Actions minutes (MTD): ${{ steps.billing.outputs.total_minutes }}" '{text: $text}')
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
