name: DBM Verifier (Non-Restart)

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace for Postgres
        default: vibecode-platform
        required: true
        type: string
      datadogNamespace:
        description: Kubernetes namespace for Datadog Agent
        default: datadog
        required: true
        type: string
      postgresService:
        description: Postgres service DNS name (service only)
        default: postgres-service
        required: true
        type: string
      dbName:
        description: Database name to verify
        default: vibecode
        required: true
        type: string
      dbUser:
        description: Datadog monitoring user
        default: datadog
        required: true
        type: string
      dbAdminUser:
        description: Admin user for setup commands
        default: vibecode
        required: true
        type: string
      sslMode:
        description: SSL mode for Datadog integration
        default: disable
        required: true
        type: choice
        options: [disable, require, verify-ca, verify-full]
      skipPostgresRestart:
        description: Skip restarting Postgres workload
        default: true
        required: true
        type: boolean
      skipAgentRestart:
        description: Skip restarting Datadog agent
        default: true
        required: true
        type: boolean
      skipSampleData:
        description: Skip creating/seeding sample data
        default: true
        required: true
        type: boolean
  push:
    paths:
      - 'scripts/verify-datadog-dbm.sh'
      - '.github/workflows/dbm-verifier-run.yml'

permissions:
  contents: read

jobs:
  run-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NAMESPACE: ${{ inputs.namespace }}
      DATADOG_AGENT_NAMESPACE: ${{ inputs.datadogNamespace }}
      POSTGRES_SERVICE: ${{ inputs.postgresService }}
      DB_NAME: ${{ inputs.dbName }}
      DB_USER: ${{ inputs.dbUser }}
      DB_ADMIN_USER: ${{ inputs.dbAdminUser }}
      SSL_MODE: ${{ inputs.sslMode }}
      SKIP_POSTGRES_RESTART: ${{ inputs.skipPostgresRestart }}
      SKIP_AGENT_RESTART: ${{ inputs.skipAgentRestart }}
      SKIP_SAMPLE_DATA: ${{ inputs.skipSampleData }}
      USE_SECRET_PASSWORD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        if: ${{ secrets.AZURE_CREDENTIALS != '' }}
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kubelogin
        uses: azure/use-kubelogin@v1

      - name: Get AKS credentials
        if: ${{ secrets.AZURE_RESOURCE_GROUP != '' && secrets.AZURE_AKS_CLUSTER_NAME != '' }}
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_AKS_CLUSTER_NAME }}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Preflight cluster info
        run: |
          kubectl config current-context || true
          kubectl get ns || true
          kubectl -n "$DATADOG_AGENT_NAMESPACE" get daemonset || true
          kubectl -n "$NAMESPACE" get pods -l app=postgres -o wide || \
          kubectl -n "$NAMESPACE" get pods -l app=postgresql -o wide || \
          kubectl -n "$NAMESPACE" get pods -l app=postgres-simple -o wide || true

      - name: Run DBM verifier (non-restart path)
        env:
          DD_POSTGRES_PASSWORD: ${{ secrets.DD_POSTGRES_PASSWORD || '' }}
        run: |
          bash scripts/verify-datadog-dbm.sh

      - name: Upload dashboard JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datadog-pgvector-dashboard
          path: /tmp/datadog-pgvector-dashboard.json
