name: TruffleHog On-Demand Scan

on:
  workflow_dispatch:
    inputs:
      history:
        description: "Scan full git history (true/false)"
        required: false
        default: "false"

jobs:
  filesystem:
    name: Filesystem scan (verified only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history to support history job)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (filesystem)
        uses: trufflesecurity/trufflehog-actions-scan@v0.13.0
        with:
          scanArguments: "--no-update --only-verified --fail --exclude_paths .trufflehog-exclude.txt ."

  git-history:
    name: Git history scan (verified only)
    if: ${{ github.event.inputs.history == 'true' }}
    needs: filesystem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run TruffleHog (git)
        run: |
          echo "Scanning full git history (verified only)"
          trufflehog git --no-update --only-verified --fail --json file://$(pwd)
