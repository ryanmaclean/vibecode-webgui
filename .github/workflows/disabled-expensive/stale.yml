name: Close stale issues and PRs

on:
  schedule:
    - cron: '30 4 * * *' # nightly UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 14
          days-before-close: 7
          stale-issue-message: |
            This issue has been marked as stale because it has had no activity for 14 days.
            It will be closed in 7 days if no further activity occurs.
            If this is still relevant, please add a comment or apply the `pinned` or `triaged` label.
          stale-pr-message: |
            This pull request has been marked as stale due to 14 days of inactivity.
            It will be closed in 7 days if no further activity occurs.
            If this is still relevant, please add a comment or apply the `pinned` or `triaged` label.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security,never-stale,triaged'
          exempt-pr-labels: 'pinned,security,never-stale,triaged'
          remove-stale-when-updated: true
          operations-per-run: 200
