name: Supply Chain Attestations

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      artifact_path:
        description: 'Path to artifact to attest'
        required: true
        default: 'artifacts/openvscode'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest-artifacts:
    name: Generate Attestations
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.2'

      - name: Install SLSA verifier
        run: |
          curl -Lo slsa-verifier https://github.com/slsa-framework/slsa-verifier/releases/download/v2.5.1/slsa-verifier-linux-amd64
          chmod +x slsa-verifier
          sudo mv slsa-verifier /usr/local/bin/

      - name: Find artifacts
        id: artifacts
        run: |
          ARTIFACT_PATH="${{ github.event.inputs.artifact_path || 'artifacts/openvscode' }}"
          if [[ -d "${ARTIFACT_PATH}" ]]; then
            ARTIFACTS=$(find "${ARTIFACT_PATH}" -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.img" \) | head -10)
          else
            echo "No artifacts found at ${ARTIFACT_PATH}"
            exit 1
          fi
          
          echo "artifacts<<EOF" >> $GITHUB_OUTPUT
          echo "${ARTIFACTS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate SBOMs
        run: |
          # Install syft for SBOM generation
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          
          while IFS= read -r artifact; do
            if [[ -n "${artifact}" ]]; then
              echo "Generating SBOM for ${artifact}..."
              syft "${artifact}" -o spdx-json > "${artifact}.sbom.json"
            fi
          done <<< "${{ steps.artifacts.outputs.artifacts }}"

      - name: Sign artifacts with Cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          while IFS= read -r artifact; do
            if [[ -n "${artifact}" && -f "${artifact}" ]]; then
              echo "Signing ${artifact}..."
              cosign sign-blob \
                --yes \
                --bundle="${artifact}.cosign.bundle" \
                "${artifact}"
              
              # Also sign the SBOM
              if [[ -f "${artifact}.sbom.json" ]]; then
                cosign sign-blob \
                  --yes \
                  --bundle="${artifact}.sbom.cosign.bundle" \
                  "${artifact}.sbom.json"
              fi
            fi
          done <<< "${{ steps.artifacts.outputs.artifacts }}"

      - name: Generate provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: '${{ github.event.inputs.artifact_path || ''artifacts/openvscode'' }}/*'

      - name: Create attestation summary
        run: |
          cat > attestation-summary.md <<EOF
          # Supply Chain Attestation Summary
          
          **Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${GITHUB_SHA:0:7}
          **Workflow:** ${GITHUB_WORKFLOW}
          **Run:** ${GITHUB_RUN_NUMBER}
          
          ## Artifacts Attested
          
          $(while IFS= read -r artifact; do
            if [[ -n "${artifact}" ]]; then
              echo "- \`$(basename "${artifact}")\`"
              echo "  - SBOM: \`$(basename "${artifact}").sbom.json\`"
              echo "  - Signature: \`$(basename "${artifact}").cosign.bundle\`"
            fi
          done <<< "${{ steps.artifacts.outputs.artifacts }}")
          
          ## Verification
          
          To verify an artifact:
          
          \`\`\`bash
          # Verify signature
          cosign verify-blob \\
            --bundle=<artifact>.cosign.bundle \\
            --certificate-identity-regexp='.*' \\
            --certificate-oidc-issuer-regexp='.*' \\
            <artifact>
          
          # Verify SBOM
          cosign verify-blob \\
            --bundle=<artifact>.sbom.cosign.bundle \\
            --certificate-identity-regexp='.*' \\
            --certificate-oidc-issuer-regexp='.*' \\
            <artifact>.sbom.json
          \`\`\`
          
          ## SLSA Provenance
          
          Build provenance attestations are available via GitHub's attestation API.
          
          EOF
          
          cat attestation-summary.md

      - name: Upload attestations
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-attestations
          path: |
            **/*.sbom.json
            **/*.cosign.bundle
            attestation-summary.md
          retention-days: 90

      - name: Comment on release (if applicable)
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('attestation-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.release.id,
              body: summary
            });

      - name: Upload to release assets (if applicable)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/*.sbom.json
            **/*.cosign.bundle
            attestation-summary.md
