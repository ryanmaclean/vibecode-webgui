name: Desktop Build - Cross-Platform

on:
  push:
    tags:
      - 'desktop-v*'  # Trigger on desktop version tags (e.g., desktop-v1.0.0)
    branches:
      - 'feature/cross-platform-builds'  # Allow testing on feature branch
  pull_request:
    paths:
      - 'src-tauri/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:  # Manual trigger for testing
    inputs:
      skip_signing:
        description: 'Skip code signing (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-matrix:
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds
          - platform: macos
            arch: universal
            os: macos-14
            target: universal-apple-darwin
            bundle: dmg,app

          # Linux builds
          - platform: linux
            arch: x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage,rpm

          - platform: linux
            arch: arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bundle: deb,appimage
            cross_compile: true

          # Windows builds
          - platform: windows
            arch: x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: msi,nsis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      # Linux-specific dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      # Linux ARM64 cross-compilation setup
      - name: Setup ARM64 cross-compilation
        if: matrix.platform == 'linux' && matrix.cross_compile
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

          # Configure cargo for cross-compilation
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      # Linux RPM packaging tools
      - name: Install RPM tools (Linux x86_64 only)
        if: matrix.platform == 'linux' && matrix.arch == 'x86_64'
        run: |
          sudo apt-get install -y rpm

      # macOS-specific dependencies
      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install --quiet --no-auto-update \
            pkg-config \
            openssl@3

      # Windows-specific setup
      - name: Setup Windows dependencies
        if: matrix.platform == 'windows'
        run: |
          # Install WiX Toolset for MSI creation
          dotnet tool install --global wix --version 5.0.0

      - name: Validate Tauri configuration
        run: |
          echo "Validating Tauri setup..."
          test -f src-tauri/tauri.conf.json || { echo "Error: tauri.conf.json not found"; exit 1; }
          test -f src-tauri/icons/icon.icns || { echo "Error: icon.icns not found"; exit 1; }
          test -f src-tauri/icons/icon.ico || { echo "Error: icon.ico not found"; exit 1; }
          echo "Tauri configuration validated successfully"
        shell: bash

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Tauri CLI installation
        run: |
          echo "Verifying Tauri CLI..."
          npm run tauri -- --version || { echo "Error: Tauri CLI not available"; exit 1; }
        shell: bash

      - name: Build Tauri app
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          NEXT_CONFIG_FILE: next.config.tauri.js
        run: |
          echo "Building Tauri app for ${{ matrix.platform }} (${{ matrix.arch }})..."
          echo "Target: ${{ matrix.target }}"
          npm run tauri build -- --target ${{ matrix.target }} --verbose
        shell: bash

      # macOS Code Signing
      - name: Import Apple Developer Certificate
        if: |
          matrix.platform == 'macos' &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_signing != 'true'))
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Creating temporary keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "Importing Apple Developer certificate..."
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Sign macOS Application
        if: |
          matrix.platform == 'macos' &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_signing != 'true'))
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/macos/VibeCode.app"

          echo "Signing VibeCode.app..."
          codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --entitlements src-tauri/entitlements.plist \
            --timestamp \
            "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize macOS Application
        if: |
          matrix.platform == 'macos' &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_signing != 'true'))
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/VibeCode_*.dmg"

          echo "Submitting DMG for notarization..."
          xcrun notarytool submit $DMG_PATH \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m \
            --verbose

          echo "Stapling notarization ticket..."
          xcrun stapler staple $DMG_PATH

      # Windows Code Signing (if certificate is available)
      - name: Sign Windows Application
        if: |
          matrix.platform == 'windows' &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_signing != 'true'))
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # Import certificate
          $cert = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("certificate.pfx", $cert)

          # Sign MSI
          $msiPath = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi" | Select-Object -First 1
          if ($msiPath) {
            & signtool sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $msiPath.FullName
          }

          # Sign NSIS installer
          $nsisPath = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($nsisPath) {
            & signtool sign /f certificate.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $nsisPath.FullName
          }

          Remove-Item certificate.pfx
        shell: pwsh
        continue-on-error: true

      - name: Generate checksums
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle

          # Find all installer files
          if [ "${{ matrix.platform }}" = "macos" ]; then
            for file in dmg/*.dmg; do
              [ -f "$file" ] && shasum -a 256 "$file" > "$file.sha256"
            done
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            for file in deb/*.deb appimage/*.AppImage rpm/*.rpm 2>/dev/null; do
              [ -f "$file" ] && sha256sum "$file" > "$file.sha256"
            done
          elif [ "${{ matrix.platform }}" = "windows" ]; then
            for file in msi/*.msi nsis/*.exe; do
              [ -f "$file" ] && certutil -hashfile "$file" SHA256 > "$file.sha256"
            done
          fi
        shell: bash

      - name: List build artifacts
        run: |
          echo "Build artifacts for ${{ matrix.platform }} (${{ matrix.arch }}):"
          ls -lhR src-tauri/target/${{ matrix.target }}/release/bundle/ || true
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VibeCode-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.sha256
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.sha256
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sha256
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.sha256
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.sha256
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sha256
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup macOS keychain
        if: always() && matrix.platform == 'macos'
        run: |
          if security list-keychains | grep -q build.keychain; then
            security delete-keychain build.keychain || true
          fi
          rm -f certificate.p12 || true

  create-release:
    name: Create GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.rpm
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          body: |
            # VibeCode Desktop Application - Multi-Platform Release

            ## Installation Instructions

            ### macOS (Universal Binary - Intel & Apple Silicon)
            1. Download `VibeCode_*_universal.dmg`
            2. Open the DMG file
            3. Drag VibeCode.app to Applications folder
            4. Launch VibeCode from Applications

            **Note:** The app is signed and notarized with Apple. First launch may take a moment for Gatekeeper verification.

            ### Linux (Ubuntu/Debian)
            ```bash
            # x86_64
            sudo dpkg -i VibeCode_*_amd64.deb

            # ARM64
            sudo dpkg -i VibeCode_*_arm64.deb
            ```

            ### Linux (Fedora/RHEL/Rocky)
            ```bash
            # x86_64 only
            sudo rpm -i VibeCode-*.x86_64.rpm
            ```

            ### Linux (AppImage - Universal)
            ```bash
            # x86_64
            chmod +x VibeCode_*_amd64.AppImage
            ./VibeCode_*_amd64.AppImage

            # ARM64
            chmod +x VibeCode_*_arm64.AppImage
            ./VibeCode_*_arm64.AppImage
            ```

            ### Windows (Windows 10/11)

            **Option 1: MSI Installer (Recommended)**
            1. Download `VibeCode_*_x64.msi`
            2. Double-click to install
            3. Follow installation wizard

            **Option 2: NSIS Installer**
            1. Download `VibeCode_*_x64-setup.exe`
            2. Run the installer
            3. Follow installation wizard

            ## Verify Download Integrity

            All packages include SHA256 checksums. Verify your download:

            ```bash
            # macOS/Linux
            sha256sum -c VibeCode_*.sha256

            # Windows PowerShell
            Get-FileHash VibeCode_*.msi -Algorithm SHA256
            ```

            ## Platform-Specific Notes

            ### macOS
            - **System Requirements:** macOS 10.13 or later
            - **Architecture:** Universal binary supports both Intel and Apple Silicon
            - **Permissions:** May need to allow in System Preferences > Security & Privacy on first launch

            ### Linux
            - **System Requirements:**
              - Ubuntu 20.04+, Debian 11+, Fedora 35+, or similar
              - GLIBC 2.31+
            - **Dependencies:** Installed automatically with .deb/.rpm packages
            - **AppImage:** No installation required, runs on any Linux distribution

            ### Windows
            - **System Requirements:** Windows 10 (build 1809+) or Windows 11
            - **Architecture:** x86_64 (64-bit) only
            - **Installation:** Per-user installation (no admin required)

            ## Changes

            See the full changelog for details on what's new in this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
