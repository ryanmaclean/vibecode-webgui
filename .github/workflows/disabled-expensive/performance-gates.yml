name: Performance Gates

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  performance-testing:
    name: Performance Testing & Gates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:performance
        env:
          CI: true

      - name: Build performance test
        run: npm run build
        env:
          CI: true

      - name: Measure build time
        id: build-time
        run: |
          start_time=$(date +%s)
          npm run build
          end_time=$(date +%s)
          build_time=$((end_time - start_time))
          echo "build_time=$build_time" >> $GITHUB_OUTPUT
          echo "🏗️ Build completed in ${build_time}s"

      - name: Check build performance gate
        run: |
          if [ ${{ steps.build-time.outputs.build-time }} -gt 15 ]; then
            echo "❌ Build performance gate failed: ${build_time}s > 15s threshold"
            exit 1
          else
            echo "✅ Build performance gate passed: ${build_time}s <= 15s threshold"
          fi

      - name: Run memory usage test
        run: |
          node -e "
            const { PerformanceTester } = require('./tests/performance/performance-regression.test.ts');
            const tester = new PerformanceTester({
              buildTime: 15,
              pageLoadTime: 2000,
              apiResponseTime: 500,
              memoryUsage: 1024,
              cpuUsage: 80
            });
            const result = tester.testMemoryUsage();
            if (!result.passed) {
              console.error('❌ Memory usage gate failed:', result.actual, 'MB >', result.threshold, 'MB');
              process.exit(1);
            }
            console.log('✅ Memory usage gate passed:', result.actual, 'MB <=', result.threshold, 'MB');
          "

      - name: Performance regression check
        run: |
          echo "🔍 Checking for performance regressions..."
          npm run test:performance:regression

      - name: Generate performance report
        run: |
          echo "📊 Generating performance report..."
          npm run test:performance:report

      - name: Comment PR with performance results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = '## 🚀 Performance Test Results\n\n**Build Performance:** ✅ Passed (threshold: 15s)\n**Memory Usage:** ✅ Passed (threshold: 1GB)\n**Performance Gates:** ✅ All passed\n\nPerformance regression testing completed successfully. No regressions detected.\n\n---\n*Generated by Performance Gates workflow*';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            });

  performance-monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    needs: performance-testing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run synthetic performance tests
        run: |
          echo "🧪 Running synthetic performance tests..."
          npm run test:performance:synthetic

      - name: Collect performance metrics
        run: |
          echo "📈 Collecting performance metrics..."
          npm run test:performance:metrics

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-metrics
          path: |
            performance-results/
            .next/
            coverage/

      - name: Performance budget check
        run: |
          echo "💰 Checking performance budgets..."
          npm run test:performance:budget

      - name: Alert on performance regression
        if: failure()
        run: |
          echo "🚨 Performance regression detected!"
          echo "Sending alert to team..."
          # Add your alerting logic here (Slack, email, etc.)

  security-scanning:
    name: Security & Dependency Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Check for secrets
        run: |
          echo "🔒 Checking for exposed secrets..."
          npm run test:security:secrets

      - name: Dependency vulnerability scan
        run: |
          echo "🛡️ Scanning dependencies for vulnerabilities..."
          npm run test:security:dependencies

      - name: SAST scan
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  e2e-performance:
    name: E2E Performance Testing
    runs-on: ubuntu-latest
    needs: [performance-testing, security-scanning]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Start application
        run: npm run dev &
        env:
          CI: true

      - name: Wait for app to start
        run: |
          echo "⏳ Waiting for application to start..."
          timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run E2E performance tests
        run: |
          echo "🎭 Running E2E performance tests..."
          npm run test:e2e:performance

      - name: Collect Core Web Vitals
        run: |
          echo "📊 Collecting Core Web Vitals..."
          npm run test:performance:web-vitals

      - name: Performance budget enforcement
        run: |
          echo "💰 Enforcing performance budgets..."
          npm run test:performance:budget:e2e

      - name: Generate performance report
        run: |
          echo "📋 Generating comprehensive performance report..."
          npm run test:performance:report:full

      - name: Upload E2E performance results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-performance-results
          path: |
            playwright-report/
            test-results/
            performance-results/
