name: Infrastructure Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'tofu/**'
      - 'scripts/deploy-aks.py'
      - 'tests/**'
      - '.github/workflows/infrastructure-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'tofu/**'
      - 'scripts/deploy-aks.py'
      - 'tests/**'
      - '.github/workflows/infrastructure-tests.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Test environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
      cleanup:
        description: 'Clean up resources after testing'
        required: true
        default: true
        type: boolean

env:
  # Test configuration
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.6.0"
  AZURE_CLI_VERSION: "2.53.0"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Install Terraform (fallback)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python scripts/run-infrastructure-tests.py --unit
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload unit test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results/
            coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run integration tests
        run: |
          python scripts/run-infrastructure-tests.py --integration
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  e2e-tests:
    name: E2E Tests (Validation Only)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run E2E validation tests
        run: |
          # Run only validation tests (no real deployment)
          python scripts/run-infrastructure-tests.py --e2e
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Note: Real deployment tests require Azure credentials and are run manually

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: test-results/

  # This job runs on manual dispatch for real Azure deployment testing
  e2e-deployment-tests:
    name: E2E Deployment Tests (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: azure-testing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run E2E deployment tests
        run: |
          python scripts/run-infrastructure-tests.py --e2e --enable-deployment
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}

      - name: Upload deployment test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: deployment-test-results
          path: test-results/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'tofu/'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Checkov security scan
        run: |
          pip install checkov
          checkov -d tofu/ --framework terraform --output sarif --output-file checkov-results.sarif || true

      - name: Upload Checkov results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan-results
          path: |
            trivy-results.sarif
            checkov-results.sarif

  generate-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, security-scan]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate consolidated report
        run: |
          python scripts/generate-test-report.py \
            --unit-results unit-test-results/ \
            --integration-results integration-test-results/ \
            --e2e-results e2e-test-results/ \
            --security-results security-scan-results/ \
            --output consolidated-test-report.json

      - name: Upload consolidated report
        uses: actions/upload-artifact@v3
        with:
          name: consolidated-test-report
          path: consolidated-test-report.json

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('consolidated-test-report.json', 'utf8'));

            const comment = `## 🧪 Infrastructure Test Results

            | Test Type | Status | Passed | Failed | Skipped |
            |-----------|--------|--------|--------|---------|
            | Unit Tests | ${report.unit.failed === 0 ? '✅' : '❌'} | ${report.unit.passed} | ${report.unit.failed} | ${report.unit.skipped} |
            | Integration Tests | ${report.integration.failed === 0 ? '✅' : '❌'} | ${report.integration.passed} | ${report.integration.failed} | ${report.integration.skipped} |
            | E2E Tests | ${report.e2e.failed === 0 ? '✅' : '❌'} | ${report.e2e.passed} | ${report.e2e.failed} | ${report.e2e.skipped} |

            **Overall Success Rate:** ${report.summary.success_rate}%

            ${report.summary.failed > 0 ? '⚠️ Some tests failed. Please check the detailed results.' : '✅ All tests passed!'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });