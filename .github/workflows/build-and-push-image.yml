name: Build and Push Container Image

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'Dockerfile.production'
      - '.github/workflows/build-and-push-image.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.js'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - 'Dockerfile.production'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even without code changes'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,format=short
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NODE_ENV=production
          NEXT_TELEMETRY_DISABLED=1

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        format: spdx-json
        output-file: sbom.spdx.json
      if: github.event_name != 'pull_request'

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom-${{ github.sha }}
        path: sbom.spdx.json
      if: github.event_name != 'pull_request'

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image-digest }}
        format: 'sarif'
        output: 'trivy-results.sarif'
      env:
        REGISTRY: ghcr.io
        IMAGE_NAME: ${{ github.repository }}

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      if: always()

  deploy-to-aks:
    # Only run if Azure credentials are configured and we're on main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AKS_CLUSTER_NAME != ''
    needs: [build-and-push, security-scan]
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Check Azure credentials
      id: check-azure
      run: |
        if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "::warning::Azure credentials not configured, skipping AKS deployment"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Checkout repository
      if: steps.check-azure.outputs.skip != 'true'
      uses: actions/checkout@v4

    - name: Azure CLI Login
      if: steps.check-azure.outputs.skip != 'true'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set up kubectl
      if: steps.check-azure.outputs.skip != 'true'
      uses: azure/setup-kubectl@v3

    - name: Get AKS credentials
      if: steps.check-azure.outputs.skip != 'true'
      run: |
        az aks get-credentials \
          --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
          --name ${{ vars.AKS_CLUSTER_NAME }} \
          --overwrite-existing

    - name: Update Helm deployment
      if: steps.check-azure.outputs.skip != 'true'
      run: |
        # Extract image tag from build output
        IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"

        # Update Helm deployment with new image
        helm upgrade --install vibecode-app charts/vibecode \
          --namespace vibecode-platform \
          --set image.repository="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
          --set image.tag="${GITHUB_SHA}" \
          --set datadog.version="${GITHUB_SHA}" \
          --wait --timeout=600s

    - name: Verify deployment
      if: steps.check-azure.outputs.skip != 'true'
      run: |
        kubectl rollout status deployment/vibecode-app -n vibecode-platform --timeout=300s
        kubectl get pods -n vibecode-platform -l app.kubernetes.io/name=vibecode

    - name: Post deployment notification
      if: always() && steps.check-azure.outputs.skip != 'true'
      uses: 8398a7/action-slack@v3
      continue-on-error: true
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          Deployment to AKS: ${{ job.status }}
          Image: ${{ needs.build-and-push.outputs.image-tag }}
          Commit: ${{ github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
