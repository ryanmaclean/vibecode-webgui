name: Changelog Generation

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_from:
        description: 'Starting tag (leave empty for last tag)'
        required: false
        type: string
      tag_to:
        description: 'Ending tag (leave empty for HEAD)'
        required: false
        type: string
      update_file:
        description: 'Update CHANGELOG.md file'
        required: false
        type: boolean
        default: true

env:
  DD_SERVICE: ${{ github.event.repository.name }}
  DD_ENV: ci
  DD_VERSION: ${{ github.sha }}
  DD_TAGS: team:platform,component:ci

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-changelog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Setup git-cliff
        uses: kenji-miyake/setup-git-cliff@v2
        with:
          version: latest

      - name: Detect version range
        id: version-range
        run: |
          if [ -n "${{ github.event.inputs.tag_from }}" ]; then
            echo "from=${{ github.event.inputs.tag_from }}" >> $GITHUB_OUTPUT
          else
            # Get the previous tag
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            echo "from=${PREVIOUS_TAG}" >> $GITHUB_OUTPUT
          fi

          if [ -n "${{ github.event.inputs.tag_to }}" ]; then
            echo "to=${{ github.event.inputs.tag_to }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "release" ]; then
            echo "to=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "to=HEAD" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog content
        id: changelog
        run: |
          FROM_TAG="${{ steps.version-range.outputs.from }}"
          TO_TAG="${{ steps.version-range.outputs.to }}"

          if [ -z "$FROM_TAG" ]; then
            # First release - generate from all commits
            git cliff --tag "$TO_TAG" --output CHANGELOG_NEW.md
          else
            # Generate changelog between tags
            git cliff "$FROM_TAG".."$TO_TAG" --tag "$TO_TAG" --output CHANGELOG_NEW.md
          fi

          # Store changelog content for GitHub release
          cat CHANGELOG_NEW.md >> $GITHUB_STEP_SUMMARY

      - name: Update CHANGELOG.md
        if: |
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.update_file == 'true'))
        run: |
          # Prepend new changelog to existing file
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG_NEW.md CHANGELOG.md > CHANGELOG_TEMP.md
            mv CHANGELOG_TEMP.md CHANGELOG.md
          else
            mv CHANGELOG_NEW.md CHANGELOG.md
          fi

      - name: Commit changelog
        if: |
          (github.event_name == 'release' ||
           (github.event_name == 'workflow_dispatch' &&
            github.event.inputs.update_file == 'true'))
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet CHANGELOG.md; then
            echo "No changes to CHANGELOG.md"
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG.md for ${{ steps.version-range.outputs.to }}" \
                     -m "" \
                     -m "🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
                     -m "" \
                     -m "Co-Authored-By: Claude <noreply@anthropic.com>"

          git push origin HEAD:main || {
            echo "Failed to push to main, creating PR instead"
            BRANCH="changelog-update-$(date +%s)"
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"

            gh pr create \
              --title "docs: update CHANGELOG.md for ${{ steps.version-range.outputs.to }}" \
              --body "Automated changelog update for release ${{ steps.version-range.outputs.to }}" \
              --base main \
              --head "$BRANCH"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release notes
        if: github.event_name == 'release'
        run: |
          # Extract changelog content without the header
          CHANGELOG_BODY=$(tail -n +3 CHANGELOG_NEW.md)

          gh release edit ${{ github.event.release.tag_name }} \
            --notes "$CHANGELOG_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ steps.version-range.outputs.to }}
          path: CHANGELOG_NEW.md
          retention-days: 90
