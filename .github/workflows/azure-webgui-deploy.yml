name: Deploy WebGUI to Azure App Service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: sha)'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'next.config.mjs'
      - 'package.json'
      - '.github/workflows/azure-webgui-deploy.yml'
      - 'src/**'

concurrency:
  group: azure-webgui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY_WEBGUI || 'vibecode/webgui' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_azure_client: ${{ steps.check.outputs.has_azure_client }}
      has_azure_tenant: ${{ steps.check.outputs.has_azure_tenant }}
      has_azure_subscription: ${{ steps.check.outputs.has_azure_subscription }}
      has_acr_name: ${{ steps.check.outputs.has_acr_name }}
      has_resource_group: ${{ steps.check.outputs.has_resource_group }}
      has_app_name: ${{ steps.check.outputs.has_app_name }}
    steps:
      - name: Check Azure secrets
        id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP_NAME_WEBGUI: ${{ secrets.APP_NAME_WEBGUI }}
        run: |
          set -euo pipefail

          check() {
            local key="$1" value="$2" flag="$3" message="$4"
            if [ -n "$value" ]; then
              echo "✅ $key configured"
              printf '%s=1\n' "$flag" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::$message"
              printf '%s=0\n' "$flag" >> "$GITHUB_OUTPUT"
            fi
          }

          check 'AZURE_CLIENT_ID' "${AZURE_CLIENT_ID:-}" 'has_azure_client' 'Missing AZURE_CLIENT_ID secret; deployment will be skipped.'
          check 'AZURE_TENANT_ID' "${AZURE_TENANT_ID:-}" 'has_azure_tenant' 'Missing AZURE_TENANT_ID secret; deployment will be skipped.'
          check 'AZURE_SUBSCRIPTION_ID' "${AZURE_SUBSCRIPTION_ID:-}" 'has_azure_subscription' 'Missing AZURE_SUBSCRIPTION_ID secret; deployment will be skipped.'
          check 'ACR_NAME' "${ACR_NAME:-}" 'has_acr_name' 'Missing ACR_NAME secret; container registry login unavailable.'
          check 'AZURE_RESOURCE_GROUP' "${AZURE_RESOURCE_GROUP:-}" 'has_resource_group' 'Missing AZURE_RESOURCE_GROUP secret; deployment will be skipped.'
          check 'APP_NAME_WEBGUI' "${APP_NAME_WEBGUI:-}" 'has_app_name' 'Missing APP_NAME_WEBGUI secret; deployment will be skipped.'

  build-and-push:
    needs: validate-secrets
    if: needs.validate-secrets.outputs.has_azure_client == '1' &&
        needs.validate-secrets.outputs.has_azure_tenant == '1' &&
        needs.validate-secrets.outputs.has_azure_subscription == '1' &&
        needs.validate-secrets.outputs.has_acr_name == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI - Get ACR login server
        id: acr
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account show -o none
            az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv > acr.txt
            echo "login_server=$(cat acr.txt)" >> $GITHUB_OUTPUT

      - name: Docker Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image (WebGUI)
        run: |
          docker build -t ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Push image (WebGUI)
        run: |
          docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Publish artifact meta
        run: |
          echo "image=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    runs-on: ubuntu-latest
    needs: [validate-secrets, build-and-push]
    if: needs.validate-secrets.outputs.has_azure_client == '1' &&
        needs.validate-secrets.outputs.has_azure_tenant == '1' &&
        needs.validate-secrets.outputs.has_azure_subscription == '1' &&
        needs.validate-secrets.outputs.has_resource_group == '1' &&
        needs.validate-secrets.outputs.has_app_name == '1'
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI - Update App Service container image (WebGUI)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -e
            ACR_LOGIN_SERVER=$(az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv)
            IMAGE="${ACR_LOGIN_SERVER}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}"
            echo "Deploying image: ${IMAGE}"
            az webapp config container set \
              -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
              -n ${{ secrets.APP_NAME_WEBGUI }} \
              --docker-custom-image-name ${IMAGE} \
              --enable-app-service-storage false

      - name: Azure CLI - Restart app (WebGUI)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp restart -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${{ secrets.APP_NAME_WEBGUI }}

      - name: Resolve App URL
        id: app
        uses: azure/cli@v2
        with:
          inlineScript: |
            HOST=$(az webapp show -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${{ secrets.APP_NAME_WEBGUI }} --query defaultHostName -o tsv)
            echo "url=https://${HOST}" >> $GITHUB_OUTPUT
            echo "WebGUI URL: https://${HOST}" >> $GITHUB_STEP_SUMMARY

      - name: Post-deploy smoke (home)
        run: |
          set -e
          URL="${{ steps.app.outputs.url }}"
          echo "Probing ${URL}/"
          curl -sS --max-time 12 -i "${URL}/" | head -n 40

  missing-secrets:
    runs-on: ubuntu-latest
    needs: validate-secrets
    if: needs.validate-secrets.outputs.has_azure_client != '1' ||
        needs.validate-secrets.outputs.has_azure_tenant != '1' ||
        needs.validate-secrets.outputs.has_azure_subscription != '1' ||
        needs.validate-secrets.outputs.has_acr_name != '1' ||
        needs.validate-secrets.outputs.has_resource_group != '1' ||
        needs.validate-secrets.outputs.has_app_name != '1'
    steps:
      - name: Log skipped deployment
        run: echo '::notice::Skipping WebGUI App Service deployment because required Azure secrets are not configured.'
