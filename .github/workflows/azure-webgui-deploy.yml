name: Deploy WebGUI to Azure App Service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: sha)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
        - staging
        - production
  push:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - 'next.config.mjs'
      - 'package.json'
      - '.github/workflows/azure-webgui-deploy.yml'
      - 'src/**'

permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY_WEBGUI || 'vibecode/webgui' }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
  TARGET_ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI - Get ACR login server
        id: acr
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account show -o none
            az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv > acr.txt
            echo "login_server=$(cat acr.txt)" >> $GITHUB_OUTPUT

      - name: Docker Login to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image (WebGUI)
        run: |
          docker build -t ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }} .

      - name: Push image (WebGUI)
        run: |
          docker push ${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Publish artifact meta
        run: |
          echo "image=${{ steps.acr.outputs.login_server }}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}
      url: ${{ github.event.inputs.environment == 'staging' && 'https://vibecode-staging.eastus2.cloudapp.azure.com' || 'https://vibecode.eastus2.cloudapp.azure.com' }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI - Update App Service container image (WebGUI)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -e
            ACR_LOGIN_SERVER=$(az acr show -n ${{ secrets.ACR_NAME }} -g ${{ secrets.AZURE_RESOURCE_GROUP }} --query loginServer -o tsv)
            IMAGE="${ACR_LOGIN_SERVER}/${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}"
            APP_NAME="${{ secrets.APP_NAME_WEBGUI }}"
            echo "Deploying image: ${IMAGE} to environment: ${{ env.TARGET_ENVIRONMENT }}"
            echo "App name: ${APP_NAME}"
            az webapp config container set \
              -g ${{ secrets.AZURE_RESOURCE_GROUP }} \
              -n ${APP_NAME} \
              --docker-custom-image-name ${IMAGE} \
              --enable-app-service-storage false

      - name: Azure CLI - Restart app (WebGUI)
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_NAME="${{ secrets.APP_NAME_WEBGUI }}"
            az webapp restart -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${APP_NAME}

      - name: Resolve App URL
        id: app
        uses: azure/cli@v2
        with:
          inlineScript: |
            APP_NAME="${{ secrets.APP_NAME_WEBGUI }}"
            HOST=$(az webapp show -g ${{ secrets.AZURE_RESOURCE_GROUP }} -n ${APP_NAME} --query defaultHostName -o tsv)
            echo "url=https://${HOST}" >> $GITHUB_OUTPUT
            echo "WebGUI URL (${TARGET_ENVIRONMENT}): https://${HOST}" >> $GITHUB_STEP_SUMMARY

      - name: Post-deploy smoke (home)
        run: |
          set -e
          URL="${{ steps.app.outputs.url }}"
          echo "Probing ${URL}/"
          curl -sS --max-time 12 -i "${URL}/" | head -n 40
