            "priority": "normal",
            "tags": ["environment:production", "service:vibecode-webgui", "deployment:success"],
            "alert_type": "success",
            "source_type_name": "github"
          }
          EOF

  # Post-Deployment Monitoring
  post-deployment-monitoring:
    name: Post-Deployment Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && needs.deploy-production.result == 'success'
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    
    steps:
      - name: Setup Datadog monitors
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/monitor" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ env.DD_API_KEY }}" \
            -H "DD-APPLICATION-KEY: ${{ env.DD_APP_KEY }}" \
            -d @- << 'EOF'
          {
            "type": "metric alert",
            "query": "avg(last_5m):avg:kubernetes.cpu.usage.total{service:vibecode-webgui,environment:production} > 0.8",
            "name": "High CPU Usage - VibeCode Production",
            "message": "CPU usage is above 80% for VibeCode production @slack-alerts",
            "tags": ["service:vibecode-webgui", "environment:production"],
            "priority": 2
          }
          EOF

      - name: Setup synthetic tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/synthetics/tests" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ env.DD_API_KEY }}" \
            -H "DD-APPLICATION-KEY: ${{ env.DD_APP_KEY }}" \
            -d @- << 'EOF'
          {
            "type": "api",
            "subtype": "http",
            "config": {
              "request": {
                "method": "GET",
                "url": "https://vibecode-webgui.yourdomain.com/api/health"
              },
              "assertions": [
                {
                  "type": "statusCode",
                  "operator": "is",
                  "target": 200
                },
                {
                  "type": "responseTime",
                  "operator": "lessThan",
                  "target": 1000
                }
              ]
            },
            "locations": ["aws:us-east-1", "aws:eu-west-1"],
            "options": {
              "tick_every": 60,
              "min_failure_duration": 180
            },
            "name": "VibeCode Production Health Check",
            "message": "VibeCode health check failed @slack-alerts",
            "tags": ["service:vibecode-webgui", "environment:production"]
          }
          EOF

      - name: Wait and verify metrics
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: |
          sleep 300  # Wait 5 minutes for metrics to populate
          
          # Check deployment metrics
          curl -X POST "https://api.datadoghq.com/api/v1/query" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ env.DD_API_KEY }}" \
            -H "DD-APPLICATION-KEY: ${{ env.DD_APP_KEY }}" \
            -d '{"query":"avg:kubernetes.pods.running{service:vibecode-webgui,environment:production}"}'

  # Rollback capability
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: [deploy-production]
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
    
    steps:
      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rollback deployment
        run: |
          kubectl rollout undo deployment/vibecode-webgui \
            -n vibecode-webgui-production

      - name: Wait for rollback
        run: |
          kubectl rollout status deployment/vibecode-webgui \
            -n vibecode-webgui-production \
            --timeout=600s

      - name: Verify rollback
        run: |
          curl -f https://vibecode-webgui.yourdomain.com/api/health

      - name: Notify Datadog of rollback
        if: ${{ env.DD_API_KEY != '' }}
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ env.DD_API_KEY }}" \
            -d @- << 'EOF'
          {
            "title": "Production Rollback",
            "text": "Production deployment rolled back due to failure",
            "priority": "high",
            "tags": ["environment:production", "service:vibecode-webgui", "deployment:rollback"],
            "alert_type": "error",
            "source_type_name": "github"
          }
          EOF