name: tundra-ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  topics-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Check Kafka topics list
        run: scripts/check-kafka-topics.sh
