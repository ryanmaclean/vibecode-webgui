name: Release Branch CI/CD (Comprehensive)

# Full testing and deployment pipeline for release branches
# This is where the comprehensive testing happens to control costs

on:
  push:
    branches: 
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    branches: 
      - 'release/*'

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  deployments: write

env:
  NODE_VERSION: '22.11.0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Comprehensive testing matrix
  test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        test-type: [unit, integration, e2e]
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup test environment
        run: |
          cp .env.template .env.local
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/testdb" >> .env.local
          echo "REDIS_URL=redis://localhost:6379" >> .env.local
          echo "PLAYWRIGHT_TEST=true" >> .env.local
          echo "ENABLE_REAL_INTEGRATION_TESTS=true" >> .env.local
      
      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: |
          npm test -- --passWithNoTests \
            --testPathIgnorePatterns="tests/integration|tests/e2e|tests/k8s" \
            --coverage --coverageReporters=lcov
      
      - name: Run integration tests
        if: matrix.test-type == 'integration'
        run: |
          npm test -- --testPathPatterns="tests/integration" \
            --testTimeout=30000 \
            --maxWorkers=2
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379
          ENABLE_REAL_INTEGRATION_TESTS: true
      
      - name: Install Playwright browsers
        if: matrix.test-type == 'e2e'
        run: npx playwright install --with-deps chromium
      
      - name: Build application for E2E
        if: matrix.test-type == 'e2e'
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true
      
      - name: Run E2E tests
        if: matrix.test-type == 'e2e'
        run: |
          npm run dev &
          sleep 10
          npx playwright test --project=chromium --reporter=line
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          PLAYWRIGHT_TEST: true
          BASE_URL: http://localhost:3001
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            test-results/
            playwright-report/
            coverage/

  # Security and quality checks
  security-and-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security audit
        run: npm audit --audit-level=moderate
      
      - name: Run CodeQL analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
      
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2
      
      - name: Run dependency check
        run: |
          npm ls --depth=0 --json > dependency-tree.json
          echo "Dependency scan completed"

  # Build and containerize
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-suite]
    timeout-minutes: 15
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=release-
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Output image
        id: image
        run: |
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

  # Performance testing
  performance-tests:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    timeout-minutes: 15
    if: contains(github.ref, 'release/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Deployment to staging (release branches only)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test-suite, security-and-quality, build-and-push]
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: staging
    timeout-minutes: 10
    
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying ${{ needs.build-and-push.outputs.image }} to staging"
          echo "Image digest: ${{ needs.build-and-push.outputs.digest }}"
          # Add actual deployment commands here
      
      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging environment"
          # Add smoke test commands here

  # Cost reporting
  cost-report:
    runs-on: ubuntu-latest
    needs: [test-suite, security-and-quality, build-and-push, performance-tests]
    if: always()
    steps:
      - name: Calculate estimated costs
        run: |
          echo "Release branch CI executed at $(date)"
          echo "Jobs run: test-suite (3 parallel), security-and-quality, build-and-push, performance-tests"
          echo "Estimated cost: ~$2-4 (depends on test duration)"
          echo "This comprehensive testing ensures release quality"
