name: Code-Server Release Monitor

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine current code-server tag
        id: current
        run: |
          TAG=$(grep -oE 'codercom/code-server:[^ ]+' docker/code-server/Dockerfile | head -n1 | cut -d: -f2)
          VERSION=${TAG%%-*}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch latest upstream release
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({ owner: 'coder', repo: 'code-server' })
            const tag = data.tag_name.replace(/^v/, '')
            core.setOutput('tag', tag)

      - name: Open issue for new release
        if: steps.current.outputs.version != steps.latest.outputs.tag
        uses: actions/github-script@v7
        with:
          script: |
            const latest = process.env.LATEST_TAG
            const currentTag = process.env.CURRENT_TAG
            const title = `code-server ${latest} available`
            const body = `## Summary\nUpstream code-server **${latest}** has shipped. Our Dockerfiles currently reference \\`${currentTag}\\`.\n\n## Actions\n- [ ] Update \\`docker/code-server/Dockerfile\\` and \\`Dockerfile.kind\\` to use the new base tag.\n- [ ] Rebuild and push the multi-arch image via \\`scripts/build-codeserver-multiarch.sh\\`.\n- [ ] Run KinD + Helm smoke tests (\\`scripts/test-code-server-kind.sh\\`, \\`helm/code-server-cloud\\`).\n- [ ] Document the rollout in docs/logs/issues/code-server-cloud-deployment.md.\n\n---\n_This issue was created automatically by the Code-Server Release Monitor workflow._`
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: undefined, per_page: 100 })
            const alreadyOpen = existing.data.some(issue => issue.title === title)
            if (alreadyOpen) {
              core.info(`Issue already open: ${title}`)
              return
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            })
        env:
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          CURRENT_TAG: ${{ steps.current.outputs.tag }}
