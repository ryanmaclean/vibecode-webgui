name: VibeCode CI/CD Pipeline - Simplified

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.11.0'

jobs:
  # Code Quality & Security
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Security
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Prepare environment (.env)
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Install dependencies
        run: |
          # Remove any existing package-lock.json to avoid platform-specific issues
          rm -f package-lock.json
          # Install dependencies for the current platform
          npm install --legacy-peer-deps --omit=optional

      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Lint code
        run: npm run lint
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets and API keys..."
          # Enhanced secret scanning with multiple patterns
          grep -r -E "(sk-[a-zA-Z0-9]{40,}|sk-ant-[a-zA-Z0-9]{40,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16})" src/ --exclude-dir=node_modules || echo "✅ No hardcoded secrets found"
          grep -r -E "(password\s*=\s*['\"][^'\"]+['\"]|api[_-]?key\s*=\s*['\"][^'\"]+['\"])" src/ --exclude-dir=node_modules || echo "✅ No hardcoded credentials found"

  # Root Tests (Integration & Validation) - Our Working Tests
  root-tests:
    runs-on: ubuntu-latest
    name: Root Integration Tests
    needs: code-quality
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: test-secret-key-for-ci
      # Datadog CI Visibility
      DD_CI_VISIBILITY_ENABLED: true
      DD_SERVICE: vibecode-webgui
      DD_ENV: ci
      DD_VERSION: ${{ github.sha }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: ${{ secrets.DD_SITE || 'datadoghq.com' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Setup test environment
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/testdb" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env
          echo "NEXTAUTH_SECRET=test-secret-key-for-ci" >> .env
          echo "NODE_ENV=test" >> .env

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U test; do sleep 1; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'

      - name: Run infrastructure tests
        run: npm run test:root:infrastructure
        continue-on-error: true

      - name: Run database tests
        run: npm run test:root:database
        continue-on-error: true

      - name: Run credentials tests
        run: npm run test:root:credentials
        continue-on-error: true

      - name: Run workflow tests
        run: npm run test:root:workflow
        continue-on-error: true

      - name: Run AI/Embedding tests (if API keys available)
        if: env.OPENAI_API_KEY != ''
        run: npm run test:root:ai
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run Azure Embedding tests (if API keys available)
        if: env.AZURE_OPENAI_API_KEY != ''
        run: npm run test:root:azure
        continue-on-error: true
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}

      - name: Upload root test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: root-test-results
          path: |
            test-results/
            logs/

  # Build Test
  build-test:
    runs-on: ubuntu-latest
    name: Build Test
    needs: code-quality
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Build project
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .next/
            public/

  # Final Validation
  validation-complete:
    runs-on: ubuntu-latest
    name: CI/CD Validation Complete
    needs: [root-tests, build-test]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Check all jobs status
        run: |
          echo "Root Tests: ${{ needs.root-tests.result }}"
          echo "Build Test: ${{ needs.build-test.result }}"
          
          if [[ "${{ needs.root-tests.result }}" == "success" && 
                "${{ needs.build-test.result }}" == "success" ]]; then
            echo "✅ All CI/CD validations passed!"
          else
            echo "❌ Some validations failed"
            exit 1
          fi

      - name: Notify Datadog of CI completion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${{ secrets.DD_API_KEY }}" \
            -d '{
              "title": "VibeCode CI/CD Pipeline Complete",
              "text": "Simplified CI/CD pipeline completed successfully with root tests and build validation",
              "tags": ["source:github", "env:ci", "service:vibecode-webgui", "event:ci-complete"],
              "alert_type": "success"
            }' || echo "Datadog notification skipped (no API key)"

  # AI Gateway Service Tests
  ai-gateway-tests:
    runs-on: ubuntu-latest
    name: AI Gateway Metrics and E2E (conditional)
    needs: code-quality
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install AI Gateway dependencies
        run: npm --prefix services/ai-gateway ci

      - name: Build AI Gateway
        run: npm --prefix services/ai-gateway run build

      - name: Run AI Gateway route-level metrics tests
        run: npm --prefix services/ai-gateway run test:metrics:routes
        env:
          NODE_ENV: test

      - name: Run AI Gateway OpenRouter E2E (if OPENROUTER_API_KEY present)
        if: env.OPENROUTER_API_KEY != ''
        run: npm --prefix services/ai-gateway run test:e2e:openrouter
        env:
          NODE_ENV: test
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JWT_SECRET: test_jwt_secret
          API_KEYS: vbai_test_key

      - name: Upload AI Gateway test logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-gateway-test-logs
          path: |
            services/ai-gateway/.jest-cache/
            services/ai-gateway/test-results/
