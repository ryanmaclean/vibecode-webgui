name: VibeCode CI/CD Pipeline - Simplified

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-simplified-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.19.0'  # Match current package engine requirements
  DD_SERVICE: ${{ github.event.repository.name }}
  DD_ENV: ci
  DD_VERSION: ${{ github.sha }}
  DD_TAGS: team:platform,component:ci

jobs:
  # Code Quality & Security
  code-quality:
    runs-on: ${{ fromJSON(vars.CI_USE_SELF_HOSTED == 'true' && (vars.CI_SELF_HOSTED_LABELS_JSON || '["self-hosted","linux","x64"]') || '["ubuntu-latest"]') }}
    name: Code Quality & Security
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Prepare environment
        run: |
          if [ -f .env.template ]; then
            cp .env.template .env
            echo "Created .env from .env.template"
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo "Created .env from .env.example"
          fi

      - name: Install dependencies
        run: |
          attempt=1
          max_attempts=3
          until npm install --legacy-peer-deps; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Dependency install failed after $max_attempts attempts"
              exit 1
            fi
            echo "Install failed; retrying in 10s (attempt $attempt/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Lint code
        run: npm run lint

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets and API keys..."
          # Enhanced secret scanning with multiple patterns
          if grep -r -E "(sk-[a-zA-Z0-9]{40,}|sk-ant-[a-zA-Z0-9]{40,}|ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16})" src/ --exclude-dir=node_modules 2>/dev/null; then
            echo "WARNING: Potential hardcoded secrets found"
            exit 1
          fi
          # Scan for hardcoded credentials, excluding password masking/sanitization code
          if grep -r -E "(password\s*=\s*['\"][^'\"]+['\"]|api[_-]?key\s*=\s*['\"][^'\"]+['\"])" src/ \
            --exclude-dir=node_modules \
            --exclude="DatabaseTracing.ts" \
            --exclude="*sanitiz*.ts" \
            --exclude="*mask*.ts" 2>/dev/null | grep -v "\.replace(" | grep -v "password='\\*"; then
            echo "WARNING: Potential hardcoded credentials found"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

  # Integration Tests with Services
  integration-tests:
    runs-on: ${{ fromJSON(vars.CI_USE_SELF_HOSTED == 'true' && (vars.CI_SELF_HOSTED_LABELS_JSON || '["self-hosted","linux","x64"]') || '["ubuntu-latest"]') }}
    name: Integration Tests
    needs: code-quality
    timeout-minutes: 25
    env:
      # NOTE: These are ephemeral CI test credentials only
      # Database and Redis services are destroyed after each run
      # Credentials match the service containers defined below
      DATABASE_URL: postgresql://${{ vars.CI_TEST_DB_USER || 'test' }}:${{ vars.CI_TEST_DB_PASSWORD || 'test' }}@localhost:5432/${{ vars.CI_TEST_DB_NAME || 'testdb' }}
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET || 'test-secret-key-for-ci' }}
      NODE_ENV: test
      DD_CI_VISIBILITY_ENABLED: ${{ secrets.DD_API_KEY != '' }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_ENV: ci
      DD_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      DD_GIT_COMMIT_SHA: ${{ github.sha }}
      DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      DD_SERVICE: vibecode-webgui
      DD_SITE: datadoghq.com
      DD_VERSION: ${{ github.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ vars.CI_TEST_DB_PASSWORD || 'test' }}
          POSTGRES_USER: ${{ vars.CI_TEST_DB_USER || 'test' }}
          POSTGRES_DB: ${{ vars.CI_TEST_DB_NAME || 'testdb' }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          attempt=1
          max_attempts=3
          until npm ci --legacy-peer-deps; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Dependency install failed after $max_attempts attempts"
              exit 1
            fi
            echo "Install failed; retrying in 10s (attempt $attempt/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Setup test environment
        run: |
          if [ -f .env.template ]; then
            cp .env.template .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          fi
          # Use environment variables already set in job env
          {
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "REDIS_URL=${REDIS_URL}"
            echo "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}"
            echo "NODE_ENV=test"
          } >> .env

      - name: Wait for services
        run: |
          echo "Waiting for PostgreSQL..."
          max_attempts=30
          attempt=1
          until pg_isready -h localhost -p 5432 -U test || [ $attempt -eq $max_attempts ]; do
            echo "PostgreSQL not ready, attempt $attempt/$max_attempts"
            sleep 2
            attempt=$((attempt + 1))
          done
          if ! pg_isready -h localhost -p 5432 -U test; then
            echo "❌ PostgreSQL failed to become ready after $max_attempts attempts"
            exit 1
          fi
          echo "✅ PostgreSQL is ready"

          echo "Waiting for Redis..."
          attempt=1
          until redis-cli -h localhost -p 6379 ping > /dev/null 2>&1 || [ $attempt -eq $max_attempts ]; do
            echo "Redis not ready, attempt $attempt/$max_attempts"
            sleep 2
            attempt=$((attempt + 1))
          done
          if ! redis-cli -h localhost -p 6379 ping > /dev/null 2>&1; then
            echo "❌ Redis failed to become ready after $max_attempts attempts"
            exit 1
          fi
          echo "✅ Redis is ready"

      - name: Run unit tests
        run: |
          npm test -- --passWithNoTests \
            --testPathIgnorePatterns="tests/e2e|tests/k8s" \
            --runInBand
        env:
          NODE_OPTIONS: -r dd-trace/ci/init

      - name: Run integration tests
        run: |
          if npm run test:integration --if-present; then
            echo "✅ Integration tests passed"
          else
            echo "❌ Integration tests failed"
            exit 1
          fi
        env:
          NODE_OPTIONS: -r dd-trace/ci/init

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            test-results/
            logs/
          retention-days: 7

  # Build Test
  build-test:
    runs-on: ${{ fromJSON(vars.CI_USE_SELF_HOSTED == 'true' && (vars.CI_SELF_HOSTED_LABELS_JSON || '["self-hosted","linux","x64"]') || '["ubuntu-latest"]') }}
    name: Build Test
    needs: code-quality
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          attempt=1
          max_attempts=3
          until npm ci --legacy-peer-deps; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Dependency install failed after $max_attempts attempts"
              exit 1
            fi
            echo "Install failed; retrying in 10s (attempt $attempt/$max_attempts)"
            sleep 10
            attempt=$((attempt + 1))
          done

      - name: Build project
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .next/
            public/
          retention-days: 7

  # Final Validation
  validation-complete:
    runs-on: ${{ fromJSON(vars.CI_USE_SELF_HOSTED == 'true' && (vars.CI_SELF_HOSTED_LABELS_JSON || '["self-hosted","linux","x64"]') || '["ubuntu-latest"]') }}
    name: CI/CD Validation Complete
    needs: [integration-tests, build-test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check all jobs status
        run: |
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Build Test: ${{ needs.build-test.result }}"

          if [[ "${{ needs.integration-tests.result }}" == "success" &&
                "${{ needs.build-test.result }}" == "success" ]]; then
            echo "✅ All CI/CD validations passed!"
            exit 0
          elif [[ "${{ needs.integration-tests.result }}" == "failure" ||
                  "${{ needs.build-test.result }}" == "failure" ]]; then
            echo "❌ Some validations failed"
            exit 1
          else
            echo "⚠️ Some validations were skipped or cancelled"
            exit 0
          fi

  # AI Gateway Service Tests (optional, only if dependencies exist)
  ai-gateway-tests:
    runs-on: ${{ fromJSON(vars.CI_USE_SELF_HOSTED == 'true' && (vars.CI_SELF_HOSTED_LABELS_JSON || '["self-hosted","linux","x64"]') || '["ubuntu-latest"]') }}
    name: AI Gateway Tests (conditional)
    needs: code-quality
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Check AI Gateway exists
        id: check
        run: |
          if [ -d "services/ai-gateway" ] && [ -f "services/ai-gateway/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install AI Gateway dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm --prefix services/ai-gateway ci

      - name: Build AI Gateway
        if: steps.check.outputs.exists == 'true'
        run: npm --prefix services/ai-gateway run build

      - name: Run AI Gateway tests
        if: steps.check.outputs.exists == 'true'
        run: npm --prefix services/ai-gateway test -- --passWithNoTests
        env:
          NODE_ENV: test
