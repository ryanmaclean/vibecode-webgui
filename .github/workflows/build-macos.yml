name: Build macOS

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build macOS App
    runs-on: macos-14  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install system dependencies
        run: |
          brew install create-dmg

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: true

      - name: Build Tauri app (Release)
        if: github.event.inputs.build_type != 'debug'
        run: npm run tauri:build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Tauri app (Debug)
        if: github.event.inputs.build_type == 'debug'
        run: npm run tauri:build:debug

      - name: List build artifacts
        run: |
          echo "=== Build artifacts ==="
          find src-tauri/target -name "*.dmg" -o -name "*.app" || echo "No artifacts found"

      - name: Generate checksums
        run: |
          cd src-tauri/target/release/bundle/dmg || cd src-tauri/target/debug/bundle/dmg
          if ls *.dmg 1> /dev/null 2>&1; then
            shasum -a 256 *.dmg > SHA256SUMS.txt
            cat SHA256SUMS.txt
          else
            echo "No DMG files found"
          fi

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload App bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-arm64
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 30

  build-universal:
    name: Build Universal Binary (Intel + Apple Silicon)
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SKIP_ENV_VALIDATION: true

      - name: Build for ARM64
        run: npm run tauri:build -- --target aarch64-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build for x86_64
        run: npm run tauri:build -- --target x86_64-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Create universal binary
        run: |
          echo "Creating universal binary..."
          # This would require custom lipo commands to merge the binaries
          # Placeholder for now - implementation depends on Tauri config

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app
          if-no-files-found: warn
          retention-days: 30

  test-build:
    name: Test macOS Build
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-app-arm64
          path: ./test-artifacts

      - name: Verify app bundle
        run: |
          if [ -d "./test-artifacts"/*.app ]; then
            echo "App bundle found"
            ls -la ./test-artifacts/*.app
          else
            echo "No app bundle found"
            exit 1
          fi

      - name: Run basic app test
        run: |
          echo "Basic app validation passed"
          # Add more sophisticated tests here
