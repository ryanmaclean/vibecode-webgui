name: Main Branch CI (Lightweight)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: '20.11.0'
  DD_SERVICE: ${{ github.event.repository.name }}
  DD_ENV: ci
  DD_VERSION: ${{ github.sha }}
  DD_TAGS: team:platform,component:ci

jobs:
  quick-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: bash scripts/install-ci.sh

      - name: Lint check
        run: npm run lint || echo "Linting issues found (non-blocking)"

      - name: Type check
        run: npm run type-check || echo "Type issues found (non-blocking)"

      - name: Basic unit tests
        run: npm test -- --testPathPatterns="(auth|security|utils)" --passWithNoTests
        timeout-minutes: 5
        env:
          DD_CI_VISIBILITY_ENABLED: ${{ secrets.DD_API_KEY != '' }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_ENV: ci
          DD_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          DD_GIT_COMMIT_SHA: ${{ github.sha }}
          DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          DD_SERVICE: vibecode-webgui
          DD_SITE: datadoghq.com
          DD_VERSION: ${{ github.sha }}
          NODE_OPTIONS: -r dd-trace/ci/init

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run security audit
        run: npm audit --audit-level moderate || echo "Security issues found (logged)"

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
        continue-on-error: true

  cost-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Log cost optimization
        run: |
          echo "💰 Cost optimization active: Main branch runs lightweight CI only"
          echo "📊 Expected savings: 70-80% reduction in GitHub Actions usage"
          echo "🚀 For full testing, create a release branch: git checkout -b release/v1.0.0"
