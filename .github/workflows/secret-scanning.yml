name: Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base and head commits
        id: commit-range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "No base SHA available (push without before SHA); skipping TruffleHog." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "Base ($BASE_SHA) and head ($HEAD_SHA) are identical; skipping TruffleHog." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Scanning commit range $BASE_SHA..$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: TruffleHog OSS
        if: steps.commit-range.outputs.skip != 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified
