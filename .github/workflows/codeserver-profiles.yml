name: Build Codeserver Profiles

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Codeserver version to build"
        required: true
        type: string
      profiles:
        description: "Comma-separated profiles to build (e.g., default,gpu,cuda)"
        required: false
        default: "default"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: codeserver
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Build selected profiles
        env:
          VERSION: ${{ github.event.inputs.version }}
          PROFILES: ${{ github.event.inputs.profiles || 'default' }}
        run: |
          set -euo pipefail

          IFS=',' read -ra profile_list <<< "$PROFILES"
          for raw_profile in "${profile_list[@]}"; do
            profile="$(echo "$raw_profile" | xargs)"
            [ -z "$profile" ] && continue

            image="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
            unique_tag="${VERSION}-${profile}-${GITHUB_RUN_ID}-${GITHUB_SHA}"
            profile_tag="${VERSION}-${profile}"

            echo "Building profile: ${profile}"

            docker buildx build \
              --file ./Dockerfile.codeserver \
              --build-arg VERSION="${VERSION}" \
              --build-arg PROFILE="${profile}" \
              --tag "${image}:${unique_tag}" \
              --tag "${image}:${profile_tag}" \
              --push \
              .

            syft scan "${image}:${unique_tag}" -o spdx-json --file "sbom-${profile}.json"
            jq empty "sbom-${profile}.json"
          done

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.event.inputs.version || 'manual' }}-${{ github.run_id }}
          path: sbom-*.json
          if-no-files-found: error
          retention-days: 90

  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Codeserver Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ github.event.inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Profiles:** ${{ github.event.inputs.profiles || 'default' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run ID:** ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
