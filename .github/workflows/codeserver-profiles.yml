name: Build code-server multi-profile images

on:
  push:
    paths:
      - '.github/workflows/codeserver-profiles.yml'
      - 'docker/code-server/Dockerfile'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Profiles to build (comma-separated: minimal,standard,ai,web,full or "all")'
        required: true
        default: 'minimal'
      version:
        description: 'Version tag (e.g., 1.1.0)'
        required: true
        default: '1.1.1'
      push_to_dockerhub:
        description: 'Also push to Docker Hub'
        type: boolean
        default: false

env:
  REGISTRY_GHCR: ghcr.io
  REGISTRY_DOCKERHUB: docker.io
  IMAGE_NAME: vibecode-codeserver
  CACHE_SCOPE: codeserver-profiles

concurrency:
  group: codeserver-profiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine profiles to build
        id: matrix
        run: |
          input="${{ github.event.inputs.profiles || 'minimal' }}"
          if [ "$input" = "all" ]; then
            profiles='["minimal","standard","ai","web","full"]'
          else
            # Convert comma-separated to JSON array
            profiles=$(echo "$input" | jq -R -s -c 'split(",") | map(select(length > 0))')
          fi
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
          echo "Building profiles: $profiles"
      
      - name: Set version
        id: version
        run: |
          version="${{ github.event.inputs.version || '1.1.1' }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build-profile:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.prepare.outputs.profiles) }}
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        run: |
          case "${{ matrix.profile }}" in
            minimal)
              echo "tags=ghcr.io/ryanmaclean/vibecode-codeserver:${{ needs.prepare.outputs.version }}-minimal,ghcr.io/ryanmaclean/vibecode-codeserver:minimal" >> "$GITHUB_OUTPUT"
              ;;
            standard)
              echo "tags=ghcr.io/ryanmaclean/vibecode-codeserver:${{ needs.prepare.outputs.version }}-standard,ghcr.io/ryanmaclean/vibecode-codeserver:standard" >> "$GITHUB_OUTPUT"
              ;;
            ai)
              echo "tags=ghcr.io/ryanmaclean/vibecode-codeserver:${{ needs.prepare.outputs.version }}-ai,ghcr.io/ryanmaclean/vibecode-codeserver:ai" >> "$GITHUB_OUTPUT"
              ;;
            web)
              echo "tags=ghcr.io/ryanmaclean/vibecode-codeserver:${{ needs.prepare.outputs.version }}-web,ghcr.io/ryanmaclean/vibecode-codeserver:web" >> "$GITHUB_OUTPUT"
              ;;
            full)
              echo "tags=ghcr.io/ryanmaclean/vibecode-codeserver:${{ needs.prepare.outputs.version }}-full,ghcr.io/ryanmaclean/vibecode-codeserver:full,ghcr.io/ryanmaclean/vibecode-codeserver:${{ needs.prepare.outputs.version }},ghcr.io/ryanmaclean/vibecode-codeserver:latest" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Tags: $tags"

      - name: Build and push ${{ matrix.profile }} profile
        id: build
        uses: docker/build-push-action@v5
        with:
          file: docker/code-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.profile }}
          cache-to: type=gha,scope=${{ env.CACHE_SCOPE }}-${{ matrix.profile }},mode=max
          build-args: |
            PROFILE=${{ matrix.profile }}
            VERSION=${{ needs.prepare.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}

      - name: Verify tools on amd64
        run: |
          tag="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.profile }}"
          docker run --rm --platform linux/amd64 --entrypoint bash "$tag" -c "
            echo '=== Verifying ${{ matrix.profile }} profile (amd64) ===' &&
            vim --version | head -1 &&
            nvim --version | head -1 &&
            aider --version &&
            goose --version 2>&1 | head -1 &&
            echo '✅ All tools verified on amd64'
          "

      - name: Verify tools on arm64
        run: |
          tag="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.profile }}"
          docker run --rm --platform linux/arm64 --entrypoint bash "$tag" -c "
            echo '=== Verifying ${{ matrix.profile }} profile (arm64) ===' &&
            vim --version | head -1 &&
            nvim --version | head -1 &&
            aider --version &&
            goose --version 2>&1 | head -1 &&
            echo '✅ All tools verified on arm64'
          "

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ matrix.profile }}
          format: spdx-json
          output-file: sbom-${{ matrix.profile }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.profile }}-${{ github.run_id }}
          path: sbom-${{ matrix.profile }}.spdx.json

  summary:
    needs: [prepare, build-profile]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          cat <<'MARKDOWN' >> "$GITHUB_STEP_SUMMARY"
          # Code-Server Multi-Profile Build Complete
          
          ## Version: ${{ needs.prepare.outputs.version }}
          
          ## Profiles Built:
          ${{ needs.prepare.outputs.profiles }}
          
          ## Registries:
          - ✅ GitHub Container Registry (GHCR)
          ${{ github.event.inputs.push_to_dockerhub == 'true' && '- ✅ Docker Hub' || '- ⏭️ Docker Hub (skipped)' }}
          
          ## Pull Commands:
          ```bash
          # Pull from GHCR
          docker pull ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-<profile>
          
          # Pull from Docker Hub (if enabled)
          docker pull ${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-<profile>
          ```
          
          ## Test Command:
          ```bash
          docker run -it --rm ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:standard bash
          ```
          MARKDOWN
