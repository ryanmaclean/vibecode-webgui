name: Run Synthetic Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ci-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY || '' }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY || '' }}
      DD_SYNTHETIC_TEST_IDS: ${{ vars.DD_SYNTHETIC_TEST_IDS || '' }}
    steps:
      - name: Validate CI config (Datadog secrets)
        run: |
          MISSING=0
          if [ -z "${DD_API_KEY}" ]; then
            echo "::warning::Missing secret DD_API_KEY; Datadog Synthetic Tests will be skipped."
            MISSING=1
          fi
          if [ -z "${DD_APP_KEY}" ]; then
            echo "::warning::Missing secret DD_APP_KEY; Datadog Synthetic Tests will be skipped."
            MISSING=1
          fi
          if [ -z "${DD_SYNTHETIC_TEST_IDS}" ]; then
            echo "Note: DD_SYNTHETIC_TEST_IDS not set; will fallback to search query."
          fi
          if [ $MISSING -eq 0 ]; then
            echo "All required Datadog secrets present."
          fi

  run-synthetic-tests:
    needs: [validate-ci-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY || '' }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY || '' }}
      DD_SYNTHETIC_TEST_IDS: ${{ vars.DD_SYNTHETIC_TEST_IDS || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Datadog Synthetic Tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        run: |
          set -euo pipefail
          if [ -n "${DD_SYNTHETIC_TEST_IDS}" ]; then
            echo "Running Datadog Synthetic tests by public IDs..."
            npx @datadog/datadog-ci synthetics run-tests \
              --publicIds "${DD_SYNTHETIC_TEST_IDS}" \
              --failOnCriticalErrors
          else
            echo "Running Datadog Synthetic tests by search query..."
            npx @datadog/datadog-ci synthetics run-tests \
              --search "VibeCode Critical User Journey" \
              --failOnCriticalErrors
          fi
        env:
          DATADOG_API_KEY: ${{ env.DD_API_KEY }}
          DATADOG_APP_KEY: ${{ env.DD_APP_KEY }}
          DATADOG_SITE: datadoghq.com
