name: Build minimal profile only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/code-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ryanmaclean/vibecode-codeserver:1.1.1-minimal,ghcr.io/ryanmaclean/vibecode-codeserver:minimal
          build-args: |
            PROFILE=minimal
            VERSION=1.1.1
