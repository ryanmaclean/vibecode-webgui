name: Performance Testing & Monitoring

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run daily performance tests
    - cron: '0 6 * * *'

env:
  NODE_VERSION: '20'

jobs:
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with bundle analyzer
        run: ANALYZE=true npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check bundle budgets
        run: |
          echo "Checking bundle sizes against budgets..."
          # This would parse build output and compare against budget.json
          npm run analyze

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: .next/analyze

      - name: Comment PR with bundle changes
        if: github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_DD_APPLICATION_ID: ${{ secrets.DD_APPLICATION_ID }}
          NEXT_PUBLIC_DD_CLIENT_TOKEN: ${{ secrets.DD_CLIENT_TOKEN }}

      - name: Start server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/monitoring
            http://localhost:3000/marketplace
          uploadArtifacts: true
          temporaryPublicStorage: true

  core-web-vitals:
    name: Core Web Vitals Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Core Web Vitals tests
        run: npx playwright test tests/performance/core-web-vitals.test.ts
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: test-results/

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  performance-regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    needs: [lighthouse-ci, core-web-vitals]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download baseline metrics
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-results
          path: ./current-results

      - name: Compare with baseline
        run: |
          echo "Comparing current performance with baseline..."
          node scripts/compare-performance-metrics.js

      - name: Fail if regression detected
        run: |
          if [ -f "./regression-detected.txt" ]; then
            echo "Performance regression detected!"
            cat ./regression-detected.txt
            exit 1
          fi

  datadog-synthetic:
    name: Datadog Synthetic Monitoring
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Datadog Synthetics
        run: npm run test:performance:synthetic
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}

  performance-summary:
    name: Performance Test Summary
    runs-on: ubuntu-latest
    needs: [bundle-analysis, lighthouse-ci, core-web-vitals]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate performance summary
        run: |
          echo "# Performance Test Summary" > summary.md
          echo "" >> summary.md
          echo "## Bundle Analysis" >> summary.md
          echo "- Initial Bundle: TBD" >> summary.md
          echo "- Route Chunks: TBD" >> summary.md
          echo "" >> summary.md
          echo "## Core Web Vitals" >> summary.md
          echo "- LCP: TBD" >> summary.md
          echo "- FID: TBD" >> summary.md
          echo "- CLS: TBD" >> summary.md
          echo "" >> summary.md
          echo "## Lighthouse Scores" >> summary.md
          echo "- Performance: TBD" >> summary.md
          echo "- Accessibility: TBD" >> summary.md

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const summary = fs.readFileSync('summary.md', 'utf8')
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })
