name: Performance Testing & Monitoring

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run daily performance tests
    - cron: '0 6 * * *'

env:
  NODE_VERSION: '20'

jobs:
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Analyze bundle size
        run: |
          echo "Analyzing Next.js build output..."

          # Create analysis directory
          mkdir -p .next/analyze

          # Extract bundle sizes from build output
          if [ -d ".next/static" ]; then
            echo "Bundle Analysis Report" > .next/analyze/report.txt
            echo "======================" >> .next/analyze/report.txt
            echo "" >> .next/analyze/report.txt

            echo "JavaScript Bundles:" >> .next/analyze/report.txt
            find .next/static/chunks -name "*.js" -type f -exec ls -lh {} \; | awk '{print $9, $5}' >> .next/analyze/report.txt

            echo "" >> .next/analyze/report.txt
            echo "CSS Files:" >> .next/analyze/report.txt
            find .next/static/css -name "*.css" -type f -exec ls -lh {} \; 2>/dev/null | awk '{print $9, $5}' >> .next/analyze/report.txt || echo "No CSS files found" >> .next/analyze/report.txt

            # Calculate total size
            total_size=$(du -sh .next/static | awk '{print $1}')
            echo "" >> .next/analyze/report.txt
            echo "Total Static Size: $total_size" >> .next/analyze/report.txt

            cat .next/analyze/report.txt
          else
            echo "Build output not found"
            exit 1
          fi

      - name: Check bundle budgets
        run: |
          echo "Checking bundle sizes against budgets from budget.json..."

          # Simple budget validation - check if any JS bundle exceeds 500KB
          max_bundle_size=512000  # 500KB in bytes
          oversized_bundles=0

          while IFS= read -r file; do
            size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
            if [ "$size" -gt "$max_bundle_size" ]; then
              echo "WARNING: $file exceeds budget ($size bytes > $max_bundle_size bytes)"
              oversized_bundles=$((oversized_bundles + 1))
            fi
          done < <(find .next/static/chunks -name "*.js" -type f)

          if [ $oversized_bundles -gt 0 ]; then
            echo "Found $oversized_bundles bundle(s) exceeding size budget"
            echo "bundle_budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "All bundles within budget limits"
            echo "bundle_budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis
          path: .next/analyze

      - name: Comment PR with bundle info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = '.next/analyze/report.txt';

            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              const body = `## Bundle Size Analysis\n\n\`\`\`\n${report}\n\`\`\``;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_DD_APPLICATION_ID: ${{ secrets.DD_APPLICATION_ID }}
          NEXT_PUBLIC_DD_CLIENT_TOKEN: ${{ secrets.DD_CLIENT_TOKEN }}

      - name: Start server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/monitoring
            http://localhost:3000/marketplace
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.js'
          runs: 3

      - name: Save Lighthouse results
        if: always()
        run: |
          mkdir -p .lighthouseci
          # treosh/lighthouse-ci-action creates results automatically
          echo "Lighthouse CI completed"

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30

  core-web-vitals:
    name: Core Web Vitals Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Core Web Vitals tests
        run: npx playwright test tests/performance/core-web-vitals.test.ts
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: test-results/
          retention-days: 30

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  performance-regression:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    needs: [lighthouse-ci, core-web-vitals]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download current Lighthouse results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-results
          path: ./current-results

      - name: Download current performance test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: performance-test-results
          path: ./current-perf-results

      - name: Compare with baseline
        run: |
          echo "Comparing current performance with baseline..."

          # Create comparison script inline for now
          cat > compare-metrics.js << 'EOF'
          const fs = require('fs');
          const path = require('path');

          function analyzeResults() {
            console.log('Performance Regression Analysis');
            console.log('================================\n');

            let hasRegression = false;

            // Check if Lighthouse results exist
            const lhResultsPath = './current-results';
            if (fs.existsSync(lhResultsPath)) {
              console.log('Lighthouse results found - basic validation');
              const files = fs.readdirSync(lhResultsPath);
              console.log(`Found ${files.length} result file(s)`);

              // In a real implementation, we'd compare against baseline
              // For now, just validate that results exist
              if (files.length === 0) {
                console.log('WARNING: No Lighthouse result files found');
              }
            } else {
              console.log('No Lighthouse results to analyze');
            }

            // Check if performance test results exist
            const perfResultsPath = './current-perf-results';
            if (fs.existsSync(perfResultsPath)) {
              console.log('\nPerformance test results found');
              try {
                const files = fs.readdirSync(perfResultsPath);
                console.log(`Found ${files.length} performance test file(s)`);
              } catch (e) {
                console.log('Could not read performance results:', e.message);
              }
            } else {
              console.log('\nNo performance test results to analyze');
            }

            console.log('\n================================');
            console.log('Status: Analysis complete');
            console.log('Note: Full baseline comparison requires historical data storage');

            return hasRegression;
          }

          const hasRegression = analyzeResults();

          if (hasRegression) {
            fs.writeFileSync('./regression-detected.txt', 'Performance regression detected');
            process.exit(1);
          }
          EOF

          node compare-metrics.js

      - name: Fail if regression detected
        run: |
          if [ -f "./regression-detected.txt" ]; then
            echo "Performance regression detected!"
            cat ./regression-detected.txt
            exit 1
          fi
          echo "No significant performance regressions detected"

  datadog-synthetic:
    name: Datadog Synthetic Monitoring
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Datadog Synthetics
        run: npm run test:performance:synthetic
        continue-on-error: true
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_APP_KEY: ${{ secrets.DATADOG_APP_KEY }}

  performance-summary:
    name: Performance Test Summary
    runs-on: ubuntu-latest
    needs: [bundle-analysis, lighthouse-ci, core-web-vitals]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle analysis
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bundle-analysis
          path: ./artifacts/bundle-analysis

      - name: Download Lighthouse results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-results
          path: ./artifacts/lighthouse-results

      - name: Download performance test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: performance-test-results
          path: ./artifacts/performance-test-results

      - name: Generate performance summary
        run: |
          cat > summary.md << 'EOF'
          # Performance Test Summary

          ## Bundle Analysis
          EOF

          if [ -f "./artifacts/bundle-analysis/report.txt" ]; then
            echo '```' >> summary.md
            cat ./artifacts/bundle-analysis/report.txt >> summary.md
            echo '```' >> summary.md
          else
            echo "- Bundle analysis not available" >> summary.md
          fi

          cat >> summary.md << 'EOF'

          ## Lighthouse CI
          EOF

          if [ -d "./artifacts/lighthouse-results" ]; then
            echo "- Lighthouse results collected" >> summary.md
            ls -la ./artifacts/lighthouse-results >> summary.md 2>/dev/null || echo "- Could not list results" >> summary.md
          else
            echo "- Lighthouse results not available" >> summary.md
          fi

          cat >> summary.md << 'EOF'

          ## Core Web Vitals
          EOF

          if [ -d "./artifacts/performance-test-results" ]; then
            echo "- Performance test results collected" >> summary.md
            ls -la ./artifacts/performance-test-results >> summary.md 2>/dev/null || echo "- Could not list results" >> summary.md
          else
            echo "- Performance test results not available" >> summary.md
          fi

          cat >> summary.md << 'EOF'

          ---
          *Note: Detailed metrics available in artifacts*
          EOF

          cat summary.md

      - name: Comment PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')

            if (!fs.existsSync('summary.md')) {
              console.log('Summary file not found');
              return;
            }

            const summary = fs.readFileSync('summary.md', 'utf8')

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            })
