name: Security - Tool Verification

on:
  pull_request:
    paths:
      - 'docker/code-server/Dockerfile'
      - 'scripts/verify-tool-download.sh'
      - 'tests/security/**'
      - '.github/workflows/security-tool-verification.yml'
  push:
    branches:
      - main
    paths:
      - 'docker/code-server/Dockerfile'
      - 'scripts/verify-tool-download.sh'
      - 'tests/security/**'
  workflow_dispatch:

jobs:
  verify-tool-configuration:
    name: Verify Tool Download Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run verification tests
        run: |
          echo "🔒 Running security verification tests..."
          make test-security

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/code-server/Dockerfile
          failure-threshold: error

      - name: Check for TODOs removed
        run: |
          echo "🔍 Checking that security TODOs were properly addressed..."
          
          # Count remaining hardening TODOs
          TODO_COUNT=$(grep -c "TODO(sec-hardening-" docker/code-server/Dockerfile || true)
          
          echo "Found ${TODO_COUNT} security hardening TODOs remaining"
          
          # Fail if there are any unaddressed security TODOs in the modified sections
          if grep -q "TODO(sec-hardening-kubectl)" docker/code-server/Dockerfile; then
            echo "❌ kubectl hardening TODO still present"
            exit 1
          fi
          
          if grep -q "TODO(sec-hardening-helm)" docker/code-server/Dockerfile; then
            echo "❌ helm hardening TODO still present"
            exit 1
          fi
          
          if grep -q "TODO(sec-hardening-kubectx)" docker/code-server/Dockerfile; then
            echo "❌ kubectx hardening TODO still present"
            exit 1
          fi
          
          if grep -q "TODO(sec-hardening-kubens)" docker/code-server/Dockerfile; then
            echo "❌ kubens hardening TODO still present"
            exit 1
          fi
          
          echo "✅ All security hardening TODOs have been addressed"

      - name: Summary
        if: always()
        run: |
          echo "## Security Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tool download verification tests passed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Checksum validation configured correctly" >> $GITHUB_STEP_SUMMARY
          echo "✅ Using pinned versions for all tools" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verified Tools" >> $GITHUB_STEP_SUMMARY
          echo "- kubectl: SHA256 checksum verification" >> $GITHUB_STEP_SUMMARY
          echo "- helm: SHA256 checksum verification" >> $GITHUB_STEP_SUMMARY
          echo "- kubectx: Tagged release v0.9.5" >> $GITHUB_STEP_SUMMARY
          echo "- kubens: Tagged release v0.9.5" >> $GITHUB_STEP_SUMMARY

  test-dockerfile-build:
    name: Test Dockerfile Build
    runs-on: ubuntu-latest
    # Only run on main branch or when explicitly triggered to save CI resources
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test (amd64 only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/code-server/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: vibecode-codeserver:test

      - name: Summary
        if: always()
        run: |
          echo "## Docker Build Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dockerfile builds successfully with verification enabled" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tool downloads and checksums validated" >> $GITHUB_STEP_SUMMARY
