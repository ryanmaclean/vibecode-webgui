name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'content/wiki/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'content/wiki/**'
      - '.github/workflows/deploy-docs.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      docs_system:
        description: 'Which documentation system to deploy'
        required: true
        default: 'astro'
        type: choice
        options:
          - astro
          - nextjs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      docs_system: ${{ steps.detect.outputs.docs_system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # --- Astro Build Steps ---
      - name: Detect docs system
        id: detect
        run: |
          system='${{ github.event.inputs.docs_system || '' }}'
          if [ -z "$system" ]; then
            if [ -f docs/package.json ]; then
              system='astro'
            else
              system='nextjs'
            fi
          fi
          echo "docs_system=$system" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for Astro
        if: steps.detect.outputs.docs_system == 'astro'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './docs/package-lock.json'

      - name: Install Astro dependencies
        if: steps.detect.outputs.docs_system == 'astro'
        run: npm ci
        working-directory: ./docs

      - name: Build Astro site
        if: steps.detect.outputs.docs_system == 'astro'
        run: npm run build
        working-directory: ./docs

      - name: Upload Astro artifact
        if: steps.detect.outputs.docs_system == 'astro'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/dist

      # --- Next.js Build Steps ---
      - name: Setup Node.js for Next.js
        if: steps.detect.outputs.docs_system == 'nextjs'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Next.js dependencies
        if: steps.detect.outputs.docs_system == 'nextjs'
        run: npm ci

      - name: Build Next.js site
        if: steps.detect.outputs.docs_system == 'nextjs'
        run: npm run build

      - name: Upload Next.js artifact
        if: steps.detect.outputs.docs_system == 'nextjs'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
