name: Deploy Documentation to GitHub Pages

# NOTE: This workflow requires GitHub Pages to be enabled in repository settings:
# Settings > Pages > Build and deployment > Source = GitHub Actions

on:
  push:
    branches: [main]
    # Always build docs on main branch pushes to keep them up to date
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'content/wiki/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
    inputs:
      docs_system:
        description: 'Which documentation system to deploy'
        required: true
        default: 'astro'
        type: choice
        options:
          - astro
          - nextjs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Datadog CI
        uses: datadog/agent-github-action@v1
        # Note: Skipped gracefully if DD_API_KEY not configured
        continue-on-error: true
        with:
          api_key: ${{ secrets.DD_API_KEY }}

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        # Note: Pages must be enabled manually in repository settings
        # Settings > Pages > Build and deployment > Source = GitHub Actions

      # --- Astro Build Steps ---
      - name: Setup Node.js for Astro
        if: ${{ github.event_name == 'push' || github.event.inputs.docs_system == 'astro' }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Install Astro dependencies
        if: ${{ github.event_name == 'push' || github.event.inputs.docs_system == 'astro' }}
        run: bash scripts/install-ci.sh --prefix docs

      - name: Build Astro site
        if: ${{ github.event_name == 'push' || github.event.inputs.docs_system == 'astro' }}
        run: npm run build
        working-directory: docs
        env:
          NODE_ENV: production

      - name: Upload Astro artifact
        if: ${{ github.event_name == 'push' || github.event.inputs.docs_system == 'astro' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      # --- Next.js Build Steps ---
      - name: Setup Node.js for Next.js
        if: ${{ github.event.inputs.docs_system == 'nextjs' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Next.js dependencies
        if: ${{ github.event.inputs.docs_system == 'nextjs' }}
        run: bash scripts/install-ci.sh

      - name: Build Next.js site
        if: ${{ github.event.inputs.docs_system == 'nextjs' }}
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Next.js artifact
        if: ${{ github.event.inputs.docs_system == 'nextjs' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .next/standalone

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
