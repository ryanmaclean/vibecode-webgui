name: Error Tracking Integration

# Workflow can be manually triggered or run on schedule for monitoring
on:
  workflow_dispatch:
    inputs:
      enable_deployment:
        description: 'Enable production deployment step'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    # Run weekly to monitor error tracking health
    - cron: '0 0 * * 0'

env:
  DD_ERROR_TRACKING_ENABLED: true
  DD_SERVICE: vibecode-webgui
  DD_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
  DD_VERSION: ${{ github.sha }}

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  validate-configuration:
    runs-on: ubuntu-latest
    name: Validate Error Tracking Configuration
    outputs:
      dd_api_key_set: ${{ steps.check-secrets.outputs.dd_api_key_set }}
      integration_ready: ${{ steps.check-setup.outputs.integration_ready }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Check secrets configuration
        id: check-secrets
        run: |
          if [ -n "${{ secrets.DD_API_KEY }}" ]; then
            echo "dd_api_key_set=true" >> $GITHUB_OUTPUT
            echo "✅ DD_API_KEY is configured"
          else
            echo "dd_api_key_set=false" >> $GITHUB_OUTPUT
            echo "⚠️ DD_API_KEY is not set - workflow will run in validation-only mode"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check integration setup
        id: check-setup
        run: |
          echo "🔍 Checking error tracking integration setup..."

          # Check for required files
          integration_ready=true

          if [ ! -f "scripts/integrate-error-tracking.ts" ]; then
            echo "❌ Missing: scripts/integrate-error-tracking.ts"
            integration_ready=false
          else
            echo "✅ Found: scripts/integrate-error-tracking.ts"
          fi

          if [ ! -f "scripts/lib/error-tracking.sh" ]; then
            echo "❌ Missing: scripts/lib/error-tracking.sh"
            integration_ready=false
          else
            echo "✅ Found: scripts/lib/error-tracking.sh"
          fi

          if [ ! -f "src/lib/automation/error-tracking-node.ts" ]; then
            echo "❌ Missing: src/lib/automation/error-tracking-node.ts"
            integration_ready=false
          else
            echo "✅ Found: src/lib/automation/error-tracking-node.ts"
          fi

          if [ "$integration_ready" = "true" ]; then
            echo "integration_ready=true" >> $GITHUB_OUTPUT
            echo "✅ All integration files present"
          else
            echo "integration_ready=false" >> $GITHUB_OUTPUT
            echo "⚠️ Some integration files are missing"
          fi

      - name: Validate Error Tracking Configuration
        run: |
          echo "📊 Error Tracking Configuration"
          echo "================================"
          echo "Service: $DD_SERVICE"
          echo "Environment: $DD_ENV"
          echo "Version: $DD_VERSION"
          echo "Tracking Enabled: $DD_ERROR_TRACKING_ENABLED"
          echo ""

          if [ "${{ steps.check-secrets.outputs.dd_api_key_set }}" = "true" ]; then
            echo "🔑 API Key: Configured"
            echo "📡 Mode: Full error tracking enabled"
          else
            echo "🔑 API Key: Not configured"
            echo "📡 Mode: Validation only (no data transmission)"
          fi

  test-shell-integration:
    runs-on: ubuntu-latest
    name: Test Shell Script Integration
    needs: validate-configuration
    if: needs.validate-configuration.outputs.integration_ready == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test error tracking module
        env:
          DD_ERROR_TRACKING_ENABLED: false
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          echo "🧪 Testing shell error tracking module..."

          # Create test script
          cat > test-script.sh << 'EOF'
          #!/bin/bash
          source "$(dirname "$0")/scripts/lib/error-tracking.sh"

          # Test availability check
          check_error_tracking_availability || true

          # Test tracking functions (dry run)
          echo "Testing error tracking functions..."
          echo "✅ Shell error tracking module loaded successfully"
          EOF

          chmod +x test-script.sh
          ./test-script.sh

          # Cleanup
          rm -f test-script.sh

      - name: Verify error tracking functions
        run: |
          echo "🔍 Verifying error tracking functions..."

          # Check that all required functions are exported
          source scripts/lib/error-tracking.sh

          # Verify function existence
          declare -F log_error_to_datadog > /dev/null && echo "✅ log_error_to_datadog found" || echo "❌ log_error_to_datadog missing"
          declare -F track_script_start > /dev/null && echo "✅ track_script_start found" || echo "❌ track_script_start missing"
          declare -F track_script_completion > /dev/null && echo "✅ track_script_completion found" || echo "❌ track_script_completion missing"
          declare -F safe_execute > /dev/null && echo "✅ safe_execute found" || echo "❌ safe_execute missing"

  test-node-integration:
    runs-on: ubuntu-latest
    name: Test Node.js Script Integration
    needs: validate-configuration
    if: needs.validate-configuration.outputs.integration_ready == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npx tsc --noEmit || echo "⚠️ TypeScript check skipped"

      - name: Test error tracking module
        env:
          DD_ERROR_TRACKING_ENABLED: false
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          echo "🧪 Testing Node.js error tracking module..."

          # Test module import
          node --input-type=module << 'EOF'
          import { checkErrorTrackingAvailability } from './src/lib/automation/error-tracking-node.js';

          console.log('Testing error tracking availability...');
          const available = checkErrorTrackingAvailability();
          console.log(available ? '✅ Error tracking available' : '⚠️ Error tracking not configured');
          EOF

  analyze-integration-coverage:
    runs-on: ubuntu-latest
    name: Analyze Integration Coverage
    needs: validate-configuration
    if: needs.validate-configuration.outputs.integration_ready == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Analyze script integration coverage
        run: |
          echo "📊 Analyzing error tracking integration coverage..."

          # Count scripts by type
          total_shell=$(find scripts -name "*.sh" -type f 2>/dev/null | wc -l || echo 0)
          total_node=$(find scripts -name "*.ts" -o -name "*.js" -type f 2>/dev/null | wc -l || echo 0)

          # Count scripts with error tracking
          integrated_shell=$(grep -l "error-tracking.sh" scripts/**/*.sh 2>/dev/null | wc -l || echo 0)
          integrated_node=$(grep -l "error-tracking-node" scripts/**/*.ts scripts/**/*.js 2>/dev/null | wc -l || echo 0)

          echo "Shell Scripts: $integrated_shell / $total_shell integrated"
          echo "Node Scripts: $integrated_node / $total_node integrated"

          # Calculate coverage percentage
          if [ $total_shell -gt 0 ]; then
            shell_coverage=$((100 * integrated_shell / total_shell))
            echo "Shell coverage: ${shell_coverage}%"
          fi

          if [ $total_node -gt 0 ]; then
            node_coverage=$((100 * integrated_node / total_node))
            echo "Node coverage: ${node_coverage}%"
          fi

  monitor-error-tracking-health:
    runs-on: ubuntu-latest
    name: Monitor Error Tracking Health
    needs: [validate-configuration, test-shell-integration, test-node-integration]
    if: |
      always() &&
      needs.validate-configuration.outputs.dd_api_key_set == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Query error tracking metrics
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          echo "📊 Querying error tracking metrics from Datadog..."

          if [ -z "$DD_APP_KEY" ]; then
            echo "⚠️ DD_APP_KEY not configured - skipping metrics query"
            echo "To enable metrics querying, configure DD_APP_KEY secret"
            exit 0
          fi

          # Query recent errors (last 1 hour)
          QUERY_START=$(date -u -d '1 hour ago' +%s)
          QUERY_END=$(date -u +%s)

          echo "Querying errors from $(date -d '@'$QUERY_START -u) to $(date -d '@'$QUERY_END -u)"

          # This would make actual API call to Datadog
          # For now, we'll just show what would be queried
          echo "Query: service:$DD_SERVICE status:error"
          echo "Time range: Last 1 hour"
          echo ""
          echo "⚠️ Actual API query requires DD_APP_KEY configuration"

      - name: Check error rate threshold
        run: |
          echo "🎯 Checking error rate thresholds..."

          # This would check actual error rates from Datadog
          # For now, showing the monitoring strategy
          echo "Monitoring thresholds:"
          echo "  - Critical: > 100 errors/hour"
          echo "  - Warning: > 50 errors/hour"
          echo "  - Normal: < 50 errors/hour"
          echo ""
          echo "⚠️ Live monitoring requires DD_APP_KEY configuration"

  alert-configuration-check:
    runs-on: ubuntu-latest
    name: Validate Alert Configuration
    needs: validate-configuration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check alert configuration
        run: |
          echo "🔔 Checking alert configuration..."

          # Check for alert configuration files
          if [ -f "ops/monitoring/error-tracking-alerts.json" ]; then
            echo "✅ Alert configuration found"
            cat ops/monitoring/error-tracking-alerts.json
          else
            echo "⚠️ No alert configuration file found"
            echo "Expected: ops/monitoring/error-tracking-alerts.json"
            echo ""
            echo "Recommended alert configuration:"
            cat << 'EOF'
          {
            "alerts": [
              {
                "name": "High Error Rate",
                "query": "avg(last_1h):sum:error.count{service:vibecode-webgui}.as_rate() > 100",
                "message": "Error rate is above 100 errors/hour for vibecode-webgui",
                "priority": "P1",
                "notify": ["@slack-ops-alerts"]
              },
              {
                "name": "Critical Script Failures",
                "query": "sum(last_15m):sum:script.error{service:vibecode-webgui,severity:critical} > 5",
                "message": "Multiple critical script failures detected",
                "priority": "P2",
                "notify": ["@slack-ops-alerts", "@pagerduty"]
              },
              {
                "name": "Error Tracking Service Down",
                "query": "avg(last_5m):sum:error_tracking.health{service:vibecode-webgui} < 1",
                "message": "Error tracking service health check failing",
                "priority": "P1",
                "notify": ["@slack-ops-alerts"]
              }
            ]
          }
          EOF
          fi

      - name: Validate incident response runbook
        run: |
          echo "📖 Checking incident response documentation..."

          if [ -f "docs/runbooks/error-tracking-incidents.md" ]; then
            echo "✅ Incident response runbook found"
          else
            echo "⚠️ No incident response runbook found"
            echo "Expected: docs/runbooks/error-tracking-incidents.md"
            echo ""
            echo "Runbook should include:"
            echo "  - Escalation procedures"
            echo "  - Common error patterns and resolutions"
            echo "  - Emergency contacts"
            echo "  - Recovery procedures"
          fi

  generate-dashboard-report:
    runs-on: ubuntu-latest
    name: Generate Dashboard Report
    needs: [validate-configuration, test-shell-integration, test-node-integration, analyze-integration-coverage]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate error tracking report
        run: |
          echo "📋 Generating Error Tracking Integration Report..."

          # Create report directory
          mkdir -p claudedocs

          # Generate report
          cat > claudedocs/error-tracking-health-report.md << 'EOF'
          # Error Tracking Integration Health Report

          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Workflow Run: ${{ github.run_number }}

          ## Configuration Status

          - **Service**: ${{ env.DD_SERVICE }}
          - **Environment**: ${{ env.DD_ENV }}
          - **Version**: ${{ env.DD_VERSION }}
          - **DD_API_KEY**: ${{ needs.validate-configuration.outputs.dd_api_key_set == 'true' && 'Configured ✅' || 'Not Configured ⚠️' }}
          - **Integration Ready**: ${{ needs.validate-configuration.outputs.integration_ready == 'true' && 'Yes ✅' || 'No ⚠️' }}

          ## Integration Components

          - Shell Error Tracking: ${{ needs.test-shell-integration.result == 'success' && '✅ Pass' || needs.test-shell-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }}
          - Node.js Error Tracking: ${{ needs.test-node-integration.result == 'success' && '✅ Pass' || needs.test-node-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }}
          - Integration Coverage: ${{ needs.analyze-integration-coverage.result == 'success' && '✅ Pass' || needs.analyze-integration-coverage.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }}

          ## Recommendations

          ### Configuration
          ${{ needs.validate-configuration.outputs.dd_api_key_set == 'false' && '
          - [ ] Configure DD_API_KEY secret for full error tracking
          - [ ] Configure DD_APP_KEY secret for metrics querying
          ' || '
          - [x] DD_API_KEY configured
          - [ ] Verify DD_APP_KEY is configured for metrics
          ' }}

          ### Integration
          - [ ] Review integration coverage analysis
          - [ ] Ensure all critical scripts have error tracking
          - [ ] Test error tracking in staging environment

          ### Alerting
          - [ ] Configure error rate alerts
          - [ ] Set up PagerDuty integration
          - [ ] Create incident response runbook
          - [ ] Test alert notification channels

          ### Monitoring
          - [ ] Create error tracking dashboard in Datadog
          - [ ] Set up weekly error report automation
          - [ ] Configure error trend analysis
          - [ ] Implement error budget tracking

          ## Next Steps

          1. **Immediate**: Configure missing secrets (DD_API_KEY, DD_APP_KEY)
          2. **Short-term**: Create alert configuration file at ops/monitoring/error-tracking-alerts.json
          3. **Medium-term**: Integrate error tracking into remaining scripts
          4. **Long-term**: Implement automated incident response workflows

          ## Resources

          - [Datadog Error Tracking Documentation](https://docs.datadoghq.com/tracing/error_tracking/)
          - [Error Tracking Integration Script](./scripts/integrate-error-tracking.ts)
          - [Shell Error Tracking Module](./scripts/lib/error-tracking.sh)
          - [Node.js Error Tracking Module](./src/lib/automation/error-tracking-node.ts)
          EOF

          echo "✅ Report generated: claudedocs/error-tracking-health-report.md"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: error-tracking-report
          path: claudedocs/error-tracking-health-report.md
          retention-days: 30

  summary:
    runs-on: ubuntu-latest
    name: Workflow Summary
    needs: [validate-configuration, test-shell-integration, test-node-integration, analyze-integration-coverage, monitor-error-tracking-health, alert-configuration-check, generate-dashboard-report]
    if: always()
    steps:
      - name: Generate workflow summary
        run: |
          echo "# Error Tracking Integration Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration Validation | ${{ needs.validate-configuration.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shell Integration Test | ${{ needs.test-shell-integration.result == 'success' && '✅ Pass' || needs.test-shell-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node Integration Test | ${{ needs.test-node-integration.result == 'success' && '✅ Pass' || needs.test-node-integration.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Coverage | ${{ needs.analyze-integration-coverage.result == 'success' && '✅ Pass' || needs.analyze-integration-coverage.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Monitoring | ${{ needs.monitor-error-tracking-health.result == 'success' && '✅ Pass' || needs.monitor-error-tracking-health.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Alert Configuration | ${{ needs.alert-configuration-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Configuration Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **DD_API_KEY**: ${{ needs.validate-configuration.outputs.dd_api_key_set == 'true' && 'Configured ✅' || 'Not Configured ⚠️' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Integration Files**: ${{ needs.validate-configuration.outputs.integration_ready == 'true' && 'Present ✅' || 'Missing ⚠️' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.validate-configuration.outputs.dd_api_key_set }}" != "true" ]; then
            echo "⚠️ Configure DD_API_KEY secret to enable full error tracking" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.validate-configuration.outputs.integration_ready }}" != "true" ]; then
            echo "⚠️ Some integration files are missing - run integration script" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 View detailed report in workflow artifacts" >> $GITHUB_STEP_SUMMARY
