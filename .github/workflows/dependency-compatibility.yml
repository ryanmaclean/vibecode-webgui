name: Dependency Compatibility Testing

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

# Explicit permissions following principle of least privilege
permissions:
  contents: read
  issues: write
  pull-requests: read

# Resource limits to prevent CI exhaustion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies with clean cache
        run: |
          npm ci --cache .npm --prefer-offline
        timeout-minutes: 10

      - name: Check for dependency conflicts
        run: |
          echo "🔍 Checking for dependency conflicts..."
          if ! npm ls --depth=0; then
            echo "❌ Dependency conflicts detected"
            exit 1
          fi
          echo "✅ No dependency conflicts"
        timeout-minutes: 5

      - name: Audit dependencies for security vulnerabilities
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level=high --omit=dev || {
            echo "⚠️ High or critical vulnerabilities found in production dependencies"
            exit 1
          }
        timeout-minutes: 5

      - name: Check for outdated dependencies
        run: |
          echo "📦 Checking for outdated dependencies..."
          npx npm-check-updates@16.14.20 --target minor --format group
        timeout-minutes: 5

      - name: Validate peer dependencies
        run: |
          echo "🔗 Validating peer dependencies..."
          if npm ls --depth=1 2>&1 | grep -E "(UNMET|missing|invalid)"; then
            echo "❌ Peer dependency issues detected"
            exit 1
          fi
          echo "✅ All peer dependencies satisfied"
        timeout-minutes: 5

      - name: Test build with current dependencies
        run: |
          echo "🏗️  Testing build compatibility..."
          npm run build
        timeout-minutes: 10

      - name: Run dependency-specific tests
        run: |
          echo "🧪 Running dependency compatibility tests..."
          npm run test:unit -- --testNamePattern="dependency|import|require" --passWithNoTests
        timeout-minutes: 10

      - name: Check TypeScript compatibility
        run: |
          echo "📝 Checking TypeScript compatibility..."
          npm run type-check
        timeout-minutes: 5

      - name: Generate dependency report
        if: always()
        run: |
          echo "📊 Generating dependency report..."
          mkdir -p reports
          npm ls --json > reports/dependency-tree.json || echo "{}" > reports/dependency-tree.json
          npm audit --json > reports/security-audit.json || echo "{}" > reports/security-audit.json
          npx npm-check-updates@16.14.20 --format json > reports/outdated-deps.json || echo "{}" > reports/outdated-deps.json
        timeout-minutes: 5

      - name: Upload dependency reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports-node-${{ matrix.node-version }}
          path: reports/
          retention-days: 14

  dependency-update-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Install npm-check-updates with pinned version
        run: npm install -g npm-check-updates@16.14.20
        timeout-minutes: 5

      - name: Run security audit before update check
        id: pre-audit
        run: |
          echo "🔒 Running pre-update security audit..."
          npm audit --json > pre-audit.json || true

          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' pre-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' pre-audit.json)

          echo "critical_vulns=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high_vulns=$HIGH" >> $GITHUB_OUTPUT

          if [ "$CRITICAL" -gt 0 ]; then
            echo "⚠️ Critical vulnerabilities detected: $CRITICAL"
          fi
        timeout-minutes: 5

      - name: Check for safe updates
        id: check-updates
        run: |
          echo "🔍 Checking for safe dependency updates..."

          # Check for patch updates (safe)
          PATCH_UPDATES=$(ncu --target patch --format json | jq -r 'keys[]' | wc -l)

          # Check for minor updates (usually safe)
          MINOR_UPDATES=$(ncu --target minor --format json | jq -r 'keys[]' | wc -l)

          # Check for major updates (potentially breaking)
          MAJOR_UPDATES=$(ncu --target major --format json | jq -r 'keys[]' | wc -l)

          echo "patch_updates=$PATCH_UPDATES" >> $GITHUB_OUTPUT
          echo "minor_updates=$MINOR_UPDATES" >> $GITHUB_OUTPUT
          echo "major_updates=$MAJOR_UPDATES" >> $GITHUB_OUTPUT

          if [ "$PATCH_UPDATES" -gt 0 ] || [ "$MINOR_UPDATES" -gt 0 ]; then
            echo "updates_available=true" >> $GITHUB_OUTPUT
          else
            echo "updates_available=false" >> $GITHUB_OUTPUT
          fi
        timeout-minutes: 5

      - name: Verify update security
        if: steps.check-updates.outputs.updates_available == 'true'
        run: |
          echo "🔍 Verifying security of proposed updates..."

          # Apply updates to temporary package.json
          cp package.json package.json.backup
          ncu --target patch -u
          ncu --target minor -u

          # Run audit on proposed updates
          npm install --package-lock-only
          npm audit --json > post-audit.json || true

          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' post-audit.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' post-audit.json)

          # Restore original package.json
          mv package.json.backup package.json

          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Proposed updates introduce critical vulnerabilities"
            exit 1
          fi

          echo "✅ Proposed updates pass security validation"
        timeout-minutes: 10

      - name: Create dependency update issue
        if: steps.check-updates.outputs.updates_available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            // Get detailed update information
            const patchUpdates = execSync('ncu --target patch --format json', { encoding: 'utf8' });
            const minorUpdates = execSync('ncu --target minor --format json', { encoding: 'utf8' });
            const majorUpdates = execSync('ncu --target major --format json', { encoding: 'utf8' });

            const patch = JSON.parse(patchUpdates || '{}');
            const minor = JSON.parse(minorUpdates || '{}');
            const major = JSON.parse(majorUpdates || '{}');

            // Load security audit results
            let securityNote = '';
            try {
              const preAudit = JSON.parse(fs.readFileSync('pre-audit.json', 'utf8'));
              const critical = preAudit.metadata?.vulnerabilities?.critical || 0;
              const high = preAudit.metadata?.vulnerabilities?.high || 0;

              if (critical > 0 || high > 0) {
                securityNote = `\n### 🚨 Security Alert\n\n`;
                securityNote += `Current vulnerabilities detected:\n`;
                if (critical > 0) securityNote += `- **Critical**: ${critical}\n`;
                if (high > 0) securityNote += `- **High**: ${high}\n`;
                securityNote += `\n**Action Required**: Review and update vulnerable packages immediately.\n\n`;
              }
            } catch (e) {
              console.log('Could not load security audit results');
            }

            let body = `## 📦 Dependency Update Report\n\n`;
            body += `**Generated:** ${new Date().toISOString()}\n`;
            body += `**Security Validated:** ✅ All proposed updates passed security audit\n\n`;

            if (securityNote) {
              body += securityNote;
            }

            if (Object.keys(patch).length > 0) {
              body += `### 🟢 Patch Updates (Safe)\n\n`;
              Object.entries(patch).forEach(([pkg, version]) => {
                body += `- \`${pkg}\`: ${version}\n`;
              });
              body += `\n`;
            }

            if (Object.keys(minor).length > 0) {
              body += `### 🟡 Minor Updates (Usually Safe)\n\n`;
              Object.entries(minor).forEach(([pkg, version]) => {
                body += `- \`${pkg}\`: ${version}\n`;
              });
              body += `\n`;
            }

            if (Object.keys(major).length > 0) {
              body += `### 🔴 Major Updates (Review Required)\n\n`;
              Object.entries(major).forEach(([pkg, version]) => {
                body += `- \`${pkg}\`: ${version}\n`;
              });
              body += `\n`;
            }

            body += `### 🔧 Recommended Actions\n\n`;
            body += `1. **Patch Updates**: Can be applied immediately\n`;
            body += `2. **Minor Updates**: Review changelog, test thoroughly\n`;
            body += `3. **Major Updates**: Requires careful review and testing\n\n`;
            body += `### 🚀 Next Steps\n\n`;
            body += `Run the following commands to apply safe updates:\n\n`;
            body += `\`\`\`bash\n`;
            body += `# Apply patch updates\n`;
            body += `ncu --target patch -u\n`;
            body += `npm install\n\n`;
            body += `# Run security audit\n`;
            body += `npm audit\n\n`;
            body += `# Test the application\n`;
            body += `npm run test\n`;
            body += `npm run build\n`;
            body += `\`\`\`\n\n`;
            body += `> **Note**: This issue was automatically generated by the dependency compatibility workflow.`;

            // Check if an issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['dependencies', 'automated'],
              state: 'open'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes('Dependency Updates Available')
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📦 Dependency Updates Available',
                body: body,
                labels: ['dependencies', 'automated', 'enhancement']
              });
              console.log(`Created new issue #${issue.data.number}`);
            }
        timeout-minutes: 5

  validate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
        timeout-minutes: 5

      - name: Validate package-lock.json
        run: |
          echo "🔒 Validating package-lock.json integrity..."

          # Check if package-lock.json is in sync with package.json
          if ! npm ci --dry-run; then
            echo "❌ package-lock.json is out of sync with package.json"
            exit 1
          fi

          # Verify lockfile format version
          LOCKFILE_VERSION=$(jq -r '.lockfileVersion' package-lock.json)
          echo "Lockfile version: $LOCKFILE_VERSION"

          if [ "$LOCKFILE_VERSION" != "3" ]; then
            echo "⚠️  Warning: Lockfile version is not 3. Consider updating npm."
          fi

          echo "✅ Lockfile validation passed"
        timeout-minutes: 5

      - name: Check for phantom dependencies
        run: |
          echo "👻 Checking for phantom dependencies..."

          # Install only production dependencies
          npm ci --omit=dev --omit=optional

          # Try to build (this will fail if there are phantom deps)
          if ! npm run build; then
            echo "❌ Build failed - possible phantom dependencies detected"
            echo "Phantom dependencies are packages used in code but not declared in package.json"
            exit 1
          fi

          echo "✅ No phantom dependencies detected"
        timeout-minutes: 10
