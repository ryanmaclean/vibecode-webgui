name: Documentation Automation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json' 
      - 'docs/**'
      - '**/*.md'
  schedule:
    # Run weekly to check for outdated documentation
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate documentation
        run: npm run docs:validate

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress --exclude-loopback --exclude-private --exclude-mail --max-concurrency 5 --timeout 10 --exclude-path "node_modules|dist|.git" "docs/**/*.md" "*.md"
          fail: true

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-report
          path: docs/VALIDATION_REPORT.md

  update-docs:
    name: Update Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate API documentation
        run: npx tsx scripts/generate-api-docs.ts

      - name: Update README
        run: npx tsx scripts/auto-update-readme.ts

      - name: Validate updated documentation
        run: npm run docs:validate

      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git status --porcelain
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit documentation updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ README.md
          git commit -m "docs: auto-update documentation

          🤖 Generated with [GitHub Actions](https://github.com/features/actions)
          
          - Updated API documentation from code analysis
          - Refreshed README.md with current project structure
          - Validated all documentation links and examples
          
          Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push

  check-examples:
    name: Validate Code Examples
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Extract and validate TypeScript examples
        run: |
          # Extract TypeScript code blocks from documentation
          find docs -name "*.md" -type f -exec grep -l "^\`\`\`typescript" {} \; 2>/dev/null | while read file; do
            echo "Validating TypeScript examples in $file"

            # Extract code blocks and create temporary files for validation
            awk '/^```typescript/{flag=1; next} /^```$/{flag=0} flag' "$file" > temp_example.ts

            if [ -s temp_example.ts ]; then
              # Basic TypeScript syntax check with minimal configuration
              echo '{"compilerOptions": {"target": "ES2020", "module": "commonjs", "strict": false, "skipLibCheck": true, "noEmit": true}}' > temp_tsconfig.json
              npx tsc --project temp_tsconfig.json temp_example.ts 2>&1 | head -20 || echo "⚠️ Warning: TypeScript errors in $file"
              rm -f temp_tsconfig.json
            else
              echo "No TypeScript code found in $file"
            fi

            rm -f temp_example.ts
          done

      - name: Validate npm scripts in documentation
        run: |
          # Extract npm run commands from documentation and verify they exist
          echo "Checking npm scripts referenced in documentation..."

          # Get all documented npm scripts
          find . -maxdepth 1 -name "*.md" -o -path "./docs/*.md" | xargs grep -oh "npm run [a-zA-Z0-9:_-]*" 2>/dev/null | \
          sort -u | while read cmd; do
            script_name=$(echo "$cmd" | sed 's/npm run //')
            if ! npm run 2>&1 | grep -q "  $script_name$"; then
              echo "⚠️ Warning: Script '$script_name' not found in package.json"
            else
              echo "✅ Script '$script_name' exists"
            fi
          done

  security-scan:
    name: Security Scan Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for sensitive information
        run: |
          # Check for potential secrets or sensitive data in documentation
          echo "Scanning for sensitive information..."
          
          # Check for API keys, passwords, or tokens in documentation
          if grep -r -i -E "(api[_-]?key|password|secret|token).*[:=]\s*['\"][^'\"]{10,}" docs/ README.md; then
            echo "❌ Potential sensitive information found in documentation"
            exit 1
          fi
          
          # Check for hardcoded URLs that might expose internal systems
          if grep -r -E "http://[^/]*\.(local|internal|corp|dev):" docs/ README.md; then
            echo "❌ Potential internal URLs found in documentation"
            exit 1
          fi
          
          echo "✅ No sensitive information detected"

  accessibility-check:
    name: Documentation Accessibility
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation accessibility
        run: |
          echo "Checking heading structure and accessibility..."

          find docs -name "*.md" -type f 2>/dev/null | while read file; do
            echo "Analyzing $file..."

            # Check for missing alt text in images
            if grep -n "!\[.*\](" "$file" 2>/dev/null | grep -q "!\[\]"; then
              echo "Warning: Missing alt text for images in $file"
            fi

            # Check heading hierarchy - simplified bash approach
            awk '/^#+ / {
              match($0, /^#+/);
              level = RLENGTH;
              if (prev_level > 0 && level > prev_level + 1) {
                printf "Warning: Heading level jump in %s (line %d)\n", FILENAME, NR
              }
              prev_level = level
            }' "$file"
          done

          # Check main README
          if [ -f "README.md" ]; then
            echo "Analyzing README.md..."
            if grep -n "!\[.*\](" "README.md" 2>/dev/null | grep -q "!\[\]"; then
              echo "Warning: Missing alt text for images in README.md"
            fi
          fi

  performance-check:
    name: Documentation Performance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation size and performance
        run: |
          echo "Checking documentation performance..."

          # Check for overly large documentation files (>1MB)
          find docs -name "*.md" -type f -size +1M 2>/dev/null | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "⚠️ Warning: Large documentation file detected: $file ($size)"
          done

          # Check README separately
          if [ -f "README.md" ]; then
            readme_size=$(stat -f%z "README.md" 2>/dev/null || stat -c%s "README.md" 2>/dev/null)
            if [ "$readme_size" -gt 1048576 ]; then
              echo "⚠️ Warning: README.md is larger than 1MB"
            fi
          fi

          # Check for overly long lines that might impact readability
          find docs -name "*.md" -type f 2>/dev/null | while read file; do
            long_lines=$(awk 'length > 120' "$file" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$long_lines" -gt 10 ]; then
              echo "⚠️ Warning: Many long lines (>120 chars) in $file: $long_lines lines"
            fi
          done

          # Count total documentation
          total_files=$(find docs -name "*.md" -type f 2>/dev/null | wc -l | tr -d ' ')
          total_size=$(du -sh docs 2>/dev/null | cut -f1)
          echo "📊 Documentation summary: $total_files files, ${total_size:-0} total"

  notify-on-failure:
    name: Notify on Documentation Issues
    runs-on: ubuntu-latest
    needs: [validate-docs, check-examples, security-scan, accessibility-check]
    if: failure()
    
    steps:
      - name: Create issue for documentation problems
        uses: actions/github-script@v7
        with:
          script: |
            const title = '📚 Documentation Issues Detected';
            const body = `
            ## Documentation Issues Found
            
            The automated documentation validation has detected issues that need attention:
            
            ### Failed Jobs
            ${context.payload.workflow_run ? 
              `- Workflow: ${context.payload.workflow_run.name}` : 
              '- Current workflow run'
            }
            
            ### Next Steps
            
            1. Check the workflow logs for specific errors
            2. Run \`npm run docs:validate\` locally to identify issues
            3. Fix any broken links, invalid code examples, or accessibility problems
            4. Update documentation to match current codebase
            
            ### Quick Fixes
            
            - **Broken Links**: Update file paths and URLs
            - **Code Examples**: Verify TypeScript syntax and imports
            - **Scripts**: Ensure documented npm scripts exist in package.json
            - **Accessibility**: Add alt text to images and fix heading structure
            
            This issue was automatically created by the documentation automation workflow.
            `;
            
            // Check if issue already exists
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['documentation', 'automation']
            });
            
            const hasExistingIssue = existingIssues.data.some(issue => 
              issue.title.includes('Documentation Issues Detected')
            );
            
            if (!hasExistingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['documentation', 'automation', 'bug']
              });
            }