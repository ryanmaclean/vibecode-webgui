name: Demo Validation

on:
  push:
    branches: [main]
    paths:
      - 'cmd/vibecode-demo/**'
      - 'scripts/verify-datadog-dbm.sh'
      - 'scripts/generate-vector-activity.sh'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/vibecode-demo/**'
      - 'scripts/verify-datadog-dbm.sh'
      - 'scripts/generate-vector-activity.sh'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

concurrency:
  group: demo-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Validate Go module
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build TUI demo
        run: make build

      - name: Validate scripts are executable
        run: |
          test -x scripts/verify-datadog-dbm.sh
          test -x scripts/generate-vector-activity.sh

      - name: Test Makefile targets
        run: |
          make help
          make clean
          make install
          make build

      - name: Validate demo binary
        run: |
          test -f bin/vibecode-demo
          file bin/vibecode-demo | grep -q "executable"

  validate-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts
        run: |
          # Check script syntax
          bash -n scripts/verify-datadog-dbm.sh
          bash -n scripts/generate-vector-activity.sh
          
          # Check for common issues
          shellcheck scripts/verify-datadog-dbm.sh || true
          shellcheck scripts/generate-vector-activity.sh || true

      - name: Validate script permissions
        run: |
          ls -la scripts/verify-datadog-dbm.sh
          ls -la scripts/generate-vector-activity.sh
          test -x scripts/verify-datadog-dbm.sh
          test -x scripts/generate-vector-activity.sh

  validate-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate README
        run: |
          # Check that README mentions the demo
          grep -q "make demo" README.md
          grep -q "pgvector" README.md
          grep -q "Datadog" README.md

      - name: Validate Makefile help
        run: |
          make help | grep -q "demo"
          make help | grep -q "pgvector"
          make help | grep -q "Datadog"

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Setup KIND
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: demo-test
          kubectl_version: v1.28.0

      - name: Mark start time
        run: echo "DEMO_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build demo
        run: make build

      - name: Test script dry-run mode
        id: dbm-script
        run: |
          set +e
          timeout 30 scripts/verify-datadog-dbm.sh
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Test demo binary exists and runs
        id: demo-help
        run: |
          set +e
          ./bin/vibecode-demo --help
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate package.json scripts
        run: |
          grep -q '"demo"' package.json
          grep -q '"demo:setup"' package.json
          npm run demo --help || echo "Expected to fail without infrastructure"

      - name: Upload integration logs
        if: always()
        run: |
          mkdir -p demo-logs
          [ -f demo.log ] && mv demo.log demo-logs/ || true
          kind export logs demo-logs/kind-logs || true
        continue-on-error: true
      - name: Publish integration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-validation-logs
          path: demo-logs
          retention-days: 14

      - name: Integration summary
        if: always()
        run: |
          end=$(date +%s)
          duration=$(( end - DEMO_START ))
          mins=$(( duration / 60 ))
          secs=$(( duration % 60 ))
          dbm_status='${{ steps.dbm-script.outputs.status || "0" }}'
          demo_status='${{ steps.demo-help.outputs.status || "0" }}'
          icon() { [ "$1" = "0" ] && echo "✅" || echo "⚠️"; }
          echo "### Demo Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duration: ${duration}s (${mins}m ${secs}s)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Datadog script: $(icon "$dbm_status") (exit $dbm_status)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Demo help: $(icon "$demo_status") (exit $demo_status)" >> "$GITHUB_STEP_SUMMARY"
