name: Enhanced Secret Scanning

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    # Run daily secret scan at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: TruffleHog OSS Secret Scanning
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified --json --fail
        continue-on-error: true  # Don't fail the workflow, but collect results

      - name: Generate SARIF report
        if: always()
        continue-on-error: true
        run: |
          # Convert TruffleHog JSON output to SARIF if available
          echo "SARIF conversion step - implement if TruffleHog outputs JSON"

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: results.sarif

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Optional for Gitleaks Pro

  workflow-security-audit:
    name: Workflow Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan workflows for insecure patterns
        id: workflow_scan
        run: |
          echo "Scanning GitHub Actions workflows for security issues..."

          issues_found=0

          # Check for dangerous echo patterns with secrets
          echo "Checking for echo commands with secrets..."
          if grep -rn "echo.*\${{.*secrets" .github/workflows/ 2>/dev/null; then
            echo "::error::Found echo commands with secrets - potential exposure risk"
            issues_found=$((issues_found + 1))
          fi

          # Check for workflows without explicit permissions
          echo "Checking for workflows without explicit permissions..."
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            if [ -f "$workflow" ]; then
              if ! grep -q "permissions:" "$workflow"; then
                echo "::warning file=$workflow::Workflow missing explicit permissions block"
              fi
            fi
          done

          # Check for mutable action versions
          echo "Checking for mutable action versions..."
          if grep -rn "uses:.*@main\|uses:.*@master" .github/workflows/ 2>/dev/null | grep -v "trufflesecurity/trufflehog"; then
            echo "::warning::Found actions using mutable versions (main/master)"
          fi

          # Check for pull_request_target usage
          echo "Checking for pull_request_target trigger..."
          if grep -rn "pull_request_target" .github/workflows/ 2>/dev/null; then
            echo "::warning::Found pull_request_target usage - verify secret access is restricted"
          fi

          # Check for secrets in conditionals (potential information leak)
          echo "Checking for secrets in conditionals..."
          if grep -rn "if:.*secrets\." .github/workflows/ 2>/dev/null; then
            echo "::notice::Found secrets used in conditionals - verify no information leakage"
          fi

          if [ $issues_found -gt 0 ]; then
            echo "::error::Found $issues_found critical security issues in workflows"
            exit 1
          fi

          echo "Workflow security scan complete"

      - name: Check for hardcoded credentials
        run: |
          echo "Scanning for potential hardcoded credentials..."

          # Common credential patterns
          patterns=(
            "password\s*=\s*['\"][^'\"]+['\"]"
            "api[_-]?key\s*=\s*['\"][^'\"]+['\"]"
            "secret\s*=\s*['\"][^'\"]+['\"]"
            "token\s*=\s*['\"][^'\"]+['\"]"
            "bearer\s+[A-Za-z0-9\-\._~\+\/]+=*"
          )

          issues=0
          for pattern in "${patterns[@]}"; do
            if grep -rniE "$pattern" . \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=dist \
              --exclude-dir=build \
              --exclude="*.min.js" \
              --exclude="*.log" 2>/dev/null | grep -v ".github/workflows/secret-scanning"; then
              issues=$((issues + 1))
            fi
          done

          if [ $issues -gt 0 ]; then
            echo "::warning::Found potential hardcoded credentials - review manually"
          else
            echo "No obvious hardcoded credentials found"
          fi

  secret-usage-inventory:
    name: Secret Usage Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate secret usage report
        run: |
          echo "# Secret Usage Inventory" > secret-inventory.md
          echo "Generated: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" >> secret-inventory.md
          echo "" >> secret-inventory.md

          echo "## Secrets Referenced in Workflows" >> secret-inventory.md
          echo "" >> secret-inventory.md
          echo "| Secret Name | Usage Count | Files |" >> secret-inventory.md
          echo "|-------------|-------------|-------|" >> secret-inventory.md

          # Extract all secret references
          grep -rho "secrets\.[A-Z_][A-Z0-9_]*" .github/workflows/ 2>/dev/null | \
            sort | uniq -c | sort -rn | \
            awk '{
              secret=$2;
              gsub("secrets\\.", "", secret);
              count=$1;
              printf "| %s | %d | Multiple |\n", secret, count;
            }' >> secret-inventory.md || echo "No secrets found" >> secret-inventory.md

          echo "" >> secret-inventory.md
          echo "## Workflow Files with Secret Usage" >> secret-inventory.md
          echo "" >> secret-inventory.md

          grep -rl "secrets\." .github/workflows/ 2>/dev/null | while read -r file; do
            count=$(grep -o "secrets\." "$file" | wc -l)
            echo "- $file: $count secret references"
          done >> secret-inventory.md || echo "No workflow files with secrets" >> secret-inventory.md

          echo "" >> secret-inventory.md
          echo "## Security Recommendations" >> secret-inventory.md
          echo "" >> secret-inventory.md
          echo "1. Audit all secrets for necessity" >> secret-inventory.md
          echo "2. Rotate secrets on a schedule (90 days recommended)" >> secret-inventory.md
          echo "3. Use environment-scoped secrets for production" >> secret-inventory.md
          echo "4. Consider OIDC for cloud provider authentication" >> secret-inventory.md
          echo "5. Remove unused secrets from repository settings" >> secret-inventory.md

          cat secret-inventory.md

      - name: Upload inventory report
        uses: actions/upload-artifact@v4
        with:
          name: secret-usage-inventory
          path: secret-inventory.md
          retention-days: 30

  summary:
    name: Security Scan Summary
    needs: [trufflehog, gitleaks, workflow-security-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        run: |
          cat <<'MARKDOWN' >> $GITHUB_STEP_SUMMARY
          # Secret Scanning Results

          ## Scan Status

          - **TruffleHog**: ${{ needs.trufflehog.result }}
          - **Gitleaks**: ${{ needs.gitleaks.result }}
          - **Workflow Audit**: ${{ needs.workflow-security-audit.result }}

          ## Security Posture

          ${{ needs.trufflehog.result == 'success' && needs.gitleaks.result == 'success' && needs.workflow-security-audit.result == 'success' && '✅ All secret scans passed - no verified secrets detected' || '❌ Secret scanning detected issues - review scan results' }}

          ## Next Steps

          1. Review any detected secrets in Security tab
          2. Rotate compromised credentials immediately
          3. Update .gitignore to prevent future commits
          4. Consider pre-commit hooks for local scanning

          ## Resources

          - [GitHub Secret Scanning](https://docs.github.com/en/code-security/secret-scanning)
          - [Secret Rotation Guide](https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions)
          - [TruffleHog Documentation](https://github.com/trufflesecurity/trufflehog)
          MARKDOWN

      - name: Fail if any scan failed
        if: needs.trufflehog.result == 'failure' || needs.gitleaks.result == 'failure' || needs.workflow-security-audit.result == 'failure'
        run: |
          echo "One or more secret scans failed"
          exit 1
