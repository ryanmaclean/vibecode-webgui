name: VibeCode Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'platforms/macos/VibeCodeSwift/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]

jobs:
  swift-tests:
    name: Swift Unit Tests
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check Swift version
      run: swift --version
    
    - name: Build VibeCode
      working-directory: platforms/macos/VibeCodeSwift
      run: swift build -c release
    
    - name: Run Swift tests
      working-directory: platforms/macos/VibeCodeSwift
      run: swift test --enable-code-coverage
    
    - name: Generate code coverage
      working-directory: platforms/macos/VibeCodeSwift
      run: |
        xcrun llvm-cov export -format="lcov" \
          .build/debug/VibeCodePackageTests.xctest/Contents/MacOS/VibeCodePackageTests \
          -instr-profile .build/debug/codecov/default.profdata > coverage.lcov
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./platforms/macos/VibeCodeSwift/coverage.lcov
        flags: swift-tests

  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run regression tests
      run: ./scripts/regression-tests.sh
      env:
        CI: true

    - name: Run integration test suite
      run: |
        if [ -f "./scripts/test-vibecode-vms.sh" ]; then
          ./scripts/test-vibecode-vms.sh
        else
          echo "SKIP: test-vibecode-vms.sh not found"
        fi
      env:
        CI: true
      continue-on-error: true

    - name: Run functional tests
      run: ./scripts/functional-tests.sh
      env:
        CI: true

    - name: Run GUI tests
      run: |
        if [ -f "./scripts/test-gui.sh" ]; then
          ./scripts/test-gui.sh
        else
          echo "SKIP: test-gui.sh not found"
        fi
      env:
        CI: true
      continue-on-error: true

    - name: Run E2E with Datadog
      run: |
        if [ -f "./scripts/test-e2e-with-datadog.sh" ]; then
          ./scripts/test-e2e-with-datadog.sh
        else
          echo "SKIP: test-e2e-with-datadog.sh not found"
        fi
      env:
        CI: true
      continue-on-error: true
    
    - name: Check for test artifacts
      if: always()
      run: |
        ls -la logs/ || echo "No logs directory"
        ls -la platforms/macos/VibeCodeSwift/.build/ || echo "No build artifacts"

  lint:
    name: Code Quality
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: SwiftLint
      run: |
        if command -v swiftlint &> /dev/null; then
          swiftlint --strict
        else
          echo "SwiftLint not installed, skipping"
        fi
      working-directory: platforms/macos/VibeCodeSwift
      continue-on-error: true
    
    - name: Check for TODO/FIXME
      run: |
        if grep -r "TODO\|FIXME" platforms/macos/VibeCodeSwift/Sources/ --exclude-dir=.build; then
          echo "Found TODO/FIXME comments"
          exit 1
        fi
      continue-on-error: true

