jobs:
  validate-ci-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY || '' }}
      KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 || '' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || '' }}
    steps:
      - name: Validate CI config (Datadog secrets)
        run: |
          missing=0
          if [ -z "${DD_API_KEY}" ]; then
            echo "::warning::Missing secret DD_API_KEY (or legacy DATADOG_API_KEY); monitoring stack deployment will be skipped."
            missing=1
          else
            echo "DD_API_KEY present."
          fi
          if [ -z "${KUBECONFIG_BASE64}" ]; then
            echo "::warning::Missing secret KUBECONFIG_BASE64; Kubernetes context steps and deployment will be skipped."
            missing=1
          else
            echo "KUBECONFIG_BASE64 present."
          fi
          if [ -z "${DOCKER_USERNAME}" ]; then
            echo "::warning::Missing secret DOCKER_USERNAME; deployment script may not be able to authenticate to registry if required."
          else
            echo "DOCKER_USERNAME present."
          fi
          if [ "$missing" -eq 0 ]; then
            echo "All required deployment secrets present."
          fi

  deploy:
    needs: [validate-ci-config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY || '' }}
      KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 || '' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Kubernetes context
        if: ${{ env.KUBECONFIG_BASE64 != '' }}
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ env.KUBECONFIG_BASE64 }}

      - name: Deploy VibeCode Application
        if: ${{ env.KUBECONFIG_BASE64 != '' }}
        run: |
          chmod +x ./scripts/production-deploy.sh
          ./scripts/production-deploy.sh
        env:
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}

      - name: Deploy Monitoring Stack
        if: ${{ env.DD_API_KEY != '' }}
        run: |
          chmod +x ./scripts/deploy-monitoring.sh
          ./scripts/deploy-monitoring.sh -m kubernetes
        env:
          DATADOG_API_KEY: ${{ env.DD_API_KEY }}
