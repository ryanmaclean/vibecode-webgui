name: Test ARM64 Standard Profile

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vibecode-codeserver

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 standard profile test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/code-server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vibecode-codeserver:test-arm64-standard
            ghcr.io/${{ github.repository_owner }}/vibecode-codeserver:test-standard-${{ github.sha }}
          build-args: |
            PROFILE=standard
            VERSION=test-arm64-standard
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_COMMIT=${{ github.sha }}

      - name: Test pull image
        run: |
          echo "Standard profile image built and pushed successfully!"
          echo "Pull with: container images pull ghcr.io/${{ github.repository_owner }}/vibecode-codeserver:test-arm64-standard"
