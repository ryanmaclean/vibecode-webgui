name: PR Testing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  DD_SERVICE: ${{ github.event.repository.name }}
  DD_ENV: ci
  DD_VERSION: ${{ github.sha }}
  DD_TAGS: team:platform,component:ci

jobs:
  test-pr:
    name: Test PR Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        continue-on-error: false

      - name: Run TypeScript type check
        id: typecheck
        run: |
          echo "## TypeScript Type Check" >> $GITHUB_STEP_SUMMARY
          npm run type-check 2>&1 | tee typecheck.log || true
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Type check passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Type check failed" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -50 typecheck.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Run ESLint
        id: lint
        run: |
          echo "## ESLint" >> $GITHUB_STEP_SUMMARY
          npm run lint 2>&1 | tee lint.log || true
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Lint passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Lint failed" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -50 lint.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Run Next.js build
        id: build
        run: |
          echo "## Next.js Build" >> $GITHUB_STEP_SUMMARY
          npm run build 2>&1 | tee build.log || true
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Build passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -100 build.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Datadog CI CLI
        run: npm install -g @datadog/datadog-ci

      - name: Run tests
        id: test
        run: |
          echo "## Test Suite" >> $GITHUB_STEP_SUMMARY
          npm test 2>&1 | tee test.log || true
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Tests failed" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -50 test.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
        env:
          DD_CI_VISIBILITY_ENABLED: ${{ secrets.DD_API_KEY != '' }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_ENV: ${{ env.DD_ENV }}
          DD_GIT_BRANCH: ${{ github.event.pull_request.head.ref }}
          DD_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DD_GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          DD_SERVICE: ${{ env.DD_SERVICE }}
          DD_SITE: datadoghq.com
          DD_VERSION: ${{ github.sha }}
          DD_CI_VISIBILITY_AGENTLESS_ENABLED: true
          NODE_OPTIONS: -r dd-trace/ci/init
          CI: true
        continue-on-error: true

      - name: Upload test results to Datadog
        if: always()
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: datadoghq.com
          DD_ENV: ${{ env.DD_ENV }}
          DD_SERVICE: ${{ env.DD_SERVICE }}
        run: |
          # Upload JUnit XML test results with flaky test detection
          datadog-ci junit upload \
            --service $DD_SERVICE \
            --env $DD_ENV \
            --tags "test.framework:jest,ci.workflow:${{ github.workflow }},ci.job:test-pr,pr.number:${{ github.event.pull_request.number }}" \
            test-results/*.xml || echo "No test results to upload"

      - name: Check for launcher test script
        id: launcher-test
        run: |
          echo "## Launcher Tests" >> $GITHUB_STEP_SUMMARY
          if [ -f "scripts/test-launcher.sh" ]; then
            echo "Found test-launcher.sh, running..." >> $GITHUB_STEP_SUMMARY
            bash scripts/test-launcher.sh 2>&1 | tee launcher-test.log || true
            if [ ${PIPESTATUS[0]} -eq 0 ]; then
              echo "✅ Launcher tests passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Launcher tests failed" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              cat launcher-test.log >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "ℹ️ No launcher test script found" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Generate test summary
        if: always()
        run: |
          echo "# PR Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PR: #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.event.pull_request.head.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.event.pull_request.head.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run completed at $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-logs
          path: |
            *.log
          retention-days: 7
