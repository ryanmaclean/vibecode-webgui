name: KinD Infrastructure Testing

on:
  # Nightly schedule for regular validation
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  
  # Manual dispatch for on-demand testing
  workflow_dispatch:
    inputs:
      cluster_config:
        description: 'KinD cluster configuration to use'
        required: false
        default: 'k8s/kind-ci-config.yaml'
        type: string
      run_full_tests:
        description: 'Run full test suite (including deployment tests)'
        required: false
        default: true
        type: boolean
  
  # Trigger on relevant changes
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'helm/**'
      - 'infrastructure/kind/**'
      - '.github/workflows/kind-testing.yml'
      - 'tests/k8s/**'
  
  pull_request:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'helm/**' 
      - 'infrastructure/kind/**'
      - '.github/workflows/kind-testing.yml'
      - 'tests/k8s/**'

env:
  CLUSTER_NAME: vibecode-ci
  KUBECTL_VERSION: v1.29.0

jobs:
  # Validate CI configuration and secrets
  validate-ci-config:
    name: Validate CI Configuration
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check-secrets.outputs.has-secrets }}
      config-valid: ${{ steps.validate-config.outputs.valid }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for required secrets
        id: check-secrets
        run: |
          # Check if we have basic secrets for testing (non-sensitive check)
          HAS_SECRETS="true"
          
          # For forks, we'll skip secret-dependent tests
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "Fork detected - will skip secret-dependent tests"
            HAS_SECRETS="false"
          fi
          
          echo "has-secrets=$HAS_SECRETS" >> $GITHUB_OUTPUT
          echo "Has secrets for testing: $HAS_SECRETS"

      - name: Validate configuration files
        id: validate-config
        run: |
          # Check if required configuration files exist
          CONFIG_FILE="${{ github.event.inputs.cluster_config || 'k8s/kind-ci-config.yaml' }}"
          
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "❌ KinD configuration file not found: $CONFIG_FILE"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ KinD configuration file found: $CONFIG_FILE"
          
          # Validate YAML syntax
          if ! yq eval '.' "$CONFIG_FILE" > /dev/null 2>&1; then
            echo "❌ Invalid YAML syntax in $CONFIG_FILE"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ Configuration file is valid YAML"
          echo "valid=true" >> $GITHUB_OUTPUT

  # Main KinD testing job
  kind-cluster-tests:
    name: KinD Cluster Tests
    runs-on: ubuntu-latest
    needs: validate-ci-config
    if: needs.validate-ci-config.outputs.config-valid == 'true'
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create KinD cluster
        uses: helm/kind-action@v1.10.0
        with:
          version: "v0.24.0"
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          cluster_name: ${{ env.CLUSTER_NAME }}
          config: ${{ github.event.inputs.cluster_config || 'k8s/kind-ci-config.yaml' }}
          wait: 300s

      - name: Verify cluster creation
        run: |
          echo "🔍 Verifying KinD cluster creation..."
          
          # Check cluster exists
          if ! kind get clusters | grep -q "^${{ env.CLUSTER_NAME }}$"; then
            echo "❌ Cluster ${{ env.CLUSTER_NAME }} not found"
            exit 1
          fi
          echo "✅ Cluster ${{ env.CLUSTER_NAME }} exists"
          
          # Check kubectl context
          kubectl cluster-info --context kind-${{ env.CLUSTER_NAME }}
          
          # Check nodes are ready
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes
          
          echo "✅ Cluster validation completed successfully"

      - name: Install required tools
        run: |
          # Install Helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version
          
          # Install yq for YAML processing (if not already available)
          if ! command -v yq &> /dev/null; then
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          yq --version

      - name: Lint Kubernetes manifests
        run: |
          echo "🔍 Linting Kubernetes manifests..."
          
          # Find and validate Kubernetes YAML files (exclude Helm values and incomplete manifests)
          find ./k8s -type f -name "*.yaml" -o -name "*.yml" | while read -r file; do
            # Skip Helm values files and known incomplete manifests
            if [[ "$file" =~ (values|secret\.yaml|kind-.*config\.yaml)$ ]]; then
              echo "⏭️ Skipping non-manifest file: $file"
              continue
            fi
            
            # Check if file has apiVersion and kind (basic K8s manifest requirements)
            if ! grep -q "apiVersion:" "$file" || ! grep -q "kind:" "$file"; then
              echo "⏭️ Skipping incomplete manifest: $file"
              continue
            fi
            
            echo "Validating: $file"
            if ! kubectl apply --dry-run=client -f "$file" >/dev/null 2>&1; then
              echo "⚠️ Validation warning for: $file"
              echo "This may be expected for manifests requiring cluster context"
              # Don't fail the workflow for validation issues that may be cluster-context dependent
            else
              echo "✅ Valid: $file"
            fi
          done
          
          echo "✅ Kubernetes manifest linting completed"

      - name: Test Helm charts (if available)
        run: |
          echo "🔍 Testing Helm charts..."
          
          # Check if Helm charts directory exists
          if [[ -d "./helm" ]] || [[ -d "./charts" ]]; then
            CHARTS_DIR=""
            [[ -d "./helm" ]] && CHARTS_DIR="./helm"
            [[ -d "./charts" ]] && CHARTS_DIR="./charts"
            
            echo "Found charts directory: $CHARTS_DIR"
            
            # Lint all charts
            find "$CHARTS_DIR" -type f -name "Chart.yaml" | while read -r chart_file; do
              chart_dir=$(dirname "$chart_file")
              echo "Linting chart: $chart_dir"
              helm lint "$chart_dir"
            done
            
            echo "✅ Helm chart validation completed"
          else
            echo "ℹ️ No Helm charts found - skipping Helm tests"
          fi

      - name: Run Jest K8s tests
        env:
          NODE_ENV: test
        run: |
          echo "🔍 Running Jest K8s validation tests..."
          
          # Run the K8s cluster validation tests
          npm run test:k8s:quick
          
          echo "✅ Jest K8s tests completed"

      - name: Deploy test workloads
        if: ${{ github.event.inputs.run_full_tests == 'true' || github.event.inputs.run_full_tests == '' }}
        run: |
          echo "🔍 Deploying test workloads..."
          
          # Create test namespace
          kubectl create namespace vibecode-test || true
          
          # Deploy a simple test workload
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-app
            namespace: vibecode-test
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-app
            template:
              metadata:
                labels:
                  app: test-app
              spec:
                containers:
                - name: test-app
                  image: nginx:alpine
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: test-app-service
            namespace: vibecode-test
          spec:
            selector:
              app: test-app
            ports:
            - port: 80
              targetPort: 80
          EOF
          
          # Wait for deployment to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/test-app -n vibecode-test
          
          # Verify service connectivity
          kubectl run test-curl --image=curlimages/curl:latest --rm -i --restart=Never --namespace=vibecode-test -- \
            curl -s http://test-app-service.vibecode-test.svc.cluster.local
          
          echo "✅ Test workload deployment completed"

      - name: Collect cluster information
        if: always()
        run: |
          echo "📊 Collecting cluster information..."
          
          echo "=== Cluster Info ==="
          kubectl cluster-info
          
          echo "=== Nodes ==="
          kubectl get nodes -o wide
          
          echo "=== Pods ==="
          kubectl get pods --all-namespaces
          
          echo "=== Services ==="
          kubectl get services --all-namespaces
          
          echo "=== Events ==="
          kubectl get events --all-namespaces --sort-by='.lastTimestamp' | tail -20
          
          echo "=== Docker Images ==="
          docker images | grep -E "(kindest|vibecode)"
          
          echo "📊 Cluster information collection completed"

      - name: Cleanup test resources
        if: always()
        run: |
          echo "🧹 Cleaning up test resources..."
          
          # Clean up test namespace
          kubectl delete namespace vibecode-test --ignore-not-found=true
          
          # Clean up any test pods
          kubectl delete pod test-curl --ignore-not-found=true
          
          echo "✅ Cleanup completed"

  # Post-test reporting
  report-results:
    name: Report Test Results
    runs-on: ubuntu-latest
    needs: [validate-ci-config, kind-cluster-tests]
    if: always()
    steps:
      - name: Report test completion
        run: |
          echo "## KinD Infrastructure Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.validate-ci-config.result }}" == "success" ]]; then
            echo "✅ **Configuration Validation**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Configuration Validation**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.kind-cluster-tests.result }}" == "success" ]]; then
            echo "✅ **KinD Cluster Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.kind-cluster-tests.result }}" == "failure" ]]; then
            echo "❌ **KinD Cluster Tests**: Failed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.kind-cluster-tests.result }}" == "skipped" ]]; then
            echo "⏭️ **KinD Cluster Tests**: Skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster**: ${{ env.CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration**: ${{ github.event.inputs.cluster_config || 'k8s/kind-ci-config.yaml' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY