name: Tauri Release - Build and Sign DMG

on:
  push:
    tags:
      - 'app-v*'  # Trigger on Tauri app version tags (e.g., app-v1.0.0)
    branches:
      - 'feature/dmg-packaging'  # Allow testing on the DMG packaging branch
  pull_request:
    paths:
      - 'platforms/tauri/**'
      - '.github/workflows/tauri-release.yml'
  workflow_dispatch:  # Manual trigger for testing
    inputs:
      skip_signing:
        description: 'Skip code signing (for testing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build-tauri-macos:
    name: Build Tauri App (macOS Universal)
    runs-on: macos-14  # macOS with Apple Silicon (M1/M2)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platforms/tauri -> target

      - name: Validate Tauri configuration
        run: |
          echo "Validating Tauri setup..."
          test -f platforms/tauri/tauri.conf.json || { echo "Error: tauri.conf.json not found"; exit 1; }
          test -f platforms/tauri/entitlements.plist || { echo "Error: entitlements.plist not found"; exit 1; }
          test -f platforms/tauri/icons/icon.icns || { echo "Error: icon.icns not found"; exit 1; }
          echo "Tauri configuration validated successfully"

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend for Tauri
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          echo "Building Next.js frontend for Tauri static export..."
          echo "Node memory limit: $NODE_OPTIONS"

          # Backup original config and use Tauri-specific config
          if [ -f next.config.js ]; then
            cp next.config.js next.config.js.backup
          fi
          if [ -f next.config.mjs ]; then
            mv next.config.mjs next.config.mjs.backup
          fi

          # Use Tauri config for static export
          cp next.config.tauri.js next.config.js

          # IMPORTANT: Move API routes out of the way for static export
          # API routes use force-dynamic which is incompatible with output: export
          # They will be handled by Tauri's Rust backend instead
          echo "Temporarily excluding API routes for static export..."
          if [ -d "src/app/api" ]; then
            mv src/app/api src/app/api.excluded
          fi

          # Clean Next.js cache to prevent stale route references
          echo "Cleaning Next.js cache..."
          rm -rf .next

          # Build with static export
          npm run build
          BUILD_STATUS=$?

          # Restore API routes immediately after build
          if [ -d "src/app/api.excluded" ]; then
            mv src/app/api.excluded src/app/api
          fi

          # Check if build succeeded
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "Build failed with status $BUILD_STATUS"
            exit $BUILD_STATUS
          fi

          # Restore original config
          if [ -f next.config.js.backup ]; then
            mv next.config.js.backup next.config.js
          fi
          if [ -f next.config.mjs.backup ]; then
            mv next.config.mjs.backup next.config.mjs
          fi

          # Verify static export was created
          if [ ! -d "out" ]; then
            echo "Error: Static export directory 'out' not created"
            echo "Build output type may be incorrect - check next.config.tauri.js has output: 'export'"
            exit 1
          fi

          echo "Copying static export to platforms/public..."
          rm -rf platforms/public
          cp -r out platforms/public
          ls -la platforms/public/
          echo "Frontend build complete - $(find platforms/public -type f | wc -l) files"

      - name: Verify Tauri CLI installation
        working-directory: platforms/tauri
        run: |
          echo "Verifying Tauri CLI..."
          npx tauri --version || { echo "Error: Tauri CLI not available"; exit 1; }

      - name: Install Tauri dependencies
        working-directory: platforms/tauri
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          # Install system dependencies if needed
          brew install --quiet \
            pkg-config \
            openssl@3

      - name: Build Tauri app (Universal Binary)
        working-directory: platforms/tauri
        env:
          # Build optimizations
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          NEXT_CONFIG_FILE: next.config.tauri.js
        run: |
          echo "Building Tauri app for universal macOS binary..."
          echo "Using Next.js config: $NEXT_CONFIG_FILE"
          npx tauri build --target universal-apple-darwin --verbose || {
            echo "Build failed. Checking logs..."
            test -f target/universal-apple-darwin/release/build.log && cat target/universal-apple-darwin/release/build.log
            exit 1
          }

      - name: Verify build artifacts
        run: |
          echo "Checking for build artifacts..."
          ls -lh platforms/tauri/target/universal-apple-darwin/release/bundle/macos/
          ls -lh platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/ || echo "No DMG found yet"

      - name: Import Apple Developer Certificate
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_signing != 'true')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "Creating temporary keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "Importing Apple Developer certificate..."
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain

          echo "Verifying certificate import..."
          security find-identity -v -p codesigning build.keychain

      - name: Sign macOS Application
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_signing != 'true')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP_PATH="platforms/tauri/target/universal-apple-darwin/release/bundle/macos/VibeCode.app"

          echo "Signing VibeCode.app with identity: $APPLE_SIGNING_IDENTITY"
          codesign --force --deep --sign "$APPLE_SIGNING_IDENTITY" \
            --options runtime \
            --entitlements platforms/tauri/entitlements.plist \
            --timestamp \
            "$APP_PATH"

          echo "Verifying signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --verbose=4 --type execute "$APP_PATH" || echo "Gatekeeper assessment pending notarization"

      - name: Create DMG Package
        run: |
          echo "Creating DMG installer..."

          # Install create-dmg if not available
          npm install -g create-dmg || true

          APP_PATH="platforms/tauri/target/universal-apple-darwin/release/bundle/macos/VibeCode.app"
          DMG_OUTPUT="platforms/tauri/target/universal-apple-darwin/release/bundle/dmg"
          mkdir -p "$DMG_OUTPUT"

          # Create DMG with custom styling
          create-dmg \
            --volname "VibeCode" \
            --volicon "platforms/tauri/icons/icon.icns" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "VibeCode.app" 200 190 \
            --hide-extension "VibeCode.app" \
            --app-drop-link 600 185 \
            --no-internet-enable \
            "$DMG_OUTPUT/VibeCode.dmg" \
            "$APP_PATH" || {
              # Fallback: simple DMG creation
              hdiutil create -volname "VibeCode" \
                -srcfolder "$APP_PATH" \
                -ov -format UDZO \
                "$DMG_OUTPUT/VibeCode.dmg"
            }

          echo "DMG created successfully"
          ls -lh "$DMG_OUTPUT/VibeCode.dmg"

      - name: Sign DMG Package
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_signing != 'true')
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          DMG_PATH="platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/VibeCode.dmg"

          echo "Signing DMG package..."
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            --timestamp \
            "$DMG_PATH"

          echo "Verifying DMG signature..."
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Notarize Application
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_signing != 'true')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH="platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/VibeCode.dmg"

          echo "Submitting DMG for notarization..."
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m \
            --verbose

          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"

          echo "Verifying notarization..."
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - name: Generate checksums
        run: |
          DMG_PATH="platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/VibeCode.dmg"

          echo "Generating checksums..."
          cd "$(dirname "$DMG_PATH")"
          shasum -a 256 "$(basename "$DMG_PATH")" > VibeCode.dmg.sha256
          shasum -a 512 "$(basename "$DMG_PATH")" > VibeCode.dmg.sha512

          echo "SHA256:"
          cat VibeCode.dmg.sha256
          echo "SHA512:"
          cat VibeCode.dmg.sha512

      - name: Create release archive
        run: |
          APP_PATH="platforms/tauri/target/universal-apple-darwin/release/bundle/macos/VibeCode.app"
          ARCHIVE_OUTPUT="platforms/tauri/target/universal-apple-darwin/release/bundle/macos/VibeCode.app.tar.gz"

          echo "Creating app bundle archive..."
          tar -czf "$ARCHIVE_OUTPUT" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

          echo "Archive created:"
          ls -lh "$ARCHIVE_OUTPUT"

      - name: Upload build artifacts (for PRs and manual runs)
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VibeCode-macOS-Universal
          path: |
            platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/*.sha256
            platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/*.sha512
            platforms/tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/VibeCode.dmg
            platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/VibeCode.dmg.sha256
            platforms/tauri/target/universal-apple-darwin/release/bundle/dmg/VibeCode.dmg.sha512
            platforms/tauri/target/universal-apple-darwin/release/bundle/macos/VibeCode.app.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          body: |
            # VibeCode Desktop Application

            ## Installation

            ### macOS (Universal Binary - Intel & Apple Silicon)
            1. Download `VibeCode.dmg`
            2. Open the DMG file
            3. Drag VibeCode.app to Applications folder
            4. Launch VibeCode from Applications

            **Note:** The app is signed and notarized with Apple. First launch may take a moment for Gatekeeper verification.

            ## Checksums

            Verify download integrity:
            ```bash
            shasum -a 256 -c VibeCode.dmg.sha256
            ```

            ## Changes

            See the full changelog for details on what's new in this release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keychain
        if: always()
        run: |
          if security list-keychains | grep -q build.keychain; then
            security delete-keychain build.keychain || true
          fi
          rm -f certificate.p12 || true
