name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        env:
          NODE_ENV: development

      # Check 1: Secret Detection
      - name: Scan for secrets in code
        id: secret-scan
        continue-on-error: true
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified --json

      # Check 2: Validate .env.example completeness
      - name: Validate .env.example completeness
        id: env-validation
        run: |
          echo "## Environment Configuration Validation" >> $GITHUB_STEP_SUMMARY

          # Check if .env.example exists
          if [ ! -f .env.example ]; then
            echo "❌ .env.example file not found" >> $GITHUB_STEP_SUMMARY
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Extract required variables from code
          REQUIRED_VARS=$(grep -rh "process\.env\." src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" 2>/dev/null | \
            sed -n 's/.*process\.env\.\([A-Z_][A-Z0-9_]*\).*/\1/p' | \
            sort -u | \
            head -50)

          MISSING_VARS=""
          FOUND_COUNT=0
          MISSING_COUNT=0

          echo "### Required Environment Variables Check" >> $GITHUB_STEP_SUMMARY

          for VAR in $REQUIRED_VARS; do
            # Skip common test/build variables
            if [[ "$VAR" =~ ^(NODE_ENV|CI|GITHUB_|VERCEL_).*$ ]]; then
              continue
            fi

            if grep -q "^${VAR}=" .env.example || grep -q "^#.*${VAR}=" .env.example; then
              FOUND_COUNT=$((FOUND_COUNT + 1))
            else
              MISSING_VARS="${MISSING_VARS}\n- ${VAR}"
              MISSING_COUNT=$((MISSING_COUNT + 1))
            fi
          done

          echo "✅ Found: $FOUND_COUNT variables documented" >> $GITHUB_STEP_SUMMARY

          if [ $MISSING_COUNT -gt 0 ]; then
            echo "⚠️ Missing: $MISSING_COUNT variables not documented in .env.example" >> $GITHUB_STEP_SUMMARY
            echo -e "$MISSING_VARS" >> $GITHUB_STEP_SUMMARY
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            echo "✅ All variables documented" >> $GITHUB_STEP_SUMMARY
            echo "status=passed" >> $GITHUB_OUTPUT
          fi

      # Check 3: NPM Audit
      - name: Run npm audit
        id: npm-audit
        continue-on-error: true
        run: |
          echo "## NPM Security Audit" >> $GITHUB_STEP_SUMMARY

          # Run audit and capture output
          if npm audit --audit-level=moderate --json > audit-results.json 2>&1; then
            echo "✅ No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            # Parse audit results
            CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' audit-results.json)
            HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' audit-results.json)
            MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' audit-results.json)
            LOW=$(jq -r '.metadata.vulnerabilities.low // 0' audit-results.json)

            echo "### Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
            echo "- 🔴 Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- 🟠 High: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- 🟡 Moderate: $MODERATE" >> $GITHUB_STEP_SUMMARY
            echo "- 🟢 Low: $LOW" >> $GITHUB_STEP_SUMMARY

            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "❌ Critical or high vulnerabilities found - action required" >> $GITHUB_STEP_SUMMARY
              echo "status=failed" >> $GITHUB_OUTPUT

              # Show top 5 vulnerabilities
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Top Vulnerabilities" >> $GITHUB_STEP_SUMMARY
              jq -r '.vulnerabilities | to_entries | sort_by(.value.severity) | reverse | .[:5] | .[] | "- **\(.key)**: \(.value.severity) - \(.value.via[0].title // "No title")"' audit-results.json >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Moderate or low vulnerabilities found" >> $GITHUB_STEP_SUMMARY
              echo "status=warning" >> $GITHUB_OUTPUT
            fi
          fi

      # Check 4: Check for hardcoded secrets patterns
      - name: Check for hardcoded secrets patterns
        id: pattern-check
        run: |
          echo "## Hardcoded Secrets Pattern Check" >> $GITHUB_STEP_SUMMARY

          # Patterns to check
          PATTERNS=(
            'password\s*=\s*["\047][^"\047]+["\047]'
            'api[_-]?key\s*=\s*["\047][^"\047]+["\047]'
            'secret\s*=\s*["\047][^"\047]+["\047]'
            'token\s*=\s*["\047][^"\047]+["\047]'
            'AKIA[0-9A-Z]{16}'
            'AIza[0-9A-Za-z\-_]{35}'
          )

          ISSUES_FOUND=0

          for PATTERN in "${PATTERNS[@]}"; do
            MATCHES=$(git diff --cached --diff-filter=d | grep -E "$PATTERN" || true)
            if [ ! -z "$MATCHES" ]; then
              ISSUES_FOUND=$((ISSUES_FOUND + 1))
            fi
          done

          if [ $ISSUES_FOUND -gt 0 ]; then
            echo "⚠️ Found $ISSUES_FOUND potential secret patterns in staged changes" >> $GITHUB_STEP_SUMMARY
            echo "Please review changes to ensure no secrets are committed" >> $GITHUB_STEP_SUMMARY
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            echo "✅ No obvious secret patterns detected" >> $GITHUB_STEP_SUMMARY
            echo "status=passed" >> $GITHUB_OUTPUT
          fi

      # Check 5: Branch protection validation (only on main branch)
      - name: Check branch protection
        id: branch-protection
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## Branch Protection Status" >> $GITHUB_STEP_SUMMARY

          # Check if branch protection is enabled
          PROTECTION=$(gh api repos/${{ github.repository }}/branches/main/protection 2>&1 || echo "NOT_FOUND")

          if [[ "$PROTECTION" == *"NOT_FOUND"* ]] || [[ "$PROTECTION" == *"Branch not protected"* ]]; then
            echo "⚠️ Branch protection not enabled on main" >> $GITHUB_STEP_SUMMARY
            echo "status=warning" >> $GITHUB_OUTPUT
          else
            echo "✅ Branch protection is enabled" >> $GITHUB_STEP_SUMMARY
            echo "status=passed" >> $GITHUB_OUTPUT
          fi

      # Generate summary report
      - name: Generate security report
        if: always()
        id: report
        run: |
          echo "# Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Secret scanning
          if [ "${{ steps.secret-scan.outcome }}" == "success" ]; then
            echo "✅ Secret Scanning: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Secret Scanning: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Env validation
          if [ "${{ steps.env-validation.outputs.status }}" == "passed" ]; then
            echo "✅ Environment Config: Complete" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.env-validation.outputs.status }}" == "warning" ]; then
            echo "⚠️ Environment Config: Missing variables" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Environment Config: Failed" >> $GITHUB_STEP_SUMMARY
          fi

          # NPM Audit
          if [ "${{ steps.npm-audit.outputs.status }}" == "passed" ]; then
            echo "✅ NPM Audit: No vulnerabilities" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.npm-audit.outputs.status }}" == "warning" ]; then
            echo "⚠️ NPM Audit: Low/Moderate vulnerabilities" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ NPM Audit: Critical/High vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi

          # Pattern check
          if [ "${{ steps.pattern-check.outputs.status }}" == "passed" ]; then
            echo "✅ Secret Patterns: None detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Secret Patterns: Potential issues found" >> $GITHUB_STEP_SUMMARY
          fi

          # Branch protection (if checked)
          if [ "${{ steps.branch-protection.outcome }}" == "success" ]; then
            if [ "${{ steps.branch-protection.outputs.status }}" == "passed" ]; then
              echo "✅ Branch Protection: Enabled" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Branch Protection: Not configured" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      # Comment on PR with results
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let comment = '## 🔒 Security Audit Results\n\n';

            // Secret scanning
            const secretStatus = '${{ steps.secret-scan.outcome }}' === 'success' ? '✅' : '❌';
            comment += `${secretStatus} **Secret Scanning**: `;
            comment += '${{ steps.secret-scan.outcome }}' === 'success' ? 'No secrets detected\n' : 'Issues found\n';

            // Env validation
            const envStatus = '${{ steps.env-validation.outputs.status }}';
            const envIcon = envStatus === 'passed' ? '✅' : envStatus === 'warning' ? '⚠️' : '❌';
            comment += `${envIcon} **Environment Config**: `;
            comment += envStatus === 'passed' ? 'Complete\n' : envStatus === 'warning' ? 'Missing variables\n' : 'Failed\n';

            // NPM audit
            const auditStatus = '${{ steps.npm-audit.outputs.status }}';
            const auditIcon = auditStatus === 'passed' ? '✅' : auditStatus === 'warning' ? '⚠️' : '❌';
            comment += `${auditIcon} **NPM Audit**: `;
            comment += auditStatus === 'passed' ? 'No vulnerabilities\n' : auditStatus === 'warning' ? 'Low/Moderate issues\n' : 'Critical/High vulnerabilities\n';

            // Pattern check
            const patternStatus = '${{ steps.pattern-check.outputs.status }}' === 'passed' ? '✅' : '⚠️';
            comment += `${patternStatus} **Secret Patterns**: `;
            comment += '${{ steps.pattern-check.outputs.status }}' === 'passed' ? 'None detected\n' : 'Potential issues\n';

            comment += '\n---\n';
            comment += '📊 **View full results**: [Security Audit Summary](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';
            comment += '⏱️ **Duration**: < 2 minutes\n';

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Security Audit Results')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }

      # Fail job if critical issues found
      - name: Fail on critical issues
        if: |
          steps.secret-scan.outcome == 'failure' ||
          steps.npm-audit.outputs.status == 'failed' ||
          steps.env-validation.outputs.status == 'failed'
        run: |
          echo "❌ Critical security issues detected"
          exit 1
