name: Monitor code-server releases

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest upstream tag
        id: latest
        run: |
          TAG=$(curl -s https://api.github.com/repos/coder/code-server/releases/latest | jq -r '.tag_name')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream tag: $TAG"

      - name: Compare with Dockerfile base
        id: compare
        run: |
          # Check main Dockerfile
          current=$(grep '^FROM codercom/code-server:' docker/code-server/Dockerfile | head -1 | cut -d':' -f2)
          latest=${{ steps.latest.outputs.tag }}

          # Strip 'v' prefix if present for comparison
          current_version="${current#v}"
          latest_version="${latest#v}"

          echo "Current version: $current_version"
          echo "Latest version: $latest_version"

          if [[ "$latest_version" != "$current_version" ]]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "latest_tag=$latest" >> $GITHUB_OUTPUT
            echo "current_tag=$current" >> $GITHUB_OUTPUT
            echo "Update needed: $current → $latest"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "No update needed"
          fi

      - name: Open issue if update needed
        if: steps.compare.outputs.update_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_title="Update code-server base image to ${{ steps.compare.outputs.latest_tag }}"

          # Check if similar issue already exists
          existing=$(gh issue list --search "Update code-server base image to ${{ steps.compare.outputs.latest_tag }}" --state open --json number --jq '.[0].number')

          if [ -z "$existing" ]; then
            gh issue create \
              --title "$issue_title" \
              --body "Latest upstream code-server release: **${{ steps.compare.outputs.latest_tag }}**

          Current Dockerfile base: **${{ steps.compare.outputs.current_tag }}**

          ## Action Required
          Please update the following files:
          - docker/code-server/Dockerfile (base image version)
          - docker/code-server/Dockerfile.optimized (base image version)
          - docker/code-server/Dockerfile.kind (if exists)

          ## Steps
          1. Update FROM statement to codercom/code-server:${{ steps.compare.outputs.latest_tag }}
          2. Rebuild multi-arch images using rebuild-codeserver.yml workflow
          3. Run smoke tests to verify Monaco editor integration
          4. Update documentation with new image digest

          ## Automation
          This issue was automatically created by the code-server release monitor." \
              --label "dependencies,code-server,automation"
            echo "Created new issue for update"
          else
            echo "Issue already exists: #$existing"
          fi
