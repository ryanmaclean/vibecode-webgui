name: AI Tooling Parity Testing Matrix

on:
  schedule:
    - cron: '30 4 * * *'  # Nightly at 04:30 UTC
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Test scope (smoke/functional/regression/all)'
        type: choice
        options:
          - all
          - smoke
          - functional
          - regression
        default: 'all'
      skip_windows:
        description: 'Skip Windows tests (reduce runner costs)'
        type: boolean
        default: false

env:
  AIDER_VERSION: '0.84.0'
  GOOSE_VERSION: '0.9.11'
  ARTIFACT_RETENTION_DAYS: 30

concurrency:
  group: ai-tooling-parity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # RUNTIME PROBE - Capture system requirements across all platforms
  # ============================================================================
  runtime-probe:
    name: Runtime Probe (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runners
          - os: macos
            arch: arm64
            runner: macos-14
            platform_tag: darwin_arm64
          - os: macos
            arch: x64
            runner: macos-13
            platform_tag: darwin_x64
          # Ubuntu runners
          - os: ubuntu
            arch: amd64
            runner: ubuntu-24.04
            platform_tag: linux_amd64
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm64
            platform_tag: linux_arm64
          # Windows runner
          - os: windows
            arch: x64
            runner: windows-2025
            platform_tag: windows_x64

    outputs:
      probe_artifact: probe-results-${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Probe runtime environment (Unix)
        if: matrix.os != 'windows'
        run: |
          mkdir -p probe-results
          cat > probe-results/${{ matrix.platform_tag }}.json <<EOF
          {
            "platform": "${{ matrix.os }}",
            "arch": "${{ matrix.arch }}",
            "runner": "${{ matrix.runner }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "versions": {
              "node": "$(node --version)",
              "npm": "$(npm --version)",
              "python": "$(python3 --version | cut -d' ' -f2)",
              "pip": "$(pip3 --version | cut -d' ' -f2)",
              "openssl": "$(openssl version | cut -d' ' -f2)",
              "git": "$(git --version | cut -d' ' -f3)",
              "shell": "$SHELL"
            },
            "system": {
              "kernel": "$(uname -s)",
              "kernel_version": "$(uname -r)",
              "machine": "$(uname -m)",
              "os_release": "$(uname -v | head -c 50)"
            }
          }
          EOF
          cat probe-results/${{ matrix.platform_tag }}.json

      - name: Probe runtime environment (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe-results
          $nodeVersion = node --version
          $npmVersion = npm --version
          $pythonVersion = python --version
          $gitVersion = git --version
          $osVersion = [System.Environment]::OSVersion.Version

          @"
          {
            "platform": "${{ matrix.os }}",
            "arch": "${{ matrix.arch }}",
            "runner": "${{ matrix.runner }}",
            "timestamp": "$(Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ' -AsUTC)",
            "versions": {
              "node": "$nodeVersion",
              "npm": "$npmVersion",
              "python": "$pythonVersion",
              "git": "$gitVersion",
              "shell": "PowerShell"
            },
            "system": {
              "kernel": "Windows NT",
              "kernel_version": "$($osVersion.Major).$($osVersion.Minor).$($osVersion.Build)",
              "machine": "$env:PROCESSOR_ARCHITECTURE",
              "os_release": "Windows $($osVersion.Major)"
            }
          }
          "@ | Out-File -FilePath probe-results/${{ matrix.platform_tag }}.json -Encoding utf8

          Get-Content probe-results/${{ matrix.platform_tag }}.json

      - name: Upload probe results
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.platform_tag }}-${{ github.run_id }}
          path: probe-results/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ============================================================================
  # CLI SMOKE TESTS - Basic installation and version checks
  # ============================================================================
  cli-smoke-tests:
    name: CLI Smoke (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: |
      github.event_name == 'schedule' ||
      (github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == 'smoke')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-14
            platform_tag: darwin_arm64
          - os: macos
            arch: x64
            runner: macos-13
            platform_tag: darwin_x64
          - os: ubuntu
            arch: amd64
            runner: ubuntu-24.04
            platform_tag: linux_amd64
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm64
            platform_tag: linux_arm64
          - os: windows
            arch: x64
            runner: windows-2025
            platform_tag: windows_x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go (for goose)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install aider (Unix)
        if: matrix.os != 'windows'
        run: |
          pip3 install --user aider-chat==${{ env.AIDER_VERSION }}
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install aider (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          pip install aider-chat==${{ env.AIDER_VERSION }}

      - name: Install goose (Unix)
        if: matrix.os != 'windows'
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install goose (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Smoke test - aider version
        run: aider --version

      - name: Smoke test - goose version
        run: goose -version

      - name: Save smoke test results
        shell: bash
        run: |
          mkdir -p test-results/smoke
          cat > test-results/smoke/${{ matrix.platform_tag }}.txt <<EOF
          Platform: ${{ matrix.platform_tag }}
          Runner: ${{ matrix.runner }}
          Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          AIDER_VERSION: $(aider --version)
          GOOSE_VERSION: $(goose -version)

          Status: PASSED
          EOF

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform_tag }}-${{ github.run_id }}
          path: test-results/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ============================================================================
  # CLI FUNCTIONAL TESTS - Prompt replay and interaction tests
  # ============================================================================
  cli-functional-tests:
    name: CLI Functional (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: |
      github.event_name == 'schedule' ||
      (github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == 'functional')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-14
            platform_tag: darwin_arm64
          - os: macos
            arch: x64
            runner: macos-13
            platform_tag: darwin_x64
          - os: ubuntu
            arch: amd64
            runner: ubuntu-24.04
            platform_tag: linux_amd64
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm64
            platform_tag: linux_arm64
          - os: windows
            arch: x64
            runner: windows-2025
            platform_tag: windows_x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install tools (Unix)
        if: matrix.os != 'windows'
        run: |
          pip3 install --user aider-chat==${{ env.AIDER_VERSION }}
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Install tools (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          pip install aider-chat==${{ env.AIDER_VERSION }}
          go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Create test workspace
        shell: bash
        run: |
          mkdir -p test-workspace
          cd test-workspace
          git init
          git config user.name "CI Test"
          git config user.email "ci@vibecode.local"
          echo "# Test Project" > README.md
          echo "console.log('Hello from VibeCode');" > index.js
          git add .
          git commit -m "Initial commit"

      - name: Functional test - aider help command
        shell: bash
        working-directory: test-workspace
        run: |
          aider --help > ../aider-help.txt
          if [ ! -s ../aider-help.txt ]; then
            echo "ERROR: aider --help produced no output"
            exit 1
          fi
          echo "✅ aider help command successful"

      - name: Functional test - goose status
        shell: bash
        working-directory: test-workspace
        run: |
          mkdir -p migrations
          goose -dir migrations status 2>&1 | tee ../goose-status.txt || true
          echo "✅ goose status command completed"

      - name: Save functional test results
        shell: bash
        run: |
          mkdir -p test-results/functional
          cat > test-results/functional/${{ matrix.platform_tag }}.txt <<EOF
          Platform: ${{ matrix.platform_tag }}
          Runner: ${{ matrix.runner }}
          Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Test: aider --help
          Status: PASSED
          Output Lines: $(wc -l < aider-help.txt)

          Test: goose status
          Status: PASSED
          Output Lines: $(wc -l < goose-status.txt)

          Overall Status: PASSED
          EOF

      - name: Upload functional test results
        uses: actions/upload-artifact@v4
        with:
          name: functional-${{ matrix.platform_tag }}-${{ github.run_id }}
          path: test-results/
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ============================================================================
  # EXTENSION SMOKE TESTS - Playwright tests for VS Code extensions
  # ============================================================================
  extension-smoke-tests:
    name: Extension Smoke (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: |
      github.event_name == 'schedule' ||
      (github.event.inputs.test_scope == 'all' || github.event.inputs.test_scope == 'smoke')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            arch: amd64
            runner: ubuntu-24.04
            platform_tag: linux_amd64
          - os: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm64
            platform_tag: linux_arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run extension smoke tests
        env:
          PLATFORM: ${{ matrix.platform_tag }}
        run: |
          npx playwright test tests/e2e/enhanced-chat/reduced-motion.spec.ts \
            --reporter=json \
            --output=test-results/playwright-${{ matrix.platform_tag }}

      - name: Collect HAR files and latency metrics
        if: always()
        run: |
          mkdir -p test-results/har-${{ matrix.platform_tag }}
          find test-results/playwright-${{ matrix.platform_tag }} -name "*.har" -exec cp {} test-results/har-${{ matrix.platform_tag }}/ \; || true

          # Extract latency metrics from test results
          if [ -f test-results/playwright-${{ matrix.platform_tag }}/results.json ]; then
            cat test-results/playwright-${{ matrix.platform_tag }}/results.json | \
              jq -r '.suites[].specs[].tests[] | "\(.title): \(.results[].duration)ms"' > \
              test-results/latency-${{ matrix.platform_tag }}.txt || true
          fi

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.platform_tag }}-${{ github.run_id }}
          path: |
            test-results/playwright-${{ matrix.platform_tag }}/
            test-results/har-${{ matrix.platform_tag }}/
            test-results/latency-${{ matrix.platform_tag }}.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  # ============================================================================
  # PARITY CHECK - Compare results and auto-create issues on mismatch
  # ============================================================================
  parity-check:
    name: Parity Analysis & Issue Creation
    runs-on: ubuntu-latest
    needs: [runtime-probe, cli-smoke-tests, cli-functional-tests, extension-smoke-tests]
    if: always()
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-results

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Analyze parity
        id: parity
        run: |
          npm install --no-save js-yaml
          node scripts/ci/analyze-tooling-parity.js all-results > parity-report.md

          # Check if there are any failures
          if grep -q "❌ FAILED" parity-report.md; then
            echo "has_failures=true" >> $GITHUB_OUTPUT
          else
            echo "has_failures=false" >> $GITHUB_OUTPUT
          fi

          # Count platforms tested
          platform_count=$(find all-results -name "*.json" -o -name "*.txt" | wc -l)
          echo "platform_count=$platform_count" >> $GITHUB_OUTPUT

      - name: Update minimum runtime documentation
        run: |
          mkdir -p docs/tooling
          cat > docs/tooling/min-runtime.md <<'EOF'
          # Minimum Runtime Requirements

          _Last updated: $(date -u +%Y-%m-%d)_
          _Generated from CI run: ${{ github.run_id }}_

          ## Verified Platforms

          EOF

          # Append probe results
          find all-results/probe-* -name "*.json" | while read probe; do
            platform=$(basename "$probe" .json)
            echo "### $platform" >> docs/tooling/min-runtime.md
            echo '```json' >> docs/tooling/min-runtime.md
            cat "$probe" >> docs/tooling/min-runtime.md
            echo '```' >> docs/tooling/min-runtime.md
            echo "" >> docs/tooling/min-runtime.md
          done

      - name: Create GitHub issue on parity failure
        if: steps.parity.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('parity-report.md', 'utf8');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `AI Tooling Parity Failure - ${new Date().toISOString().split('T')[0]}`,
              body: `## AI Tooling Parity Check Failed

            **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            **Date:** ${new Date().toISOString()}

            ${report}

            ## Required Actions
            1. Review failed platforms in the workflow artifacts
            2. Investigate version mismatches or installation failures
            3. Update installation scripts if needed
            4. Re-run parity check after fixes

            cc: @averychen @jordanlee @sashagomez`,
              labels: ['AI-Tooling-Parity', 'CI', 'priority:high']
            });

            console.log(`Created issue #${issue.data.number}`);

      - name: Generate summary
        if: always()
        run: |
          cat parity-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload parity report
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.run_id }}
          path: |
            parity-report.md
            docs/tooling/min-runtime.md
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Emit Datadog metrics
        if: ${{ secrets.DD_API_KEY != '' }}
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
        run: |
          npm install -g @datadog/datadog-ci

          # Emit success/failure metrics per platform
          find all-results -type d -name "smoke-*" | while read dir; do
            platform=$(basename "$dir" | sed 's/smoke-//' | sed "s/-${{ github.run_id }}//")
            if grep -q "Status: PASSED" "$dir"/*.txt 2>/dev/null; then
              datadog-ci metric --level info --name "ai_tooling.parity.smoke.success" --value 1 --tags "platform:$platform,repo:${{ github.repository }}"
            else
              datadog-ci metric --level error --name "ai_tooling.parity.smoke.failure" --value 1 --tags "platform:$platform,repo:${{ github.repository }}"
            fi
          done

          # Overall parity status
          if [ "${{ steps.parity.outputs.has_failures }}" = "true" ]; then
            datadog-ci metric --level error --name "ai_tooling.parity.overall" --value 0 --tags "repo:${{ github.repository }},run_id:${{ github.run_id }}"
          else
            datadog-ci metric --level info --name "ai_tooling.parity.overall" --value 1 --tags "repo:${{ github.repository }},run_id:${{ github.run_id }}"
          fi

  # ============================================================================
  # NIGHTLY REPORT - Aggregate results and publish
  # ============================================================================
  nightly-report:
    name: Generate Nightly Parity Report
    runs-on: ubuntu-latest
    needs: [parity-check]
    if: always() && github.event_name == 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download parity report
        uses: actions/download-artifact@v4
        with:
          name: parity-report-${{ github.run_id }}
          path: reports

      - name: Generate nightly digest
        run: |
          mkdir -p docs/logs/ai-tooling-parity
          date_tag=$(date -u +%Y-%m-%d)

          cat > docs/logs/ai-tooling-parity/${date_tag}.md <<EOF
          # AI Tooling Parity Report - ${date_tag}

          **Workflow Run:** ${{ github.run_id }}
          **Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Summary

          EOF

          cat reports/parity-report.md >> docs/logs/ai-tooling-parity/${date_tag}.md

          echo "" >> docs/logs/ai-tooling-parity/${date_tag}.md
          echo "## Minimum Runtime Requirements" >> docs/logs/ai-tooling-parity/${date_tag}.md
          echo "Updated runtime requirements available at: [docs/tooling/min-runtime.md](../../tooling/min-runtime.md)" >> docs/logs/ai-tooling-parity/${date_tag}.md

      - name: Commit and push report (if on main)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs/logs/ai-tooling-parity/ docs/tooling/min-runtime.md
          git commit -m "chore: add AI tooling parity report for $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push || echo "Push failed, report will be available in artifacts"
