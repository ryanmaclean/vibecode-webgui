name: Datadog Trace Verification

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trace-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run if Datadog integration is enabled
    if: vars.DATADOG_TRACE_VERIFICATION_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check secrets availability
        id: check_secrets
        run: |
          if [ -z "${{ secrets.DD_API_KEY }}" ] || [ -z "${{ secrets.DD_APP_KEY }}" ]; then
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Datadog API secrets not configured - skipping verification"
          else
            echo "secrets_available=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify trace search configuration exists
        if: steps.check_secrets.outputs.secrets_available == 'true'
        run: |
          if [ ! -f "configs/trace-search-checks.json" ]; then
            echo "❌ Configuration file not found: configs/trace-search-checks.json"
            exit 1
          fi
          echo "✅ Configuration file found"

      - name: Verify trace search
        if: steps.check_secrets.outputs.secrets_available == 'true'
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
        run: python3 scripts/verify-trace-search-batch.py --config configs/trace-search-checks.json

      - name: Upload trace search artifacts
        if: always() && steps.check_secrets.outputs.secrets_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: datadog-trace-search-${{ github.run_id }}
          path: datadog/trace-search/*.json
          if-no-files-found: warn

      - name: Skip verification (secrets not available)
        if: steps.check_secrets.outputs.secrets_available == 'false'
        run: |
          echo "⏭️ Skipping trace verification - Datadog secrets not configured"
          echo "To enable trace verification:"
          echo "1. Set DD_API_KEY secret in repository settings"
          echo "2. Set DD_APP_KEY secret in repository settings"
          echo "3. Set DATADOG_TRACE_VERIFICATION_ENABLED variable to 'true'"
          echo ""
          echo "This is expected for pull requests and forks."

  trace-validation-report:
    runs-on: ubuntu-latest
    needs: trace-search
    if: always() && vars.DATADOG_TRACE_VERIFICATION_ENABLED == 'true'
    steps:
      - name: Download trace artifacts
        uses: actions/download-artifact@v4
        with:
          name: datadog-trace-search-${{ github.run_id }}
          path: trace-results
        continue-on-error: true

      - name: Generate validation report
        run: |
          echo "# Datadog Trace Verification Report" > report.md
          echo "" >> report.md
          echo "**Run ID**: ${{ github.run_id }}" >> report.md
          echo "**Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> report.md
          echo "" >> report.md

          if [ -d "trace-results" ] && [ "$(ls -A trace-results/*.json 2>/dev/null)" ]; then
            echo "## Results" >> report.md
            echo "" >> report.md
            for file in trace-results/*.json; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                count=$(python3 -c "import json; data=json.load(open('$file')); print(len(data.get('data', [])))")
                echo "- **$filename**: $count spans found" >> report.md
              fi
            done
          else
            echo "⚠️ No trace results found" >> report.md
          fi

          cat report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: trace-verification-report-${{ github.run_id }}
          path: report.md
          if-no-files-found: ignore
