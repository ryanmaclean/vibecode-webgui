name: Build code-server multi-arch image

on:
  push:
    paths:
      - 'docker/code-server/**'
      - 'scripts/build-codeserver-multiarch.sh'
      - 'scripts/test-code-server-kind.sh'
      - '.github/workflows/codeserver-multiarch.yml'
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      promote_canary:
        description: 'Promote validation image to canary tags'
        type: boolean
        default: true
      promote_latest:
        description: 'Promote validation image to latest and stable tags'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vibecode-codeserver
  CACHE_SCOPE: codeserver

concurrency:
  group: codeserver-multiarch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      validation_tag: ${{ steps.meta.outputs.validation_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Datadog CLI
        if: ${{ secrets.DD_API_KEY != '' }}
        run: npm install -g @datadog/datadog-ci

      - name: Run lint/type-check/unit tests
        run: |
          npm run lint
          npm run type-check
          npm run test:unit -- --runInBand

      - name: Set build metadata
        id: meta
        run: |
          tag="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}-${{ github.sha }}"
          echo "VALIDATION_TAG=$tag" >> "$GITHUB_ENV"
          echo "validation_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=${{ github.run_started_at }}" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for validation build
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch validation image
        id: build_validation
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/code-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.VALIDATION_TAG }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,scope=${{ env.CACHE_SCOPE }},mode=max
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}

      - name: Verify aider/goose on AMD64 image
        run: docker run --rm --platform linux/amd64 --entrypoint bash ${{ env.VALIDATION_TAG }} -lc "aider --version && goose -version"

      - name: Verify aider/goose on ARM64 image (qemu)
        run: docker run --rm --platform linux/arm64 --entrypoint bash ${{ env.VALIDATION_TAG }} -lc "aider --version && goose -version"

      - name: Create KinD cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: vibecode-ci
          wait: true

      - name: Run code-server KinD smoke test
        env:
          CODE_SERVER_IMAGE: ${{ env.VALIDATION_TAG }}
          KIND_CLUSTER_NAME: vibecode-ci
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: ${{ secrets.DD_SITE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: ./scripts/test-code-server-kind.sh

      - name: Collect KinD diagnostics
        if: always()
        run: |
          mkdir -p artifacts/kind
          kubectl get pods -A > artifacts/kind/pods.txt
          kubectl describe deployment/code-server-kind -n vibecode-platform > artifacts/kind/deployment.txt || true
          kubectl logs deployment/code-server-kind -n vibecode-platform > artifacts/kind/deployment.log || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-smoke-${{ github.run_id }}
          path: artifacts/kind

  build-push:
    needs: validate
    runs-on: ubuntu-latest
    if: github.repository == 'ryanmaclean/vibecode-webgui'
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        run: |
          set -eo pipefail
          image_root="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          latest="$image_root:latest"
          stable="$image_root:stable"
          sha_tag="$image_root:${{ github.sha }}"
          ci_tag="${{ needs.validate.outputs.validation_tag }}"
          promote_latest="${{ github.event_name != 'workflow_dispatch' || github.event.inputs.promote_latest == true || github.event.inputs.promote_latest == 'true' }}"
          promote_tags="$sha_tag\n$ci_tag"
          summary_tags="$sha_tag\n$ci_tag"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            nightly="$image_root:nightly"
            promote_tags="$promote_tags\n$nightly"
            summary_tags="$summary_tags\n$nightly"
          fi
          if [ "$promote_latest" = "true" ]; then
            promote_tags="$promote_tags\n$latest\n$stable"
            summary_tags="$summary_tags\n$latest\n$stable"
          else
            summary_tags="$summary_tags\n$latest (skipped)\n$stable (skipped)"
          fi
          echo "promote_tags<<'EOF'" >> "$GITHUB_OUTPUT"
          printf '%b\n' "$promote_tags" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"
          echo "summary_tags<<'EOF'" >> "$GITHUB_OUTPUT"
          printf '%b\n' "$summary_tags" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Promote validation tag to canary tags
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.promote_canary == false) }}
        env:
          VALIDATION_TAG: ${{ needs.validate.outputs.validation_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eo pipefail
          manifest=$(docker buildx imagetools inspect "$VALIDATION_TAG" --raw)
          amd64_digest=$(echo "$manifest" | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')
          arm64_digest=$(echo "$manifest" | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          if [ -z "$amd64_digest" ] || [ -z "$arm64_digest" ]; then
            echo 'Failed to resolve per-architecture digests for canary promotion' >&2
            exit 1
          fi
          docker buildx imagetools create --tag "ghcr.io/$OWNER/${{ env.IMAGE_NAME }}:amd64-canary" "$VALIDATION_TAG@$amd64_digest"
          docker buildx imagetools create --tag "ghcr.io/$OWNER/${{ env.IMAGE_NAME }}:arm64-canary" "$VALIDATION_TAG@$arm64_digest"

      - name: Promote validation tag to release tags
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.promote_latest == false) }}
        run: |
          while read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create --tag "$tag" ${{ needs.validate.outputs.validation_tag }}
          done <<'EOF'
          ${{ steps.tags.outputs.promote_tags }}
          EOF

      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.validate.outputs.validation_tag }}
          format: spdx-json
          output-file: sbom-code-server.spdx.json
        continue-on-error: false

      - name: Upload SBOM artifact
        if: steps.sbom.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-code-server-${{ github.run_id }}
          path: sbom-code-server.spdx.json
          sbom: true
        continue-on-error: false

      - name: Verify aider/goose on amd64 image
        run: docker run --rm --platform linux/amd64 --entrypoint bash ${{ needs.validate.outputs.validation_tag }} -lc "aider --version && goose -version"

      - name: Verify aider/goose on arm64 image
        run: docker run --rm --platform linux/arm64 --entrypoint bash ${{ needs.validate.outputs.validation_tag }} -lc "aider --version && goose -version"

      - name: Install Datadog CLI (build job)
        if: ${{ secrets.DD_API_KEY != '' }}
        run: npm install -g @datadog/datadog-ci

      - name: Emit Datadog metrics
        if: ${{ secrets.DD_API_KEY != '' }}
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: ${{ secrets.DD_SITE != '' && secrets.DD_SITE || 'datadoghq.com' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          VALIDATION_TAG: ${{ needs.validate.outputs.validation_tag }}
        run: |
          set -eo pipefail
          start_epoch=$(date -d '${{ github.run_started_at }}' +%s 2>/dev/null || date +%s)
          end_epoch=$(date +%s)
          duration=$(( end_epoch - start_epoch ))
          echo "### Datadog Metrics Submission" >> "$GITHUB_STEP_SUMMARY"
          echo "Submitting build metrics for run ${GITHUB_RUN_ID}..." >> "$GITHUB_STEP_SUMMARY"
          datadog-ci metrics submit codeserver.build.duration "$duration" --type gauge --tags "workflow:codeserver-multiarch,repo:${GITHUB_REPOSITORY},run:${GITHUB_RUN_ID}" | tee -a "$GITHUB_STEP_SUMMARY"
          datadog-ci metrics submit codeserver.build.success 1 --type gauge --tags "workflow:codeserver-multiarch,repo:${GITHUB_REPOSITORY},run:${GITHUB_RUN_ID}" | tee -a "$GITHUB_STEP_SUMMARY"
          datadog-ci events post "code-server build complete" "Run ${GITHUB_RUN_ID} promoted ${VALIDATION_TAG}" --tags "workflow:codeserver-multiarch,repo:${GITHUB_REPOSITORY}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Metrics submission completed at $(date)" >> "$GITHUB_STEP_SUMMARY"
          echo "Build duration: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise published tags
        run: |
          cat <<'MARKDOWN' >> "$GITHUB_STEP_SUMMARY"
          ### Code-server multi-arch publish
          Tags pushed:
          ${{ steps.tags.outputs.summary_tags }}
          MARKDOWN
