# Configuration for git-cliff changelog generation
# See: https://git-cliff.org/docs/configuration

[changelog]
# Changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
          {% if commit.breaking %} [**BREAKING**]{% endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""

# Template for the changelog footer
footer = """
<!-- Generated by git-cliff -->
"""

# Remove the leading and trailing whitespace from the templates
trim = true

[git]
# Parse commits based on conventional commits
conventional_commits = true

# Filter commits based on conventional commit types
filter_unconventional = true

# Process each line of commit as an individual commit
split_commits = false

# Protect breaking changes from being skipped
protect_breaking_commits = true

# Filter commits by their scope
# filter_commits = true

# Regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^security", group = "Security" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "CI/CD" },
  { message = "^build", group = "Build System" },
  { message = "^revert", group = "Reverts" },
  { body = ".*breaking change.*", group = "Breaking Changes" },
]

# Protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = true

# Filter out commits that are not matched by any commit parser
filter_commits = false

# Regex for matching tags
tag_pattern = "v[0-9]*"

# Skip tags that match the pattern
skip_tags = "v0.0.0-alpha*"

# Sort tags chronologically
date_order = false

# Sort commits inside sections by oldest/newest order
sort_commits = "newest"

# Limit the number of commits included in the changelog
# limit_commits = 50
