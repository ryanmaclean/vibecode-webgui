apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vector-db
  namespace: vibecode
  labels:
    app: vector-db
    component: database
    team: data-engineering
    part-of: vibecode-platform
spec:
  serviceName: vector-db
  replicas: 3
  selector:
    matchLabels:
      app: vector-db
  template:
    metadata:
      labels:
        app: vector-db
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        ad.datadoghq.com/postgres.logs: '[{"source":"postgresql","service":"vector-db"}]'
        ad.datadoghq.com/postgres.check_names: '["postgres"]'
        ad.datadoghq.com/postgres.init_configs: '[{}]'
        ad.datadoghq.com/postgres.instances: |
          [
            {
              "host": "%%host%%",
              "port": 5432,
              "username": "datadog",
              "password": "%%env_DD_PG_PASS%%",
              "dbname": "postgres",
              "tags": ["env:%%env%%", "service:vector-db"]
            }
          ]
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 70  # postgres group
        runAsUser: 70 # postgres user
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - vector-db
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: init-db
        image: "vibecode/db-init:latest"
        imagePullPolicy: IfNotPresent
        command: ["/scripts/init-vector-db.sh"]
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: vector-db-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vector-db-credentials
              key: password
        - name: POSTGRES_DB
          value: "vector_db"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /scripts
        - name: tmp-dir
          mountPath: /tmp
      containers:
      - name: postgres
        image: "postgres:15-alpine"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: vector-db-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: vector-db-credentials
              key: password
        - name: POSTGRES_DB
          value: "vector_db"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_INITDB_ARGS
          value: "--data-checksums"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "md5"
        - name: MAX_CONNECTIONS
          value: "100"
        - name: SHARED_BUFFERS
          value: "1GB"
        - name: EFFECTIVE_CACHE_SIZE
          value: "3GB"
        - name: WORK_MEM
          value: "128MB"
        - name: MAINTENANCE_WORK_MEM
          value: "256MB"
        - name: PGUSER
          value: "postgres"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "pg_ctl -D $PGDATA stop -m smart"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: config-map
          mountPath: /etc/postgresql.conf.d
        - name: tmp-dir
          mountPath: /tmp
        - name: shared-memory
          mountPath: /dev/shm
      - name: metrics
        image: prometheuscommunity/postgres-exporter:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9187
          name: metrics
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: vector-db-credentials
              key: connection_string
        - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
          value: "true"
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres-exporter/queries.yaml"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: postgres-exporter-config
          mountPath: /etc/postgres-exporter
      - name: datadog-agent
        image: "datadog/agent:latest"
        imagePullPolicy: IfNotPresent
        env:
        - name: DD_API_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-secrets
              key: api_key
        - name: DD_APP_KEY
          valueFrom:
            secretKeyRef:
              name: datadog-secrets
              key: app_key
        - name: DD_SITE
          value: "datadoghq.com"
        - name: DD_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DD_KUBELET_TLS_VERIFY
          value: "false"
        - name: DD_LOGS_ENABLED
          value: "true"
        - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
          value: "true"
        - name: DD_APM_ENABLED
          value: "true"
        - name: DD_PROCESS_AGENT_ENABLED
          value: "true"
        - name: DD_TAGS
          value: "env:production,service:vector-db,team:data-engineering,component:database"
        - name: DD_PG_PASS
          valueFrom:
            secretKeyRef:
              name: vector-db-credentials
              key: datadog_password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: socket-dir
          mountPath: /var/run/datadog
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: cgroup
          mountPath: /host/sys/fs/cgroup
          readOnly: true
        - name: postgres-logs
          mountPath: /var/log/postgresql
          readOnly: true
        - name: datadog-config
          mountPath: /etc/datadog-agent
        - name: tmp-dir
          mountPath: /tmp
      volumes:
      - name: init-scripts
        configMap:
          name: vector-db-init-scripts
      - name: config-map
        configMap:
          name: vector-db-config
      - name: postgres-exporter-config
        configMap:
          name: postgres-exporter-config
      - name: datadog-config
        configMap:
          name: datadog-agent-config
      - name: socket-dir
        emptyDir: {}
      - name: proc
        hostPath:
          path: /proc
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
      - name: postgres-logs
        emptyDir: {}
      - name: tmp-dir
        emptyDir: {}
      - name: shared-memory
        emptyDir:
          medium: Memory
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db
  namespace: vibecode
  labels:
    app: vector-db
    component: database
    team: data-engineering
    part-of: vibecode-platform
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: vector-db
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db-headless
  namespace: vibecode
  labels:
    app: vector-db
    component: database
    team: data-engineering
    part-of: vibecode-platform
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: vector-db
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vector-db-pdb
  namespace: vibecode
  labels:
    app: vector-db
    component: database
    team: data-engineering
    part-of: vibecode-platform
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: vector-db
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vector-db-monitor
  namespace: monitoring
  labels:
    app: vector-db
    component: database
    team: data-engineering
    part-of: vibecode-platform
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app: vector-db
  endpoints:
  - port: metrics
    interval: 15s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - vibecode