apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitpod-workspace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitpod-workspace
  template:
    metadata:
      labels:
        app: gitpod-workspace
    spec:
      containers:
      - name: workspace
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        command: ["/bin/sh", "-c", "apk add --no-cache bash git curl nodejs npm python3 && sleep infinity"]
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
