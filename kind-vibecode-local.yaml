kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vibecode-local

nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
  - containerPort: 6379
    hostPort: 6379
    protocol: TCP
  - containerPort: 3000
    hostPort: 3000
    protocol: TCP

networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
