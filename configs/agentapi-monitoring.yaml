# AgentAPI Monitoring Configuration
# Complete observability stack configuration for agent health and performance monitoring

# OpenTelemetry Configuration
opentelemetry:
  enabled: true
  service_name: agentapi
  service_version: 1.0.0
  environment: production

  # OTLP Exporter Configuration
  exporter:
    endpoint: http://localhost:4318/v1/traces
    protocol: http/protobuf
    timeout: 10s
    compression: gzip

  # Sampling Configuration
  sampling:
    # Sample 100% in development, 10% in production
    ratio: 0.1
    parent_based: true

  # Resource Attributes
  resources:
    deployment.environment: production
    service.namespace: vibecode
    service.instance.id: ${HOSTNAME}

  # Instrumentation
  instrumentations:
    http: true
    express: true
    fs: false  # Disable in production to reduce overhead
    dns: false
    net: false

# Prometheus Configuration
prometheus:
  enabled: true
  port: 9090
  endpoint: /metrics
  hostname: 0.0.0.0

  # Metric Collection
  collection:
    interval: 15s  # Collect process metrics every 15 seconds

  # Custom Metrics
  custom_metrics:
    - name: agent_task_duration_seconds
      type: histogram
      description: Duration of agent task execution
      buckets: [1, 5, 10, 30, 60, 120, 300, 600, 1800]

    - name: agent_success_total
      type: counter
      description: Total successful agent tasks

    - name: agent_failure_total
      type: counter
      description: Total failed agent tasks

    - name: agent_active_count
      type: gauge
      description: Current active agents

    - name: agent_output_lines_total
      type: counter
      description: Total output lines from agents

    - name: agent_errors_total
      type: counter
      description: Total errors from agents

    - name: http_requests_total
      type: counter
      description: Total HTTP requests

    - name: http_request_duration_seconds
      type: histogram
      description: HTTP request duration
      buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]

# Datadog Configuration
datadog:
  enabled: true
  site: datadoghq.com

  # APM Configuration
  apm:
    enabled: true
    service_name: agentapi
    environment: production
    version: 1.0.0

    # Agentless Mode (requires DD_API_KEY)
    agentless:
      enabled: true

    # Sampling
    sample_rate: 0.1

  # Dashboard Configuration
  dashboard:
    auto_create: true
    title: AgentAPI Monitoring Dashboard

    # Widgets
    widgets:
      - type: agent_health_grid
        enabled: true
      - type: api_latency_heatmap
        enabled: true
      - type: error_rate_timeseries
        enabled: true
      - type: task_duration_percentiles
        enabled: true
      - type: resource_utilization
        enabled: true

  # Log Management
  logs:
    enabled: true
    service: agentapi
    source: nodejs

    # Log Correlation
    correlation:
      inject_trace_ids: true

  # Metrics
  metrics:
    enabled: true
    namespace: vibecode.agentapi

    # DogStatsD Configuration
    dogstatsd:
      enabled: false  # Use Prometheus exporter instead
      host: localhost
      port: 8125

# Alert Configuration
alerts:
  enabled: true

  # Alert Rules
  rules:
    - name: high_error_rate
      enabled: true
      severity: critical
      threshold: 5  # 5% error rate
      duration: 5m
      channels: [slack, pagerduty, email]

    - name: slow_response_time
      enabled: true
      severity: warning
      threshold: 1.0  # 1 second P95
      duration: 5m
      channels: [slack, email]

    - name: agent_downtime
      enabled: true
      severity: critical
      threshold: 0  # No requests
      duration: 2m
      channels: [slack, pagerduty, email]

    - name: long_task_duration
      enabled: true
      severity: warning
      threshold: 600  # 10 minutes
      duration: 10m
      channels: [slack, email]

    - name: high_memory_usage
      enabled: true
      severity: warning
      threshold: 80  # 80%
      duration: 5m
      channels: [slack, email]

    - name: high_cpu_usage
      enabled: true
      severity: warning
      threshold: 85  # 85%
      duration: 5m
      channels: [slack, email]

    - name: too_many_concurrent_agents
      enabled: true
      severity: warning
      threshold: 4  # Max 4 concurrent
      duration: 5m
      channels: [slack, email]

    - name: agent_stuck
      enabled: true
      severity: warning
      threshold: 0  # No output
      duration: 5m
      channels: [slack, email]

  # Notification Channels
  notification_channels:
    slack:
      enabled: true
      webhook_url: ${SLACK_WEBHOOK_URL}
      channel: #agentapi-alerts

    pagerduty:
      enabled: true
      integration_key: ${PAGERDUTY_INTEGRATION_KEY}

    email:
      enabled: true
      recipients:
        - devops@vibecode.com
        - ai-team@vibecode.com

# Performance Constraints
performance:
  # Monitoring overhead should be <3% CPU
  max_cpu_overhead_percent: 3

  # Metric cardinality limit
  max_metric_cardinality: 10000

  # Alert delivery SLA
  alert_delivery_sla_seconds: 60

  # Trace sampling
  trace_sampling:
    # Sample all errors
    sample_errors: true
    # Sample slow requests (>1s)
    sample_slow_requests: true
    slow_threshold_seconds: 1.0

# Distributed Tracing
distributed_tracing:
  enabled: true

  # W3C Trace Context
  propagation:
    format: w3c  # W3C Trace Context standard

  # Trace ID injection
  inject_trace_ids:
    http_headers: true
    logs: true

  # Correlation
  correlation:
    # Link traces across services
    link_nextjs_to_agentapi: true
    link_agentapi_to_agent_runtime: true

# Health Checks
health_checks:
  enabled: true

  # Liveness probe
  liveness:
    path: /health
    interval: 10s
    timeout: 5s

  # Readiness probe
  readiness:
    path: /ready
    interval: 10s
    timeout: 5s

  # Startup probe
  startup:
    path: /health
    interval: 5s
    timeout: 5s
    failure_threshold: 30

# Logging
logging:
  level: info
  format: json

  # Structured logging
  structured:
    enabled: true
    include_trace_id: true
    include_span_id: true

  # Log destinations
  destinations:
    - type: stdout
      enabled: true
    - type: file
      enabled: true
      path: /var/log/agentapi/app.log
      rotation:
        max_size: 100MB
        max_files: 10
    - type: datadog
      enabled: true
      service: agentapi
      source: nodejs
