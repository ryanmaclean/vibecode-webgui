schema-version: v2.2
dd-service: vibecode-docker-doctor
team: platform-engineering
contacts:
  - name: Kim Smith
    type: email
    contact: kim.smith@vibecode.com
  - name: Jessie
    type: email
    contact: jessie@vibecode.com
  - name: Platform Engineering Slack
    type: slack
    contact: https://vibecode.slack.com/archives/platform-engineering
  - name: Platform Engineering Email
    type: email
    contact: platform-engineering@vibecode.com
description: Interactive terminal UI tool that diagnoses and repairs Docker Desktop issues blocking VibeCode development workflows.
tier: tier3
lifecycle: production
application: vibecode-platform
languages:
  - bash
type: custom
ci-pipeline-fingerprints:
  - github-actions:main-branch-ci
links:
  - name: Docker Doctor User Guide
    type: runbook
    url: https://github.com/vibecode/vibecode-webgui/blob/main/docs/src/content/docs/docker-troubleshooting.md
  - name: Docker Doctor Script
    type: repo
    provider: github
    url: https://github.com/vibecode/vibecode-webgui/blob/main/scripts/docker-doctor.sh
  - name: Troubleshooting Playbook
    type: doc
    provider: github
    url: https://github.com/vibecode/vibecode-webgui/blob/main/docs/src/content/docs/KIND_TROUBLESHOOTING_GUIDE.md
  - name: Scripts Index
    type: doc
    provider: github
    url: https://github.com/vibecode/vibecode-webgui/blob/main/scripts/README.md
tags:
  - env:development
  - component:docker-doctor
  - tooling:tui
  - language:bash
  - business-unit:platform
  - cost-center:engineering
extensions:
  datadoghq.com/dora-metrics:
    repository: vibecode/vibecode-webgui
    source_patterns:
      - scripts/docker-doctor.sh
      - docs/src/content/docs/docker-troubleshooting.md
  datadoghq.com/cd-visibility:
    deployment_patterns:
      - Publish Developer Tooling Release Notes
