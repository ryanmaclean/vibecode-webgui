# Connection Count Alerts

# PostgreSQL connections approaching limit
name: "VibeCode PostgreSQL Connection Limit"
type: "metric"
query: "avg:vibecode.service.postgresql.connections{*}"

thresholds:
  warning: 30   # Out of default 100
  critical: 90  # Out of default 100

trigger_type: "threshold"
condition: "above"
evaluation_window: "5m"

severity: "warning"

notify:
  - slack: "#vibecode-alerts"

message: |
  PostgreSQL is approaching connection limit.

  Current connections: {{value}}
  Limit: 100

  **Check active connections**:
  ```
  vibecode-vm ssh "psql -U postgres -c \"SELECT count(*) FROM pg_stat_activity;\""
  ```

  **Terminate idle connections**:
  ```
  vibecode-vm ssh "psql -U postgres -c \"SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state='idle';\""
  ```

---
# Valkey Memory Alert
name: "VibeCode Valkey Memory Pressure"
type: "metric"
query: "avg:vibecode.service.valkey.memory{*}"

thresholds:
  warning: 1500  # MB
  critical: 1800 # MB (close to 2GB)

trigger_type: "threshold"
condition: "above"
evaluation_window: "5m"

severity: "warning"

notify:
  - slack: "#vibecode-alerts"

message: |
  Valkey memory usage is high.

  Current: {{value}}MB
  Capacity: 2048MB

  **Check memory usage**:
  ```
  vibecode-vm ssh "redis-cli INFO memory"
  ```

  **Clear expired keys**:
  ```
  vibecode-vm ssh "redis-cli FLUSHALL"
  ```
