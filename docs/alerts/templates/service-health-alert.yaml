# VibeCode Service Health Alerts
# Monitors all services and alerts if any are down

---
# SSH Service Alert
name: "VibeCode SSH Service Down"
type: "metric"
query: "avg:vibecode.service.ssh.up{*}"

thresholds:
  critical: 1

trigger_type: "threshold"
condition: "below"
evaluation_window: "2m"

severity: "critical"

notify:
  - pagerduty: "vibecode-oncall"
  - slack: "#vibecode-critical @vibecode"

message: |
  **CRITICAL: SSH Service is DOWN**

  The SSH service is no longer responding.

  **Impact**: Cannot access VM via SSH

  **Immediate actions**:
  1. Try manual restart: `vibecode-vm restart`
  2. Check service status: `vibecode-vm status | grep SSH`
  3. View logs: `vibecode-vm logs | tail -100`

  **If still down**: Restart VM completely

---
# PostgreSQL Service Alert
name: "VibeCode PostgreSQL Service Down"
type: "metric"
query: "avg:vibecode.service.postgresql.up{*}"

thresholds:
  critical: 1

trigger_type: "threshold"
condition: "below"
evaluation_window: "2m"

severity: "critical"

notify:
  - pagerduty: "vibecode-oncall"
  - slack: "#vibecode-critical @vibecode"

message: |
  **CRITICAL: PostgreSQL Service is DOWN**

  The PostgreSQL database is no longer responding.

  **Impact**: Applications cannot access the database

  **Check connection**:
  ```
  vibecode-vm ssh "psql -U postgres -c 'SELECT 1'"
  ```

  **Restart service**:
  ```
  vibecode-vm restart
  ```

