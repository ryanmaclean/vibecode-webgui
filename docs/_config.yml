# GitHub Pages Configuration
theme: jekyll-theme-cayman
title: VibeCode
description: AI-powered development environment with native Apple Silicon support
show_downloads: true
google_analytics: # Add your GA tracking ID

# Navigation
navigation:
  - title: Home
    url: /
  - title: Demo Guide
    url: /VFKIT_DEMO_GUIDE
  - title: Valkey Build
    url: /scripts/vfkit/compile-valkey-musl
  - title: GitHub
    url: https://github.com/ryanmaclean/vibecode-webgui

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# SEO
tagline: Native Apple Silicon development with Alpine ARM64 VMs
author: Ryan MacLean
twitter:
  username: # Add your Twitter handle
  card: summary_large_image

# Social
social:
  name: VibeCode
  links:
    - https://github.com/ryanmaclean/vibecode-webgui

# Exclude from processing
exclude:
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - "*.sh"
  - scripts/
  - config/

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Permalinks
permalink: pretty

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
