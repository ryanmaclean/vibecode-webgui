version: '3.8'

services:
  # The Brain: OpenClaw Gateway
  openclaw:
    image: openclaw/gateway:latest
    container_name: openclaw-gateway
    ports:
      - "18789:18789" # API Port
    environment:
      - OPENCLAW_ENV=production
      - OPENCLAW_AUTH_TOKEN=${OPENCLAW_AUTH_TOKEN:-openclaw-local}
      - DD_SERVICE=openclaw
      - DD_ENV=${DD_ENV:-local}
      - DD_VERSION=${OPENCLAW_VERSION:-unknown}
      - DD_TRACE_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_LOGS_INJECTION=true
    volumes:
      - ./data/openclaw:/root/.openclaw
    restart: unless-stopped
    networks:
      - vibecode-net

  # Optional: Redis for caching/state
  redis:
    image: redis:alpine
    container_name: vibecode-redis
    ports:
      - "6379:6379"
    networks:
      - vibecode-net

networks:
  vibecode-net:
    driver: bridge
