[package]
name = "vibecode"
version = "0.1.0"
description = "VibeCode - AI-Powered Development Environment"
authors = ["VibeCode Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bollard = "0.18"
mdns-sd = "0.11"
hostname = "0.4"
thiserror = "2"
url = "2"
dirs = "5"

[profile.release]
# optimize for small binary size
strip = true
lto = "thin"
opt-level = "z"
codegen-units = 1
panic = "abort"
