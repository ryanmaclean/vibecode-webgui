[package]
name = "vibecode"
version = "0.1.0"
description = "VibeCode - AI-Powered Development Environment"
authors = ["VibeCode Team"]
edition = "2021"

[lib]
name = "vibecode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vibecode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
bollard = "0.18"
mdns-sd = "0.11"
thiserror = "2"
